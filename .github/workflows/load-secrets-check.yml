name: Load secrets check

# シークレットの供給元を検証する（#1306）。本番には一切触れない。
#
# 用途は2つ。
#
# 1. 複合アクション `.github/actions/load-secrets` の動作確認。deploy.ymlは`main`へのpushでしか
#    動かないため、そこで初めて壊れているのが分かるのでは遅い。ここで先に実証する。
# 2. #1307で他リポジトリへ展開する際の「投入が済んでいるか」の確認。preferを切り替えて実行すれば、
#    GitHub側だけで解決できるのか、1Passwordへのフォールバックが要る状態なのかが分かる。
#
# 値そのものは出力しない。解決できたかどうかと、解決できなかった項目の**名前だけ**を報告する。

on:
  workflow_dispatch:
    inputs:
      prefer:
        description: 優先する供給元
        required: false
        type: choice
        default: github
        options: [github, "1password"]
      use-fallback:
        description: もう片方へのフォールバックを許可する（1Passwordの日次枠を消費する可能性がある）
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # GitHub側の値はここで明示的に渡す。複合アクションは `secrets` コンテキストを丸ごと
    # 受け取れない（`toJSON(secrets)` を入力へ渡すとrunがaction_requiredになりジョブが
    # 1つも作られない。PR #1315で再現・切り分け済み）。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する。
    # マニフェストとのズレは scripts/check-load-secrets-env-block.sh が検出する。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.HOST }}
      USERNAME: ${{ secrets.USERNAME }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      MIGRATE_DB_USER: ${{ secrets.MIGRATE_DB_USER }}
      MIGRATE_DB_PASSWORD: ${{ secrets.MIGRATE_DB_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_APP_ID: ${{ vars.APP_GITHUB_APP_ID }}
      NEXT_PUBLIC_GITHUB_APP_SLUG: ${{ vars.NEXT_PUBLIC_GITHUB_APP_SLUG }}
      GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.APP_GITHUB_APP_PRIVATE_KEY_BASE64 }}
      GITHUB_WEBHOOK_SECRET: ${{ secrets.APP_GITHUB_WEBHOOK_SECRET }}
      GITHUB_USER_TOKEN_ENCRYPTION_KEY: ${{ secrets.APP_GITHUB_USER_TOKEN_ENCRYPTION_KEY }}
      GITHUB_OAUTH_CLIENT_ID: ${{ secrets.APP_GITHUB_OAUTH_CLIENT_ID }}
      GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.APP_GITHUB_OAUTH_CLIENT_SECRET }}
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
      DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
      GITHUB_BILLING_TOKEN: ${{ secrets.APP_GITHUB_BILLING_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 不足分を1Passwordから補う
        uses: ./.github/actions/load-secrets
        with:
          prefer: ${{ inputs.prefer }}
          # 許可した場合のみトークンを渡す。渡さなければアクションは1Passwordを
          # 一切触らない（日次枠を不用意に消費しないため）。
          op-token: ${{ inputs.use-fallback && secrets.OP_SERVICE_ACCOUNT_TOKEN || '' }}

      - name: 解決結果を確認する
        env:
          MANIFEST: .github/secrets-manifest.tsv
        run: |
          set -euo pipefail
          # 値は出さない。長さも出さない（長さ自体が手がかりになるため）。
          # 「空でないか」だけを見て OK / MISS を出す。
          fail=0
          while IFS=$'\t' read -r key scope kind gh_name source; do
            [[ -z "${key:-}" || "$key" == \#* ]] && continue
            [[ -z "${source:-}" ]] && continue
            if [[ -n "${!key:-}" ]]; then
              printf 'OK    %s\n' "$key"
            else
              printf 'MISS  %s\n' "$key"
              fail=1
            fi
          done < "$MANIFEST"
          exit "$fail"
