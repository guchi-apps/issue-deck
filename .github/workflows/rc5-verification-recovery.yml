name: Candidate verification recovery
on:
  push:
    branches: [issue-4695]
    paths: [.github/workflows/rc5-verification-recovery.yml]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: rc5-verification-recovery
  cancel-in-progress: false
jobs:
  quota:
    if: github.repository == 'guchi-apps/issue-deck'
    runs-on: ubuntu-latest
    steps:
      - name: Use existing installation with read-only permission
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          permission-contents: read
      - name: Read remaining quota and reset time only
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api rate_limit --jq '.resources.core | {limit,remaining,used,reset}'
          printf 'installation_id=%s\n' "$INSTALLATION_ID"
  request:
    if: github.repository == 'guchi-apps/issue-deck'
    runs-on: ubuntu-latest
    steps:
      - name: Read recorded verification status for pending candidates
        env:
          GH_TOKEN: ${{ github.token }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROGRESS_REPORT_SECRET"
          test "$APP_BASE_URL" = "https://issuedeck.gucchii.com"
          for target in issue-deck:4710 aide:659 pi0w:32 solitaire:189; do
            repo="guchi-apps/${target%:*}"
            number="${target#*:}"
            pr="$(gh api "repos/$repo/pulls/$number")"
            printf '%s' "$pr" | jq -e '.state == "open" and .base.ref == "main"' >/dev/null
            body="$(printf '%s' "$pr" | jq -c --arg repo "$repo" '{action:"status",repository:$repo,pullRequest:.number,baseSha:.base.sha,headSha:.head.sha}')"
            curl --fail --silent --show-error --max-time 30 \
              -X POST "$APP_BASE_URL/api/dispatch/release-verify" \
              -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
              -H "Content-Type: application/json" --data "$body" \
              | jq --arg target "$target" '{target:$target,status,views,blockers}'
          done
