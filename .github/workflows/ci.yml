name: CI

# 注意: claude-conflict-resolve.ymlが、このワークフローの`workflow_run`(CI / requested /
# develop)を「developへのpush」の代理通知として購読している(#1330。claude-code-actionが
# pushイベントに対応していないため直接pushで受けられない)。したがって
# - ワークフロー名(`CI`)
# - `push: branches: [develop]`トリガー
# を変更・削除すると、コンフリクト自動解消の最速検知経路が無言で止まる(scheduleの15分
# おきの安全網だけが残る)。変更する場合はclaude-conflict-resolve.ymlも合わせて直す。

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build:ci
        env:
          NODE_ENV: production
          DATABASE_URL: mysql://placeholder:placeholder@127.0.0.1:3306/app_issue_deck
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          GITHUB_APP_ID: "123456"
          GITHUB_APP_PRIVATE_KEY_BASE64: Y2ktcGxhY2Vob2xkZXI=
          NEXT_PUBLIC_GITHUB_APP_SLUG: ci-placeholder
          GITHUB_WEBHOOK_SECRET: ci-placeholder

  docs-sync-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cross-repo setup guide sync check
        run: scripts/check-cross-repo-guide-sync.sh

      - name: Workflow gh repository check
        run: scripts/check-workflow-gh-repo.sh

      # checkoutを行うジョブがpermissions:へcontentsを書き忘れると、publicのissue-deckでは
      # 匿名cloneが通って気付けず、privateの配布先だけでcheckoutが落ちる（#2126）。
      - name: Workflow job permissions check
        run: scripts/check-workflow-job-permissions.sh

      # ローカル起動プロトコル（#1073）への適合。issue-deck自身が契約を満たさなくなると、
      # 他リポジトリへ配る内容の正が崩れるため、developへ入る前に落とす。
      - name: Local session contract check
        run: scripts/check-local-session-contract.sh

      # マニフェストへ項目を足したのに load-secrets-check.yml の env: へ足し忘れると、
      # 検証ワークフローがその項目を見ないまま「OK」を出す。検証していないのに
      # 検証したように見えるのを防ぐ（#1306）。
      - name: Load secrets env block check
        run: scripts/check-load-secrets-env-block.sh

      # claude-reviewの判定マーカー（#2136）が、レビュープロンプトと再利用ワークフローで
      # 一致しているか。ずれるとワークフロー側が「該当なし」に倒れ、自動マージ不可と
      # 判定したPRが黙って自動マージされる。
      - name: Review verdict marker check
        run: scripts/check-review-verdict-marker.sh

      # 手作業Issueの本文の雛形（docs/multi-agent/manual-step-body-template.md）が、
      # 差し込み先の4ファイルへ反映されているか（#2048）。雛形を直したのに差し込みを
      # 忘れると、起票するエージェントは古い雛形を読み続けるが、どこにも警告が出ない。
      - name: Prompt shared template sync check
        run: node scripts/generate-prompt-templates.mjs --check

  # ワークフローファイルが「Invalid workflow file」になる書き方を、developへ入る前に落とす。
  # 無効になるとトリガーが一切発火しなくなり、ジョブも作られないためログに何も残らない。
  # **ジョブ名は変えないこと**（ブランチ保護の必須チェックとして参照されている）。検査を
  # 増やすときはここへステップを足す。
  #   - 式テンプレート長（21,000バイト）の超過（#901）
  #   - 式として解釈できない `${{ ... }}`（#2181）
  workflow-expression-length-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Workflow expression length check
        run: node scripts/check-workflow-expression-length.mjs

      - name: Workflow expression syntax check
        run: node scripts/check-workflow-expression-syntax.mjs

  # ワークフロー同期のずれを知らせるだけの通知ジョブ。CIの合否には影響させない。
  # continue-on-errorをジョブ単位ではなくステップ単位に付けているのは、ジョブ単位だと
  # ジョブのcheck-run conclusionがfailureのまま残り、refのcheck-runsを集約して
  # CI状態を出す側（lib/github/release-api.tsのfetchRefCiState、#1059）から失敗に
  # 見えてしまうため。ステップ単位ならジョブはsuccessで終わる。
  workflow-drift-notice:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for workflow file changes
        id: changed
        # base_refのfetchに失敗してもCIを落とさない。失敗時はchangedが空になり、
        # 後続の通知ステップはif条件を満たさずスキップされる。
        continue-on-error: true
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- .github/workflows/; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Workflow sync drift notice
        if: steps.changed.outputs.changed == 'true'
        # 情報表示が目的のステップなので、スクリプトの実行時エラーでCIを失敗させない。
        # 2026-08-08に実行権限漏れ(exit 126 Permission denied)でdevelop→mainの
        # リリースPRのCIを落とした実績がある(その個別原因は51ac1cfで解消済み)。
        # scripts/check-workflow-sync-drift.shはset -euo pipefailで動くため、
        # 同種の実行時エラーは今後も起こりうる。
        continue-on-error: true
        run: scripts/check-workflow-sync-drift.sh

  notify:
    needs: [lint-and-build]
    if: always()
    runs-on: ubuntu-latest
    # GitHub側の値はここで明示的に渡す。複合アクションのステップはジョブの env: を
    # 引き継ぐが、呼び出しステップの env: は引き継がない。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          lint_and_build="${{ needs.lint-and-build.result }}"
          if [ "$lint_and_build" = "success" ]; then
            result=success
          elif [ "$lint_and_build" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$lint_and_build" = "success" ]; then
            echo "jobs=lint-and-build" >> "$GITHUB_OUTPUT"
          elif [ "$result" = "failure" ] && [ "${{ github.event_name }}" = "pull_request" ] \
            && [ "${{ github.base_ref }}" = "develop" ] \
            && printf '%s' "${{ github.head_ref }}" | grep -Eq '^issue-[0-9]+$'; then
            # develop向けの`issue-<番号>`ブランチのCI失敗は、claude-ci-fix.ymlが人の操作なしに
            # 直しにいく（docs/multi-agent/auto-repair.md）。それを通知に書かないと、受け取った
            # 側は「自分が直さないと止まったまま」と読んでしまう（#2072）。
            echo "jobs=lint-and-build: $lint_and_build（自動修正を試みます）" >> "$GITHUB_OUTPUT"
          else
            echo "jobs=lint-and-build: $lint_and_build" >> "$GITHUB_OUTPUT"
          fi
          # develop push: failure only. main PR: success, failure, and cancelled.
          if [ "$result" = "failure" ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 不足分を1Passwordから補う
        if: steps.status.outputs.should_notify == 'true'
        uses: ./.github/actions/load-secrets
        with:
          only: SIGNALY_WEBHOOK_URL
          # issue-deckは#1302・#1308で1Password依存を外しており、このsecretは存在しない。
          # 空が渡るとアクションは1Passwordを一切触らない。他リポジトリでは値が入るため、
          # GitHub側の投入が済むまで1Passwordから補われる（#1307の段階的な移行のため）。
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Signaly に通知
        if: steps.status.outputs.should_notify == 'true'
        # 通知はCIの合否そのものではない。ここが失敗してもrun全体を落とさない
        # （1Passwordのレート制限でリリースPRのCIが赤くなった実績がある。#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: issue-deck
          NOTIFY_KIND: CI
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
          NOTIFY_JOB: ${{ steps.status.outputs.jobs }}
        run: bash .github/scripts/signaly-notify.sh
