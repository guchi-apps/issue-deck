name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build:ci
        env:
          NODE_ENV: production
          DATABASE_URL: mysql://placeholder:placeholder@127.0.0.1:3306/app_issue_deck
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          GITHUB_APP_ID: "123456"
          GITHUB_APP_PRIVATE_KEY_BASE64: Y2ktcGxhY2Vob2xkZXI=
          NEXT_PUBLIC_GITHUB_APP_SLUG: ci-placeholder
          GITHUB_WEBHOOK_SECRET: ci-placeholder

  docs-sync-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cross-repo setup guide sync check
        run: scripts/check-cross-repo-guide-sync.sh

      - name: Workflow gh repository check
        run: scripts/check-workflow-gh-repo.sh

      # ローカル起動プロトコル（#1073）への適合。issue-deck自身が契約を満たさなくなると、
      # 他リポジトリへ配る内容の正が崩れるため、developへ入る前に落とす。
      - name: Local session contract check
        run: scripts/check-local-session-contract.sh

  # ワークフローの式テンプレート長（21,000バイト）超過を検出する（#901）。
  # 超過するとワークフローファイル自体が無効になり、issue_comment等のトリガーが
  # 一切発火しなくなるため、developへ入る前に落とす。
  workflow-expression-length-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Workflow expression length check
        run: node scripts/check-workflow-expression-length.mjs

  # ワークフロー同期のずれを知らせるだけの通知ジョブ。CIの合否には影響させない。
  # continue-on-errorをジョブ単位ではなくステップ単位に付けているのは、ジョブ単位だと
  # ジョブのcheck-run conclusionがfailureのまま残り、refのcheck-runsを集約して
  # CI状態を出す側（lib/github/release-api.tsのfetchRefCiState、#1059）から失敗に
  # 見えてしまうため。ステップ単位ならジョブはsuccessで終わる。
  workflow-drift-notice:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for workflow file changes
        id: changed
        # base_refのfetchに失敗してもCIを落とさない。失敗時はchangedが空になり、
        # 後続の通知ステップはif条件を満たさずスキップされる。
        continue-on-error: true
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- .github/workflows/; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Workflow sync drift notice
        if: steps.changed.outputs.changed == 'true'
        # 情報表示が目的のステップなので、スクリプトの実行時エラーでCIを失敗させない。
        # 2026-08-08に実行権限漏れ(exit 126 Permission denied)でdevelop→mainの
        # リリースPRのCIを落とした実績がある(その個別原因は51ac1cfで解消済み)。
        # scripts/check-workflow-sync-drift.shはset -euo pipefailで動くため、
        # 同種の実行時エラーは今後も起こりうる。
        continue-on-error: true
        run: scripts/check-workflow-sync-drift.sh

  notify:
    needs: [lint-and-build]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          lint_and_build="${{ needs.lint-and-build.result }}"
          if [ "$lint_and_build" = "success" ]; then
            result=success
          elif [ "$lint_and_build" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$lint_and_build" = "success" ]; then
            echo "jobs=lint-and-build" >> "$GITHUB_OUTPUT"
          else
            echo "jobs=lint-and-build: $lint_and_build" >> "$GITHUB_OUTPUT"
          fi
          # develop push: failure only. main PR: success, failure, and cancelled.
          if [ "$result" = "failure" ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
          fi

      # 切り分け用: ローカル複合アクションの参照だけを入れ、secrets/varsは空を渡す。
      # これでCIが起動すれば、原因は toJSON(secrets) の受け渡しにあると分かる。
      - name: シークレットを解決する
        if: steps.status.outputs.should_notify == 'true'
        uses: ./.github/actions/load-secrets
        with:
          only: SIGNALY_WEBHOOK_URL
          secrets-json: ${{ toJSON(secrets) }}
          vars-json: ${{ toJSON(vars) }}

      - name: Signaly に通知
        if: steps.status.outputs.should_notify == 'true'
        # 通知はCIの合否そのものではない。ここが失敗してもrun全体を落とさない
        # （1Passwordのレート制限でリリースPRのCIが赤くなった実績がある。#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: issue-deck
          NOTIFY_KIND: CI
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
          NOTIFY_JOB: ${{ steps.status.outputs.jobs }}
        run: bash .github/scripts/signaly-notify.sh
