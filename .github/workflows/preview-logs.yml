name: Preview Logs

# プレビュー環境（Fly.io Machines、#826）のアプリケーションログを取得するだけのworkflow。
# プレビューで発生したサーバーエラー（500など）の原因は、Machine内のNext.jsが出力する
# ログにしか出てこないが、Fly.ioのダッシュボード・CLIを持っていない場合は確認する手段が
# なかった（#880でログイン後の500を調査する際に必要になった）。
# 再デプロイせずログだけを見るため、本番DBのダンプ・イメージビルドは行わない。
on:
  workflow_dispatch:
    inputs:
      lines:
        description: "取得する行数の上限"
        type: string
        default: "200"

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENV_FILE: .github/preview-logs.env.tpl

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: ログを取得する
        # `flyctl logs`は既定でtailし続けるため`--no-tail`で直近のログだけ出して終了させる。
        # それでも終了しない場合に備えてtimeoutで打ち切る（打ち切り自体は失敗扱いにしない）。
        run: |
          set -uo pipefail
          timeout 120 flyctl logs --no-tail | tail -n "${LINES}"
          echo "（Fly.ioが保持している直近のログのみ。古いものは残っていない場合がある）"
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          LINES: ${{ inputs.lines }}
