name: Claude CI Fix

# develop向けPR（issue-<番号>ブランチ）のCI（.github/workflows/ci.yml）が失敗した際、これまでは
# 人間がIssueに`@claude CIの失敗を直して`のようにコメントして個別に依頼する必要があった。
# この依頼を自動化し、CI失敗を検知したら人間の操作なしにClaude Codeが修正を試みるワークフロー
# （docs/multi-agent/auto-repair.md「CI失敗の自動解消」参照、issue #807）。
#
# **トリガー定義のみ**を持ち、ジョブ本体はreusable-claude-ci-fix.ymlへ切り出してある（#1066）。
# 他リポジトリからも同じ実体を呼べるようにするため（方式は#934、先行例は#940・#945）。
#
# issue-deck自身はローカルパス参照(./)を使い、常にそのブランチ・PRの内容で動かす。
# 他アプリはタグ固定(@workflows/vX)で参照する運用とし、issue-deck側が先に壊れて
# 他アプリには波及しない「カナリア」構成にする（#934）。
#
# develop→mainのリリースPR（head=develop）のCI失敗は対象外（#812で別途検討）。リリースPRの
# headはdevelop自体であり、develop直接pushが禁止のためこのワークフローと同じ「対象ブランチへ
# 直接push」方式を適用できないこと、対応する単一のIssueが存在せずリトライ管理・報告先の前提が
# 異なることが理由。
#
# トリガー:
# - workflow_run（CI, completed）: CIの結果が出るたびに検知する。ci.ymlはconcurrency設定で
#   追加pushにより前の実行がcancelledになるため、conclusion=='failure'のみを対象にすれば
#   古い実行に誤反応することはない
# - workflow_dispatch: 手動実行用（対象のIssue番号を入力する）
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      issue_number:
        description: "対象のIssue番号（develop向けPRのissue-<番号>ブランチのIssue番号）"
        required: true
        type: number

jobs:
  ci-fix:
    uses: ./.github/workflows/reusable-claude-ci-fix.yml
    # issue-deckは唯一pnpmを使うリポジトリ（他の全アプリはnpm）。既定は多数派のnpmのため明示する。
    with:
      runtime-setup: node-db
      package-manager: pnpm
      # 再利用ワークフロー内のinputsコンテキストはworkflow_callのinputsを指すため、
      # 呼び出し元のworkflow_dispatch入力はここで明示的に渡す。
      issue-number: ${{ inputs.issue_number }}
      # プロンプトの「- 修正後、」に続けてそのまま埋め込まれるため、文末まで含めて書く。
      # YAMLの折りたたみ(>-)は改行を半角スペースへ変換し日本語の途中に空白が入るため、1行で書く。
      verify-commands: "`pnpm test`（lint・typecheck・unit testを実行）と `pnpm build:ci` を実行し、いずれも問題がないことを確認する（DBサーバーは実際には起動していないが、環境変数はこのステップに既に設定済みのため`.github/workflows/ci.yml`のbuildステップと同様に成功するはず）"
      # pnpm build:ciの実行に必要。.github/workflows/ci.ymlのbuildステップと同じ
      # プレースホルダー値を使う（実際の外部サービスには接続しない）。
      # 実シークレットはここに書かない（secrets: inheritで別途渡る）。
      build-env: |
        DATABASE_URL=mysql://placeholder:placeholder@127.0.0.1:3306/app_issue_deck
        NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-placeholder
        GITHUB_APP_ID=123456
        GITHUB_APP_PRIVATE_KEY_BASE64=Y2ktcGxhY2Vob2xkZXI=
        NEXT_PUBLIC_GITHUB_APP_SLUG=ci-placeholder
        GITHUB_WEBHOOK_SECRET=ci-placeholder
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
