name: Issue Progress

# Issueの進捗(Project Status)の状態遷移を担うワークフローの、issue-deck自身のトリガー定義(#940)。
# ジョブ本体はreusable-issue-labels.ymlへ切り出し、他リポジトリからも同じ実体を
# 呼べるようにしている(展開方式は#934)。
#
# ファイル名に`labels`が残っているのは、他リポジトリのcallerが`uses:`でこのパスを
# 指しているため(改名すると全リポジトリのcallerを同時に直す必要がある)。
# 進捗ラベルそのものは#991 Phase 5(#1010)で廃止しており、いま扱うのはProject Statusと
# 条件系ラベル(`00.check-user`)だけ。
#
# issue-deck自身はローカルパス参照(./)を使い、常にそのブランチ・PRの内容で動かす。
# 他アプリはタグ固定(@workflows/vX)で参照する運用とし、issue-deck側が先に壊れて他アプリには
# 波及しない「カナリア」構成にする(#934)。
on:
  push:
    branches:
      - "issue-*"
  pull_request:
    types: [opened, synchronize, closed]
    branches:
      - develop
      - main
  # closedはcleanup-on-close(00.check-userの除去・スクリーンショットの掃除)、
  # opened/editedはmanual-step-label(タイトルが`[手作業]`のIssueへの71.manual-step付与・#1492)が使う。
  # **トリガー定義はcaller側にしか無いため、他リポジトリでopened/editedを拾うにはそちらのcallerにも
  # 同じ追記が要る**(タグを上げるだけでは届かない。docs/cross-repo-setup-guide.md)。
  issues:
    types: [opened, edited, closed]
  # **`schedule`は持たない(#2294)。** 以前はここに15分ごとのcronを置き、
  # reusable側のdevelop-merge-sweep・manual-step-labelを定期的に動かしていた。
  # Actionsの課金はジョブ単位で1分未満切り上げのため、実測20秒・5秒の2ジョブでも
  # 1回の実行で2分が課金され、privateリポジトリの従量課金のほとんどがこれになっていた。
  # どちらもサブPCのpollerが叩く`POST /api/issues/progress-sweep`へ移した
  # (docs/github-billing.md・src/lib/github/progress-sweep.ts)。
  #
  # **他リポジトリのcallerには`schedule:`が残っている。** callerの配布の仕組みが無く、
  # リポジトリごとに書き換える必要があるため。ただしreusable側にscheduleで動くジョブが
  # 1つも無くなったので、全ジョブがskipされ課金は発生しない(空のrunが並ぶだけ)。

jobs:
  labels:
    uses: ./.github/workflows/reusable-issue-labels.yml
    # 呼ばれる側の権限はcallerの付与範囲を超えられない。cleanup-on-closeジョブが
    # contents: write を要求するため、トップレベル相当の2つとあわせてここで付与する。
    permissions:
      issues: write
      pull-requests: write
      contents: write
    # 進捗をissue-deckの報告APIへ送るための共有シークレット(#991 Phase 2)。
    # secrets: inherit ではなく個別に渡し、呼ばれる側へ渡る秘密を最小限に保つ。
    secrets:
      PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
