name: Claude Code Review (develop向けPR)

# develop向けPRの作成・更新時に、機械的リスク判定・Claude Codeによる自動レビュー・
# 低リスクPRの自動マージを行う(docs/multi-agent-workflow.md「段階的導入計画」のPhase3/Phase4)。
#
# **トリガー定義とconcurrencyのみ**を持ち、ジョブ本体はreusable-claude-review-develop.ymlへ
# 切り出してある(#1078)。他リポジトリからも同じ実体を呼べるようにするため
# (方式は#934、先行例は#940・#945・#1066)。
#
# issue-deck自身はローカルパス参照(./)を使い、常にそのブランチ・PRの内容で動かす。
# 他アプリはタグ固定(@workflows/vX)で参照する運用とし、issue-deck側が先に壊れて
# 他アプリには波及しない「カナリア」構成にする(#934)。
#
# concurrency: 本ワークフローはdevelop向けPRへのpush(synchronize)のたびに毎回起動するため、
# 実装エージェントが同一PRへ連続してpushすると、supersededになった古いpush分のwait-for-ci/
# risk-check/claude-review(Claude Code呼び出しを含む)が古いコミットに対してそのまま走り
# 切ってしまい、無駄なClaude Code消費になっていた(#818)。ここでは新しいpushが来たら
# 古い実行を丸ごとキャンセルする。各ジョブが行う操作(ラベル付与・コメント投稿・
# auto-merge有効化)はいずれも冪等かつ「より新しい実行が最終的に正しい判定を行えば十分」
# なため、実行途中でキャンセルされても後続のより新しい実行が正しい状態に収束する。
# 呼び出し元のワークフローレベルに置くことで、呼び出し先のジョブも一緒にキャンセルされる。
concurrency:
  group: claude-review-develop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop

jobs:
  review:
    uses: ./.github/workflows/reusable-claude-review-develop.yml
    # issue-deckのリスクパスは再利用ワークフロー側の内蔵パターン
    # (.github/workflows/** ・.env* ・.shared-context/** ・prisma/migrations/** ・**/auth/**)
    # で過不足なくカバーできるため、risk-pathsは渡さない。
    # 依存関係はメジャー更新のみをリスクとみなす既定(major)のままでよい。
    # lock-filesは既定(pnpm-lock.yaml package-lock.json)のままにする。issue-deckはpnpmのみだが、
    # 存在しないファイル名を除外対象に含めても無害で、移行前の挙動とも完全に一致する。
    with:
      review-file-threshold: "10"
      review-line-threshold: "500"
      # 変更カテゴリ(DBマイグレーション・ワークフロー・.env・認証・依存のメジャー更新)では
      # developへのマージを止めない(#2775)。developはリリース前の統合先で、本番へ出るには
      # develop -> main のリリースPR(自動マージ不可カテゴリのまま・人がマージする)をもう1回
      # 通るため、ここで毎回「確認待ち」の札を積む価値が薄かった。
      # **レビューは従来どおり実行する。** 止めるのをやめるだけで、省いてはいない。
      # relaxedでも止まるのは、22.merge-confirm-required・23.preview-required・
      # 24.screenshot-required・.shared-context/の混入・claude-reviewが要修正と判定した場合。
      # 他リポジトリはstrict(既定)のまま。配布は別Issueで行う。
      merge-policy: relaxed
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
