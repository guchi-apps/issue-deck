name: Claude Code Review (develop向けPR)

# develop向けPRの作成・更新時に、機械的リスク判定・Claude Codeによる自動レビュー・
# 低リスクPRの自動マージを行う(docs/multi-agent-workflow.md「段階的導入計画」のPhase3/Phase4)。
#
# ジョブ構成:
# - identify-issue: 対応Issue番号を特定する(他ジョブが共通で参照する)
# - wait-for-ci: risk-check/claude-reviewの判定・00.check-user付与を、CI(ci.yml)の
#   完了を待ってから行うようにするための待機ジョブ。CIが`in_progress`のうちに
#   00.check-userが付いてしまい、issue-deck画面上で時期尚早に「要確認」に見える
#   問題を防ぐ(#810)。ポーリングがタイムアウトした場合もジョブ自体は失敗させず
#   後続へ進める(fail-open。失敗させるとneeds経由でrisk-check/claude-reviewが
#   skipされ、レビュー自体が行われないまま放置される事故につながるため)
# - risk-check: パスパターンによる機械的リスク判定、および対応Issueへの
#   22.merge-confirm-required・24.screenshot-required・23.preview-requiredラベル
#   付与の有無を確認する。該当時は00.check-userを
#   付与し、判定理由をissueにコメント投稿する(#94, #366)。ただしこのpush開始時点で
#   既に00.check-userが付いていた場合はコメント投稿のみ省略する(ラベルは毎回再付与する)。
#   実装エージェントが同一PRへ連続してpushする間、同内容の確認要求コメントが繰り返し
#   投稿され、作業中なのか確認待ちなのか紛らわしくなる問題を防ぐため(#594)
# - claude-review: Claude Codeによる意味的なレビュー・自動マージ不可カテゴリ判定。
#   該当時は00.check-userを付与し、判定理由をissueにコメント投稿する(#94)。
#   マージやラベル状態遷移(03.d:marge等)は行わない
# - claude-review-fallback: claude-reviewが失敗した場合にのみ走る。Claude Code自体を
#   使わない単純なシェルスクリプトとし、Claude Code側の失敗原因に関わらず確実に
#   PRへ失敗を通知し、対応Issueに00.check-userを付与する(auto-mergeは
#   claude-reviewの失敗により既にスキップされるため二重の安全網になる)(#83)
# - auto-merge: risk-check/claude-reviewの結果、対応Issueに00.check-userが
#   付いていなければ gh pr merge --auto --merge を実行する
# - auto-merge-fallback: auto-mergeが失敗した場合にのみ走る。claude-review-fallback
#   と同様に、確実にPRへ失敗を通知し、対応Issueに00.check-userを付与する(#238)
#
# 00.check-userラベルを両判定(機械的/意味的)共通の「マージ保留」シグナルとして
# 使うことで、判定ロジックとマージ可否判断を疎結合に保っている。
#
# 対応issueの番号は、本リポジトリの命名規約であるブランチ名 issue-<番号>
# (scripts/start-issue.shが作成)から特定する。head_ref等の値はscript injection
# を避けるため env 経由でのみ参照し、run: 本文に直接展開しない
# (.github/workflows/issue-labels.yml と同じ方針)。
#
# concurrency: 本ワークフローはdevelop向けPRへのpush(synchronize)のたびに毎回起動するため、
# 実装エージェントが同一PRへ連続してpushすると、supersededになった古いpush分のwait-for-ci/
# risk-check/claude-review(Claude Code呼び出しを含む)が古いコミットに対してそのまま走り
# 切ってしまい、無駄なClaude Code消費になっていた(#818)。ここでは新しいpushが来たら
# 古い実行を丸ごとキャンセルする。各ジョブが行う操作(ラベル付与・コメント投稿・
# auto-merge有効化)はいずれも冪等かつ「より新しい実行が最終的に正しい判定を行えば十分」
# なため、実行途中でキャンセルされても後続のより新しい実行が正しい状態に収束する。
concurrency:
  group: claude-review-develop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop

jobs:
  identify-issue:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.issue.outputs.number }}
    steps:
      - name: 対応Issue番号を特定する
        id: issue
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" =~ ^issue-([0-9]+)$ ]]; then
            echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
          fi

  wait-for-ci:
    needs: identify-issue
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: CI(ci.yml)の完了を待つ
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 60); do
            STATUS="$(gh api "repos/${GH_REPO}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request" \
              --jq '[.workflow_runs[] | select(.name == "CI")][0].status // ""')"
            if [ -z "$STATUS" ]; then
              echo "CIの実行がまだ見つかりません。20秒待って再試行します。($i/60)"
            elif [ "$STATUS" = "completed" ]; then
              echo "CIが完了しました。"
              exit 0
            else
              echo "CIはまだ完了していません(status=${STATUS})。20秒待って再試行します。($i/60)"
            fi
            sleep 20
          done
          echo "タイムアウトしました。CI完了を待たずに後続ジョブへ進みます(fail-open)。"

  risk-check:
    needs: [identify-issue, wait-for-ci]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: パスパターンによる機械的リスク判定
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.identify-issue.outputs.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -e
          CHANGED_FILES="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          RISKY=false
          REASONS=""

          add_reason() {
            RISKY=true
            REASONS="${REASONS}${REASONS:+$'\n'}- $1"
          }

          if echo "$CHANGED_FILES" | grep -q '^prisma/migrations/'; then
            add_reason "DBマイグレーションの変更 (prisma/migrations/**)"
          fi
          if echo "$CHANGED_FILES" | grep -qE '(^|/)\.env'; then
            add_reason "環境変数ファイルの変更 (.env*)"
          fi
          if echo "$CHANGED_FILES" | grep -q '^\.github/workflows/'; then
            add_reason "GitHub Actionsワークフローの変更 (.github/workflows/**)"
          fi
          if echo "$CHANGED_FILES" | grep -qE '(^|/)auth(/|\.[^/]*$)'; then
            add_reason "認証・認可関連ファイルの変更 (**/auth/**)"
          fi

          if echo "$CHANGED_FILES" | grep -q '^package\.json$'; then
            if git show "origin/${BASE_REF}:package.json" > /tmp/old-package.json 2>/dev/null; then
              if ! node -e '
                const fs = require("fs");
                const old = JSON.parse(fs.readFileSync("/tmp/old-package.json", "utf8"));
                const neu = JSON.parse(fs.readFileSync("package.json", "utf8"));
                const oldDeps = { ...old.dependencies, ...old.devDependencies };
                const newDeps = { ...neu.dependencies, ...neu.devDependencies };
                let major = false;
                for (const [name, newVer] of Object.entries(newDeps)) {
                  const oldVer = oldDeps[name];
                  if (!oldVer) continue;
                  const oldMajor = oldVer.match(/\d+/)?.[0];
                  const newMajor = newVer.match(/\d+/)?.[0];
                  if (oldMajor && newMajor && oldMajor !== newMajor) {
                    console.log(`${name}: ${oldVer} -> ${newVer}`);
                    major = true;
                  }
                }
                process.exit(major ? 1 : 0);
              '; then
                add_reason "依存関係のメジャーバージョン更新 (package.json)"
              fi
            else
              add_reason "package.jsonの変更（比較元の取得に失敗したため安全側で判定）"
            fi
          fi

          if [ -n "$ISSUE_NUMBER" ]; then
            ISSUE_LABELS="$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')"
            if echo "$ISSUE_LABELS" | grep -qx "22.merge-confirm-required"; then
              add_reason "Issueに \`22.merge-confirm-required\` ラベルが付与されているため（developへのマージ前に必ずユーザー確認を行う設定）"
            fi
            if echo "$ISSUE_LABELS" | grep -qx "24.screenshot-required"; then
              add_reason "Issueに \`24.screenshot-required\` ラベルが付与されているため（スクリーンショット確認のため、developへのマージ前に必ずユーザー確認を行う設定。このコメントはPR作成・push直後に自動投稿されるため、この時点ではまだスクリーンショットは添付されていません。実装エージェントが撮影まで完了すると、この後に別コメントとして画像が追加投稿されるので、催促する前に少し待って最新コメントをご確認ください）"
            fi
            if echo "$ISSUE_LABELS" | grep -qx "23.preview-required"; then
              add_reason "Issueに \`23.preview-required\` ラベルが付与されているため（画面プレビュー確認のため、developへのマージ前に必ずユーザー確認を行う設定）"
            fi
          fi

          if [ "$RISKY" = "true" ]; then
            echo "リスクありと判定:"
            echo "$REASONS"
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue edit "$ISSUE_NUMBER" --add-label "00.check-user"
              # このpush開始時点で既に00.check-user付与済み(=既に確認待ち)ならコメントのみ省略する(#594)
              if echo "$ISSUE_LABELS" | grep -qx "00.check-user"; then
                echo "Issue #${ISSUE_NUMBER} は既に00.check-user付与済みのため、重複コメントの投稿をスキップします。"
              else
                COMMENT_BODY="⚠️ 以下の理由により、developへのマージ前にユーザーの確認が必要と判定しました。"
                COMMENT_BODY="$COMMENT_BODY"$'\n\n'"$REASONS"
                COMMENT_BODY="$COMMENT_BODY"$'\n\n<!-- issue-deck-source:claude-review-develop -->'
                gh issue comment "$ISSUE_NUMBER" --body "$COMMENT_BODY"
              fi
            fi
          else
            echo "機械的リスク判定: 該当なし"
          fi

  claude-review:
    needs: [identify-issue, wait-for-ci]
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 共有知識リポジトリをcheckoutする
        # レビュー観点の1つである「共有知識との整合性」と、実装エージェントが投稿した
        # 共有知識への追加提案の審査に使う(docs/shared-knowledge.md「9.2 審査」)。
        # checkoutに失敗してもレビュー自体は続行する(continue-on-error)。
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SHARED_CONTEXT_REPO || 'guchi-apps/docs' }}
          ref: ${{ vars.SHARED_CONTEXT_REF || 'main' }}
          path: .shared-context
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Run Claude Code Review
        id: claude_review
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 本運用ではPRをclaude[bot]（Claude CodeのGitHub App）が作成するため、
          # claude-code-actionの非人間アクター拒否機構を明示的に許可する
          # (参考: https://github.com/anthropics/claude-code-action/issues/1299)
          allowed_bots: "claude[bot]"
          additional_permissions: |
            actions: read
          # Read/Grep/Globは、レビュー観点「共有知識との整合性」と共有知識追加提案の審査のために
          # .shared-context/配下を読む用途で追加している。gh issue viewは対応Issueの本文・コメント
          # （実装エージェントが投稿した追加提案コメントを含む）の取得に使う。
          # gh pr diff/view/checksは、レビューの起点となる差分の取得とCI結果の確認に使う(#906)。
          # プロンプトが指示している操作を許可リストに含めておかないと、拒否された分だけ無駄な
          # 往復が発生し、その時点の文脈をまるごと再送することになる（`gh pr checks`は従来
          # 「確認すること」で指示していながら許可されておらず、毎回拒否されていた）。
          claude_args: '--allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Read,Grep,Glob"'
          prompt: |
            develop向けPull Request（${{ github.repository }}/pull/${{ github.event.pull_request.number }}）を自動レビューしてください。

            ## 対応Issue
            対応Issue番号: ${{ needs.identify-issue.outputs.number }}
            （空欄の場合はブランチ名がissue-<番号>の命名規約に従っていないため、Issue番号は不明として扱ってください）

            ## 読む範囲
            レビューの対象はこのPull Requestの変更内容です。まず`gh pr diff`で差分を取得し、そこを
            起点に読んでください。変更ファイルとその呼び出し元・呼び出し先など、差分の評価に直接
            必要な範囲を超えてリポジトリを読み回さないでください。

            大きいファイルを丸ごと読むと、以降のやり取り全てにその内容が乗り続けます。目安として
            数万バイトを超える`.md`・`.yml`は`Read`で全体を開かず、`Grep`で該当箇所を特定してから
            `Read`の`offset`・`limit`で必要な範囲だけ読んでください。特に
            `.github/workflows/claude-issue-dispatch.yml`（約120KB）は大きいため、全体を開かないで
            ください。

            これが差分に含まれている場合も、読むのは`gh pr diff`が出力した変更箇所と、その前後の
            文脈を確認するために必要な範囲だけで十分です。

            ## 確認すること
            - 対応Issueの要件を満たしているか（`gh issue view <番号>`でIssue本文・コメントを確認する）
            - Issue外の変更が混入していないか
            - 既存設計・このリポジトリの`CLAUDE.md`・`docs/`のルールと整合しているか
            - コード品質・セキュリティ上の問題がないか（OWASP Top10等の観点を含む）
            - CI結果に問題がないか（`gh pr checks`で確認。同一ワークフロー内の`wait-for-ci`ジョブが
              CI完了を待ってからこのジョブを起動しているため、通常は結果が出ているはずだが、
              タイムアウト等でまだ実行中の場合はその旨のみ記載する）
            - 全アプリ共通の共有知識と矛盾していないか（下記「共有知識との整合性」参照）
            - `.shared-context/`配下（共有知識リポジトリのcheckout）がPRの差分に混入していないか。
              混入していれば必ず指摘し、自動マージ不可として扱う

            ## 全アプリ共通の共有知識（`.shared-context/`）
            ワークツリー内の`.shared-context/`に、全アプリ共通の知識リポジトリ（`guchi-apps/docs`）が
            チェックアウトされています。レビューに必要な範囲だけ読んでください。

            - `.shared-context/CLAUDE.md` — 共有知識の索引・読む順序
            - `.shared-context/agent-rules/review.md` — レビュー・統合エージェントの共通ルール
            - `.shared-context/knowledge/` — 今回のPRが触る領域に対応するファイルがあれば読む

            注意事項:
            - `.shared-context/`配下は読み取り専用です。編集・コミットは行いません。
            - ディレクトリが存在しない場合（checkoutに失敗した場合）は、共有知識に関する確認は
              スキップし、その旨をレビューコメントに一行だけ記載してください。レビュー自体は続行します。
            - 共有知識の記述とこのリポジトリの`CLAUDE.md`・`docs/`が矛盾する場合は、このリポジトリ側が
              優先されます。共有知識に反しているという理由だけで「要修正」と判定しないでください。
              ただし、意図的な逸脱に見えない場合は「気になった点」として指摘してください。

            ## 自動マージ不可カテゴリの判定
            以下のいずれかに該当する変更が含まれる場合は「自動マージ不可」と判定してください。
            - 認証・認可
            - DBスキーマ変更・マイグレーション
            - 本番環境の設定
            - GitHub Actionsやデプロイ設定
            - Secretsや環境変数
            - 課金・決済
            - 大規模な依存関係の更新

            判定方法:
            - 一次判定（機械的）: 同一ワークフロー内の`risk-check`ジョブが`git diff --name-only origin/develop...HEAD`のパスパターンで既に判定済み（該当時は対応Issueへの00.check-user付与も完了している）
            - 二次判定（意味的、あなたの担当）: パスパターンに引っかからなくても、diffの内容自体が上記カテゴリに実質該当しないか読解して判断する

            該当すると判定し、かつ対応Issue番号が特定できている場合のみ、以下を両方実行してください
            （ラベル付与だけでなくコメント投稿も必須。ユーザーがissue画面を見て理由が分かるようにするため）。
            - `gh issue edit <対応Issue番号> --add-label "00.check-user"`
            - `gh issue comment <対応Issue番号> --body "..."` で、該当すると判断した理由を日本語で
              issueにコメント投稿する（risk-checkジョブが既にコメント済みの理由と重複してもよい。
              あなたの判定はrisk-checkとは独立した二次判定のため）。コメント本文の末尾に、投稿元を
              示す`<!-- issue-deck-source:claude-review-develop -->`マーカーを必ず付与すること

            ## 共有知識への追加提案の審査
            対応Issue番号が特定できている場合、`gh issue view <対応Issue番号> --comments` で取得した
            コメントの中に、実装エージェントが投稿した`<!-- shared-knowledge-proposal -->`マーカー付きの
            「共有知識への追加提案」コメントが含まれていることがあります。含まれている場合のみ、
            以下の審査を行ってください（含まれていなければこの節は何もしません）。

            提案されている各項目について、次の4観点を**すべて**満たすかを判定します。

            1. **再利用性** — 対象リポジトリを別のアプリに差し替えても内容が成立するか。
               issue-deck固有のディレクトリ構成・スキーマ・画面・ラベル・ワークフロー定義に
               依存していないか
            2. **正確性** — 根拠（出典URL、または再現した事象と実行ログ）が示されており、
               `.shared-context/`の既存の記述や公式仕様と矛盾しないか
            3. **重複** — `.shared-context/`配下に既に同等の記述がないか（`Grep`で確認する。
               既にあるなら却下、または差分だけに絞るよう指摘する）
            4. **恒久性** — 一時的な障害・特定バージョン限定のバグではなく、数週間以上有効な
               仕様・制約・方針か

            判定結果は `gh issue comment <対応Issue番号> --body "..."` で対応Issueへ日本語で投稿し、
            本文末尾に次のマーカーを付与してください。

            - 提案の全部または一部を承認する場合: `<!-- shared-knowledge-verdict:approved -->`
            - すべて却下する場合: `<!-- shared-knowledge-verdict:rejected -->`

            あわせて、投稿元を示す`<!-- issue-deck-source:claude-review-develop -->`マーカーも付与して
            ください。一部承認の場合は、どの提案を承認しどれを却下したかを理由つきで本文に明記して
            ください（承認された提案だけが、developマージ後に別のワークフローによって共有知識
            リポジトリへのPull Requestに変換されます）。

            **判定は共有知識を汚さない方向に倒してください。** 迷った場合は却下し、その知見は対象
            リポジトリの`docs/`にアプリ固有の知見として残すよう本文で促してください。この審査は
            PRのマージ可否とは独立しており、提案を却下したことを理由に`00.check-user`を付与したり
            「要修正」と判定したりはしないでください。

            ## 出力
            レビュー結果は日本語で、以下の内容を含めてPRへのコメントとして投稿してください。
            - 総評（LGTM / 要修正 / 要確認 のいずれか）
            - 気になった点（あれば具体的なファイル・行を示す）
            - 自動マージ不可カテゴリに該当するかどうかとその理由
            - 共有知識への追加提案があった場合は、その審査結果の要約（詳細は上記のとおりIssue側へ
              投稿する）

            ## 禁止事項
            - PRのマージ・承認（Approve）は行わない
            - ラベル `03.d:marge` 等の状態遷移ラベルの付け替えは行わない（`00.check-user`の付与のみ許可）
            - コードの直接修正は行わない（レビューコメントの投稿のみ）
            - `.shared-context/`配下（共有知識リポジトリ）の編集・コミット。共有知識への反映は
              developマージ後に別のワークフローがPull Requestとして行い、最終的なマージは人間が行う

      - name: Claude使用量をJob Summaryに出力する（Run Claude Code Review）
        # トークン使用量・ターン数・権限拒否を可視化する(#903)。計測は補助情報のため、
        # 失敗しても本来の処理に影響させない(スクリプト側で常にexit 0する)。
        if: always() && steps.claude_review.outputs.execution_file != ''
        run: .github/scripts/summarize-claude-usage.sh "Run Claude Code Review" "${{ steps.claude_review.outputs.execution_file }}"

  claude-review-fallback:
    needs: [identify-issue, claude-review]
    if: always() && needs.claude-review.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: 自動レビュー失敗をPRに通知する
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ needs.identify-issue.outputs.number }}
        run: |
          set -e
          gh pr comment "$PR_NUMBER" --body "⚠️ 自動レビュー（claude-review）が実行できませんでした。Actionsの実行ログを確認してください。安全のため自動マージはスキップされます。"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label "00.check-user"
          fi

  auto-merge:
    needs: [identify-issue, risk-check, claude-review]
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # GITHUB_TOKEN起点でAuto-mergeを有効化すると、必須ステータスチェック通過後に
      # GitHub側が非同期に実行する実際のマージが「GITHUB_TOKEN起点のイベントは他の
      # ワークフローを起動しない」というGitHub仕様の影響を受け、issue-labels.ymlの
      # develop-pr-mergedジョブが発火しないことがある(Issue #112)。WORKFLOW_PAT
      # （実PAT由来）で有効化することでこの制約を回避する。
      - name: 自動マージ可否を判定して実行する
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.identify-issue.outputs.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "対応Issue番号を特定できないため、自動マージをスキップします。"
            exit 0
          fi

          LABELS="$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')"
          if echo "$LABELS" | grep -qx "00.check-user"; then
            echo "対応Issue #${ISSUE_NUMBER} に 00.check-user が付与されているため、自動マージをスキップします。"
            exit 0
          fi

          echo "自動マージ不可カテゴリに該当しないため、auto-mergeを有効化します。"
          gh pr merge "$PR_NUMBER" --auto --merge

  auto-merge-fallback:
    needs: [identify-issue, auto-merge]
    if: always() && needs.auto-merge.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: 自動マージ失敗をPRに通知する
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ needs.identify-issue.outputs.number }}
        run: |
          set -e
          gh pr comment "$PR_NUMBER" --body "⚠️ 自動マージ（auto-merge）が失敗しました。Actionsの実行ログを確認し、必要であれば手動でマージしてください。"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label "00.check-user"
          fi
