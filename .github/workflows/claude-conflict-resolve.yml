name: Claude Conflict Resolve

# develop向けPRがdevelopとの間でコンフリクトした際、これまでは人間がIssueに
# `@claude コンフリクトを解消して`のようにコメントして個別に依頼する必要があった。
# この依頼を自動化し、コンフリクトを検知したら人間の操作なしにClaude Codeが解消を
# 試みるワークフロー(docs/multi-agent/auto-repair.md「PRコンフリクトの自動解消」参照、issue #315)。
#
# **トリガー定義のみ**を持ち、ジョブ本体(detect-conflicts / resolve-conflicts)は
# reusable-claude-conflict-resolve.ymlへ切り出してある(#1066)。
# 他リポジトリからも同じ実体を呼べるようにするため(方式は#934、先行例は#940・#945・#1066)。
#
# issue-deck自身はローカルパス参照(./)を使い、常にそのブランチ・PRの内容で動かす。
# 他アプリはタグ固定(@workflows/vX)で参照する運用とし、issue-deck側が先に壊れて
# 他アプリには波及しない「カナリア」構成にする(#934)。
#
# トリガー:
# - workflow_run(CI / requested / develop): developへ新たな変更が入るとOPENなPRが
#   コンフリクトしうるため、その都度検知する(最も速報性が高い経路)。
#   本来はpush(develop)で直接受けたいが、claude-code-actionはpushイベントに対応して
#   おらず`Unsupported event type: push`で必ず失敗する(#1330。対応するのはissues /
#   issue_comment / pull_request / pull_request_target / pull_request_review /
#   pull_request_review_comment / workflow_dispatch / repository_dispatch /
#   schedule / workflow_runの10種類のみ)。ci.ymlがpush(develop)で走るため、その
#   `requested`(=CI実行がキューされた時点)を代理のpush通知として使う。completedでは
#   なくrequestedにするのは、CIの完走を待つ分だけ検知が遅れるのを避けるためで、
#   コンフリクト検知自体はCIの成否と無関係なため待つ必要がない。
#   なお workflow_run は「デフォルトブランチ上のワークフローファイル」でのみ発火する。
#   このリポジトリのデフォルトブランチはdevelopなので、developへマージした時点で有効。
# - pull_request(develop向け、opened/reopened): develop向けPRが作成された時点で
#   既にdevelopとコンフリクトしているケース(issue #715)を即座に拾うため。
#   synchronize(PRへの追加push毎)は含めない。実装エージェントが1つのIssueに対して
#   何度も細かくpushする間、毎回detect-conflicts→resolve-conflictsのmatrixジョブが
#   走ると、resolve-conflictsが使う同じissue-dispatch-<番号>-branch concurrency
#   グループ内で実装ステップ自体と噛み合いキューが詰まる懸念があるため。developが
#   動いてPRがコンフリクトに変化するケースは既存のworkflow_run(develop)トリガーで
#   カバーされる。
#   このトリガーはトリガー元のPR自身が既にコンフリクトしていないかだけを見ればよく、
#   develop向けの他PRの状態まで見る必要はない。1回のワークフロー実行内のmatrix全ジョブの
#   チェックはトリガーしたPRのチェック一覧に紐付いて表示されるため、全件スキャンすると
#   たまたま同じタイミングでコンフリクトしていた無関係な他PRのチェックまで表示されて
#   しまう不具合があった(#814)
# - schedule(15分おき): GitHubのmergeable判定は非同期に計算されるため、workflow_run・
#   pull_request直後の検知時点ではまだ計算が終わっておらずUNKNOWNのままの場合がある。
#   detect-conflictsのポーリングでも解消しきれなかった取りこぼしを拾い直す
#   安全網として、issue-labels.ymlの各scheduleジョブと同じ間隔で走査する
# - workflow_dispatch: 手動実行用。issue_numberを指定するとそのIssueのdevelop向けPR
#   1件だけを対象にする(未指定なら従来どおり全件走査)。issue-deckの画面の
#   「コンフリクトを自動解消」ボタンがこの経路で起動する(#1293)

on:
  workflow_run:
    workflows:
      - CI
    types:
      - requested
    branches:
      - develop
  pull_request:
    types:
      - opened
      - reopened
    branches:
      - develop
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "対象のIssue番号（未指定ならdevelop向けの全OPEN PRを走査する）"
        required: false
        type: string

jobs:
  conflict-resolve:
    uses: ./.github/workflows/reusable-claude-conflict-resolve.yml
    # issue-deckは唯一pnpmを使うリポジトリ（他の全アプリはnpm）。既定は多数派のnpmのため明示する。
    with:
      runtime-setup: node-db
      package-manager: pnpm
      # 再利用ワークフロー内のinputsコンテキストはworkflow_callのinputsを指すため、
      # 呼び出し元のworkflow_dispatch入力はここで明示的に渡す（claude-ci-fix.ymlと同じ）。
      issue-number: ${{ inputs.issue_number }}
      # プロンプトの「- 解消後、」に続けてそのまま埋め込まれるため、文末まで含めて書く。
      # YAMLの折りたたみ(>-)は改行を半角スペースへ変換し日本語の途中に空白が入るため、1行で書く。
      verify-commands: "`pnpm test`（lint・typecheckを実行）と `pnpm build:ci` を実行し、問題がないことを確認する（DBサーバーは実際には起動していないが、環境変数はこのステップに既に設定済みのため`.github/workflows/ci.yml`のbuildステップと同様に成功するはず）"
      # pnpm build:ciの実行に必要。.github/workflows/ci.ymlのbuildステップと同じ
      # プレースホルダー値を使う（実際の外部サービスには接続しない）。
      # 実シークレットはここに書かない（secrets: inheritで別途渡る）。
      build-env: |
        DATABASE_URL=mysql://placeholder:placeholder@127.0.0.1:3306/app_issue_deck
        NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-placeholder
        GITHUB_APP_ID=123456
        GITHUB_APP_PRIVATE_KEY_BASE64=Y2ktcGxhY2Vob2xkZXI=
        NEXT_PUBLIC_GITHUB_APP_SLUG=ci-placeholder
        GITHUB_WEBHOOK_SECRET=ci-placeholder
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
