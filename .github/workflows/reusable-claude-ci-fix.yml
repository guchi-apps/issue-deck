name: Reusable Claude CI Fix

# develop向けPR（issue-<番号>ブランチ）のCI（.github/workflows/ci.yml）が失敗した際、
# Claude Codeが原因を修正してpushするワークフローのジョブ本体（#1066）。
# トリガー定義は呼び出し元の claude-ci-fix.yml が持ち、ここは on: workflow_call のみ。
#
# もとは各リポジトリへファイルごとコピーする方式だったが、コピーは
# 「ファイル数 × リポジトリ数」で増えるうえ、issue-deck側の改善が届かないまま
# 独立にドリフトしていく（実測でshopping-listは47%が差分になっていた）。
# 方式の設計は#934、最初の適用例は#940（issue-labels.yml）・#945（claude-issue-dispatch.yml）。
#
# リポジトリ差はinputsで吸収する:
#   runtime-setup:   node-db(Next.js+DB) / node(Next.js) / minimal(素のJS)
#                    ※本ワークフローはDBサービスコンテナを持たないため node-db と node は同じ挙動。
#                      値の語彙をreusable-issue-dispatch.ymlと揃え、callerが全ワークフローへ
#                      同じ値を渡せるようにしている
#   package-manager: npm(既定) / pnpm  ※issue-deckのみpnpm、他の全アプリはnpm
#   build-env:       ビルド検証に必要なダミー環境変数（複数行のKEY=VALUE）
#   verify-commands: 修正後に実行させる検証コマンドの説明
#   prompts-ref:     プロンプト(.github/prompts/)の取得元
#
# 呼び出し元は secrets: inherit で WORKFLOW_PAT・CLAUDE_CODE_OAUTH_TOKEN を渡すこと。

on:
  workflow_call:
    inputs:
      runtime-setup:
        description: "ランタイム準備のプリセット: node-db / node / minimal"
        required: false
        type: string
        default: minimal
      package-manager:
        description: "パッケージマネージャ: npm / pnpm"
        required: false
        type: string
        default: npm
      node-version:
        description: "セットアップするNode.jsのバージョン。未指定なら24"
        required: false
        type: string
        default: ""
      install-dependencies:
        description: >-
          ランタイム準備で依存関係をインストールするか。runtime-setup が minimal 以外のときのみ効く。
          Nodeのセットアップは必要だが依存のインストールは不要なリポジトリ（検証コマンドが
          node --check だけで node_modules を要さない等）で false にする。
        required: false
        type: boolean
        default: true
      build-env:
        description: >-
          Claude Codeステップに設定するビルド検証用の環境変数（複数行の KEY=VALUE）。
          値はワークフローログに残りうるCI専用のプレースホルダーに限り、
          実シークレットは絶対に渡さないこと（実シークレットは secrets: inherit で渡る）。
          値に改行を含めることはできない。
        required: false
        type: string
        default: ""
      verify-commands:
        description: >-
          修正後の検証手順の説明。プロンプトの「- 修正後、」に続けてそのまま埋め込まれるため、
          文末まで含む完全な文で渡すこと。ビルドに外部サービスが要らない旨などの補足も
          ここに含める。未指定なら
          「.github/workflows/ci.yml を読んで同じコマンドを実行する」旨の文面へ
          フォールバックする。
        required: false
        type: string
        default: ""
      prompts-ref:
        description: >-
          プロンプト(.github/prompts/)の取得元とするissue-deckのref。
          未指定なら呼び出し元リポジトリの.github/prompts/を使う(issue-deck自身はこちら)。
          他リポジトリから呼ぶ場合は uses: と同じタグを指定する。
        required: false
        type: string
        default: ""
      issue-number:
        description: >-
          手動実行(workflow_dispatch)時の対象Issue番号。呼び出し元が自身の
          workflow_dispatch入力を渡す。workflow_run起点の場合は空になり、
          detectジョブがworkflow_runのペイロードから判定する。
          再利用ワークフロー内のinputsコンテキストはworkflow_callのinputsを指し、
          呼び出し元のworkflow_dispatch入力は見えないため、こうして明示的に渡す。
        required: false
        type: string
        default: ""

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_process: ${{ steps.detect.outputs.should_process }}
      issue_number: ${{ steps.detect.outputs.issue_number }}
    steps:
      - name: 対象Issueを判定する
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue-number }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PR_LIST_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          set -e
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "手動実行のため入力されたIssue番号をそのまま対象にします"
            echo "should_process=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=$INPUT_ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$WORKFLOW_RUN_CONCLUSION" != "failure" ]; then
            echo "conclusion=$WORKFLOW_RUN_CONCLUSION のため対象外です"
            echo "should_process=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$WORKFLOW_RUN_EVENT" != "pull_request" ]; then
            echo "event=$WORKFLOW_RUN_EVENT のため対象外です（developへの直接pushはこのワークフローの対象外）"
            echo "should_process=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_JSON="$(echo "$PR_LIST_JSON" | jq -c '.[0]')"
          if [ -z "$PR_JSON" ] || [ "$PR_JSON" = "null" ]; then
            echo "workflow_runペイロードにPR情報が無いため対象外です"
            echo "should_process=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_REF="$(echo "$PR_JSON" | jq -r '.base.ref')"
          HEAD_REF="$(echo "$PR_JSON" | jq -r '.head.ref')"
          if [ "$BASE_REF" != "develop" ]; then
            echo "base=$BASE_REF のため対象外です（developへ向くPRのみ対象。develop→mainのリリースPRは#812で別途検討）"
            echo "should_process=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! echo "$HEAD_REF" | grep -qE '^issue-[0-9]+$'; then
            echo "head=$HEAD_REF がissue-<番号>命名規約に従わないため対象外です"
            echo "should_process=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ISSUE_NUMBER="$(echo "$HEAD_REF" | sed -E 's/^issue-([0-9]+)$/\1/')"
          echo "対象Issue: #$ISSUE_NUMBER"
          echo "should_process=true" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

  fix:
    needs: detect
    if: needs.detect.outputs.should_process == 'true'
    runs-on: ubuntu-latest
    # claude-issue-dispatch.ymlのdispatchジョブのbranchレーンと同じグループ名で直列化する。
    # 同じissue-<番号>ブランチへ、人間からの追加依頼（@claudeコメント）による実装ステップや
    # claude-conflict-resolve.ymlのコンフリクト解消のpushと競合しないようにする
    # （claude-conflict-resolve.ymlと同じ考え方）。
    concurrency:
      group: issue-dispatch-${{ needs.detect.outputs.issue_number }}-branch
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          # 後続のgit push、および.github/workflows/配下の修正に備え、workflow書き込み権限を持つ
          # PAT（secrets.WORKFLOW_PAT）でcheckoutする（claude-conflict-resolve.ymlと同じ理由）。
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: プロンプトの取得元をissue-deck側にする（prompts-ref指定時）
        # 共有ワークフローはcaller側リポジトリをcheckoutするため、.github/prompts/配下も
        # caller側のものが読まれる。プロンプトを各リポジトリへコピーせずに共有するための
        # 取得経路（reusable-issue-dispatch.ymlと同じ仕組み、#960）。
        #
        # 未指定(既定)なら何もしない。issue-deck自身は自分の.github/prompts/を使うため指定しない。
        # persist-credentials: false は本体リポジトリのpush認証と混線させないため。
        # continue-on-errorは付けない。プロンプトは必須であり、取得に失敗したまま進むと
        # 空のプロンプトで走り出すため。
        if: inputs.prompts-ref != ''
        uses: actions/checkout@v4
        with:
          repository: guchi-apps/issue-deck
          ref: ${{ inputs.prompts-ref }}
          path: .shared-prompts
          fetch-depth: 1
          persist-credentials: false

      - name: 共有ファイルの参照先を決める
        # 呼び出し元リポジトリに存在しうる/しないファイルの場所を1箇所で決める
        # （reusable-issue-dispatch.ymlの同名ステップと同じ、#960・#964）。
        env:
          PROMPTS_REF: ${{ inputs.prompts-ref }}
        run: |
          set -euo pipefail
          if [ -n "$PROMPTS_REF" ]; then
            ROOT=.shared-prompts
          else
            ROOT=.
          fi

          DIR="$ROOT/.github/prompts"
          if [ ! -d "$DIR" ]; then
            echo "::error::プロンプトのディレクトリ $DIR が存在しません。他リポジトリから呼ぶ場合は prompts-ref に uses: と同じタグを指定してください"
            exit 1
          fi
          echo "プロンプトの参照先: $DIR"
          echo "PROMPTS_DIR=$DIR" >> "$GITHUB_ENV"

          # 使用量出力スクリプト(#903)。プロンプトと違い必須ではないため、無くても落とさない。
          USAGE="$ROOT/.github/scripts/summarize-claude-usage.sh"
          if [ -x "$USAGE" ]; then
            echo "使用量出力スクリプト: $USAGE"
          else
            echo "使用量出力スクリプト $USAGE が無いため、使用量のJob Summary出力はスキップします"
            USAGE=""
          fi
          echo "CLAUDE_USAGE_SCRIPT=$USAGE" >> "$GITHUB_ENV"

      - name: pushの認証をWORKFLOW_PATに固定する
        # claude-code-actionは実行時にactions/checkoutが残した認証情報を削除するため、
        # push専用URL（remote.origin.pushurl）にPATを固定して.github/workflows/配下を含む
        # pushのremote rejectedを防ぐ（claude-conflict-resolve.ymlの同名ステップと同じ理由）。
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git remote set-url --push origin \
            "https://x-access-token:${WORKFLOW_PAT}@github.com/${REPOSITORY}.git"

      - name: 対象PRの状態・リトライ回数を再確認する
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.detect.outputs.issue_number }}
        run: |
          set -e
          BRANCH="issue-$ISSUE_NUMBER"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # detect実行時点からのタイムラグを考慮し、着手前にIssueのクローズ状態を再確認する。
          ISSUE_STATE="$(gh issue view "$ISSUE_NUMBER" --json state --jq .state)"
          if [ "$ISSUE_STATE" = "CLOSED" ]; then
            echo "Issueがクローズ済みのため何もしません"
            echo "should_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_JSON="$(gh pr list --head "$BRANCH" --base develop --state open --json number,url,headRefOid --jq '.[0]')"
          if [ -z "$PR_JSON" ] || [ "$PR_JSON" = "null" ]; then
            echo "対象のdevelop向けPRが見つからないため何もしません"
            echo "should_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_NUMBER="$(echo "$PR_JSON" | jq -r '.number')"
          PR_URL="$(echo "$PR_JSON" | jq -r '.url')"
          HEAD_SHA="$(echo "$PR_JSON" | jq -r '.headRefOid')"

          # 現在のHEADに対する最新のCI実行結果を再確認する。workflow_run発火からこのジョブの
          # 着手までの間に、実装エージェントの追加pushなどで既に直っている可能性があるため。
          RUN_JSON="$(gh run list --branch "$BRANCH" --workflow "CI" \
            --json databaseId,conclusion,headSha,event --limit 10 \
            | jq -c --arg sha "$HEAD_SHA" \
              '[.[] | select(.headSha == $sha and .event == "pull_request")] | sort_by(.databaseId) | reverse | .[0]')"
          if [ -z "$RUN_JSON" ] || [ "$RUN_JSON" = "null" ]; then
            echo "現在のHEADに対するCI実行結果がまだ取得できないため何もしません"
            echo "should_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CONCLUSION="$(echo "$RUN_JSON" | jq -r '.conclusion')"
          if [ "$CONCLUSION" != "failure" ]; then
            echo "現在のHEADのCIは失敗していないため何もしません（conclusion=$CONCLUSION）"
            echo "should_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUN_ID="$(echo "$RUN_JSON" | jq -r '.databaseId')"

          # 無限ループ防止のため、このワークフローが投稿した「着手コメント」の数（=試行回数）が
          # 既に上限（2回）に達している場合は、これ以上自動修正を試みず人間の確認を待つ。
          ATTEMPT_COUNT="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '
            [.comments[]
              | select(.body | contains("<!-- issue-deck-source:claude-ci-fix -->"))
              | select(.body | contains("自動修正を試みます"))
            ] | length
          ')"
          if [ "$ATTEMPT_COUNT" -ge 2 ]; then
            echo "自動修正の試行回数が上限（2回）に達しているため人間の確認を待ちます"
            BODY="⚠️ CI失敗の自動修正を${ATTEMPT_COUNT}回試みましたが、まだCIが失敗しています。無限ループを避けるため自動修正を停止し、人間の確認を待ちます。"
            BODY="$BODY"$'\n\n<!-- issue-deck-source:claude-ci-fix -->'
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
            REASON_LABEL="01.check-blocked"
            # 展開先リポジトリにラベル自体が定義されていない場合でもこのステップを落とさないよう、
            # 付与・除去の前にリポジトリのラベル一覧と突き合わせる(#975)。理由ラベル(#1490)は常に1枚
            # なので、定義済みの他の理由ラベルは同じ呼び出しで外す。
            DEFINED_LABELS="$(gh label list --json name --jq '.[].name' --limit 200)"
            LABEL_ARGS=()
            for name in "00.check-user" "$REASON_LABEL"; do
              if grep -qx "$name" <<<"$DEFINED_LABELS"; then
                LABEL_ARGS+=(--add-label "$name")
              else
                echo "::warning::ラベル '$name' がリポジトリに存在しないため付与をスキップします"
              fi
            done
            for name in 01.check-plan 01.check-input 01.check-merge 01.check-blocked 01.check-answered 00.qa-answered; do
              if [ "$name" != "$REASON_LABEL" ] && grep -qx "$name" <<<"$DEFINED_LABELS"; then
                LABEL_ARGS+=(--remove-label "$name")
              fi
            done
            if [ "${#LABEL_ARGS[@]}" -gt 0 ]; then
              gh issue edit "$ISSUE_NUMBER" "${LABEL_ARGS[@]}"
            fi
            echo "should_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_fix=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: 作業ブランチをcheckoutする
        if: steps.state.outputs.should_fix == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          BRANCH: ${{ steps.state.outputs.branch }}
        run: |
          set -e
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"

      - name: 対応開始をコメントで通知する
        if: steps.state.outputs.should_fix == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ steps.state.outputs.branch }}
          ISSUE_NUMBER: ${{ needs.detect.outputs.issue_number }}
        run: |
          set -e
          BODY="🛠️ CIの失敗を検知したため、\`${BRANCH}\` ブランチで自動修正を試みます。"
          BODY="$BODY"$'\n\n'"実行ログ: $RUN_URL"
          BODY="$BODY"$'\n\n<!-- issue-deck-source:claude-ci-fix -->'
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"

      - name: 解消前のコメント数を記録する
        id: before
        if: steps.state.outputs.should_fix == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.detect.outputs.issue_number }}
        run: |
          COUNT="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments | length')"
          echo "comment_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: 失敗したジョブ・ステップのログを取得する
        if: steps.state.outputs.should_fix == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.state.outputs.run_id }}
        run: |
          set -e
          gh run view "$RUN_ID" --log-failed > /tmp/ci-failed-log.txt || true
          echo "取得したログの行数: $(wc -l < /tmp/ci-failed-log.txt)"

      - name: Setup pnpm
        if: steps.state.outputs.should_fix == 'true' && inputs.package-manager == 'pnpm' && inputs.runtime-setup != 'minimal'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.state.outputs.should_fix == 'true' && inputs.runtime-setup != 'minimal'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version || '24' }}
          cache: ${{ inputs.package-manager }}

      - name: 依存関係をインストールする
        if: steps.state.outputs.should_fix == 'true' && inputs.runtime-setup != 'minimal' && inputs.install-dependencies
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: ビルド検証用の環境変数を設定する
        # Claude Codeエージェントがビルドを実行して修正を検証できるようにするための
        # CI専用プレースホルダー。実シークレットは渡さない前提（inputs.build-envのdescription参照）。
        if: steps.state.outputs.should_fix == 'true' && inputs.build-env != ''
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            if ! printf '%s' "$line" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*='; then
              echo "::error::build-env の行が KEY=VALUE 形式ではありません: $line"
              exit 1
            fi
            # 環境変数名だけをログに出す（値はプレースホルダーの想定だが、念のため出力しない）
            echo "設定: ${line%%=*}"
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$BUILD_ENV"

      - name: CI失敗修正プロンプトを組み立てる
        # プロンプト本文は.github/prompts/ci-fix.mdに置き、ここで動的な値を埋めたうえで
        # 環境変数に格納する（reusable-issue-dispatch.ymlと同じ仕組み、#907）。
        #
        # ワークフローのYAMLに直接書くと、`${{ }}`を1つでも含む文字列はブロック全体が1つの式
        # テンプレートとして扱われ、その長さに21,000バイト(UTF-8)の上限がかかる。超えると
        # ワークフローファイル自体が「Invalid workflow file」となりトリガーが一切発火しなくなる
        # （#901で無人実行が丸半日停止した）。env経由にすることでこの上限を構造的に回避する。
        if: steps.state.outputs.should_fix == 'true'
        env:
          ISSUE_NUMBER: ${{ needs.detect.outputs.issue_number }}
          BRANCH: ${{ steps.state.outputs.branch }}
          PR_NUMBER: ${{ steps.state.outputs.pr_number }}
          PR_URL: ${{ steps.state.outputs.pr_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERIFY_COMMANDS_INPUT: ${{ inputs.verify-commands }}
        run: |
          set -euo pipefail
          if [ -n "$VERIFY_COMMANDS_INPUT" ]; then
            VERIFY_COMMANDS="$VERIFY_COMMANDS_INPUT"
          else
            VERIFY_COMMANDS='`.github/workflows/ci.yml` を読み、CIが実行している検証コマンドと同じものを実行して、問題がないことを確認する'
          fi
          export VERIFY_COMMANDS

          PROMPT_FILE="${PROMPTS_DIR:-.github/prompts}/ci-fix.md"
          # プロンプトが空のままclaude-code-actionへ渡ると、エージェントが何をすべきか分からないまま
          # 走り出してしまう。ファイルの取り違え・削除に気付けるよう、ここで明示的に落とす。
          if [ ! -s "$PROMPT_FILE" ]; then
            echo "::error::$PROMPT_FILE が存在しないか空です"
            exit 1
          fi
          # envsubstの置換対象を変数リストで明示指定し、プロンプト本文中の他の$表記を巻き込まない
          # ようにする。
          {
            echo 'PROMPT_CI_FIX<<__ISSUE_DECK_PROMPT_EOF__'
            envsubst '${ISSUE_NUMBER} ${BRANCH} ${PR_NUMBER} ${PR_URL} ${REPOSITORY} ${RUN_URL} ${VERIFY_COMMANDS}' < "$PROMPT_FILE"
            echo '__ISSUE_DECK_PROMPT_EOF__'
          } >> "$GITHUB_ENV"

      - name: Claude Code（CI失敗修正）
        id: claude_ci_fix
        if: steps.state.outputs.should_fix == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          # .github/workflows/配下を含むgit pushの認証は、前段の「pushの認証をWORKFLOW_PATに
          # 固定する」ステップが設定するremote.origin.pushurlで別途完結しており、このステップの
          # GH_TOKENには依存しない（claude-conflict-resolve.ymlと同じ理由）。
          # ビルド検証用の環境変数は前段の「ビルド検証用の環境変数を設定する」ステップが
          # $GITHUB_ENV経由で設定済み。
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude-code-actionの非人間アクター拒否機構を明示的に許可する（#1328）。
          # workflow_run（CIの完了）で起動する場合のactorはCIを起こしたpushの実行者のため
          # 従来は人間で通っていたが、issue-deckの画面の「CI失敗を自動修正」ボタン（#1293）は
          # GitHub Appのインストールトークンでworkflow_dispatchするためactorが
          # issue-deck[bot]になり、指定が無いと`Workflow initiated by non-human actor`で
          # 必ず失敗する。claude[bot]名義のpushでCIが失敗した場合も同様に通す
          # （reusable-claude-conflict-resolve.yml・reusable-claude-pr-repair.ymlと揃える）。
          allowed_bots: "issue-deck[bot],claude[bot]"
          show_full_output: true
          # 実装が使う検証コマンドの許可リスト。**3つの再利用可能ワークフロー
          # (reusable-issue-dispatch / reusable-claude-ci-fix /
          # reusable-claude-conflict-resolve)で同一に保つこと。** ここだけ食い違うと、
          # 「CIは自動修正できるのに実装はできない」といった不揃いな挙動になる(#1147)。
          #
          # 出し分けるのはパッケージマネージャ本体だけにする(#931)。pnpmのリポジトリで
          # npmを許可するとロックファイルの取り違えが起きうるため、そこだけは分ける。
          # allowedToolsは許可リストであり、載っていないコマンドは拒否される。issue-deck
          # 自身はpnpmのため、pnpm固定でもセルフホスティングでは表面化せず、#1047でnpmの
          # リポジトリを増やして初めて発覚した(dispatchだけがこの出し分けから漏れていた)。
          #
          # **nodeとnpxは両方で許可する(#931)。** 以前はnpm側にしかnodeが無く、pnpmの
          # リポジトリでは `node -e "..."` のような状態確認が拒否されていた。実測では
          # エージェントが `pnpm exec node <ファイル>` へ切り替えて回復したが、
          # 一時ファイルを書く手間が余分に発生していた。nodeはパッケージマネージャに
          # 依存しない実行系で、どちらのリポジトリでも同じように必要になる。
          #
          # pythonは常に許可する。Pythonを使わないリポジトリでは単に使われないだけで、
          # pip installで任意パッケージを取得できる点はnpm/npxと同等のためリスクの
          # 種類が増えるわけではない。呼び出し元ごとに絞るinputは、必要になるまで
          # 増やさない(#1056 myroomがpytestを使う)。
          # ランナー標準のPythonを使うため、CIがsetup-pythonで固定しているバージョンと
          # ズレる可能性がある。厳密に揃える必要が出たらruntime-setupのプリセット追加を
          # 検討する。
          #
          # ls・cat・head・tail・wcは状態確認のための読み取り専用コマンド(#931)。
          # 実測では `ls node_modules/.bin/playwright`・`cat .claude/settings.json` が
          # 拒否されており、いずれも「今どうなっているか」を見るだけの操作だった。
          # 書き込み・削除系(mkdir・rm・mv)は足していない。一時ファイルは既存の /tmp 直下へ
          # 直接書けばディレクトリ作成が要らず、ランナーは実行ごとに破棄されるため掃除も要らない。
          # その旨をプロンプト側に明記して、そもそも使わせない方向で解決している。
          claude_args: >-
            --allowedTools "Edit,Write,Read,Grep,Glob,Bash(git:*),Bash(gh:*),${{ inputs.package-manager == 'pnpm' && 'Bash(pnpm:*)' || 'Bash(npm:*)' }},Bash(npx:*),Bash(node:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(pip3:*),Bash(pytest:*),Bash(curl:*),Bash(grep:*),Bash(find:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*)"
          prompt: ${{ env.PROMPT_CI_FIX }}

      - name: Claude使用量をJob Summaryに出力する（Claude Code（CI失敗修正））
        # トークン使用量・ターン数・権限拒否を可視化する(#903)。計測は補助情報のため、
        # 失敗しても本来の処理に影響させない(スクリプト側で常にexit 0する)。
        if: always() && steps.claude_ci_fix.outputs.execution_file != ''
        run: |
          # スクリプトが解決できていない場合はスキップする(#964)。使用量は補助情報であり、
          # 呼び出し元にスクリプトが無いことで本来の処理を失敗させない。
          if [ -z "${CLAUDE_USAGE_SCRIPT:-}" ]; then
            echo "使用量出力スクリプトが無いためスキップします"
            exit 0
          fi
          "$CLAUDE_USAGE_SCRIPT" "Claude Code（CI失敗修正）" "${{ steps.claude_ci_fix.outputs.execution_file }}"

      - name: Project Status を Develop PR へ戻す
        # reusable-issue-labels.ymlのwip-on-pushジョブが、issue-<番号>ブランチへのpush
        # （このジョブが上記ステップで行うpushを含む）をトリガーに無条件でImplementationを
        # 報告するため、developへのPRが出ている段階のissueが盤面上だけ実装中へ巻き戻る。
        # それを打ち消して`Develop PR`へ戻す。LLMの実行有無に依存させないため独立した
        # シェルステップとする（同じ状態を再報告するだけなので常に実行してよい）。
        #
        # Phase 4までは同じ目的で実装中を示す進捗ラベルを除去していた。進捗ラベルの廃止
        # （#991 Phase 5・#1010）にあわせてStatusの再報告へ置き換えている。
        if: always() && steps.state.outputs.should_fix == 'true'
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.detect.outputs.issue_number }}
          STATUS: develop-pr
        run: |
          missing=""
          [ -n "$APP_BASE_URL" ] || missing="APP_BASE_URL"
          [ -n "$PROGRESS_REPORT_SECRET" ] || missing="${missing:+$missing, }PROGRESS_REPORT_SECRET"
          if [ -n "$missing" ]; then
            echo "$missing が未設定のため、Project Statusの報告をスキップします"
            exit 0
          fi
          code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
            -X POST "$APP_BASE_URL/api/progress" \
            -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"repository\":\"$REPO\",\"issue\":$ISSUE_NUMBER,\"status\":\"$STATUS\"}")" || code=000
          if [ "$code" = "200" ]; then
            echo "issue #$ISSUE_NUMBER を $STATUS として報告しました"
          else
            echo "::warning::Project Statusの報告に失敗しました（issue #$ISSUE_NUMBER / status=$STATUS / HTTP $code）"
          fi

      - name: 修正結果を検証し、報告が確認できない場合はフォールバック通知する
        # Claude Codeエージェントに報告コメントの投稿を委ねるだけだと、途中でエラー終了した
        # 場合や許可されていない操作で行き詰まった場合に結果が使用者に一切伝わらない恐れがある。
        # そのため後続のステップとして独立に結果を確認する（claude-conflict-resolve.ymlの
        # 同種の検証ステップと同じ考え方）。
        if: always() && steps.state.outputs.should_fix == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.detect.outputs.issue_number }}
          BEFORE_COUNT: ${{ steps.before.outputs.comment_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          AFTER_COUNT="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments | length')"
          : "${BEFORE_COUNT:=0}"
          if [ "$AFTER_COUNT" -gt "$BEFORE_COUNT" ]; then
            echo "新規コメントを確認できたため、完了または停止の報告は行われたとみなします（投稿前: $BEFORE_COUNT 件, 投稿後: $AFTER_COUNT 件）"
            exit 0
          fi

          echo "新規コメントが確認できないため、フォールバックコメントを投稿します"
          FALLBACK_BODY="⚠️ CI失敗の自動修正ステップが終了しましたが、結果の報告コメントを確認できませんでした。調査や修正の途中で行き詰まった、またはエラーで終了した可能性があります。実行ログをご確認ください: $RUN_URL"$'\n\n<!-- issue-deck-source:claude-ci-fix -->'$'\n\n<!-- issue-deck-fallback-notice -->'
          gh issue comment "$ISSUE_NUMBER" --body "$FALLBACK_BODY"
          REASON_LABEL="01.check-blocked"
          # 展開先リポジトリにラベル自体が定義されていない場合でもこのステップを落とさないよう、
          # 付与・除去の前にリポジトリのラベル一覧と突き合わせる(#975)。理由ラベル(#1490)は常に1枚
          # なので、定義済みの他の理由ラベルは同じ呼び出しで外す。
          DEFINED_LABELS="$(gh label list --json name --jq '.[].name' --limit 200)"
          LABEL_ARGS=()
          for name in "00.check-user" "$REASON_LABEL"; do
            if grep -qx "$name" <<<"$DEFINED_LABELS"; then
              LABEL_ARGS+=(--add-label "$name")
            else
              echo "::warning::ラベル '$name' がリポジトリに存在しないため付与をスキップします"
            fi
          done
          for name in 01.check-plan 01.check-input 01.check-merge 01.check-blocked 01.check-answered 00.qa-answered; do
            if [ "$name" != "$REASON_LABEL" ] && grep -qx "$name" <<<"$DEFINED_LABELS"; then
              LABEL_ARGS+=(--remove-label "$name")
            fi
          done
          if [ "${#LABEL_ARGS[@]}" -gt 0 ]; then
            gh issue edit "$ISSUE_NUMBER" "${LABEL_ARGS[@]}"
          fi
