name: Rebuild issue-deck 4555 with merged fix 4557
on:
  push:
    branches: [ops/release-check-20261012-2216]
    paths: [.github/workflows/ops-rebuild-4555.yml]
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          app-id: ${{ vars.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - name: Rebuild only original candidate plus verified fix
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: guchi-apps/issue-deck
          RELEASE_CHANGELOG: |
            ブランチ画面の「次のバージョン」カードに「リリースする」ボタンを移し、PR件数を2枚のカードに分けて見やすくしました。
            準備状態を確認できるまでリリースの起動を待つようにし、作り直しとの二重起動を防ぎました。
            Slackで投稿したIssueの依頼が、AIの確認や承認を待たずに自動でIssueとして起案されるようになりました。
            PCの左メニューを「構想・準備・実行・反映済み」の4段階に整理しました。
            ブランチ画面のバッジと要対応件数を、本番リリース工程のものだけに絞りました。
            本番PRへの参照がIssueとして誤って表示される不具合を直しました。
          RELEASE_USAGE: |
            1. ブランチ画面を開き、「次のバージョン」カードを確認します。
            2. 「準備状態を確認中」の間は待ち、確認後に表示される案内に従って操作します。
            3. PCの左メニューでは「構想・準備・実行・反映済み」の順に項目を確認できます。
        run: |
          set -euo pipefail
          origin_sha=615d77a83d541df84401b20e3808cd3bc5a189f7
          fix_sha=3188e57c7dde2f617699b1a768151676b57573d5
          test "$(gh pr view 4555 --json state,headRefOid --jq '.state + " " + .headRefOid')" = "OPEN $origin_sha"
          test "$(gh pr view 4557 --json state,mergeCommit --jq '.state + " " + .mergeCommit.oid')" = "MERGED $fix_sha"
          test "$(git show origin/develop:package.json | jq -r .version)" = 8.57.1
          test -z "$(gh pr list --state open --head release/v8.57.2 --json number --jq '.[].number')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$origin_sha"
          git cherry-pick -m 1 "$fix_sha"
          fixed_sha="$(git rev-parse HEAD)"
          npm version 8.57.2 --no-git-tag-version
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/release-notes.md')
          s=p.read_text()
          assert '# v8.57.1' in s
          p.write_text(s.replace('# v8.57.1','# v8.57.2',1)+'\n- 準備状態を確認できるまでリリースの起動を待ち、作り直しとの二重起動を防ぎます。\n')
          PY
          git add package.json src/lib/changelog.ts ios/IssueDeck.xcodeproj/project.pbxproj .github/release-notes.md
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in package.json|src/lib/changelog.ts|ios/IssueDeck.xcodeproj/project.pbxproj|.github/release-notes.md) ;; *) exit 1 ;; esac
          done
          git commit -m "v8.57.2をリリースする。#4556修正を取り込んだ候補を復旧"
          candidate="$(git rev-parse HEAD)"
          git push origin "$candidate:refs/heads/release-candidate/v8.57.2"
          git checkout -b release/v8.57.2 origin/develop
          git cherry-pick "$candidate"
          git push -u origin release/v8.57.2
          cat > /tmp/rebuild-body.md <<BODY
          ## 対応Issue
          - #4556
          - 途中PR <!-- issue-deck-pr-role:interim -->

          リリース候補 #4555 に、CIと内部確認が成功してdevelopへ入った修正PR #4557 の差分だけを取り込んで、v8.57.2として作り直します。

          ## 復旧理由
          元の作り直しrun 38238357882は、過去の未公開バンプを逆順にrevertする際、#4551で訂正済みの更新案内に衝突して停止しました。訂正を取り消さず、凍結候補へ#4557のマージ差分のみを適用しています。無関係なdevelop変更を候補に加えていません。

          ## 元の候補へ足したPR
          - #4557 準備状態の取得前の二重起動を防ぐ（Issue #4556）

          ## バージョンの判断根拠
          未公開候補v8.57.1への不具合修正のためpatch更新です。

          ## 検証
          #4557のCI・内部確認は成功済み。このバンプPRのCIと、後継候補の全体レビュー・統合検証・Mac検証で再確認します。本番mainへのマージはこの作業に含めません。

          <!-- issue-deck-rebuild-origin:#4555 -->
          <!-- issue-deck-rebuild-candidate:$candidate -->
          BODY
          gh pr create --base develop --head release/v8.57.2 --title "v8.57.2をリリースする（#4555の修正候補を復旧）" --body-file /tmp/rebuild-body.md
          gh pr merge release/v8.57.2 --auto --merge
