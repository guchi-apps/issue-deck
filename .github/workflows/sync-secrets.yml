name: Sync secrets

# 1Password（正）から、このリポジトリのGitHub secret / variable へ値を同期する（#1309）。
# **本体は reusable-sync-secrets.yml にあり、ここはトリガー定義だけの薄いcaller**。
# issue-deck自身はローカルパス参照で常に最新を使い、カナリアとして先に問題を検知する。
#
# 起動経路は2つ。どちらも同じものが動く。
#
# - issue-deckの画面（設定 → シークレットの同期）… `POST /api/secrets-sync` が
#   `workflow_dispatch` で起動する
# - GitHubのActionsタブから手で実行
#
# **1Passwordの日次枠（アカウント全体で1,000リクエスト/日）を消費する。** 全件だと
# マニフェストの項目数ぶん（issue-deckは26件）。値を変えた項目だけを `only` で指定する。
# ローカルの `scripts/sync-github-secrets.sh` を直接叩く場合は個人アカウントのセッションを
# 使うため枠を消費しない。
on:
  workflow_dispatch:
    inputs:
      only:
        description: "同期するKEYをカンマ区切りで絞る（空ならマニフェスト全件）"
        required: false
        type: string
        default: ""

concurrency:
  # 同じリポジトリへの同期が重なると、同じsecretへ二重に書きにいく
  group: sync-secrets-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync-secrets:
    uses: ./.github/workflows/reusable-sync-secrets.yml
    with:
      only: ${{ inputs.only }}
    # **呼ばれる側の権限はcallerの付与範囲を超えられない**（#1181）。書き込みは
    # GITHUB_TOKEN ではなく WORKFLOW_PAT が行うため、ここは contents: read だけでよい。
    permissions:
      contents: read
    secrets: inherit
