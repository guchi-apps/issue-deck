name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-issue-deck-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

  build:
    runs-on: ubuntu-latest
    needs: tag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Construct DATABASE_URL
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          MIGRATE_DB_USER: ${{ secrets.MIGRATE_DB_USER }}
          MIGRATE_DB_PASSWORD: ${{ secrets.MIGRATE_DB_PASSWORD }}
        run: bash scripts/construct-database-url.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:ci
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          GITHUB_APP_ID: ${{ vars.APP_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.APP_GITHUB_APP_PRIVATE_KEY_BASE64 }}
          NEXT_PUBLIC_GITHUB_APP_SLUG: ${{ vars.NEXT_PUBLIC_GITHUB_APP_SLUG }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.APP_GITHUB_WEBHOOK_SECRET }}

      - name: Create archive
        run: |
          tar -czf deploy.tar.gz \
            package.json \
            pnpm-lock.yaml \
            public \
            .next \
            prisma \
            deploy \
            scripts/construct-database-url.sh \
            scripts/update-env-file.sh \
            next.config.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: deploy.tar.gz
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./

      - name: Construct DATABASE_URL
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          MIGRATE_DB_USER: ${{ secrets.MIGRATE_DB_USER }}
          MIGRATE_DB_PASSWORD: ${{ secrets.MIGRATE_DB_PASSWORD }}
        run: bash scripts/construct-database-url.sh

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: placeholder
          if_key_exists: replace

      - name: Add known hosts
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: Upload archive
        run: scp -P "${SSH_PORT}" deploy.tar.gz "${USERNAME}@${HOST}:${TARGET_DIR}/deploy.tar.gz"
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_APP_ID: ${{ vars.APP_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.APP_GITHUB_APP_PRIVATE_KEY_BASE64 }}
          NEXT_PUBLIC_GITHUB_APP_SLUG: ${{ vars.NEXT_PUBLIC_GITHUB_APP_SLUG }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.APP_GITHUB_WEBHOOK_SECRET }}
          GITHUB_USER_TOKEN_ENCRYPTION_KEY: ${{ secrets.APP_GITHUB_USER_TOKEN_ENCRYPTION_KEY }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.APP_GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.APP_GITHUB_OAUTH_CLIENT_SECRET }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          # Actionsの消費量（設定▸状態）の取得に使うclassic PAT（#2212）。GitHub Appのトークンでは
          # 課金レポートを読めない。未設定でもデプロイは通り、当該表示だけが無効になる
          GITHUB_BILLING_TOKEN: ${{ secrets.APP_GITHUB_BILLING_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 進捗管理に使うGitHub Projects v2の場所(#991)。シークレットではないためリポジトリ変数から取る。
          # 未設定ならProject連携を行わない(進捗は従来どおり進捗ラベルで判定する)
          PROJECT_V2_OWNER: ${{ vars.PROJECT_V2_OWNER }}
          PROJECT_V2_NUMBER: ${{ vars.PROJECT_V2_NUMBER }}
          # 進捗報告API(POST /api/progress)の共有シークレット(#991 Phase 2)。
          # 各ワークフローはorganization secretの同名の値でこのAPIを叩く
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          # サブPCへのディスパッチAPIの共有シークレット(#1179)。進捗報告とは別の値にする
          # (あちらは全リポジトリのActionsから参照できるorganization secretのため)
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
          # Push通知(#838)のVAPID鍵。3つ揃っていなければPush通知の機能だけが無効になる
          # (未設定でもデプロイは通り、他の機能には影響しない)。
          # 公開鍵も含めてsecretにする: このリポジトリはPUBLICでActionsのログが誰でも読めるため、
          # 単体では害が無い値でもvariableには置かない(CLAUDE.md「シークレットの扱い」)
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DATABASE_URL,MIGRATE_DATABASE_URL,DB_USER,DB_PASSWORD,DB_HOST,DB_PORT,DB_NAME,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,SUPABASE_SERVICE_ROLE_KEY,GITHUB_APP_ID,GITHUB_APP_PRIVATE_KEY_BASE64,NEXT_PUBLIC_GITHUB_APP_SLUG,GITHUB_WEBHOOK_SECRET,GITHUB_USER_TOKEN_ENCRYPTION_KEY,GITHUB_OAUTH_CLIENT_ID,GITHUB_OAUTH_CLIENT_SECRET,GITHUB_BILLING_TOKEN,ALLOWED_EMAILS,CLAUDE_CODE_OAUTH_TOKEN,PROJECT_V2_OWNER,PROJECT_V2_NUMBER,PROGRESS_REPORT_SECRET,DISPATCH_SECRET,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_SUBJECT,TARGET_DIR
          script: |
            set -euo pipefail
            cd "${TARGET_DIR}"

            # 待受ポートはシークレットではなく設定値として平文で持つ
            # （guchi-apps/docs の standards/ports.md「ポート番号は 1Password で管理しない」。#1849）。
            PORT=3111

            echo "Cleaning up old release files..."
            rm -rf .next public package.json pnpm-lock.yaml prisma deploy next.config.ts

            echo "Extracting archive..."
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            update_env() {
              bash scripts/update-env-file.sh .env "$1" "$2"
            }

            echo "Updating .env..."
            update_env NODE_ENV production
            update_env PORT "$PORT"
            update_env DATABASE_URL "$DATABASE_URL"
            update_env DB_USER "$DB_USER"
            update_env DB_PASSWORD "$DB_PASSWORD"
            update_env DB_HOST "$DB_HOST"
            update_env DB_PORT "$DB_PORT"
            update_env DB_NAME "$DB_NAME"
            update_env NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
            update_env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            update_env SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
            update_env GITHUB_APP_ID "$GITHUB_APP_ID"
            update_env GITHUB_APP_PRIVATE_KEY_BASE64 "$GITHUB_APP_PRIVATE_KEY_BASE64"
            update_env NEXT_PUBLIC_GITHUB_APP_SLUG "$NEXT_PUBLIC_GITHUB_APP_SLUG"
            update_env GITHUB_WEBHOOK_SECRET "$GITHUB_WEBHOOK_SECRET"
            update_env PROJECT_V2_OWNER "${PROJECT_V2_OWNER:-}"
            update_env PROJECT_V2_NUMBER "${PROJECT_V2_NUMBER:-}"
            update_env PROGRESS_REPORT_SECRET "${PROGRESS_REPORT_SECRET:-}"
            update_env DISPATCH_SECRET "${DISPATCH_SECRET:-}"
            update_env VAPID_PUBLIC_KEY "${VAPID_PUBLIC_KEY:-}"
            update_env VAPID_PRIVATE_KEY "${VAPID_PRIVATE_KEY:-}"
            update_env VAPID_SUBJECT "${VAPID_SUBJECT:-}"
            update_env GITHUB_USER_TOKEN_ENCRYPTION_KEY "$GITHUB_USER_TOKEN_ENCRYPTION_KEY"
            update_env GITHUB_OAUTH_CLIENT_ID "$GITHUB_OAUTH_CLIENT_ID"
            update_env GITHUB_OAUTH_CLIENT_SECRET "$GITHUB_OAUTH_CLIENT_SECRET"
            update_env ALLOWED_EMAILS "$ALLOWED_EMAILS"
            update_env GITHUB_BILLING_TOKEN "${GITHUB_BILLING_TOKEN:-}"
            update_env CLAUDE_CODE_OAUTH_TOKEN "$CLAUDE_CODE_OAUTH_TOKEN"

            echo "Installing production dependencies..."
            corepack enable pnpm >/dev/null 2>&1 || true
            pnpm install --prod --frozen-lockfile

            echo "Applying database migrations..."
            DATABASE_URL="$MIGRATE_DATABASE_URL" pnpm exec prisma migrate deploy

            echo "Restarting PM2..."
            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete issue-deck 2>/dev/null || true
              PORT="$PORT" pm2 start deploy/ecosystem.config.js --env production
              pm2 save
            else
              echo "pm2 is required on the server. Install: npm install -g pm2"
              exit 1
            fi

            echo "Health check..."
            # Next.js は起動完了までに数秒かかる。1回だけの curl では起動を待ちきれず、
            # アプリが正常に立ち上がっていても deploy ジョブが失敗する。失敗すると後続の
            # release / notify-release がスキップされ、タグはあるのに GitHub Release が
            # 作られない状態になる（複数アプリを同時にデプロイした際に実際に発生した）。
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://127.0.0.1:${PORT}/"; then
                echo "Deployment successful."
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed after 60s."
            pm2 describe issue-deck || true
            pm2 logs issue-deck --lines 50 --nostream || true
            exit 1

  notify:
    runs-on: ubuntu-latest
    needs: [tag, build, deploy]
    if: always()
    # GitHub側の値はここで明示的に渡す。複合アクションのステップはジョブの env: を
    # 引き継ぐが、呼び出しステップの env: は引き継がない。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          build="${{ needs.build.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$build" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$build" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: 不足分を1Passwordから補う
        uses: ./.github/actions/load-secrets
        with:
          only: SIGNALY_WEBHOOK_URL
          # issue-deckは#1302・#1308で1Password依存を外しており、このsecretは存在しない。
          # 空が渡るとアクションは1Passwordを一切触らない。他リポジトリでは値が入るため、
          # GitHub側の投入が済むまで1Passwordから補われる（#1307の段階的な移行のため）。
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Signaly に通知
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: issue-deck
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
        run: bash .github/scripts/signaly-notify.sh

  notify-release:
    runs-on: ubuntu-latest
    needs: [tag, deploy, release]
    if: always() && needs.release.result != 'skipped'
    # GitHub側の値はここで明示的に渡す。複合アクションのステップはジョブの env: を
    # 引き継ぐが、呼び出しステップの env: は引き継がない。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 不足分を1Passwordから補う
        uses: ./.github/actions/load-secrets
        with:
          only: SIGNALY_WEBHOOK_URL
          # issue-deckは#1302・#1308で1Password依存を外しており、このsecretは存在しない。
          # 空が渡るとアクションは1Passwordを一切触らない。他リポジトリでは値が入るため、
          # GitHub側の投入が済むまで1Passwordから補われる（#1307の段階的な移行のため）。
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Signaly に通知
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ needs.release.result }}
          NOTIFY_APP: issue-deck
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
        run: bash .github/scripts/signaly-notify.sh
