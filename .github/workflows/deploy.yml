name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-issue-deck-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

      - name: Convert release notes to task list
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          # 項目ごとの確認をGitHub Release本文と連動させるため、箇条書きをタスクリストにする（#4374）。
          # すでにタスクリストの行（`- [ ]`・`- [x]`）は触らないので、再実行しても確認状態は変わらない。
          gh release view "$TAG" --json body --jq .body | sed -E 's/^\* /- [ ] /' > release-body.md
          gh release edit "$TAG" --notes-file release-body.md

  build:
    runs-on: ubuntu-latest
    needs: tag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Construct DATABASE_URL
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          MIGRATE_DB_USER: ${{ secrets.MIGRATE_DB_USER }}
          MIGRATE_DB_PASSWORD: ${{ secrets.MIGRATE_DB_PASSWORD }}
        run: bash scripts/construct-database-url.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:ci
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          GITHUB_APP_ID: ${{ vars.APP_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.APP_GITHUB_APP_PRIVATE_KEY_BASE64 }}
          NEXT_PUBLIC_GITHUB_APP_SLUG: ${{ vars.NEXT_PUBLIC_GITHUB_APP_SLUG }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.APP_GITHUB_WEBHOOK_SECRET }}

      - name: Create archive
        run: |
          tar -czf deploy.tar.gz \
            package.json \
            pnpm-lock.yaml \
            public \
            .next \
            prisma \
            deploy \
            scripts/repair-failed-codex-weekly-floor.mjs \
            scripts/repair-failed-dispatch-session-codex-thread-id.mjs \
            scripts/repair-failed-pull-request-auto-repair-loop.mjs \
            next.config.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: deploy.tar.gz
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./

      - name: Construct DATABASE_URL
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          MIGRATE_DB_USER: ${{ secrets.MIGRATE_DB_USER }}
          MIGRATE_DB_PASSWORD: ${{ secrets.MIGRATE_DB_PASSWORD }}
        run: bash scripts/construct-database-url.sh

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: placeholder
          if_key_exists: replace

      - name: Add known hosts
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      # **VPSのgate（/usr/local/sbin/app-deploy-gate。guchi-apps/vps#275・#301）へ渡す**（#4804）。
      # 鍵はこのアプリ専用（SSH_PRIVATE_KEY。正は op://apps/issue-deck/deploy-ssh-key）で、VPSの
      # authorized_keys の command= がgateのアプリ名（issue-deck。置き場の /home/github-user/apps/issue-deck と
      # pm2のプロセス名に一致する）を固定する。任意のシェルコマンドは実行できず、upload・env・deployの
      # 3語だけが通る。旧配布物の削除・展開・.env更新・pnpm install --prod・deploy/pre-migrate.sh
      # （マイグレーションの補修スクリプト3本）・prisma migrate deploy（MIGRATE_DATABASE_URLは.envへ書かず
      # ここだけで使う）・pm2の再起動（deploy/ecosystem.config.js）・稼働版の照合はgate側が行う。
      - name: Upload archive
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" upload < deploy.tar.gz
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: Send environment variables
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_MANAGEMENT_API_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_API_TOKEN }}
          GITHUB_APP_ID: ${{ vars.APP_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.APP_GITHUB_APP_PRIVATE_KEY_BASE64 }}
          NEXT_PUBLIC_GITHUB_APP_SLUG: ${{ vars.NEXT_PUBLIC_GITHUB_APP_SLUG }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.APP_GITHUB_WEBHOOK_SECRET }}
          GITHUB_USER_TOKEN_ENCRYPTION_KEY: ${{ secrets.APP_GITHUB_USER_TOKEN_ENCRYPTION_KEY }}
          SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
          SHARED_TOKEN_WRITE_SECRET: ${{ secrets.SHARED_TOKEN_WRITE_SECRET }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.APP_GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.APP_GITHUB_OAUTH_CLIENT_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 「おまかせ」をJevで判定する場合のTypeSafeのAPIキー（#3189）。
          # 未設定でもデプロイは通り、判定がアプリ内AIのモデルへ倒れるだけ
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # AIDE向け開発状況サマリAPIの集計対象利用者（#4048）。未設定ならAPIは503 user_not_configured
          AIDE_SUMMARY_USER_LOGIN: ${{ secrets.AIDE_SUMMARY_USER_LOGIN }}
          # バックアップCI（#4065・#4113。docs/backup-ci.md 4章）。未設定でもデプロイは通り、
          # バックアップCIの起動とCircleCIの完了Webhookの受信だけができない
          CIRCLECI_API_TOKEN: ${{ secrets.CIRCLECI_API_TOKEN }}
          CIRCLECI_WEBHOOK_SECRET: ${{ secrets.CIRCLECI_WEBHOOK_SECRET }}
          # 進捗管理に使うGitHub Projects v2の場所(#991)。シークレットではないためリポジトリ変数から取る。
          # 未設定ならProject連携を行わない(進捗は従来どおり進捗ラベルで判定する)
          PROJECT_V2_OWNER: ${{ vars.PROJECT_V2_OWNER }}
          PROJECT_V2_NUMBER: ${{ vars.PROJECT_V2_NUMBER }}
          # 進捗報告API(POST /api/progress)の共有シークレット(#991 Phase 2)。
          # 各ワークフローはorganization secretの同名の値でこのAPIを叩く
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          # サブPCへのディスパッチAPIの共有シークレット(#1179)。進捗報告とは別の値にする
          # (あちらは全リポジトリのActionsから参照できるorganization secretのため)
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
          # 画像アップロードAPIのBearer認証(#3507)。上の2つとは別の値にする
          IMAGE_UPLOAD_SECRET: ${{ secrets.IMAGE_UPLOAD_SECRET }}
          # Push通知(#838)のVAPID鍵。3つ揃っていなければPush通知の機能だけが無効になる
          # (未設定でもデプロイは通り、他の機能には影響しない)。
          # 公開鍵も含めてsecretにする: このリポジトリはPUBLICでActionsのログが誰でも読めるため、
          # 単体では害が無い値でもvariableには置かない(CLAUDE.md「シークレットの扱い」)
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          # 稼働している版の照合に使う（#4007・#4804）。gateが.envのAPP_COMMIT_SHAと
          # 稼働中の/api/app-versionのshaを照合する（guchi-apps/vps#298）。コミットのSHAは公開情報
          APP_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # マイグレーション専用ユーザー（MIGRATE_DB_*）が未設定なら、通常ユーザーの接続先で流す。
          # gateはMIGRATE_DATABASE_URLが渡らないとマイグレーション自体を飛ばすため、必ず送る。
          MIGRATE_DATABASE_URL="${MIGRATE_DATABASE_URL:-$DATABASE_URL}"
          # gateは標準入力を1行1変数（KEY=VALUE）で受けるため、改行を含む値は送れない
          # （GITHUB_APP_PRIVATE_KEY_BASE64はbase64の1行で登録してある前提）。
          for name in DATABASE_URL DB_USER DB_PASSWORD DB_HOST DB_PORT DB_NAME NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY \
            SUPABASE_MANAGEMENT_API_TOKEN GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY_BASE64 \
            NEXT_PUBLIC_GITHUB_APP_SLUG GITHUB_WEBHOOK_SECRET PROJECT_V2_OWNER PROJECT_V2_NUMBER \
            PROGRESS_REPORT_SECRET DISPATCH_SECRET IMAGE_UPLOAD_SECRET VAPID_PUBLIC_KEY \
            VAPID_PRIVATE_KEY VAPID_SUBJECT GITHUB_USER_TOKEN_ENCRYPTION_KEY SHARED_TOKEN_API_SECRET \
            SHARED_TOKEN_WRITE_SECRET GITHUB_OAUTH_CLIENT_ID GITHUB_OAUTH_CLIENT_SECRET \
            CLAUDE_CODE_OAUTH_TOKEN OPENAI_API_KEY TYPESAFE_API_KEY AIDE_SUMMARY_USER_LOGIN \
            CIRCLECI_API_TOKEN CIRCLECI_WEBHOOK_SECRET MIGRATE_DATABASE_URL; do
            case "${!name:-}" in
              *$'\n'*) echo "::error::${name} が改行を含むためgateへ送れません"; exit 1 ;;
            esac
          done
          # 待受ポートはシークレットではなく設定値として平文で持つ
          # （guchi-apps/docs の standards/ports.md「ポート番号は 1Password で管理しない」。#1849）。
          {
            printf '%s\n' "NODE_ENV=production" "PORT=3111"
            printf '%s\n' "APP_COMMIT_SHA=${APP_COMMIT_SHA}"
            printf '%s\n' "MIGRATE_DATABASE_URL=${MIGRATE_DATABASE_URL}"
            printf '%s\n' "DATABASE_URL=${DATABASE_URL}"
            printf '%s\n' "DB_USER=${DB_USER}"
            printf '%s\n' "DB_PASSWORD=${DB_PASSWORD}"
            printf '%s\n' "DB_HOST=${DB_HOST}"
            printf '%s\n' "DB_PORT=${DB_PORT}"
            printf '%s\n' "DB_NAME=${DB_NAME}"
            printf '%s\n' "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            printf '%s\n' "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
            printf '%s\n' "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"
            printf '%s\n' "SUPABASE_MANAGEMENT_API_TOKEN=${SUPABASE_MANAGEMENT_API_TOKEN}"
            printf '%s\n' "GITHUB_APP_ID=${GITHUB_APP_ID}"
            printf '%s\n' "GITHUB_APP_PRIVATE_KEY_BASE64=${GITHUB_APP_PRIVATE_KEY_BASE64}"
            printf '%s\n' "NEXT_PUBLIC_GITHUB_APP_SLUG=${NEXT_PUBLIC_GITHUB_APP_SLUG}"
            printf '%s\n' "GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}"
            printf '%s\n' "PROJECT_V2_OWNER=${PROJECT_V2_OWNER}"
            printf '%s\n' "PROJECT_V2_NUMBER=${PROJECT_V2_NUMBER}"
            printf '%s\n' "PROGRESS_REPORT_SECRET=${PROGRESS_REPORT_SECRET}"
            printf '%s\n' "DISPATCH_SECRET=${DISPATCH_SECRET}"
            printf '%s\n' "IMAGE_UPLOAD_SECRET=${IMAGE_UPLOAD_SECRET}"
            printf '%s\n' "VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}"
            printf '%s\n' "VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}"
            printf '%s\n' "VAPID_SUBJECT=${VAPID_SUBJECT}"
            printf '%s\n' "GITHUB_USER_TOKEN_ENCRYPTION_KEY=${GITHUB_USER_TOKEN_ENCRYPTION_KEY}"
            printf '%s\n' "SHARED_TOKEN_API_SECRET=${SHARED_TOKEN_API_SECRET}"
            printf '%s\n' "SHARED_TOKEN_WRITE_SECRET=${SHARED_TOKEN_WRITE_SECRET}"
            printf '%s\n' "GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID}"
            printf '%s\n' "GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET}"
            printf '%s\n' "CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}"
            printf '%s\n' "OPENAI_API_KEY=${OPENAI_API_KEY}"
            printf '%s\n' "TYPESAFE_API_KEY=${TYPESAFE_API_KEY}"
            printf '%s\n' "AIDE_SUMMARY_USER_LOGIN=${AIDE_SUMMARY_USER_LOGIN}"
            printf '%s\n' "CIRCLECI_API_TOKEN=${CIRCLECI_API_TOKEN}"
            printf '%s\n' "CIRCLECI_WEBHOOK_SECRET=${CIRCLECI_WEBHOOK_SECRET}"
            # ops-dashboardは同じVPSで待ち受けている。ポートは設定値として平文で持つ（#1849・#3037）
            printf '%s\n' "OPS_DASHBOARD_URL=http://127.0.0.1:3110"
          } | ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" env

      - name: Deploy and restart
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" deploy
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

  notify:
    runs-on: ubuntu-latest
    needs: [tag, build, deploy]
    if: always()
    # GitHub側の値はここで明示的に渡す。複合アクションのステップはジョブの env: を
    # 引き継ぐが、呼び出しステップの env: は引き継がない。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          build="${{ needs.build.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$build" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$build" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: 不足分を1Passwordから補う
        # 通知のためだけのステップなので、ここが落ちてもrunは落とさない
        # （1Passwordのレート制限でリリースPRのCIが赤くなった実績がある。#1302・#2237）。
        continue-on-error: true
        uses: ./.github/actions/load-secrets
        with:
          only: SIGNALY_WEBHOOK_URL
          # issue-deckは#1302・#1308で1Password依存を外しており、このsecretは存在しない。
          # 空が渡るとアクションは1Passwordを一切触らない。他リポジトリでは値が入るため、
          # GitHub側の投入が済むまで1Passwordから補われる（#1307の段階的な移行のため）。
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Signaly に通知
        # 通知はデプロイの成否そのものではない。ここが失敗してもrun全体を落とさない
        # （Signalyが止まっている間のmainマージでデプロイ成功のrunが赤くなった。#2237）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: issue-deck
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
        run: bash .github/scripts/signaly-notify.sh

  notify-release:
    runs-on: ubuntu-latest
    needs: [tag, deploy, release]
    if: always() && needs.release.result != 'skipped'
    # GitHub側の値はここで明示的に渡す。複合アクションのステップはジョブの env: を
    # 引き継ぐが、呼び出しステップの env: は引き継がない。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 不足分を1Passwordから補う
        # 通知のためだけのステップなので、ここが落ちてもrunは落とさない
        # （1Passwordのレート制限でリリースPRのCIが赤くなった実績がある。#1302・#2237）。
        continue-on-error: true
        uses: ./.github/actions/load-secrets
        with:
          only: SIGNALY_WEBHOOK_URL
          # issue-deckは#1302・#1308で1Password依存を外しており、このsecretは存在しない。
          # 空が渡るとアクションは1Passwordを一切触らない。他リポジトリでは値が入るため、
          # GitHub側の投入が済むまで1Passwordから補われる（#1307の段階的な移行のため）。
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Signaly に通知
        # 通知が届かないことでリリース済みのrunを赤くしない（#2237）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          # リリースだけはCI・デプロイと別のチャンネルへ送る（#2391）。未登録のあいだは
          # 空が渡り、スクリプトが従来のチャンネルへフォールバックする。
          SIGNALY_RELEASE_WEBHOOK_URL: ${{ secrets.SIGNALY_RELEASE_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ needs.release.result }}
          NOTIFY_APP: issue-deck
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
        run: bash .github/scripts/signaly-notify.sh
