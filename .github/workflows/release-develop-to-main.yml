name: Release develop to main

# develop→mainのリリース（バージョンbump PR・develop→mainのPR作成）を行う。
# **本体は reusable-release-develop-to-main.yml にあり、ここはトリガー定義だけの薄いcaller**
# （#1181）。issue-deck自身はローカルパス参照で常に最新を使い、カナリアとして先に問題を検知する。
#
# 他リポジトリからは `uses: guchi-apps/issue-deck/.github/workflows/
# reusable-release-develop-to-main.yml@workflows/vN` で参照する。
#
# バンプPRはCI通過後にdevelopへ自動マージする。バンプPRがdevelopへマージされて
# バージョンが変わると、push(develop, paths)で本ワークフローが再度起動し、develop→mainの
# PRを自動作成する。**develop→mainの実際のマージはCLAUDE.mdの自動マージ不可カテゴリに
# 該当するため、これまでどおり人間が手動で行う。**
#
# **新しいリリース準備（バンプPR・候補の作成）は利用者の明示操作（workflow_dispatch）だけで
# 始める**（#178で手動に絞り、#3404・#3416で入れた15分おきのscheduleを#4599で廃止した）。
# 本番マージ後の待機時間も無い。開始後の進行（バンプPRのマージによるpush起動でのdevelop→main
# PR作成）はイベント駆動で続く。
on:
  workflow_dispatch:
    inputs:
      bump_kind:
        # バージョンの上げ幅を人が決められるようにするための入口（#1548）。issue-deckの画面
        # （リリース起動の確認ダイアログ）から渡す。**バンプPRはCI通過後にauto-mergeで
        # developへ入るため、PRが出てから上げ幅を直す時間は実質無い。** 起動する時点で
        # 決められるようにして、直す必要そのものを無くしている。
        # 既定の`auto`は従来どおりコード差分からClaudeが判定する。
        description: "バージョンの上げ幅（autoならコード差分から自動判定）"
        required: false
        type: choice
        default: auto
        options: [auto, patch, minor, major]
      allow_failed_deploy:
        description: "本番デプロイ失敗中に修正リリースを手動で開始する"
        required: false
        type: boolean
        default: false
      rebuild_selection:
        # 「修正を入れて作り直す」で元の候補へ足すPRの指定（#4335）。issue-deckのサーバーが
        # 組み立てるJSONで、手で入力するものではない（形式は reusable 側の rebuild-selection）
        description: "作り直しで元の候補へ足すPR（issue-deckが指定する）"
        required: false
        type: string
        default: ""
      candidate_request:
        # リリース候補の作成・更新の要求（#4495）。issue-deckのサーバーが組み立てるJSONで、手で入力するものではない
        # （形式は reusable 側の candidate-request）。指定があると旧方式の処理は動かない
        description: "リリース候補の作成・更新の要求（issue-deckが指定する）"
        required: false
        type: string
        default: ""
      finalize_request:
        # 合格した候補の公開準備＝正式バンプの要求（#4496）。issue-deckのサーバーが組み立てるJSONで、
        # 手で入力するものではない（形式は reusable 側の finalize-request）
        description: "リリース候補の公開準備（正式バンプ）の要求（issue-deckが指定する）"
        required: false
        type: string
        default: ""
  # バンプPRがdevelopへ（auto-mergeで）マージされ、バージョンが変わったときに再起動して
  # develop→mainのPRを自動作成する。通常のフィーチャーpushではpackage.jsonが変わらないため
  # 起動しない。
  push:
    branches: [develop]
    paths:
      - package.json

concurrency:
  group: release-develop-to-main
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/reusable-release-develop-to-main.yml
    # issue-deckはルートのpackage.jsonにversionを持ち、"version" lifecycleスクリプトも
    # 定義しているため、バージョンの読み書きに関するinputsは既定値でよい
    # （version-file: package.json / version-query: .version / bump-command: 空）。
    with:
      # push（バンプPRのマージ）起動時は`inputs`自体が無いため空文字を渡す。
      # push起動はdevelop→mainのPR作成だけを行い、上げ幅を使わない（#1548）。
      bump-kind: ${{ github.event_name == 'workflow_dispatch' && inputs.bump_kind || '' }}
      allow-failed-deploy: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_failed_deploy == true }}
      rebuild-selection: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_selection || '' }}
      candidate-request: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_request || '' }}
      finalize-request: ${{ github.event_name == 'workflow_dispatch' && inputs.finalize_request || '' }}
    secrets: inherit
    # **呼ばれる側の権限はcallerの付与範囲を超えられない。** 通常のワークフローではjobが
    # workflowレベルの既定を上回る指定をしてよいが、再利用可能ワークフローでは
    # callerが渡した範囲が上限になる。超えると startup_failure になる（#1181で2度踏んだ）。
    #
    # issues が write なのは、旧世代の reusable 側の notify-failure ジョブがリリース対象issueへ
    # 失敗を通知していたため（#4335でissue-deckへの記録に変わり、現行は使わない。配布先の
    # callerと揃えて残している）。
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
