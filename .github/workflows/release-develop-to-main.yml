name: Release develop to main

# develop→mainのリリース（バージョンbump PR・develop→mainのPR作成）を行う。
# **本体は reusable-release-develop-to-main.yml にあり、ここはトリガー定義だけの薄いcaller**
# （#1181）。issue-deck自身はローカルパス参照で常に最新を使い、カナリアとして先に問題を検知する。
#
# 他リポジトリからは `uses: guchi-apps/issue-deck/.github/workflows/
# reusable-release-develop-to-main.yml@workflows/vN` で参照する。
#
# バンプPRはCI通過後にdevelopへ自動マージする。バンプPRがdevelopへマージされて
# バージョンが変わると、push(develop, paths)で本ワークフローが再度起動し、develop→mainの
# PRを自動作成する。**develop→mainの実際のマージはCLAUDE.mdの自動マージ不可カテゴリに
# 該当するため、これまでどおり人間が手動で行う。**
#
# バンプPRの作成は人間の確認なしに走るため、scheduleでの自動起動はしない。
on:
  workflow_dispatch:
    inputs:
      bump_kind:
        # バージョンの上げ幅を人が決められるようにするための入口（#1548）。issue-deckの画面
        # （リリース起動の確認ダイアログ）から渡す。**バンプPRはCI通過後にauto-mergeで
        # developへ入るため、PRが出てから上げ幅を直す時間は実質無い。** 起動する時点で
        # 決められるようにして、直す必要そのものを無くしている。
        # 既定の`auto`は従来どおりコード差分からClaudeが判定する。
        description: "バージョンの上げ幅（autoならコード差分から自動判定）"
        required: false
        type: choice
        default: auto
        options: [auto, patch, minor, major]
  # バンプPRがdevelopへ（auto-mergeで）マージされ、バージョンが変わったときに再起動して
  # develop→mainのPRを自動作成する。通常のフィーチャーpushではpackage.jsonが変わらないため
  # 起動しない。
  push:
    branches: [develop]
    paths:
      - package.json

concurrency:
  group: release-develop-to-main
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/reusable-release-develop-to-main.yml
    # issue-deckはルートのpackage.jsonにversionを持ち、"version" lifecycleスクリプトも
    # 定義しているため、バージョンの読み書きに関するinputsは既定値でよい
    # （version-file: package.json / version-query: .version / bump-command: 空）。
    with:
      # pushトリガー（バンプPRのマージ）で起動したときは`inputs`自体が無いため空文字を渡す。
      # そちらの実行はdevelop→mainのPR作成だけを行い、上げ幅を使わない（#1548）。
      bump-kind: ${{ github.event_name == 'workflow_dispatch' && inputs.bump_kind || '' }}
    secrets: inherit
    # **呼ばれる側の権限はcallerの付与範囲を超えられない。** 通常のワークフローではjobが
    # workflowレベルの既定を上回る指定をしてよいが、再利用可能ワークフローでは
    # callerが渡した範囲が上限になる。超えると startup_failure になる（#1181で2度踏んだ）。
    #
    # issues が write なのは、reusable側の notify-failure ジョブがリリース対象issueへ
    # 失敗を通知するため。元のコピー方式では workflow レベルが read で notify-failure だけが
    # write へ上書きしており、その書き方は再利用可能ワークフローでは通らない。
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
