name: Deploy Preview

# Fly.io Machines上のオンデマンドプレビュー環境（#826）へのデプロイ。
# 本番DBをダンプし、サニタイズ・installation ID書き換え（開発App issue-deck-dev向け）を
# 行った上でイメージに焼き込み、fly deploy する（#831）。
#
# workflow_call化しているのは、claude-issue-dispatch.ymlから呼び出す想定のため（#832で実際に接続）。
# refは省略時developを対象にする。claude-issue-dispatch.ymlは23.preview-requiredが付いた
# issueの実装ブランチ（issue-<番号>）をレビュー用に表示したいため、呼び出し時に明示的に指定する。
#
# ## 複数プレビュー環境の同時起動（#892）
#
# 当初は単一のFly.ioアプリ（fly.tomlの`app`）の中身を都度上書きする方式だったため、同時に
# 存在できるプレビューが1つだけで、後からデプロイした側が前のプレビューを潰していた。しかも
# m-guchi/shopping-listも同じアプリ名を使っていたため、リポジトリをまたいで上書きが起きていた。
#
# Fly.ioのMachineは個別の公開URLを持てない（`<machine-id>.vm.<app>.internal`はプライベート
# ネットワーク限定）ため、同時に複数のプレビューを別々のURLで提供するには**アプリ自体を分ける**
# 必要がある。そのためIssueごとに`<fly.tomlのapp>-<Issue番号>`という名前のアプリを作る方式にした。
#
#   issue_number=<Issue番号> → issue-deck-preview-<Issue番号> → https://issue-deck-preview-<Issue番号>.fly.dev
#
# （具体的な番号入りのURLをこのファイルに書かないのは、scripts/check-cross-repo-guide-sync.sh
#  のラベル検出正規表現が「2桁数字＋ドット＋英字」を全てラベル名とみなすため、番号入りの
#  ホスト名がラベルの誤検出になるため）
#
# issue_numberを渡さない場合（developの手動デプロイ等）は従来どおりfly.tomlの`app`をそのまま
# 使う。アプリの破棄は.github/workflows/cleanup-preview.ymlが担当する。
#
# **前提**: `flyctl apps create`にはorganizationスコープのFly.ioトークンが必要。特定アプリに
# 限定されたデプロイトークンでは新規アプリを作成できず、「アプリを作成する」ステップで失敗する。
# その場合は失敗理由をIssueへ通知して終了する（後述のskipped_reason）。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "デプロイ対象のブランチ・コミット参照"
        type: string
        default: develop
      issue_number:
        description: "対象のIssue番号（指定するとIssueごとの専用プレビューアプリへデプロイする。空ならfly.tomlのapp）"
        type: string
        default: ""
      preview_mode:
        description: "PREVIEW_MODE（書き込み系API routeを403で封じるか）"
        type: boolean
        default: true
      logs_only:
        description: "デプロイせずMachineのログを流し続けるだけにする（エラーの再現用）"
        type: boolean
        default: false
      logs_seconds:
        description: "logs_only時にログを流す秒数"
        type: string
        default: "240"
  workflow_call:
    inputs:
      ref:
        description: "デプロイ対象のブランチ・コミット参照"
        type: string
        default: develop
      issue_number:
        description: "対象のIssue番号（指定するとIssueごとの専用プレビューアプリへデプロイする。空ならfly.tomlのapp）"
        type: string
        default: ""
      preview_mode:
        description: "PREVIEW_MODE（書き込み系API routeを403で封じるか）"
        type: boolean
        default: true
    outputs:
      preview_url:
        description: "デプロイ後のプレビューURL"
        value: ${{ jobs.deploy.outputs.preview_url }}
      skipped_reason:
        description: "デプロイを行わなかった場合の理由（空ならデプロイ実施）。呼び出し側はこれを見て通知内容を切り替える"
        value: ${{ jobs.deploy.outputs.skipped_reason }}

# プレビューアプリはIssueごとに分かれるため（#892）、直列化の単位もIssueごとにする。
# 従来は全プレビューが単一グループで直列化されており、別Issueのデプロイを待つ必要があった。
# issue_numberが空（developの手動デプロイ等）の場合は共有アプリを対象にするため、
# 従来どおり単一グループにまとめる。
concurrency:
  group: deploy-issue-deck-preview-${{ inputs.issue_number || 'shared' }}
  cancel-in-progress: true

jobs:
  # デプロイせず、動いているMachineのログを一定時間流し続けるだけのジョブ。
  # プレビューで起きたサーバーエラーの原因はMachine内のNext.jsのログにしか出ないが、
  # `flyctl logs --no-tail`は直近のログしか返さず、再起動を挟むと失われる。
  # このジョブを動かしている間に画面上で操作を再現してもらうことで、
  # そのときのスタックトレースをActionsのログに残す（#880）。
  logs:
    if: inputs.logs_only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
          # FLY_API_TOKEN以外は使わないが、テンプレートを分けると管理対象が増えるため
          # deploy-preview.env.tplをそのまま使う。
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENV_FILE: .github/deploy-preview.env.tpl

      - name: Setup flyctl
        if: steps.app.outputs.skipped_reason == ''
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: ログを流す
        run: |
          set -uo pipefail
          echo "==== ここから ${LOGS_SECONDS} 秒間、プレビュー環境のログを流します ===="
          timeout "${LOGS_SECONDS}" flyctl logs || true
          echo "==== ここまで ===="
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          LOGS_SECONDS: ${{ inputs.logs_seconds || '240' }}

  deploy:
    if: ${{ !inputs.logs_only }}
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
      skipped_reason: ${{ steps.app.outputs.skipped_reason }}

    # ダンプのサニタイズ用（本番から取得した生ダンプを一時的にロードして書き換える）。
    # プレビューMachine自体のMariaDB（scripts/preview-entrypoint.sh）とは無関係の、
    # このジョブ限りの使い捨てコンテナ。
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: app_issue_deck
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENV_FILE: .github/deploy-preview.env.tpl

      - name: Setup flyctl（デプロイ前ログ取得用）
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: プレビューアプリ名を決定し、必要なら作成する
        # Issueごとに専用のFly.ioアプリを持たせることで、複数のプレビューを同時に別々のURLで
        # 提供できるようにする（#892）。issue_numberが空の場合（developの手動デプロイ等）は
        # 従来どおりfly.tomlのappをそのまま使う。
        #
        # 同時起動数の上限（PREVIEW_MAX_APPS、既定5）に達している場合は、既存のプレビューを
        # 勝手に破棄せずデプロイ自体を見送る。他の人が確認中の環境を消さないため。呼び出し側は
        # outputs.skipped_reasonを見て、その旨をIssueへ通知する。
        #
        # `flyctl apps create`にはorganizationスコープのトークンが必要。アプリ単位に限定された
        # デプロイトークンでは失敗するため、その場合も理由を明示してスキップ扱いにする。
        id: app
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          # 同時に存在してよいIssueごとのプレビューアプリ数の上限。リポジトリ変数で調整できる。
          PREVIEW_MAX_APPS: ${{ vars.PREVIEW_MAX_APPS || '5' }}
        run: |
          set -euo pipefail

          BASE_APP="$(grep -m1 '^app = ' fly.toml | sed -E 's/app = "(.*)"/\1/')"
          if [ -z "$BASE_APP" ]; then
            echo "fly.tomlからapp名を取得できませんでした" >&2
            exit 1
          fi

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "issue_numberが空のため、共有プレビューアプリ($BASE_APP)を対象にします"
            {
              echo "app_name=$BASE_APP"
              echo "skipped_reason="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          APP_NAME="${BASE_APP}-${ISSUE_NUMBER}"
          echo "対象アプリ: $APP_NAME"

          # 既に存在するなら作成不要。flyctl status はアプリが無いと非ゼロで終了する。
          if flyctl status --app "$APP_NAME" >/dev/null 2>&1; then
            echo "アプリは既に存在するため作成をスキップします"
            {
              echo "app_name=$APP_NAME"
              echo "skipped_reason="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 上限チェック。Issueごとのプレビューアプリ（<BASE_APP>-<数字>）だけを数える。
          # 共有アプリ($BASE_APP)自体は上限の対象外。
          EXISTING_COUNT="$(flyctl apps list --json 2>/dev/null \
            | jq --arg base "$BASE_APP" '[.[] | select(.Name // .name | test("^" + $base + "-[0-9]+$"))] | length' 2>/dev/null || echo 0)"
          case "$EXISTING_COUNT" in ''|*[!0-9]*) EXISTING_COUNT=0 ;; esac
          echo "既存のIssueごとプレビューアプリ数: $EXISTING_COUNT / 上限: $PREVIEW_MAX_APPS"

          if [ "$EXISTING_COUNT" -ge "$PREVIEW_MAX_APPS" ]; then
            echo "上限に達しているため、新規プレビューアプリを作成せず終了します"
            {
              echo "app_name="
              echo "skipped_reason=limit_reached:${EXISTING_COUNT}/${PREVIEW_MAX_APPS}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! flyctl apps create "$APP_NAME" --org personal --json >/dev/null 2>/tmp/fly-create-err.txt; then
            echo "アプリの作成に失敗しました:" >&2
            cat /tmp/fly-create-err.txt >&2 || true
            {
              echo "app_name="
              echo "skipped_reason=create_failed"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "アプリを作成しました: $APP_NAME"
          {
            echo "app_name=$APP_NAME"
            echo "skipped_reason="
          } >> "$GITHUB_OUTPUT"

      - name: デプロイ前のMachineログを出力する
        # 現在動いているプレビューで起きたエラー（ログイン後の500など）は、Machine内の
        # Next.jsが出すログにしか残らない。デプロイするとMachineが再起動して追いにくくなるため、
        # 何かを置き換える前にここで直近のログを吐き出しておく（#880）。
        # ログが取れなくてもデプロイ自体は続行させる。
        # 新規作成直後のアプリにはMachineもログも無いが、`|| true`で無視される。
        if: steps.app.outputs.skipped_reason == ''
        run: timeout 120 flyctl logs --no-tail --app "$APP_NAME" | tail -n 200 || true
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          APP_NAME: ${{ steps.app.outputs.app_name }}

      - name: Install SSH key
        if: steps.app.outputs.skipped_reason == ''
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          known_hosts: placeholder
          if_key_exists: replace

      - name: Add known hosts
        if: steps.app.outputs.skipped_reason == ''
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
        env:
          HOST: ${{ env.HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}

      - name: mariadb-clientをインストール
        if: steps.app.outputs.skipped_reason == ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mariadb-client

      - name: 本番DBをダンプ
        # 認証情報をmysqldumpのコマンドライン引数（-u/-p）で渡すと、共用の本番サーバー上で
        # 他ユーザーからpsで見えてしまう（#826の「本番サーバーは共用機」という前提）。
        # --defaults-extra-file=/dev/stdin でssh経由の標準入力から読ませることで、
        # 本番サーバー側に認証情報を書いたファイルを作成せずに済ませる
        # （一時ファイルを作って削除するより単純かつ確実なため、この方式にした）。
        if: steps.app.outputs.skipped_reason == ''
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" \
            "mysqldump --defaults-extra-file=/dev/stdin --single-transaction --no-tablespaces ${DB_NAME} | gzip" \
            > /tmp/prod-dump.sql.gz <<CNF
          [client]
          user=${DB_USER}
          password=${DB_PASSWORD}
          CNF
        env:
          HOST: ${{ env.HOST }}
          USERNAME: ${{ env.USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          DB_NAME: ${{ env.DB_NAME }}

      - name: ダンプをサニタイズ用MariaDBへロード
        if: steps.app.outputs.skipped_reason == ''
        run: gunzip -c /tmp/prod-dump.sql.gz | mysql -h127.0.0.1 -P3306 -uroot -proot app_issue_deck

      - name: Setup pnpm
        if: steps.app.outputs.skipped_reason == ''
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.app.outputs.skipped_reason == ''
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        if: steps.app.outputs.skipped_reason == ''
        run: pnpm install --frozen-lockfile

      - name: installation ID書き換え・ユーザートークンのサニタイズ
        if: steps.app.outputs.skipped_reason == ''
        run: node scripts/preview-sanitize-dump.mjs
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/app_issue_deck
          GITHUB_APP_ID: "4445268"
          GITHUB_APP_PRIVATE_KEY_BASE64: ${{ env.PREVIEW_GITHUB_APP_PRIVATE_KEY_BASE64 }}

      - name: サニタイズ済みDBを再ダンプ
        if: steps.app.outputs.skipped_reason == ''
        run: |
          set -euo pipefail
          mkdir -p db-dump
          mysqldump -h127.0.0.1 -P3306 -uroot -proot --single-transaction --no-tablespaces app_issue_deck \
            | gzip > db-dump/dump.sql.gz

      - name: Setup flyctl
        if: steps.app.outputs.skipped_reason == ''
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: fly secrets set
        if: steps.app.outputs.skipped_reason == ''
        # 実行時にしか使われないサーバー専用シークレット（Dockerfileのrunnerステージには
        # 引き継がれないため、ビルド時ではなくfly secretsで渡す。fly.tomlのコメント参照）。
        # --stageで今回のdeployとまとめて反映する（このコマンド単体ではreleaseしない）。
        #
        # GITHUB_USER_TOKEN_ENCRYPTION_KEYは本番の鍵を複製せず、デプロイのたびにその場で
        # ランダム生成する（本番GitHub Appの秘密鍵を持ち込まず開発Appを使うのと同じ考え方）。
        # この鍵はログイン時にGitHubユーザートークンを暗号化して保存するために使われ、
        # 未設定だと/auth/callbackが500になる（#880）。Machineは起動のたびに
        # scripts/preview-entrypoint.shがダンプからDBを作り直し、ダンプ中の
        # User.githubAccessToken等はpreview-sanitize-dump.mjsでNULL化済みのため、
        # 鍵が毎デプロイ変わっても復号できない古い暗号文が残ることはない。
        run: |
          flyctl secrets set --stage --app "$APP_NAME" \
            GITHUB_APP_ID="4445268" \
            GITHUB_APP_PRIVATE_KEY_BASE64="${PREVIEW_GITHUB_APP_PRIVATE_KEY_BASE64}" \
            SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY}" \
            ALLOWED_EMAILS="${ALLOWED_EMAILS}" \
            GITHUB_USER_TOKEN_ENCRYPTION_KEY="$(openssl rand -base64 32)"
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          APP_NAME: ${{ steps.app.outputs.app_name }}
          PREVIEW_GITHUB_APP_PRIVATE_KEY_BASE64: ${{ env.PREVIEW_GITHUB_APP_PRIVATE_KEY_BASE64 }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOWED_EMAILS: ${{ env.ALLOWED_EMAILS }}

      - name: fly deploy
        id: deploy
        if: steps.app.outputs.skipped_reason == ''
        run: |
          set -euo pipefail
          # --ha=falseでMachineは常に1台に保つ。プレビュー環境はMachine内のローカルMariaDBに
          # ダンプを載せる構成のため、2台に増えるとリクエストごとに別々のDBを見ることになる
          # （初回デプロイのログにも`create 2 "app" machines`と出ていた）。
          #
          # --app でfly.tomlのapp名を上書きする（#892）。Issueごとに専用アプリへデプロイするため。
          flyctl deploy --remote-only --ha=false --app "$APP_NAME" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL}" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
            --build-arg NEXT_PUBLIC_GITHUB_APP_SLUG="issue-deck-dev" \
            --env PREVIEW_MODE="${PREVIEW_MODE}"

          PREVIEW_URL="https://${APP_NAME}.fly.dev"
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "### プレビューURL: ${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          APP_NAME: ${{ steps.app.outputs.app_name }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PREVIEW_MODE: ${{ inputs.preview_mode }}

      - name: Machineを起動
        # 既存Machineをrolling strategyで更新する`flyctl deploy`は、configを更新するだけで
        # Machineを起動せずstopped状態のまま終わることがある（#880）。fly.tomlの
        # auto_start_machines=trueにより、その状態でもURLへアクセスすれば起動するが、
        # レビュアーの初回アクセスがコールドスタート（MariaDB初期化・ダンプロード）待ちに
        # なるため、デプロイ直後にここで先に起こしておく。
        # 起動済みのMachineに対して実行しても`flyctl machine start`は成功扱いになる。
        if: steps.app.outputs.skipped_reason == ''
        run: |
          set -euo pipefail
          MACHINE_ID=$(flyctl machine list --app "$APP_NAME" --json | jq -r '.[0].id // empty')
          if [[ -z "$MACHINE_ID" ]]; then
            echo "Machineが存在しないため起動をスキップします" >&2
            exit 0
          fi
          flyctl machine start "$MACHINE_ID" --app "$APP_NAME"
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          APP_NAME: ${{ steps.app.outputs.app_name }}

      - name: プレビューURLの疎通を確認する
        if: steps.app.outputs.skipped_reason == ''
        # Machineが起動しても、コンテナ内のMariaDB初期化・ダンプロードが終わるまでは応答しない
        # ため、少し待ちながらリトライする。未ログインではログイン画面へのリダイレクトになる
        # ので2xx/3xxを成功とみなす。#880では起動していないMachineのURLをそのままIssueへ通知して
        # しまったため、通知前にここで落ちるようにしておく。
        run: |
          set -uo pipefail
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${PREVIEW_URL}" || echo 000)
            echo "[${i}] ${PREVIEW_URL} -> ${CODE}"
            case "$CODE" in
              2*|3*) exit 0 ;;
            esac
            sleep 10
          done
          echo "プレビューURLが応答しませんでした" >&2
          exit 1
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}

      - name: 起動失敗時にMachineのログを出力する
        # Machineの中で何が起きたかはGitHub Actions側のログには出てこないため、
        # 起動に失敗したときだけFly.io側のログを取り出して原因を追えるようにする
        # （#880では実行ビットの落ちたentrypointでMachineが即クラッシュしていた）。
        if: failure() && steps.app.outputs.skipped_reason == ''
        run: flyctl logs --no-tail --app "$APP_NAME" || true
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          APP_NAME: ${{ steps.app.outputs.app_name }}

      - name: デプロイをスキップした理由をログに出す
        # skipped_reasonが非空のときは、以降のデプロイ系ステップがすべてskipされている。
        # 呼び出し側（claude-issue-dispatch.ymlのnotify-preview-urlジョブ）がこの値を見て
        # Issueへ通知するが、Actionsのログだけを見た人にも状況が分かるようにしておく。
        if: steps.app.outputs.skipped_reason != ''
        env:
          SKIPPED_REASON: ${{ steps.app.outputs.skipped_reason }}
          PREVIEW_MAX_APPS: ${{ vars.PREVIEW_MAX_APPS || '5' }}
        run: |
          case "$SKIPPED_REASON" in
            limit_reached:*)
              echo "::warning::プレビュー環境の同時起動数が上限（${PREVIEW_MAX_APPS}）に達しているため、デプロイをスキップしました（${SKIPPED_REASON}）。不要なプレビューを破棄してから再実行してください。"
              ;;
            create_failed)
              echo "::warning::Fly.ioアプリの作成に失敗したため、デプロイをスキップしました。FLY_API_TOKENがorganizationスコープであるか確認してください（アプリ単位のデプロイトークンでは新規アプリを作成できません）。"
              ;;
            *)
              echo "::warning::デプロイをスキップしました（理由: ${SKIPPED_REASON}）"
              ;;
          esac
