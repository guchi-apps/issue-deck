name: Release

# Manual tag pushes only. Tags created by deploy.yml use the release job there
# because GITHUB_TOKEN pushes do not trigger other workflows.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}

      - name: Convert release notes to task list
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # 項目ごとの確認をGitHub Release本文と連動させるため、箇条書きをタスクリストにする（#4374）。
          # すでにタスクリストの行（`- [ ]`・`- [x]`）は触らないので、再実行しても確認状態は変わらない。
          gh release view "$TAG" --json body --jq .body | sed -E 's/^\* /- [ ] /' > release-body.md
          gh release edit "$TAG" --notes-file release-body.md

  notify:
    runs-on: ubuntu-latest
    needs: release
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Discord に異常を通知
        # 失敗・異常だけ送る（成功・キャンセルはスクリプトが送らない）。結果は改変せず、
        # 通知の失敗でrunを落とさない（#5057）。
        if: always()
        continue-on-error: true
        env:
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          NOTIFY_APP: issue-deck
          NOTIFY_KIND: リリース
          NOTIFY_STATUS: ${{ needs.release.result }}
          NOTIFY_VERSION: ${{ github.ref_name }}
        run: bash .github/scripts/discord-alert.sh
