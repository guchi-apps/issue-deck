name: Reusable Claude Code Review (develop向けPR)

# develop向けPRの作成・更新時に、機械的リスク判定・Claude Codeによる自動レビュー・
# 低リスクPRの自動マージを行う(docs/multi-agent-workflow.md「段階的導入計画」のPhase3/Phase4)。
#
# ジョブ構成:
# - identify-issue: 対応Issue番号を特定する(他ジョブが共通で参照する)
# - wait-for-ci: CI(ci.yml)の完了を待つ待機ジョブ。**依存するのは最後のauto-mergeだけで、
#   risk-check/claude-reviewはCIと並行して走る**(#2066)。CIが`in_progress`のうちに
#   00.check-userが付き、issue-deck画面上で時期尚早に「要確認」に見える問題を防ぐのが
#   目的(#810)だが、その付与を行うのは既にauto-mergeジョブだけ(#1406)なので、
#   判定とレビューまで直列に並べる必要は無くなっている。ポーリングがタイムアウトした
#   場合もジョブ自体は失敗させず後続へ進める(fail-open)
# - risk-check: パスパターンによる機械的リスク判定、および対応Issueへの
#   22.merge-confirm-required・23.preview-requiredラベル
#   付与の有無を確認する(#94, #366)。**判定するだけで、00.check-userの付与と理由コメントの
#   投稿は行わない**(#1406。実際に反映するのは最後のauto-mergeジョブ)。判定結果は
#   risky・reasons・already-check-userの各outputで渡す。
#   あわせて、後続のclaude-reviewを実行するかどうかのゲート判定(needs-review出力)も行う(#992)。
#   **変更カテゴリ(パス・依存関係)でマージを止めるかどうかはmerge-policy入力で切り替わる**
#   (#2775。relaxed=既定・止めない / strict=止める。既定の反転は#2790)。relaxedでも該当自体は検出し、
#   needs-reviewの側にだけ反映するため、レビューの実行条件は変わらない。
#   ラベルによる明示的指定と.shared-context/の混入は、relaxedでも従来どおり止める
# - claude-review: Claude Codeによる意味的なレビュー・自動マージ不可カテゴリ判定。
#   該当時は判定理由をissueにコメント投稿する(#94)。**00.check-userの付与はここでは
#   行わない**(#2136)。理由コメントの末尾に
#   <!-- issue-deck-review-verdict:merge-blocked sha=<head SHA> --> のマーカーを残し、
#   それを最後のauto-mergeジョブが読んでラベルを付ける。このジョブはCIと並行して走るため
#   (#2066)、ここで付けるとCIの実行中・レビューの完了前にユーザーへ通知が飛ぶうえ、
#   理由コメントの投稿はその数分後になるため画面には理由も出ない(実測: Issue #2126は
#   12:06:09にラベル、12:09:20に理由コメント)。マージや進捗(Project Status)の遷移も行わない。
#   develop向けPRの大半は小規模・低リスクで、そこにClaude Codeによる意味的レビューを
#   毎回かけるのは費用対効果が低いため、risk-checkのneeds-review出力が
#   trueのときだけ実行する(#992)。ゲート条件は risk-check の該当・大きな差分・
#   対応Issue番号不明・対応Issueに00.check-user付与済み、のいずれか。
#   スキップされた場合はauto-mergeがそのまま進む(下記auto-mergeのif参照)
#   なお、claude-code-actionには「ワークフローファイルの内容がデフォルトブランチ(develop)の
#   同ファイルと完全一致していなければClaudeの実行だけをスキップする」検証機構がある。
#   このファイルを含む .github/workflows/ 配下を変更するPRでは、このジョブはClaudeを
#   実行しないまま success で終わる(ステップもジョブも成功扱いになる点に注意)。
#   strictではrisk-checkの検知をauto-mergeが反映して00.check-userを付与する。relaxed(既定)では
#   それが無いため、workflow-change-policy: confirm(既定)がClaude未実行のワークフロー変更PRを
#   00.check-userで人へ回す(#4144)。confirmでは代わりにサブPCのCodexレビューを依頼し、その判定が
#   出ればそれで決める(#4149。下のcodex-review参照)。詳細は docs/multi-agent/labels.md
#   「ワークフローファイルを変更するPRではclaude-reviewが必ずスキップされる」参照
# - claude-review-fallback: claude-reviewが失敗した場合にのみ走る。Claude Code自体を
#   使わない単純なシェルスクリプトとし、Claude Code側の失敗原因に関わらず確実に
#   PRへ失敗を通知し、対応Issueに00.check-userを付与する(auto-mergeは
#   claude-reviewの失敗により既にスキップされるため二重の安全網になる)(#83)。
#   auto-mergeごとスキップされる経路では機械的リスク判定の理由も一緒に投稿する(#1406)
# - auto-merge: **まず両判定(機械的リスク判定=risk-check・意味的判定=claude-review)の結果を
#   反映する**。該当していれば00.check-userを付与する(#94, #366, #1406, #2136)。
#   理由コメントは、risk-check分をこのジョブが投稿し、claude-review分はclaude-review自身が
#   投稿済みのものを使う。ただし
#   このpush開始時点で既に00.check-userが付いていた場合はコメント投稿のみ省略する
#   (ラベルは毎回再付与する)。実装エージェントが同一PRへ連続してpushする間、同内容の確認要求
#   コメントが繰り返し投稿され、作業中なのか確認待ちなのか紛らわしくなる問題を防ぐため(#594)。
#   そのうえで、対応Issueに00.check-userが付いていなければ gh pr merge --auto --merge を実行する。
#   付与をこの最後のジョブまで遅らせているのは、risk-checkの時点で付けると、そのあとに走る
#   claude-review(数分)のcheck-runが残ったままユーザーへ通知が飛び、issue-deckの画面では
#   「CI実行中」としてマージボタンが押せない時間が続くため(#1406)。**同じ理由で、
#   claude-reviewの意味的判定もここで反映する**(#2136)。このジョブはwait-for-ciと
#   claude-reviewの両方をneedsに持つ唯一のジョブで、「CIの完了とレビューの完了の両方が
#   終わってからラベルが付く」ことを構造として保証できるのはここだけ
# - auto-merge-fallback: auto-mergeが失敗した場合にのみ走る。claude-review-fallback
#   と同様に、確実にPRへ失敗を通知し、対応Issueに00.check-userを付与する(#238)
#
# **判定とレビューはCIと並行して走る(#2066)。** ジョブの依存は
# identify-issue -> {wait-for-ci | risk-check -> claude-review} -> auto-merge で、
# CIの完了を待つのは実際にマージを有効化するauto-mergeだけ。直列だった頃(wait-for-ci ->
# risk-check -> claude-review -> auto-merge)は、直近20実行の実測でwait-for-ciが中央値167秒・
# claude-reviewが中央値235秒(20件中16件で実行)かかり、PR作成から自動マージ有効化まで約7分あった。
# 並行にすると律速がレビュー側だけになり、中央値で約2分半縮む。
# **Claude Codeの消費は増えない。** wait-for-ciはCIのconclusionを見ずcompletedで抜けるため、
# CIが落ちたコミットにも並行化の前からレビューは走っている。
# **マージの安全性も変わらない。** auto-mergeが使うGitHub Auto-merge機能は、developの
# required_status_checks(lint-and-build)の通過を待ってから実際のマージを行う。
#
# **判定が終わる前にPRがマージされていることがある(#1968)。** PR #1959は判定の6分前に
# issue-deckの画面のマージボタンでdevelopへ入り、`00.check-user`・`01.check-merge`は
# マージ後に付いた。ワークフロー内の順序(当時はwait-for-ci -> risk-check -> claude-review ->
# auto-mergeの直列。現在は上の#2066の並行構成)は保たれており、先行したのは
# **画面からの手動マージ**の方である。
# 再発防止は画面側で行い(判定中はマージボタンを押せなくする。`src/lib/pull-request-list.ts`の
# `isMergeJudgementPending`)、こちら側は「もう入ってしまった場合の伝え方」だけを直している——
# auto-mergeジョブの理由コメントは、PRが既にマージ済みなら事後確認向けの文面へ切り替える
# (ラベルは従来どおり付ける)。claude-reviewの二次判定側も同じ扱いを
# .github/prompts/review-develop.md に書いている
#
# 00.check-userラベルを両判定(機械的/意味的)共通の「マージ保留」シグナルとして
# 使うことで、判定ロジックとマージ可否判断を疎結合に保っている。
#
# 対応issueの番号は、本リポジトリの命名規約であるブランチ名 issue-<番号>
# (scripts/start-issue.shが作成)から特定する。head_ref等の値はscript injection
# を避けるため env 経由でのみ参照し、run: 本文に直接展開しない
# (.github/workflows/issue-labels.yml と同じ方針)。
#
# concurrency: 本ワークフローはdevelop向けPRへのpush(synchronize)のたびに毎回起動するため、
# 実装エージェントが同一PRへ連続してpushすると、supersededになった古いpush分のwait-for-ci/
# risk-check/claude-review(Claude Code呼び出しを含む)が古いコミットに対してそのまま走り
# 切ってしまい、無駄なClaude Code消費になっていた(#818)。ここでは新しいpushが来たら
# 古い実行を丸ごとキャンセルする。各ジョブが行う操作(ラベル付与・コメント投稿・
# auto-merge有効化)はいずれも冪等かつ「より新しい実行が最終的に正しい判定を行えば十分」
# なため、実行途中でキャンセルされても後続のより新しい実行が正しい状態に収束する。
# concurrencyは呼び出し元(claude-review-develop.yml)のワークフローレベルに置く。
# トリガーと同じ場所にあるべきもので、呼び出し元がキャンセルされれば呼び出し先のジョブも
# 一緒にキャンセルされるため挙動は変わらない(#818)。

on:
  workflow_call:
    inputs:
      risk-paths:
        description: >-
          このリポジトリ固有の「リスクとみなすパス」。1行1件で
          「<grep -E の正規表現> :: <Issueコメントに出す理由>」の形式で書く。
          区切りは半角スペース2つのコロン( :: )。正規表現側が選択(|)を含むことがあるため
          区切りに | は使えない。区切りの無い行があればジョブを失敗させる。
          .github/workflows/** ・.env* ・.shared-context/** ・prisma/migrations/** ・
          **/auth/** は再利用ワークフロー側に内蔵されており、ここで指定しなくても常に判定される
          (入力はリスクを追加できるが削減はできない)。
        required: false
        type: string
        default: ""
      dependency-check:
        description: >-
          package.json の依存関係変更をどこからリスクとみなすか。
          major(既定・メジャーバージョン更新のみ) / any(新規追加も含む) / none(判定しない)。
          npm依存を持たない方針のリポジトリは any にする。
        required: false
        type: string
        default: major
      review-file-threshold:
        description: "claude-reviewを実行する変更ファイル数の閾値(#992)"
        required: false
        type: string
        default: "10"
      review-line-threshold:
        description: "claude-reviewを実行する変更行数の閾値(#992)"
        required: false
        type: string
        default: "500"
      lock-files:
        description: >-
          差分規模の算出から除外する自動生成ファイル(スペース区切り)。
          依存を1つ足しただけで数百行動くため、除外しないと小さなPRが閾値を超えてしまう。
        required: false
        type: string
        default: "pnpm-lock.yaml package-lock.json"
      merge-policy:
        description: >-
          変更カテゴリ(DBマイグレーション・ワークフロー・.env・認証・依存のメジャー更新・
          risk-pathsの追加分)を「自動マージを止める理由」として扱うか(#2775)。
          relaxed(既定・止めずに自動マージへ進む) / strict(従来どおり止める)。
          **既定はrelaxedで、callerを持つ全リポジトリへ一律に効く**(#2790)。
          developはリリース前の統合先で、本番へ出るには develop -> main のリリースPR
          (自動マージ不可カテゴリのまま・人がマージする)をもう1回通るため、
          develop向けPRの側で毎回「確認待ち」の札を積む価値が薄い。
          カテゴリで止めたいリポジトリだけが caller に strict と書く(オプトアウト)。
          relaxedでも、Issueのラベル(22.merge-confirm-required・23.preview-required)・
          .shared-context/の混入・claude-reviewの意味的判定は
          従来どおりマージを止める。**カテゴリ該当時にclaude-reviewを実行する条件は
          relaxedでも変わらない**(止めるのをやめるだけで、レビューは省かない)。
        required: false
        type: string
        default: relaxed
      workflow-change-policy:
        description: >-
          `.github/workflows/**`を変更するPRでClaudeが実行されなかった場合の扱い(#4144)。
          claude-code-actionには「ワークフローファイルの内容がデフォルトブランチと完全一致して
          いなければClaudeの実行だけをスキップする」検証機構があり、そのPRでは意味的レビューが
          無いまま`success`で終わる。confirm(既定) / allow(従来どおりレビュー無しで通す)。
          confirmでは代わりにサブPCのCodexレビューを依頼し(#4149)、その判定で自動マージを決める
          (判定が出るまでは保留)。依頼できない・判定が得られないときは自動マージせず
          00.check-user＋01.check-mergeで人へ回す(#4144)。merge-policyとは独立で、relaxedでも効く。
          Codexが担当のPR(claude-reviewを使わない)には適用しない。
        required: false
        type: string
        default: confirm
      review-auto-fix:
        description: >-
          自動レビューが「要修正」と判定し、しかも「人の判断が要らない指摘だけ」と印を付けたとき、
          00.check-userで人へ渡さずに claude-review-fix.yml（レビュー指摘の自動修正）へ渡すか
          (#3363)。true(既定)でも、そのリポジトリに claude-review-fix.yml が置かれていなければ
          従来どおり人へ渡る。falseにすると常に従来どおり。
        required: false
        type: boolean
        default: true
      enable-auto-merge:
        description: >-
          自動マージを有効にするか。true(既定)は従来どおり判定を通ったPRへ
          GitHub Auto-mergeを予約する。falseはリスク判定とClaudeによるレビューだけを
          実行し、PRのマージは人が行う。main直行など、ブランチ保護や運用方針から
          自動マージを使わないリポジトリ向け。
        required: false
        type: boolean
        default: true
      prompts-ref:
        description: >-
          プロンプト(.github/prompts/)の取得元とするissue-deckのref。
          未指定なら呼び出し元リポジトリの.github/prompts/を使う(issue-deck自身はこちら)。
          他リポジトリから呼ぶ場合は uses: と同じタグを指定する。
        required: false
        type: string
        default: ""

jobs:
  identify-issue:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.issue.outputs.number }}
    steps:
      - name: 対応Issue番号を特定する
        id: issue
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" =~ ^issue-([0-9]+)$ ]]; then
            echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
          fi

  wait-for-ci:
    needs: identify-issue
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: CI(ci.yml)の完了を待つ
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 60); do
            STATUS="$(gh api "repos/${GH_REPO}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request" \
              --jq '[.workflow_runs[] | select(.name == "CI")][0].status // ""')"
            if [ -z "$STATUS" ]; then
              echo "CIの実行がまだ見つかりません。20秒待って再試行します。($i/60)"
            elif [ "$STATUS" = "completed" ]; then
              echo "CIが完了しました。"
              exit 0
            else
              echo "CIはまだ完了していません(status=${STATUS})。20秒待って再試行します。($i/60)"
            fi
            sleep 20
          done
          echo "タイムアウトしました。CI完了を待たずに後続ジョブへ進みます(fail-open)。"

  # permissionsのcontents: readは、下のactions/checkoutに要る(#2126)。ジョブへpermissionsを
  # 明示すると書かなかったスコープはnoneになるため、省くとGITHUB_TOKENでリポジトリを読めず、
  # privateリポジトリではcheckoutが`Repository not found`で必ず失敗する(issue-deck自身は
  # publicで匿名cloneが通るため表面化しなかった)。callerのpermissionsは呼び出し先が持てる
  # 上限を決めるだけなので、caller側では回避できない。
  risk-check:
    needs: identify-issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      # 機械的リスク判定に該当したか(auto-mergeジョブでの00.check-user付与の有無と一致する)
      risky: ${{ steps.risk.outputs.risky }}
      # 後続のclaude-reviewを実行するか(#992)。riskyより広い条件で立つ
      needs-review: ${{ steps.risk.outputs.needs-review }}
      # `.github/workflows/`配下を変更しているか(#4144)。claude-reviewがClaudeを実行できない
      # PRかどうかをauto-mergeが判定する材料
      workflow-changed: ${{ steps.risk.outputs.workflow-changed }}
      # 該当した理由(複数行)。auto-mergeジョブが投稿するコメントの本文になる(#1406)
      reasons: ${{ steps.risk.outputs.reasons }}
      # このpush開始時点で既に00.check-userが付いていたか。重複コメント抑止(#594)の判定に使う。
      # 判定材料はこの時点の状態のまま渡し、auto-mergeジョブ側で読み直さない(#1406)。
      # claude-review自身はラベルを付けなくなった(#2136)が、claude-review-fallbackなど
      # 他経路が付けた分を「元から付いていた」と誤読して理由コメントを取りこぼすのは同じ
      already-check-user: ${{ steps.risk.outputs.already-check-user }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: パスパターンによる機械的リスク判定とレビュー実行ゲート判定
        id: risk
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.identify-issue.outputs.number }}
          BASE_REF: ${{ github.base_ref }}
          # claude-reviewを実行する差分規模の閾値(#992)。いずれかを超えたら「大きな差分」と
          # みなしてレビューを実行する。直近のdevelop向けPRの実測(2〜5ファイル・数十〜200行が
          # 大半)をもとに、通常の機能追加PRはスキップされ、複数領域にまたがる変更だけが
          # 引っかかる水準に設定している
          REVIEW_FILE_THRESHOLD: ${{ inputs.review-file-threshold }}
          REVIEW_LINE_THRESHOLD: ${{ inputs.review-line-threshold }}
          RISK_PATHS: ${{ inputs.risk-paths }}
          DEPENDENCY_CHECK: ${{ inputs.dependency-check }}
          LOCK_FILES: ${{ inputs.lock-files }}
          MERGE_POLICY: ${{ inputs.merge-policy }}
        run: |
          set -e
          CHANGED_FILES="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          RISKY=false
          REASONS=""
          # merge-policy: relaxed で「マージは止めないが、レビューは実行する」に回した
          # カテゴリ該当の理由(#2775)。auto-mergeへは渡さず、この下のレビュー実行ゲートと
          # ログにだけ使う。
          RELAXED_REASONS=""

          # **入力の既定はrelaxed**(#2790)。ここのフォールバックが効くのは
          # env:の渡し忘れ・空文字を明示的に渡した場合だけで、そのときは安全側のstrictへ倒す。
          # 「既定」の正は上のinputsのdefault:で、ここは事故に備えた安全弁。役割が違う。
          MERGE_POLICY="${MERGE_POLICY:-strict}"
          case "$MERGE_POLICY" in
            strict|relaxed) ;;
            *)
              echo "::error::merge-policy は strict か relaxed のどちらかです: $MERGE_POLICY"
              exit 1
              ;;
          esac
          echo "マージ方針: ${MERGE_POLICY}"

          add_reason() {
            RISKY=true
            REASONS="${REASONS}${REASONS:+$'\n'}- $1"
          }

          # 変更カテゴリ(パス・依存関係)による該当(#2775)。
          #
          # **relaxed(既定)では止めず、strictでは従来どおりマージを止める。** relaxedを既定にしたのは
          # 「この種類のファイルを触った」こと自体は、developへ入れてよいかの判断材料として
          # 弱いため。developはリリース前の統合先で、本番へ出るには develop -> main の
          # リリースPR(自動マージ不可カテゴリのまま・人がマージする)をもう1回通る。
          #
          # 止めないだけで、**レビューを省くことはしない**。relaxedで拾った理由は
          # RELAXED_REASONSへ入れ、下のレビュー実行ゲートが従来と同じようにレビューを走らせる。
          #
          # #2790でこれをcallerを持つ全リポジトリの既定にした。カテゴリで止めたい
          # リポジトリだけがcallerに merge-policy: strict と書く(オプトアウト)。
          add_category_reason() {
            if [ "$MERGE_POLICY" = "relaxed" ]; then
              RELAXED_REASONS="${RELAXED_REASONS}${RELAXED_REASONS:+$'\n'}- $1"
            else
              add_reason "$1"
            fi
          }

          if echo "$CHANGED_FILES" | grep -q '^prisma/migrations/'; then
            add_category_reason "DBマイグレーションの変更 (prisma/migrations/**)"
          fi
          if echo "$CHANGED_FILES" | grep -qE '(^|/)\.env'; then
            add_category_reason "環境変数ファイルの変更 (.env*)"
          fi
          if echo "$CHANGED_FILES" | grep -q '^\.github/workflows/'; then
            add_category_reason "GitHub Actionsワークフローの変更 (.github/workflows/**)"
          fi
          if echo "$CHANGED_FILES" | grep -qE '(^|/)auth(/|\.[^/]*$)'; then
            add_category_reason "認証・認可関連ファイルの変更 (**/auth/**)"
          fi
          # 共有知識リポジトリのcheckout先(.gitignore済み)がコミットされていないかを機械的に確認する。
          # 従来はclaude-reviewのプロンプトだけがこれを見ていたが、claude-reviewは
          # 低リスクPRではskipされるようになった(#992)ため、機械判定側にも同じ確認を置く。
          #
          # **これはmerge-policyで緩めない**(add_category_reasonではなくadd_reason)。
          # 変更カテゴリではなく「入ってはいけないものが入っている」誤りの検知で、
          # 緩めるとdevelopへ読み取り専用のcheckout先がそのまま入る(#2775)。
          if echo "$CHANGED_FILES" | grep -q '^\.shared-context/'; then
            add_reason "共有知識リポジトリのcheckout先が差分に混入している (.shared-context/**)。読み取り専用のため、コミットから除外する必要がある"
          fi

          # ここまでが全リポジトリ共通の内蔵パターン。以降は呼び出し元が宣言した
          # リポジトリ固有のリスクパスを評価する。入力はリスクを追加できるが削減はできない
          # (merge-policy: relaxed では内蔵パターンと同じく「止めない」側へ回る)。
          if [ -n "${RISK_PATHS:-}" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in \#*) continue ;; esac
              case "$line" in
                *" :: "*) ;;
                *)
                  echo "::error::risk-paths の行が「<正規表現> :: <理由>」形式ではありません: $line"
                  exit 1
                  ;;
              esac
              PATTERN="${line%% :: *}"
              REASON="${line#* :: }"
              if echo "$CHANGED_FILES" | grep -qE "$PATTERN"; then
                add_category_reason "$REASON"
              fi
            done <<< "$RISK_PATHS"
          fi

          if [ "${DEPENDENCY_CHECK:-major}" != "none" ] && echo "$CHANGED_FILES" | grep -q '^package\.json$'; then
            if git show "origin/${BASE_REF}:package.json" > /tmp/old-package.json 2>/dev/null; then
              if ! node -e '
                const fs = require("fs");
                const old = JSON.parse(fs.readFileSync("/tmp/old-package.json", "utf8"));
                const neu = JSON.parse(fs.readFileSync("package.json", "utf8"));
                const oldDeps = { ...old.dependencies, ...old.devDependencies };
                const newDeps = { ...neu.dependencies, ...neu.devDependencies };
                // any の場合は依存の新規追加もリスクとみなす(npm依存を持たない方針の
                // リポジトリでは、1つ増えること自体が方針の変更にあたるため)。
                const mode = process.env.DEPENDENCY_CHECK || "major";
                let risky = false;
                for (const [name, newVer] of Object.entries(newDeps)) {
                  const oldVer = oldDeps[name];
                  if (!oldVer) {
                    if (mode === "any") {
                      console.log(`${name}: 新規追加 (${newVer})`);
                      risky = true;
                    }
                    continue;
                  }
                  const oldMajor = oldVer.match(/\d+/)?.[0];
                  const newMajor = newVer.match(/\d+/)?.[0];
                  if (oldMajor && newMajor && oldMajor !== newMajor) {
                    console.log(`${name}: ${oldVer} -> ${newVer}`);
                    risky = true;
                  }
                }
                process.exit(risky ? 1 : 0);
              '; then
                if [ "$DEPENDENCY_CHECK" = "any" ]; then
                  add_category_reason "依存関係の新規追加またはメジャーバージョン更新 (package.json)"
                else
                  add_category_reason "依存関係のメジャーバージョン更新 (package.json)"
                fi
              fi
            else
              add_category_reason "package.jsonの変更（比較元の取得に失敗したため安全側で判定）"
            fi
          fi

          if [ -n "$ISSUE_NUMBER" ]; then
            ISSUE_LABELS="$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')"
            if echo "$ISSUE_LABELS" | grep -qx "22.merge-confirm-required"; then
              add_reason "Issueに \`22.merge-confirm-required\` ラベルが付与されているため（developへのマージ前に必ずユーザー確認を行う設定）"
            fi
            if echo "$ISSUE_LABELS" | grep -qx "23.preview-required"; then
              add_reason "Issueに \`23.preview-required\` ラベルが付与されているため（画面プレビュー確認のため、developへのマージ前に必ずユーザー確認を行う設定）"
            fi
          fi

          # ここでは判定するだけで、00.check-userの付与と理由コメントの投稿は行わない(#1406)。
          # 付与はワークフロー終盤のauto-mergeジョブが行う。ここで付けると、その後に走る
          # claude-review(数分)・auto-mergeのcheck-runが残ったままユーザーへ通知が飛び、
          # issue-deckの画面では「CI実行中」としてマージボタンが押せない時間が続くため。
          if [ "$RISKY" = "true" ]; then
            echo "リスクありと判定(00.check-userの付与はauto-mergeジョブで行う):"
            echo "$REASONS"
          else
            echo "機械的リスク判定: 該当なし"
          fi
          if [ -n "$RELAXED_REASONS" ]; then
            echo "変更カテゴリに該当したが、merge-policy: relaxed のためマージは止めない(#2775):"
            echo "$RELAXED_REASONS"
          fi

          # 判定結果を後続ジョブへ渡す。理由は複数行になるためヒアドキュメント記法を使う。
          # 区切りはREASONS本文と衝突しないようrun idを含める。
          ALREADY_CHECK_USER=false
          if echo "$ISSUE_LABELS" | grep -qx "00.check-user"; then
            ALREADY_CHECK_USER=true
          fi
          {
            echo "already-check-user=${ALREADY_CHECK_USER}"
            echo "reasons<<RISK_REASONS_EOF_${GITHUB_RUN_ID}"
            echo "$REASONS"
            echo "RISK_REASONS_EOF_${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

          # ここから、後続のclaude-reviewを実行するかどうかのゲート判定(#992)。
          # develop向けPRの大半は2〜5ファイル・数百行以内の小規模かつ低リスクな変更で、
          # そこにClaude Codeによる意味的レビューを毎回かけるのは費用対効果が低い。
          # 「人が確認する必要がある/レビューが最後の判断材料になる」場面に絞って実行する。
          #
          # 注意: ここで立てるのはレビュー実行の要否だけで、00.check-user(マージ保留)の
          # 判定には影響させない。差分が大きいことは「レビューを読みたい」理由にはなるが、
          # 「マージを止める」理由ではないため、RISKYとは別のフラグとして扱う。
          NEEDS_REVIEW=false
          REVIEW_REASONS=""

          add_review_reason() {
            NEEDS_REVIEW=true
            REVIEW_REASONS="${REVIEW_REASONS}${REVIEW_REASONS:+$'\n'}- $1"
          }

          # 差分規模の算出。lockファイルは自動生成で行数が大きく膨らむ一方、
          # レビューで読む価値のある変更ではないため、ファイル数・行数の双方から除外する。
          # 除外するlockファイル名を入力から正規表現へ組み立てる（リポジトリごとに
          # パッケージマネージャが異なるため）。未指定なら除外しない。
          LOCK_PATTERN=""
          for f in ${LOCK_FILES:-}; do
            ESCAPED="$(printf '%s' "$f" | sed 's/\./\\./g')"
            LOCK_PATTERN="${LOCK_PATTERN}${LOCK_PATTERN:+|}${ESCAPED}"
          done
          DIFF_NUMSTAT="$(git diff --numstat "origin/${BASE_REF}...HEAD")"
          if [ -n "$LOCK_PATTERN" ]; then
            DIFF_NUMSTAT="$(printf '%s\n' "$DIFF_NUMSTAT" \
              | grep -vE "(^|[/[:space:]])(${LOCK_PATTERN})$" || true)"
          fi
          CHANGED_COUNT="$(printf '%s\n' "$DIFF_NUMSTAT" | grep -c '[^[:space:]]' || true)"
          # バイナリファイルはnumstatの追加/削除行が "-" になるため0として数える
          CHANGED_LINES="$(printf '%s\n' "$DIFF_NUMSTAT" \
            | awk '{ a = ($1 == "-" ? 0 : $1); d = ($2 == "-" ? 0 : $2); total += a + d } END { print total + 0 }')"

          if [ -n "$LOCK_PATTERN" ]; then
            echo "差分規模: ${CHANGED_COUNT}ファイル / ${CHANGED_LINES}行（除外: ${LOCK_FILES}）"
          else
            echo "差分規模: ${CHANGED_COUNT}ファイル / ${CHANGED_LINES}行（除外なし）"
          fi

          if [ "$RISKY" = "true" ]; then
            add_review_reason "機械的リスク判定に該当したため"
          fi

          # merge-policy: relaxed で「止めない」側へ回した該当も、レビューは従来どおり実行する
          # (#2775)。マージを止めなくなるぶん、意味的レビューだけが最後の判断材料になる。
          if [ -n "$RELAXED_REASONS" ]; then
            add_review_reason "変更カテゴリに該当したため（merge-policy: relaxed のためマージは止めない）"
          fi

          if [ "$CHANGED_COUNT" -ge "$REVIEW_FILE_THRESHOLD" ] || [ "$CHANGED_LINES" -ge "$REVIEW_LINE_THRESHOLD" ]; then
            add_review_reason "差分が大きいため（${CHANGED_COUNT}ファイル / ${CHANGED_LINES}行。閾値: ${REVIEW_FILE_THRESHOLD}ファイル または ${REVIEW_LINE_THRESHOLD}行）"
          fi

          if [ -z "$ISSUE_NUMBER" ]; then
            # 対応Issueが分からない場合はauto-merge自体もスキップされる。
            # 判断材料を残すため、レビューは安全側に倒して実行する。
            add_review_reason "対応Issue番号を特定できないため（安全側でレビューを実行）"
          else
            if echo "$ISSUE_LABELS" | grep -qx "00.check-user"; then
              add_review_reason "対応Issueに \`00.check-user\` が付与されており、ユーザーが確認する際の判断材料が必要なため"
            fi
          fi

          if [ "$NEEDS_REVIEW" = "true" ]; then
            echo "claude-reviewを実行します。理由:"
            echo "$REVIEW_REASONS"
          else
            echo "低リスクかつ小規模なため、claude-reviewをスキップします。"
          fi

          {
            echo "needs-review=${NEEDS_REVIEW}"
            echo "risky=${RISKY}"
            if echo "$CHANGED_FILES" | grep -q '^\.github/workflows/'; then
              echo "workflow-changed=true"
            else
              echo "workflow-changed=false"
            fi
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Claude Review 実行判定"
            echo ""
            if [ "$NEEDS_REVIEW" = "true" ]; then
              echo "**実行する**"
              echo ""
              echo "$REVIEW_REASONS"
            else
              echo "**スキップする**（低リスクかつ小規模な変更のため）"
            fi
            echo ""
            echo "- 変更ファイル数: ${CHANGED_COUNT}（閾値: ${REVIEW_FILE_THRESHOLD}）"
            echo "- 変更行数: ${CHANGED_LINES}（閾値: ${REVIEW_LINE_THRESHOLD}）"
            echo "- マージ方針: \`${MERGE_POLICY}\`"
            if [ -n "$RELAXED_REASONS" ]; then
              echo ""
              echo "変更カテゴリに該当しましたが、\`merge-policy: relaxed\` のため自動マージは止めません（#2775）。"
              echo ""
              echo "$RELAXED_REASONS"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  review-provider:
    # 実装担当を優先する（#4037）。共通設定の変更で既存Issueの担当を入れ替えない。
    needs: [identify-issue, risk-check]
    if: github.event.pull_request.draft == false && needs.risk-check.outputs.needs-review == 'true'
    runs-on: ubuntu-latest
    outputs:
      provider: ${{ steps.provider.outputs.provider }}
    steps:
      - name: 実装担当からレビュー担当を取得する
        id: provider
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.identify-issue.outputs.number }}
        run: |
          set -euo pipefail
          if [ -z "$ISSUE_NUMBER" ]; then
            # 実装Issueを持たないPRだけは共通設定を使用する。取得失敗は推測しない。
            echo "対応IssueがないPRのため共通のレビュー設定を使います"
            RESPONSE="$(curl -fsS --max-time 10 "${APP_BASE_URL%/}/api/settings/claude-model")"
            provider="$(jq -r '.aiExecutionProvider' <<< "$RESPONSE")"
          else
            [ -n "$APP_BASE_URL" ] && [ -n "$PROGRESS_REPORT_SECRET" ] || {
              echo "::error::実装担当の取得に必要な接続設定がありません"; exit 1;
            }
            BODY="$(jq -nc --arg repository "$REPOSITORY" --argjson issueNumber "$ISSUE_NUMBER" '{action:"resolve",repository:$repository,issueNumber:$issueNumber}')"
            RESPONSE="$(curl -fsS --max-time 15 -X POST "${APP_BASE_URL%/}/api/dispatch/implementation-provider" \
              -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" -H 'Content-Type: application/json' --data "$BODY")" || {
              echo "::error::実装担当が不明、または取得できません。共通設定へ切り替えず停止します"; exit 1;
            }
            provider="$(jq -r '.provider' <<< "$RESPONSE")"
          fi
          case "$provider" in claude|codex) ;; *) echo "::error::レビュー担当が不正です"; exit 1 ;; esac
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "レビュー担当: $provider（実装Issue: ${ISSUE_NUMBER:-なし}）" >> "$GITHUB_STEP_SUMMARY"

  review-provider-fallback:
    needs: [identify-issue, review-provider]
    if: always() && needs.review-provider.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: 担当を解決できない理由をPRへ通知する
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body '⚠️ 実装担当を特定できなかったため、PRレビューと自動マージを停止しました。実装セッションの記録・Issue番号・IssueDeck APIの接続状態を確認し、review-providerジョブを再実行してください。共通設定のエージェントへは切り替えていません。'

  claude-review:
    # risk-checkがレビュー要と判定した場合のみ実行する(#992)。
    # スキップされた場合、auto-mergeはclaude-reviewの結果を'skipped'として許容する
    needs: [identify-issue, risk-check, review-provider]
    if: github.event.pull_request.draft == false && needs.risk-check.outputs.needs-review == 'true' && needs.review-provider.outputs.provider == 'claude'
    runs-on: ubuntu-latest
    outputs:
      # Claudeが実際に走ったか(#2448)。claude-code-actionには「ワークフローファイルの内容が
      # デフォルトブランチと完全一致していなければClaudeの実行だけをスキップする」検証機構が
      # あり、`.github/workflows/`配下を変更するPRでは**このジョブはClaudeを実行しないまま
      # successで終わる**(このファイル冒頭の説明を参照)。auto-mergeが「判定を取得できなかった」と
      # 「そもそも実施していない」を取り違えないよう、実行の有無をここから渡す。
      executed: ${{ steps.claude_review.outputs.execution_file != '' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: プロンプトの取得元をissue-deck側にする（prompts-ref指定時）
        # 共有ワークフローはcaller側リポジトリをcheckoutするため、.github/prompts/配下も
        # caller側のものが読まれる。プロンプトを各リポジトリへコピーせずに共有するための
        # 取得経路（reusable-issue-dispatch.ymlと同じ仕組み、#960）。
        if: inputs.prompts-ref != ''
        uses: actions/checkout@v4
        with:
          repository: guchi-apps/issue-deck
          ref: ${{ inputs.prompts-ref }}
          path: .shared-prompts
          fetch-depth: 1
          persist-credentials: false

      - name: 共有ファイルの参照先を決める
        # 呼び出し元リポジトリに存在しうる/しないファイルの場所を1箇所で決める（#960・#964）。
        env:
          PROMPTS_REF: ${{ inputs.prompts-ref }}
        run: |
          set -euo pipefail
          if [ -n "$PROMPTS_REF" ]; then
            ROOT=.shared-prompts
          else
            ROOT=.
          fi

          DIR="$ROOT/.github/prompts"
          if [ ! -d "$DIR" ]; then
            echo "::error::プロンプトのディレクトリ $DIR が存在しません。他リポジトリから呼ぶ場合は prompts-ref に uses: と同じタグを指定してください"
            exit 1
          fi
          echo "プロンプトの参照先: $DIR"
          echo "PROMPTS_DIR=$DIR" >> "$GITHUB_ENV"

          # 使用量出力スクリプト(#903)。プロンプトと違い必須ではないため、無くても落とさない。
          USAGE="$ROOT/.github/scripts/summarize-claude-usage.sh"
          if [ -x "$USAGE" ]; then
            echo "使用量出力スクリプト: $USAGE"
          else
            echo "使用量出力スクリプト $USAGE が無いため、使用量のJob Summary出力はスキップします"
            USAGE=""
          fi
          echo "CLAUDE_USAGE_SCRIPT=$USAGE" >> "$GITHUB_ENV"

      - name: 共有知識リポジトリの所有者とリポジトリ名を分解する
        # 次のトークン発行ステップのowner・repositoriesは別々の入力だが、ワークフローの式には
        # 文字列を分割する関数が無い（format/join/fromJSONだけ）。checkoutが読む
        # vars.SHARED_CONTEXT_REPO（`owner/repo`形式）を唯一の正のまま使うため、ここで割る（#2388）。
        id: shared-context-target
        env:
          SHARED_CONTEXT_REPO: ${{ vars.SHARED_CONTEXT_REPO || 'guchi-apps/docs' }}
        run: |
          set -euo pipefail
          echo "owner=${SHARED_CONTEXT_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${SHARED_CONTEXT_REPO##*/}" >> "$GITHUB_OUTPUT"

      - name: 共有知識リポジトリ用のインストールトークンを発行する
        # 共有知識は**別リポジトリ**（guchi-apps/docs）にあり、#835で入れたトークンは既定の
        # スコープ（実行中のリポジトリだけ）のため読めない。そのリポジトリだけを対象にした
        # トークンをもう1本発行して、この用途に残っていたsecrets.WORKFLOW_PATを置き換える（#2388）。
        #
        # - owner・repositoriesを渡すとインストールの中でそのリポジトリだけへ絞られる。
        #   issue-deckのAppはrepository_selection: allでインストールされているため到達できる。
        # - permission-contents: read だけを要求する。ここでするのは読み取りのみ。
        # - continue-on-error: true。共有知識は「あれば精度が上がる」補助情報で、発行の失敗で
        #   ジョブを落としてはいけない。失敗してもoutputs.tokenは空のままなので、下のcheckoutは
        #   従来どおりsecrets.WORKFLOW_PATへ落ちる（#835のフォールバックと同じ形）。
        id: shared-context-token
        if: ${{ vars.WORKFLOW_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ steps.shared-context-target.outputs.owner }}
          repositories: ${{ steps.shared-context-target.outputs.repo }}
          permission-contents: read

      - name: 共有知識リポジトリをcheckoutする
        # レビュー観点の1つである「共有知識との整合性」に使う(docs/shared-knowledge.md)。
        # 共有知識へ格上げするかどうかの判定はここでは行わない(#2029)。
        # checkoutに失敗してもレビュー自体は続行する(continue-on-error)。
        # tokenは上で発行した共有知識リポジトリ用のインストールトークンで、未登録・発行失敗時は
        # 従来のsecrets.WORKFLOW_PATへ落ちる(#2388)。
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SHARED_CONTEXT_REPO || 'guchi-apps/docs' }}
          ref: ${{ vars.SHARED_CONTEXT_REF || 'main' }}
          path: .shared-context
          fetch-depth: 1
          persist-credentials: false
          token: ${{ steps.shared-context-token.outputs.token || secrets.WORKFLOW_PAT }}

      - name: レビュープロンプトを組み立てる
        # プロンプト本文は.github/prompts/review-develop.mdに置き、ここで動的な値を埋めたうえで
        # 環境変数に格納する（reusable-issue-dispatch.ymlと同じ仕組み、#907）。
        # `${{ }}`を含む文字列ブロックにかかる21,000バイト上限を構造的に回避する（#901の経路）。
        env:
          ISSUE_NUMBER: ${{ needs.identify-issue.outputs.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          # 判定マーカー(<!-- issue-deck-review-verdict:merge-blocked sha=... -->)に
          # 埋め込むhead SHA(#2136)。auto-mergeジョブは今回レビューしたコミットの
          # マーカーだけを見るため、過去のpushで投稿されたマーカーを拾わない
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # 意味的判定の基準を切り替える(#2775)。プロンプト側がstrict/relaxedの両方の
          # 振る舞いを持っており、ここで渡した値の側だけを適用する。
          MERGE_POLICY: ${{ inputs.merge-policy }}
        run: |
          set -euo pipefail
          PROMPT_FILE="${PROMPTS_DIR:-.github/prompts}/review-develop.md"
          # プロンプトが空のままclaude-code-actionへ渡ると、エージェントが何をすべきか分からないまま
          # 走り出してしまう。ファイルの取り違え・削除に気付けるよう、ここで明示的に落とす。
          if [ ! -s "$PROMPT_FILE" ]; then
            echo "::error::$PROMPT_FILE が存在しないか空です"
            exit 1
          fi
          {
            echo 'PROMPT_REVIEW<<__ISSUE_DECK_PROMPT_EOF__'
            MERGE_POLICY="${MERGE_POLICY:-strict}" \
              envsubst '${ISSUE_NUMBER} ${PR_NUMBER} ${REPOSITORY} ${HEAD_SHA} ${MERGE_POLICY}' < "$PROMPT_FILE"
            echo '__ISSUE_DECK_PROMPT_EOF__'
          } >> "$GITHUB_ENV"

      - name: PRレビュー・修復用のClaudeモデルを取得する
        id: workflow_model
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          model=auto
          if [ -n "$APP_BASE_URL" ]; then model="$(curl -fsS --max-time 5 "${APP_BASE_URL%/}/api/settings/claude-model" 2>/dev/null | jq -r '.workflowClaudeModel // "auto"' || true)"; fi
          case "$model" in auto|fable|opus|sonnet|haiku) ;; *) model=auto ;; esac
          [ "$model" = auto ] && echo 'claude_args=' >> "$GITHUB_OUTPUT" || echo "claude_args=--model $model" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude_review
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 本運用ではPRをclaude[bot]（Claude CodeのGitHub App）が作成するため、
          # claude-code-actionの非人間アクター拒否機構を明示的に許可する
          # (参考: https://github.com/anthropics/claude-code-action/issues/1299)
          #
          # issue-deck[bot]も必須(#835)。実装エージェントのPR作成をGitHub Appの
          # インストールトークンで行うようにしたため、pull_requestイベントの
          # github.actorがissue-deck[bot]になる。ここに無いと、無人実行が作った
          # develop向けPRの自動レビューだけが必ず落ちる(他4ワークフローは
          # 元からissue-deck[bot]を含んでいた)。
          allowed_bots: "claude[bot],issue-deck[bot]"
          additional_permissions: |
            actions: read
          # Read/Grep/Globは、レビュー観点「共有知識との整合性」のために.shared-context/配下を
          # 読む用途で追加している。gh issue viewは対応Issueの本文・コメントの取得に使う。
          # gh pr diff/view/checksは、レビューの起点となる差分の取得とCI結果の確認に使う(#906)。
          # **gh issue editは渡さない**(#2136)。このジョブはラベルを付けない役割になったため、
          # プロンプトの指示だけでなく道具の側でも付けられないようにしておく。
          #
          # **gh pr commentは必須**(#2488)。プロンプトは「レビュー結果をPRへのコメントとして
          # 投稿する」ことと「末尾に総評の判定マーカーを付ける」ことを求めている(#2448)のに、
          # ここに無かったため**レビュー結果がどこにも残っていなかった**。直近50件のマージ済み
          # develop向けPRにレビューのコメントは1件も無く、PR本文の`## 検証結果`は
          # `review=unavailable`（判定を取得できませんでした）、リリースPRの表も全行が
          # 「記録なし」になっていた。prompt modeのclaude-code-actionは結果を自分では投稿しない。
          claude_args: '${{ steps.workflow_model.outputs.claude_args }} --allowedTools "Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Read,Grep,Glob"'
          prompt: ${{ env.PROMPT_REVIEW }}

      # レビュー結果がPRへ残らないまま終わるのを塞ぐ(#2488)。上でallowedToolsへ
      # `gh pr comment`を足したので通常は本体が投稿するが、**投稿できていないことに誰も
      # 気付けない**のがこの経路の弱点だった(道具が無いあいだ、PR本文には
      # 「判定を取得できませんでした」とだけ書かれ、リリースPRの表は全行が「記録なし」に
      # なっていた)。投稿が無ければ、実行ログ(execution_file)に残る最後の応答を転記する。
      #
      # - **判定マーカーは足さない。** 応答に含まれていればそのまま残るだけで、
      #   こちらで`lgtm`等を書くと、レビューしていない判定を作ることになる
      # - execution_fileのJSON構造はclaude-code-actionの内部実装で、変わりうる
      #   (`summarize-claude-usage.sh`と同じ前提)。取り出せなければ何もしない
      - name: レビュー結果がPRに無ければ転記する
        if: always() && steps.claude_review.outputs.execution_file != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXECUTION_FILE: ${{ steps.claude_review.outputs.execution_file }}
        run: |
          set -uo pipefail

          POSTED="$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' \
            | grep -cE "issue-deck-review-verdict:(lgtm|needs-check|changes-requested) sha=${HEAD_SHA}|issue-deck-review-report sha=${HEAD_SHA}" || true)"
          if [ "${POSTED:-0}" -gt 0 ]; then
            echo "レビュー結果は既にPRへ投稿されています"
            exit 0
          fi

          # 最後のassistantメッセージ＝投稿しようとしたレビュー本文
          TEXT="$(jq -r '
            [ .[] | select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text ]
            | last // ""' "$EXECUTION_FILE" 2>/dev/null || true)"
          if [ -z "$TEXT" ]; then
            echo "::warning::レビュー結果をPRから読めず、実行ログからも取り出せませんでした"
            exit 0
          fi

          TMP="${RUNNER_TEMP:-/tmp}/review-report.md"
          {
            echo "🤖 **自動レビューの結果**（レビュー本体が投稿できなかったため、ワークフローが実行ログから転記しました）"
            echo
            # PRコメントの上限は65,536文字。転記は補助なので、長ければ切ってログへ誘導する
            printf '%s\n' "$TEXT" | awk -v maxlines=400 -v maxchars=30000 '
              NR > maxlines || chars + length($0) + 1 > maxchars { truncated = 1; exit }
              { chars += length($0) + 1; print }
              END { if (truncated) print "\n（長いため以降を省略しました。全文はActionsの実行ログにあります）" }
            '
            echo
            echo "<!-- issue-deck-source:claude-review-develop -->"
            echo "<!-- issue-deck-review-report sha=${HEAD_SHA} -->"
          } > "$TMP"
          gh pr comment "$PR_NUMBER" --body-file "$TMP"
          echo "レビュー結果をPRへ転記しました"

      - name: Claude使用量をJob Summaryに出力する（Run Claude Code Review）
        # トークン使用量・ターン数・権限拒否を可視化する(#903)。計測は補助情報のため、
        # 失敗しても本来の処理に影響させない(スクリプト側で常にexit 0する)。
        #
        # ISSUE_NUMBER・PR_NUMBERはこれまで渡していなかったため、使用量の明細が常に
        # 「（Issue未特定）」になっていた(#2650)。identify-issueはブランチ名issue-<番号>から
        # 対応Issue番号を取れているので、それを渡す。取れない場合（変則的なブランチ名）は
        # PR_NUMBERで代替する。
        if: always() && steps.claude_review.outputs.execution_file != ''
        env:
          AI_USAGE_REPORT_URL: ${{ vars.APP_BASE_URL }}/api/dispatch/actions-usage
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          ISSUE_NUMBER: ${{ needs.identify-issue.outputs.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # スクリプトが解決できていない場合はスキップする(#964)。使用量は補助情報であり、
          # 呼び出し元にスクリプトが無いことで本来の処理を失敗させない。
          if [ -z "${CLAUDE_USAGE_SCRIPT:-}" ]; then
            echo "使用量出力スクリプトが無いためスキップします"
            exit 0
          fi
          "$CLAUDE_USAGE_SCRIPT" "Run Claude Code Review" "${{ steps.claude_review.outputs.execution_file }}"

  codex-review:
    # APIキー課金のCodex Actionは使わず、サブPCでChatGPTサブスクリプションにログイン済みの
    # Codex CLIでレビューする（#3917）。**このジョブは依頼を積んで終わる**——結果は待たない（#3990）。
    # かつてはPRコメントへ要求印を投稿し、結果コメントが付くまで最大30分ポーリングしていたが、
    # 状態の正本をIssueDeckのDispatchJob（`PR_REVIEW`）へ移した。サブPCが実行して結果を報告すると、
    # IssueDeckがこのrunの`auto-merge`ジョブだけを再実行して最終マージ判定を再開する。
    # 依頼そのものができなかった（実行できるサブPCが無い・IssueDeckへ届かない）場合は、30分待たずに
    # ここで失敗させ、auto-mergeを止める安全側のfailureにする（codex-review-fallbackが理由を伝える）。
    #
    # **実装担当がClaudeでも、Claudeを実行できなかったワークフロー変更PRには依頼する**（#4149）。
    # claude-code-actionの検証機構で意味的レビューが省かれたPRに、Claude以外の経路でAIの判定を付ける
    # （Codex CLIはこの検証機構の対象外）。Claudeが実際に走ったかを見てから決めるため、この場合だけ
    # claude-reviewの完了を待つ（検証機構によるスキップは数十秒で終わる）。
    # この代替レビュー（MODE=workflow-change）では、依頼できなくても失敗させない。`requested=false`を
    # 返してauto-mergeへ渡し、#4144と同じく`00.check-user`＋`01.check-merge`で人へ回す——代替レビューが
    # 無いことは「止まっている」ではなく「人が見れば進められる」状態で、配布先からサブPCへ届かない
    # リポジトリでも#4144以前より悪くならないようにするため。
    needs: [identify-issue, risk-check, review-provider, claude-review]
    if: >-
      !cancelled()
      && github.event.pull_request.draft == false
      && needs.risk-check.outputs.needs-review == 'true'
      && needs.review-provider.result == 'success'
      && (needs.review-provider.outputs.provider == 'codex'
        || (needs.review-provider.outputs.provider == 'claude'
          && inputs.workflow-change-policy == 'confirm'
          && needs.risk-check.outputs.workflow-changed == 'true'
          && needs.claude-review.result == 'success'
          && needs.claude-review.outputs.executed != 'true'))
    runs-on: ubuntu-latest
    outputs:
      reason: ${{ steps.request.outputs.reason }}
      # 依頼を積めたか（#4149）。代替レビューで依頼できなかったときだけ false になる
      requested: ${{ steps.request.outputs.requested }}
    permissions:
      pull-requests: read
    steps:
      - name: CodexレビューをサブPCへ依頼する（結果は待たない）
        id: request
        env:
          MODE: ${{ needs.review-provider.outputs.provider == 'codex' && 'primary' || 'workflow-change' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_ID: ${{ github.run_id }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
        run: |
          set -uo pipefail
          fail() {
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            if [ "${MODE:-primary}" = "workflow-change" ]; then
              # 代替レビューは依頼できなくても失敗させない（auto-mergeが#4144の扱いで人へ回す）
              echo "requested=false" >> "$GITHUB_OUTPUT"
              echo "::warning::$1"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }
          # 移行前の実装がこのHEADへ投稿済みの結果があれば、積み直さずそれを使う（二重に実行しない）。
          if gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' \
            | grep -qE "issue-deck-codex-review-verdict:(lgtm|needs-check|changes-requested) sha=${HEAD_SHA}"; then
            echo "このHEADのCodexレビュー結果が既にPRにあるため、依頼しません。"
            echo "requested=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "${MODE:-primary}" = "primary" ] \
            || echo "Claudeを実行できなかったワークフロー変更PRのため、代わりにCodexレビューを依頼します（#4149）。"
          [ -n "$APP_BASE_URL" ] && [ -n "$PROGRESS_REPORT_SECRET" ] \
            || fail "APP_BASE_URL / PROGRESS_REPORT_SECRET が未設定のため、Codexレビューを依頼できません"
          BODY="$(jq -n --arg repository "$GH_REPO" --argjson pr "$PR_NUMBER" --arg head "$HEAD_SHA" \
            --arg base "$BASE_SHA" --arg run "$RUN_ID" \
            '{action:"request", repository:$repository, pullRequest:$pr, headSha:$head, baseSha:$base, agent:"codex", runId:$run}')"
          RESPONSE="$(mktemp)"
          CODE="$(curl -sS -m 30 -o "$RESPONSE" -w '%{http_code}' \
            -X POST "${APP_BASE_URL%/}/api/dispatch/pr-review" \
            -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
            -H "Content-Type: application/json" -d "$BODY")" || CODE=000
          MESSAGE="$(jq -r '.message // empty' "$RESPONSE" 2>/dev/null || true)"
          if [ "$CODE" != "200" ]; then
            fail "Codexレビューを依頼できませんでした（HTTP ${CODE}）${MESSAGE:+: ${MESSAGE}}"
          fi
          echo "requested=true" >> "$GITHUB_OUTPUT"
          echo "Codexレビューを依頼しました: $(jq -r '.state' "$RESPONSE")（${MESSAGE}）"

  claude-review-fallback:
    # wait-for-ciをneedsに入れているのは、このジョブも00.check-userを付けるため(#2136)。
    # CIが実行中のうちに付けると、auto-merge経由と同じく時期尚早の通知になる。
    # wait-for-ciはCIのconclusionを見ずcompletedで抜け、タイムアウトしても成功する(fail-open)
    # ので、レビュー失敗の通知がこの待機で失われることはない。
    needs: [identify-issue, wait-for-ci, risk-check, claude-review]
    if: always() && needs.claude-review.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      # claude-reviewが失敗するとauto-mergeはスキップされ、そこへ移した機械的リスク判定の
      # 反映ステップ(#1406)ごと落ちる。00.check-user自体はこのジョブが付けるので保留は
      # 担保されるが、理由だけが消えてしまうため、該当していればここで一緒に伝える。
      - name: 自動レビュー失敗をPRに通知する
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ needs.identify-issue.outputs.number }}
          RISKY: ${{ needs.risk-check.outputs.risky }}
          REASONS: ${{ needs.risk-check.outputs.reasons }}
        run: |
          set -e
          gh pr comment "$PR_NUMBER" --body "⚠️ 自動レビュー（claude-review）が実行できませんでした。Actionsの実行ログを確認してください。安全のため自動マージはスキップされます。"
          if [ -n "$ISSUE_NUMBER" ]; then
            REASON_LABEL="01.check-blocked"
            # 展開先リポジトリにラベル自体が定義されていない場合でもこのステップを落とさないよう、
            # 付与・除去の前にリポジトリのラベル一覧と突き合わせる(#975)。理由ラベル(#1490)は常に1枚
            # なので、定義済みの他の理由ラベルは同じ呼び出しで外す。
            DEFINED_LABELS="$(gh label list --json name --jq '.[].name' --limit 200)"
            LABEL_ARGS=()
            for name in "00.check-user" "$REASON_LABEL"; do
              if grep -qx "$name" <<<"$DEFINED_LABELS"; then
                LABEL_ARGS+=(--add-label "$name")
              else
                echo "::warning::ラベル '$name' がリポジトリに存在しないため付与をスキップします"
              fi
            done
            for name in 01.check-plan 01.check-input 01.check-merge 01.check-blocked 01.check-answered 00.qa-answered; do
              if [ "$name" != "$REASON_LABEL" ] && grep -qx "$name" <<<"$DEFINED_LABELS"; then
                LABEL_ARGS+=(--remove-label "$name")
              fi
            done
            if [ "${#LABEL_ARGS[@]}" -gt 0 ]; then
              gh issue edit "$ISSUE_NUMBER" "${LABEL_ARGS[@]}"
            fi
            # 理由は必ず「見出し語 + 箇条書き」の形で書く。issue-deckのIssue詳細
            # (src/lib/merge-check-reasons.ts)がこの形からしか理由を取り出せず、
            # 散文だけのコメントは「理由の記録が見つかりませんでした」になる(#2062)。
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            COMMENT_BODY="⚠️ 以下の理由により、developへのマージ前にユーザーの確認が必要です。"
            COMMENT_BODY="$COMMENT_BODY"$'\n\n'"- 自動レビュー（claude-review）が実行できなかったため（安全のため自動マージはスキップされます）"
            if [ "$RISKY" = "true" ]; then
              COMMENT_BODY="$COMMENT_BODY"$'\n'"$REASONS"
            fi
            COMMENT_BODY="$COMMENT_BODY"$'\n\n'"実行ログ: ${RUN_URL}"
            COMMENT_BODY="$COMMENT_BODY"$'\n\n<!-- issue-deck-source:claude-review-develop -->'
            gh issue comment "$ISSUE_NUMBER" --body "$COMMENT_BODY"
          fi

  codex-review-fallback:
    needs: [identify-issue, wait-for-ci, risk-check, codex-review]
    if: always() && needs.codex-review.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Codexレビュー失敗を通知してマージを保留する
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ needs.identify-issue.outputs.number }}
          CODEX_FAILURE_REASON: ${{ needs.codex-review.outputs.reason }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body "⚠️ Codexによる自動レビューを依頼できませんでした${CODEX_FAILURE_REASON:+（${CODEX_FAILURE_REASON}）}。サブPCの状態とActionsの実行ログを確認してください。安全のため自動マージはスキップされます。"
          [ -n "$ISSUE_NUMBER" ] || exit 0
          DEFINED_LABELS="$(gh label list --json name --jq '.[].name' --limit 200)"
          LABEL_ARGS=()
          for name in 00.check-user 01.check-blocked; do
            grep -qx "$name" <<<"$DEFINED_LABELS" && LABEL_ARGS+=(--add-label "$name")
          done
          for name in 01.check-plan 01.check-input 01.check-merge 01.check-answered 00.qa-answered; do
            grep -qx "$name" <<<"$DEFINED_LABELS" && LABEL_ARGS+=(--remove-label "$name")
          done
          [ "${#LABEL_ARGS[@]}" -eq 0 ] || gh issue edit "$ISSUE_NUMBER" "${LABEL_ARGS[@]}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY="⚠️ 以下の理由により、developへのマージ前にユーザーの確認が必要です。"
          BODY="$BODY"$'\n\n- Codexによる自動レビューを依頼できなかったため（安全のため自動マージはスキップされます）'
          [ -z "$CODEX_FAILURE_REASON" ] || BODY="$BODY"$'\n'"  - ${CODEX_FAILURE_REASON}"
          BODY="$BODY"$'\n\n'"実行ログ: ${RUN_URL}"$'\n\n<!-- issue-deck-source:codex-review-develop -->'
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"

  auto-merge:
    needs: [identify-issue, wait-for-ci, risk-check, review-provider, claude-review, codex-review]
    # **Codexレビューの結果はここで待たない**（#3990）。codex-reviewは依頼を積むだけで、auto-mergeは
    # IssueDeckのDispatchJobの状態をその場で読む。結果が出ていなければ判定を保留して終わり、
    # レビュー完了の報告を受けたIssueDeckがこのジョブだけを再実行して判定を再開する。
    # claude-reviewはrisk-checkの判定次第でskipされる(#992)。needsの既定動作では
    # 依存ジョブがskipされると後続もskipされてしまうため、条件を明示的に組み立てて
    # 「claude-reviewがsuccessまたはskipped」を許容する。
    # 逆に、claude-reviewやrisk-checkがfailureのときは従来どおり自動マージを行わない
    # (レビュー結果が得られていない状態でマージしないための安全側の挙動)。
    # identify-issueはdraft PRのときにskipされるため、successを要求することで
    # draft PRに対する自動マージも従来どおり行われない。
    # wait-for-ciの結果は条件に入れない(#2066)。CI完了待ちは通知のタイミングを揃えるための
    # ものでマージの安全性はGitHub Auto-merge機能が担保しており、待機ジョブの失敗で
    # 自動マージごと止めるとレビュー済みのPRが誰にも拾われないまま残るため(fail-open)。
    # always()ではなく!cancelled()を使うのは、always()がワークフローのキャンセル時にも
    # ジョブを実行してしまうため。本ワークフローは新しいpushが来ると古い実行を
    # concurrencyで丸ごとキャンセルする(#818)ので、always()にすると
    # supersededになった古い実行がauto-mergeを有効化してしまう。
    if: >-
      !cancelled()
      && inputs.enable-auto-merge
      && github.event.pull_request.draft == false
      && needs.identify-issue.result == 'success'
      && needs.risk-check.result == 'success'
      && (needs.risk-check.outputs.needs-review != 'true' || needs.review-provider.result == 'success')
      && (needs.claude-review.result == 'success' || needs.claude-review.result == 'skipped')
      && (needs.codex-review.result == 'success' || needs.codex-review.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # 両判定の結果(00.check-user・理由コメント)をここで反映するため(#1406・#2136)
      issues: write
    steps:
      - name: GitHub Appのインストールトークンを発行する
        # 期限切れが単一障害点になるsecrets.WORKFLOW_PATを、1時間で失効するインストールトークンへ
        # 置き換える(#835。仕組みの詳細はreusable-issue-dispatch.ymlの同名ステップと
        # docs/actions-token-model.mdを参照)。vars.WORKFLOW_APP_IDが未登録ならこのステップは
        # skipされ、使用箇所は`|| secrets.WORKFLOW_PAT`で従来のPATへ落ちる。
        # permission-*は、このワークフローが実際に使う権限だけへ絞るために付けている。
        id: app-token
        if: ${{ vars.WORKFLOW_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      # 両判定(機械的リスク判定=risk-check・意味的判定=claude-review)の結果を、ワークフローの
      # 最後のジョブであるここで反映する(#1406・#2136)。判定したジョブがその場で付けると、
      # そのあとに走るジョブのcheck-runが残ったまま通知だけが飛び、issue-deckの画面では
      # CI実行中・判定中としてマージボタンが押せない。
      # 付与の直後に下のステップがラベルを読み直すので、自動マージ可否の判定は従来どおり
      # 「ラベルが付いていればスキップ」で成立する。
      #
      # トークンは github.token を使う(マージ実行のステップだけワークフロー用トークン)。
      # ラベル付与・コメント投稿の名義を従来のgithub-actions[bot]から変えないため
      # (docs/attribution.md)。
      # Codexレビューの状態を、IssueDeckのDispatchJobから読む（#3990）。**状態の正本はDispatchJob**で、
      # PRコメントのverdict markerは結果の記録（移行前のPRのためのフォールバックとして読む）。
      # 結果（`result`）は次のどれか。
      #   skipped … Codexレビューを要求していない（低リスクで省略・Claudeモード）
      #   success … 判定が出ている（`verdict`にlgtm / needs-check / changes-requested）
      #   pending … キュー待ち・実行中。判定を保留し、完了後にこのジョブが再実行される
      #   stale   … PRのHEADが進んだ。この結果では判定しない（新しいHEADのrunが判定する）
      #   failed  … 失敗・時間切れ・不正出力・取得不能。**自動マージせず人へ渡す**（`reason`）
      - name: Codexレビューの状態を取得する
        id: codex
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CODEX_JOB_RESULT: ${{ needs.codex-review.result }}
          CODEX_REQUESTED: ${{ needs.codex-review.outputs.requested }}
          CODEX_REQUEST_REASON: ${{ needs.codex-review.outputs.reason }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
        run: |
          set -uo pipefail
          emit() {
            {
              echo "result=$1"
              echo "verdict=${2:-}"
              printf 'reason=%s\n' "$(printf '%s' "${3:-}" | tr '\n' ' ')"
            } >> "$GITHUB_OUTPUT"
            echo "Codexレビューの状態: $1 ${2:-} ${3:-}"
            exit 0
          }
          if [ "$CODEX_JOB_RESULT" != "success" ]; then
            emit skipped
          fi
          # ワークフロー変更PRの代替レビューを依頼できなかった（#4149）。判定は無いので skipped とし、
          # 依頼できなかった理由だけを渡す（マージ保留の判定が#4144の扱いで人へ回す）。
          # 出力が空（この出力を持たない版のrun）は依頼済みとして扱う
          if [ "${CODEX_REQUESTED:-}" = "false" ]; then
            emit skipped "" "${CODEX_REQUEST_REASON:-}"
          fi
          CURRENT_HEAD="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq .head.sha 2>/dev/null || true)"
          if [ -n "$CURRENT_HEAD" ] && [ "$CURRENT_HEAD" != "$HEAD_SHA" ]; then
            emit stale
          fi
          MARKER_VERDICT="$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' 2>/dev/null \
            | grep -oE "issue-deck-codex-review-verdict:(lgtm|needs-check|changes-requested) sha=${HEAD_SHA}" \
            | tail -n 1 | sed -E 's/^.*verdict:([a-z-]+) sha=.*$/\1/' || true)"
          if [ -z "$APP_BASE_URL" ] || [ -z "$PROGRESS_REPORT_SECRET" ]; then
            [ -z "$MARKER_VERDICT" ] || emit success "$MARKER_VERDICT"
            emit failed "" "APP_BASE_URL / PROGRESS_REPORT_SECRET が未設定のため、Codexレビューの状態を取得できません"
          fi
          BODY="$(jq -n --arg repository "$GH_REPO" --argjson pr "$PR_NUMBER" --arg head "$HEAD_SHA" \
            '{action:"status", repository:$repository, pullRequest:$pr, headSha:$head, agent:"codex"}')"
          RESPONSE="$(mktemp)"
          CODE="$(curl -sS -m 30 -o "$RESPONSE" -w '%{http_code}' \
            -X POST "${APP_BASE_URL%/}/api/dispatch/pr-review" \
            -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
            -H "Content-Type: application/json" -d "$BODY")" || CODE=000
          if [ "$CODE" != "200" ]; then
            [ -z "$MARKER_VERDICT" ] || emit success "$MARKER_VERDICT"
            emit failed "" "IssueDeckからCodexレビューの状態を取得できませんでした（HTTP ${CODE}）"
          fi
          STATE="$(jq -r '.state // empty' "$RESPONSE")"
          case "$STATE" in
            done) emit success "$(jq -r '.verdict // empty' "$RESPONSE")" ;;
            pending) emit pending "" "$(jq -r '.message // empty' "$RESPONSE")" ;;
            stale) emit stale ;;
            failed) emit failed "" "$(jq -r '.reason // "レビューが失敗しました"' "$RESPONSE")" ;;
            missing)
              [ -z "$MARKER_VERDICT" ] || emit success "$MARKER_VERDICT"
              emit failed "" "Codexレビューのジョブが見つかりません（依頼が届いていません）"
              ;;
            *) emit failed "" "Codexレビューの状態を読み取れませんでした" ;;
          esac

      - name: マージ保留の判定を反映する
        id: hold
        if: needs.identify-issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.identify-issue.outputs.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RISKY: ${{ needs.risk-check.outputs.risky }}
          REASONS: ${{ needs.risk-check.outputs.reasons }}
          ALREADY_CHECK_USER: ${{ needs.risk-check.outputs.already-check-user }}
          REVIEW_RESULT: ${{ needs.claude-review.result }}
          REVIEW_EXECUTED: ${{ needs.claude-review.outputs.executed }}
          WORKFLOW_CHANGED: ${{ needs.risk-check.outputs.workflow-changed }}
          WORKFLOW_CHANGE_POLICY: ${{ inputs.workflow-change-policy }}
          CODEX_REVIEW_RESULT: ${{ steps.codex.outputs.result }}
          CODEX_VERDICT_INPUT: ${{ steps.codex.outputs.verdict }}
          CODEX_FAILURE_REASON: ${{ steps.codex.outputs.reason }}
          REVIEW_AUTO_FIX: ${{ inputs.review-auto-fix }}
        run: |
          set -e

          # 意味的判定(claude-review)の結果は、レビューが対応Issueへ投稿した理由コメントの
          # 末尾のマーカーから読む(#2136)。マーカーの文字列はレビュープロンプト
          # (.github/prompts/review-develop.md)と対で、ずれるとここが黙って
          # 「該当なし」に倒れるため、scripts/check-review-verdict-marker.sh がCIで突き合わせる。
          #
          # - claude-reviewがskip(#992のゲート)・失敗した実行では読まない。前者は判定自体が
          #   無く、後者はclaude-review-fallbackがラベルを付けるため
          # - sha=で今回のhead SHAに絞る。追いコミットしたPRで、前のコミットに対する判定の
          #   マーカーを拾わないため
          # - マーカーが無ければ「該当なし」に倒す(fail-open)。Claudeが判定を残せなかった場合の
          #   挙動は、ラベルを自分で付けていた頃(付け忘れれば同じく自動マージされる)と変わらない
          REVIEW_BLOCKED=false
          if [ "$REVIEW_RESULT" = "success" ]; then
            VERDICT_MARKER="<!-- issue-deck-review-verdict:merge-blocked sha=${HEAD_SHA} -->"
            # 取得に失敗したらステップごと落とす(set -e)。auto-merge-fallbackが
            # 00.check-userを付けるので、判定を読めないまま自動マージされることはない
            ISSUE_COMMENTS="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments[].body')"
            if printf '%s' "$ISSUE_COMMENTS" | grep -qF "$VERDICT_MARKER"; then
              REVIEW_BLOCKED=true
              echo "claude-reviewが自動マージ不可と判定しています(判定マーカーを検出)。"
            else
              echo "claude-reviewの自動マージ不可の判定マーカーはありません。"
            fi
          fi

          # Codexレビューの結果が出ていない（pending）・古いHEAD（stale）なら、**何も反映せず保留する**
          # （#3990）。ラベルもコメントも自動マージも、結果が出たあとに再実行されるこのジョブが
          # 最新のHEADに対して行う。結果待ちでrunnerを保持しないための分岐。
          if [ "$CODEX_REVIEW_RESULT" = "pending" ] || [ "$CODEX_REVIEW_RESULT" = "stale" ]; then
            echo "Codexレビューが${CODEX_REVIEW_RESULT}のため、最終マージ判定を保留します（結果が出ると再実行されます）。"
            echo "waiting=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CODEX_REVIEW_BLOCKED=false
          CODEX_REVIEW_FAILED=false
          CODEX_VERDICT=""
          if [ "$CODEX_REVIEW_RESULT" = "failed" ]; then
            # 失敗・時間切れ・不正出力は、判定が無いのと同じ。**自動マージせず人へ渡す**
            CODEX_REVIEW_BLOCKED=true
            CODEX_REVIEW_FAILED=true
            echo "Codexレビューの結果を得られませんでした: ${CODEX_FAILURE_REASON}"
          elif [ "$CODEX_REVIEW_RESULT" = "success" ]; then
            CODEX_VERDICT="${CODEX_VERDICT_INPUT:-}"
            if [ -z "$CODEX_VERDICT" ]; then
              CODEX_VERDICT="$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' \
                | grep -oE "issue-deck-codex-review-verdict:(lgtm|needs-check|changes-requested) sha=${HEAD_SHA}" \
                | tail -n 1 \
                | sed -E 's/^.*verdict:([a-z-]+) sha=.*$/\1/' || true)"
            fi
            case "$CODEX_VERDICT" in
              needs-check|changes-requested)
                CODEX_REVIEW_BLOCKED=true
                echo "Codexレビューが自動マージを保留すべきと判定しています: ${CODEX_VERDICT}"
                ;;
              lgtm) echo "CodexレビューはLGTMです。" ;;
              *)
                echo "::error::Codexレビューの判定を取得できませんでした"
                exit 1
                ;;
            esac
          fi

          # ワークフローを変更したPRでClaudeが実行されていない場合は、判定が無いまま通さず人へ回す
          # (#4144)。claude-code-actionの検証機構でジョブはsuccessのまま意味的レビューだけが
          # 省かれるため、REVIEW_BLOCKED(判定マーカー)は常にfalseになり、merge-policy: relaxedでは
          # 機械判定も意味的判定も無いままdevelopへ入っていた。
          # **merge-policyとは独立**(relaxedでも止める)。止めたくないリポジトリは
          # workflow-change-policy: allow にする。
          #
          # **代わりに依頼したCodexレビューの判定が出ていれば、それを意味的判定として使う**（#4149）。
          # lgtmなら止めず、needs-check・changes-requestedは上のCodexの判定どおりに扱う（結果待ちは
          # 上で保留済み）。依頼できなかった・完了できなかったときは、Codexの失敗（01.check-blocked）
          # ではなく#4144と同じ「人が見れば進められる」扱い（01.check-merge）にし、理由を添える。
          WORKFLOW_UNREVIEWED=false
          if [ "${WORKFLOW_CHANGE_POLICY:-confirm}" = "confirm" ] && [ "$WORKFLOW_CHANGED" = "true" ] \
            && [ "$REVIEW_RESULT" = "success" ] && [ "$REVIEW_EXECUTED" != "true" ]; then
            if [ "$CODEX_REVIEW_RESULT" = "success" ]; then
              echo "ワークフローファイルの変更でClaudeを実行できなかったため、Codexレビューの判定（${CODEX_VERDICT}）を使います。"
            else
              WORKFLOW_UNREVIEWED=true
              CODEX_REVIEW_BLOCKED=false
              CODEX_REVIEW_FAILED=false
              echo "ワークフローファイルの変更を含み、Claudeによるレビューが実行されていないため、自動マージを保留します。"
              # strictではrisk-checkの理由に同じ変更が入っているので、ここで足すのはそれが無いときだけ
              if [ "$RISKY" != "true" ]; then
                REASONS="- GitHub Actionsワークフローの変更 (.github/workflows/**) を含み、Claudeによる自動レビューを実行できなかったため（claude-code-actionの検証機構でスキップされます）。内容を人が確認してからマージしてください"
              fi
              if [ -n "${CODEX_FAILURE_REASON:-}" ]; then
                REASONS="$REASONS"$'\n'"- 代わりに依頼したCodexによる自動レビューの判定も得られなかったため"
                REASONS="$REASONS"$'\n'"  - ${CODEX_FAILURE_REASON}"
              fi
            fi
          fi

          if [ "$RISKY" != "true" ] && [ "$REVIEW_BLOCKED" != "true" ] && [ "$CODEX_REVIEW_BLOCKED" != "true" ] && [ "$WORKFLOW_UNREVIEWED" != "true" ]; then
            echo "どちらの判定にも該当しないため、00.check-userは付与しません。"
            exit 0
          fi

          # レビュー指摘の自動修正へ渡すか(#3363)。止めた理由がレビューの「要修正」だけで、
          # レビュー自身が「人の判断が要らない指摘だけ」と印を付けたときに限り、00.check-userを
          # 付けずに claude-review-fix.yml へ渡す。**印が無ければ人へ渡す(フェイルセーフ)**。
          # 渡したことはIssueへの印付きコメントで伝える。claude-review-fix.ymlはこのワークフローの
          # 完了(workflow_run)で起動し、この印がいまのheadに対して残っているときだけ着手する。
          # 条件を満たさないときは下の従来の処理(00.check-user＋01.check-merge)へ落ちる。
          if { [ "$REVIEW_BLOCKED" = "true" ] || [ "$CODEX_VERDICT" = "changes-requested" ]; } && [ "$CODEX_REVIEW_FAILED" != "true" ] && [ "$CODEX_VERDICT" != "needs-check" ] && [ "$RISKY" != "true" ] && [ "$WORKFLOW_UNREVIEWED" != "true" ] && [ "$REVIEW_AUTO_FIX" = "true" ]; then
            HANDOFF_BLOCKER=""
            AUTOFIX_MARKER="<!-- issue-deck-review-autofix:ok sha=${HEAD_SHA} -->"
            HANDOFF_MAX=2
            ISSUE_COMMENTS="$(gh issue view "$ISSUE_NUMBER" --json comments --jq ' .comments[].body')"
            HANDOFF_COUNT="$(printf '%s' "$ISSUE_COMMENTS" | grep -c "issue-deck-review-fix:handoff sha=" || true)"
            # 同じHEADでも古い安全マーカーは使わず、agentごとの最新判定に限定する。
            SAFE="$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments?per_page=100" --paginate | jq -rs --arg sha "$HEAD_SHA" --arg marker "$AUTOFIX_MARKER" '
              [.[][] | select(.body | test("issue-deck(-codex)?-review-verdict:(lgtm|needs-check|changes-requested) sha=" + $sha + " -->"))]
              | group_by(if (.body | contains("issue-deck-codex-review-verdict:")) then "codex" else "claude" end)
              | map(sort_by(.created_at) | last)
              | map(select(.body | contains("lgtm sha=" + $sha + " -->") | not))
              | length > 0 and all(.[]; (.body | contains("changes-requested sha=" + $sha + " -->")) and (.body | contains($marker)))')"
            if [ "$SAFE" != true ]; then
              HANDOFF_BLOCKER="レビューが「人の判断が要らない指摘だけ」と判定していない"
            elif gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' | grep -qxE '11\.local|00\.check-user'; then
              HANDOFF_BLOCKER="対応Issueに 11.local または 00.check-user が付いている"
            elif ! gh api "repos/${GH_REPO}/contents/.github/workflows/claude-review-fix.yml" --silent >/dev/null 2>&1; then
              HANDOFF_BLOCKER="claude-review-fix.yml がこのリポジトリに無い"
            elif [ "$(gh pr view "$PR_NUMBER" --json merged --jq .merged 2>/dev/null || echo false)" = "true" ]; then
              HANDOFF_BLOCKER="PRが既にマージされている"
            elif printf '%s' "$ISSUE_COMMENTS" | grep -qF "<!-- issue-deck-review-fix:handoff sha=${HEAD_SHA} -->"; then
              echo "handoff=true" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$HANDOFF_COUNT" -ge "$HANDOFF_MAX" ]; then
              HANDOFF_BLOCKER="自動修正を${HANDOFF_COUNT}回試みた"
              LIMIT_BODY="⚠️ レビュー指摘の自動修正を${HANDOFF_COUNT}回試みましたが、まだ「要修正」と判定されています。繰り返しを避けるため自動修正を止め、確認を待ちます。内容を確認してから、issue-deckのPR画面の「レビュー指摘を自動修正」で再実行するか、修正を依頼してください。"
              gh issue comment "$ISSUE_NUMBER" --body "$LIMIT_BODY"$'\n\n<!-- issue-deck-source:claude-review-fix -->' \
                || echo "::warning::上限到達のコメントを投稿できませんでした"
            fi

            if [ -z "$HANDOFF_BLOCKER" ]; then
              ATTEMPT=$((HANDOFF_COUNT + 1))
              BODY="🛠️ 自動レビューが「要修正」と判定しましたが、人の判断が要らない指摘だけのため、確認待ちにせず自動修正へ回します（${ATTEMPT}/${HANDOFF_MAX}回目）。直した後に再レビューされ、問題が無ければそのまま自動マージされます。"
              BODY="$BODY"$'\n\n'"指摘の内容: PR #${PR_NUMBER} のレビューコメント"
              BODY="$BODY"$'\n\n<!-- issue-deck-source:claude-review-fix -->'
              BODY="$BODY"$'\n'"<!-- issue-deck-review-fix:handoff sha=${HEAD_SHA} -->"
              gh issue comment "$ISSUE_NUMBER" --body "$BODY"
              echo "レビュー指摘の自動修正へ渡しました（${ATTEMPT}/${HANDOFF_MAX}回目）。00.check-userは付与しません。"
              echo "handoff=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "レビュー指摘の自動修正へは渡しません: ${HANDOFF_BLOCKER}"
          fi

          REASON_LABEL="01.check-merge"
          # Codexレビューが完了できなかった場合は「ユーザーの判断」ではなく「止まっている」ので、
          # 理由ラベルは01.check-blockedにする
          [ "$CODEX_REVIEW_FAILED" != "true" ] || REASON_LABEL="01.check-blocked"
          # 展開先リポジトリにラベル自体が定義されていない場合でもこのステップを落とさないよう、
          # 付与・除去の前にリポジトリのラベル一覧と突き合わせる(#975)。理由ラベル(#1490)は常に1枚
          # なので、定義済みの他の理由ラベルは同じ呼び出しで外す。
          DEFINED_LABELS="$(gh label list --json name --jq '.[].name' --limit 200)"
          LABEL_ARGS=()
          for name in "00.check-user" "$REASON_LABEL"; do
            if grep -qx "$name" <<<"$DEFINED_LABELS"; then
              LABEL_ARGS+=(--add-label "$name")
            else
              echo "::warning::ラベル '$name' がリポジトリに存在しないため付与をスキップします"
            fi
          done
          for name in 01.check-plan 01.check-input 01.check-merge 01.check-blocked 01.check-answered 00.qa-answered; do
            if [ "$name" != "$REASON_LABEL" ] && grep -qx "$name" <<<"$DEFINED_LABELS"; then
              LABEL_ARGS+=(--remove-label "$name")
            fi
          done
          if [ "${#LABEL_ARGS[@]}" -gt 0 ]; then
            gh issue edit "$ISSUE_NUMBER" "${LABEL_ARGS[@]}"
          fi
          # ここで投稿するのは機械的リスク判定(risk-check)の理由だけ。意味的判定の理由は
          # claude-review自身が投稿済みで(その末尾のマーカーを上で読んでいる)、同じ理由を
          # 二重に並べないため(#2136)。
          if [ "$RISKY" != "true" ] && [ "$CODEX_REVIEW_BLOCKED" != "true" ] && [ "$WORKFLOW_UNREVIEWED" != "true" ]; then
            echo "機械的リスク判定には該当していないため、理由コメントの投稿はclaude-review側に任せます。"
          elif [ "$CODEX_REVIEW_BLOCKED" = "true" ] && [ "$ALREADY_CHECK_USER" != "true" ]; then
            BODY="⚠️ 以下の理由により、developへのマージ前にユーザーの確認が必要と判定しました。"
            if [ "$CODEX_REVIEW_FAILED" = "true" ]; then
              BODY="$BODY"$'\n\n'"- Codexによる自動レビューを完了できなかったため（安全のため自動マージはスキップされます）"
              BODY="$BODY"$'\n'"  - ${CODEX_FAILURE_REASON}"
            else
              BODY="$BODY"$'\n\n'"- Codexによる自動レビューが \`${CODEX_VERDICT}\` と判定したため。詳細はPR #${PR_NUMBER} のレビューコメントを確認してください。"
            fi
            BODY="$BODY"$'\n\n<!-- issue-deck-source:codex-review-develop -->'
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          # このpush開始時点で既に00.check-user付与済み(=既に確認待ち)ならコメントのみ省略する(#594)。
          # 判定材料はrisk-checkが掴んだpush開始時点の状態で、ここで読み直さない。読み直すと
          # 他経路が付けたラベルを見て、理由コメントを取りこぼす(#1406)
          elif [ "$ALREADY_CHECK_USER" = "true" ]; then
            echo "Issue #${ISSUE_NUMBER} は既に00.check-user付与済みのため、重複コメントの投稿をスキップします。"
          else
            # 判定が下る前にPRがマージされていることがある(#1968。PR #1959は判定の6分前に
            # issue-deckの画面からマージされた)。そのとき「マージ前に確認してください」と書くと、
            # 既にdevelopへ入った変更に対して実行できない依頼になる。**文面だけを事後確認向けに
            # 変え、ラベル(00.check-user・01.check-merge)はそのまま付ける**——確認が要る変更が
            # 入ったこと自体は変わらず、人が気付ける必要があるため。
            # 取得できない場合は従来の文面へ倒す(マージ済みと誤って言わない側)。
            MERGED="$(gh pr view "$PR_NUMBER" --json merged --jq .merged 2>/dev/null || echo "false")"
            if [ "$MERGED" = "true" ]; then
              COMMENT_BODY="⚠️ このPRは自動マージ可否の判定が終わる前にdevelopへマージされています。以下の理由により、事後の確認が必要です。"
            else
              COMMENT_BODY="⚠️ 以下の理由により、developへのマージ前にユーザーの確認が必要と判定しました。"
            fi
            COMMENT_BODY="$COMMENT_BODY"$'\n\n'"$REASONS"
            COMMENT_BODY="$COMMENT_BODY"$'\n\n<!-- issue-deck-source:claude-review-develop -->'
            gh issue comment "$ISSUE_NUMBER" --body "$COMMENT_BODY"
          fi

      # 「このPRが何をもって検証されたのか」をPR本文に残す(#2448)。レビューの判定はこれまで
      # PRコメントの散文にしか残らず、develop→mainのリリースPRを前にしたときに
      # 「中身がどこまで検証されたのか」を読む場所が無かった。ここで書いた節を
      # reusable-release-develop-to-main.ymlが対象issueぶん集めてリリースPRの表にする。
      #
      # - **追記ではなく置き換え。** 開始・終了マーカーの間を落としてから足すので、
      #   同じPRへ何度pushしても節は1つのままになる
      # - **continue-on-error: true。** 記録は補助情報で、書けなかったことを理由にこのジョブを
      #   落とすとauto-merge-fallbackが00.check-userを付けてしまう(記録の欠落より、
      #   マージが止まって人を呼ぶ方が高くつく)
      # - PR本文の編集は`pull_request`の`edited`を起こすが、呼び出し元のトリガーは
      #   opened/synchronize/reopened/ready_for_reviewだけなので再帰しない
      # - **head refが`issue-<番号>`のPRにしか書かない。** バージョンバンプPR
      #   (`release/vX.Y.Z`→develop)の本文にある`## 対象issue`は、develop→mainのPRを作るrunが
      #   引き継ぐ唯一の入力(#2117)で、リリースの配管そのもの。集計側も`issue-<番号>`のPRしか
      #   引かないため、そこへ節を足しても誰も読まない
      - name: 検証結果をPR本文へ記録する
        if: always() && needs.identify-issue.outputs.number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_RESULT: ${{ needs.claude-review.result }}
          REVIEW_EXECUTED: ${{ needs.claude-review.outputs.executed }}
          REVIEW_PROVIDER: ${{ needs.review-provider.outputs.provider }}
          WORKFLOW_CHANGED: ${{ needs.risk-check.outputs.workflow-changed }}
          WORKFLOW_CHANGE_POLICY: ${{ inputs.workflow-change-policy }}
          CODEX_REVIEW_RESULT: ${{ steps.codex.outputs.result }}
          CODEX_VERDICT_INPUT: ${{ steps.codex.outputs.verdict }}
          CODEX_FAILURE_REASON: ${{ steps.codex.outputs.reason }}
          RISKY: ${{ needs.risk-check.outputs.risky }}
          REASONS: ${{ needs.risk-check.outputs.reasons }}
          REVIEW_FIX_HANDOFF: ${{ steps.hold.outputs.handoff }}
        run: |
          set -euo pipefail

          # 古いHEADに対する実行は何も書かない（新しいHEADのrunがその時点の結果を書く。#3990）
          if [ "$CODEX_REVIEW_RESULT" = "stale" ]; then
            echo "PRのHEADが進んでいるため、検証結果の記録をスキップします。"
            exit 0
          fi

          # 自動レビューの判定は、レビューがPRへ投稿したコメントの末尾のマーカーから読む
          # (.github/prompts/review-develop.md と対。ずれるとここは黙って「取得できず」へ
          # 倒れるため、scripts/check-review-verdict-marker.sh がCIで突き合わせる)。
          # sha=で今回のhead SHAに絞り、追いコミット前の判定を拾わない。
          REVIEW="unavailable"
          # 「実施していない」理由。`skipped`のときだけ使い、develop向けPRの本文へ添える
          # (リリースPRの表は`— 実施なし`までしか出さない。理由は元のPRを開けば読める)
          SKIP_REASON=""
          case "$REVIEW_RESULT" in
            skipped)
              # #992のゲートでレビューを省いた場合。**失敗と区別する**——省くのは
              # 低リスクかつ小規模なPRに限られる設計どおりの動きで、危険信号ではない
              REVIEW="skipped"
              SKIP_REASON="低リスクかつ小規模のため省略"
              [ "${REVIEW_PROVIDER:-}" != "codex" ] || SKIP_REASON="実装担当に合わせてCodexでレビュー"
              ;;
            success)
              if [ "$REVIEW_EXECUTED" != "true" ]; then
                # ジョブはsuccessでもClaudeが動いていない場合(`.github/workflows/`配下を
                # 変更するPR)。**「判定を取得できませんでした」と書かない**——判定を残せなかった
                # のではなく、そもそも実施していない
                REVIEW="skipped"
                SKIP_REASON="ワークフローファイルの変更を含むため、Claudeを実行していない"
                # 人の確認へ回す設定のときは、通ったのではなく止めたことが分かる文面にする(#4144)。
                # 代わりのCodexレビューが判定した・判定待ちのときは、そちらへ委ねたことを書く(#4149)
                if [ "${WORKFLOW_CHANGE_POLICY:-confirm}" = "confirm" ] && [ "$WORKFLOW_CHANGED" = "true" ]; then
                  case "$CODEX_REVIEW_RESULT" in
                    success|pending) SKIP_REASON="${SKIP_REASON}。代わりにCodexでレビュー" ;;
                    *) SKIP_REASON="${SKIP_REASON}。人の確認が必要なため自動マージは保留" ;;
                  esac
                fi
              else
                FOUND="$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' \
                  | grep -oE "issue-deck-review-verdict:(lgtm|needs-check|changes-requested) sha=${HEAD_SHA}" \
                  | tail -n 1 \
                  | sed -E 's/^.*verdict:([a-z-]+) sha=.*$/\1/' || true)"
                if [ -n "$FOUND" ]; then
                  REVIEW="$FOUND"
                fi
              fi
              ;;
          esac

          CODEX_REVIEW="unavailable"
          CODEX_SKIP_REASON=""
          case "$CODEX_REVIEW_RESULT" in
            skipped)
              CODEX_REVIEW="skipped"
              CODEX_SKIP_REASON="低リスクかつ小規模のため省略"
              [ "${REVIEW_PROVIDER:-}" != "claude" ] || CODEX_SKIP_REASON="実装担当に合わせてClaudeでレビュー"
              # Claudeの代わりに依頼しようとして届かなかった(#4149)
              [ -z "${CODEX_FAILURE_REASON:-}" ] || CODEX_SKIP_REASON="Claudeの代わりに依頼できなかった"
              ;;
            success)
              FOUND="${CODEX_VERDICT_INPUT:-}"
              if [ -z "$FOUND" ]; then
                FOUND="$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' \
                  | grep -oE "issue-deck-codex-review-verdict:(lgtm|needs-check|changes-requested) sha=${HEAD_SHA}" \
                  | tail -n 1 \
                  | sed -E 's/^.*verdict:([a-z-]+) sha=.*$/\1/' || true)"
              fi
              [ -z "$FOUND" ] || CODEX_REVIEW="$FOUND"
              ;;
            # キュー待ち・実行中。完了するとこのジョブが再実行され、この節が最終の判定に書き換わる（#3990）
            pending)
              CODEX_REVIEW="pending"
              ;;
          esac

          # review=・risk=の値と文言の対応は、ローカルのレビュー・統合エージェント
          # (scripts/prompts/review-agent.md)・リリースPRの集計・画面(src/lib/github/
          # release-verification.ts)で共通の契約。**片方だけ増やさない**
          case "$REVIEW" in
            lgtm) REVIEW_TEXT="✅ 問題なし（LGTM）" ;;
            needs-check) REVIEW_TEXT="⚠️ 要確認" ;;
            changes-requested) REVIEW_TEXT="❌ 要修正" ;;
            skipped) REVIEW_TEXT="— 実施なし（${SKIP_REASON}）" ;;
            *) REVIEW="unavailable"; REVIEW_TEXT="? 判定を取得できませんでした" ;;
          esac
          case "$CODEX_REVIEW" in
            lgtm) CODEX_REVIEW_TEXT="✅ 問題なし（LGTM）" ;;
            needs-check) CODEX_REVIEW_TEXT="⚠️ 要確認" ;;
            changes-requested) CODEX_REVIEW_TEXT="❌ 要修正" ;;
            skipped) CODEX_REVIEW_TEXT="— 実施なし（${CODEX_SKIP_REASON}）" ;;
            pending) CODEX_REVIEW_TEXT="⏳ サブPCで実行待ち・実行中（完了後に自動で更新されます）" ;;
            *) CODEX_REVIEW="unavailable"; CODEX_REVIEW_TEXT="? 判定を取得できませんでした" ;;
          esac

          # 画面とリリースPRが読むreview=は両レビューの総合判定にする。
          # 片方でも要修正・要確認なら、もう片方のLGTMで上書きしない。
          if [ "$REVIEW" = "changes-requested" ] || [ "$CODEX_REVIEW" = "changes-requested" ]; then
            OVERALL_REVIEW="changes-requested"
            OVERALL_REVIEW_TEXT="❌ 要修正"
          elif [ "$REVIEW" = "needs-check" ] || [ "$CODEX_REVIEW" = "needs-check" ]; then
            OVERALL_REVIEW="needs-check"
            OVERALL_REVIEW_TEXT="⚠️ 要確認"
          elif [ "$CODEX_REVIEW" = "pending" ]; then
            # Codexの結果待ち。完了までは判定を確定させない（待ち中に「問題なし」と読ませない）
            OVERALL_REVIEW="unavailable"
            OVERALL_REVIEW_TEXT="⏳ Codexレビューの完了待ち"
          elif [ "$REVIEW" = "unavailable" ] || [ "$CODEX_REVIEW" = "unavailable" ]; then
            OVERALL_REVIEW="unavailable"
            OVERALL_REVIEW_TEXT="? 判定を取得できませんでした"
          elif [ "$REVIEW" = "lgtm" ] || [ "$CODEX_REVIEW" = "lgtm" ]; then
            OVERALL_REVIEW="lgtm"
            OVERALL_REVIEW_TEXT="✅ 問題なし（LGTM）"
          else
            OVERALL_REVIEW="skipped"
            OVERALL_REVIEW_TEXT="— 実施なし（低リスクかつ小規模のため省略）"
          fi

          if [ "$RISKY" = "true" ]; then
            RISK="hit"
            RISK_TEXT="⚠️ 該当あり"
          else
            RISK="none"
            RISK_TEXT="該当なし"
          fi

          # hold側と同じ条件(#4144)。Claudeが走っていないワークフロー変更PRは人の確認へ回る。
          # 代わりのCodexレビューが判定した・判定待ちなら、そちらの結果で決まる(#4149)
          WORKFLOW_UNREVIEWED=false
          if [ "${WORKFLOW_CHANGE_POLICY:-confirm}" = "confirm" ] && [ "$WORKFLOW_CHANGED" = "true" ] \
            && [ "$REVIEW_RESULT" = "success" ] && [ "$REVIEW_EXECUTED" != "true" ] \
            && [ "$CODEX_REVIEW_RESULT" != "success" ] && [ "$CODEX_REVIEW_RESULT" != "pending" ]; then
            WORKFLOW_UNREVIEWED=true
          fi

          if [ "$REVIEW_FIX_HANDOFF" = "true" ]; then
            CONFIRM_TEXT="不要（指摘を自動修正へ回しました。直した後に再レビューされます）"
          elif [ "$RISK" = "hit" ] || [ "$WORKFLOW_UNREVIEWED" = "true" ] || [ "$REVIEW" = "needs-check" ] || [ "$REVIEW" = "changes-requested" ] || [ "$CODEX_REVIEW" = "needs-check" ] || [ "$CODEX_REVIEW" = "changes-requested" ]; then
            CONFIRM_TEXT="必要（自動マージはスキップされます）"
          elif [ "$CODEX_REVIEW" = "pending" ]; then
            CONFIRM_TEXT="判定待ち（Codexレビューの完了後に自動で判定します）"
          else
            CONFIRM_TEXT="不要（自動マージの対象）"
          fi

          TMP="${RUNNER_TEMP:-/tmp}"
          {
            echo "<!-- issue-deck-verification:start review=${OVERALL_REVIEW} risk=${RISK} -->"
            echo "## 検証結果"
            echo
            echo "- 自動レビュー: ${OVERALL_REVIEW_TEXT}"
            echo "- Claudeによる自動レビュー: ${REVIEW_TEXT}"
            echo "- Codexによる自動レビュー: ${CODEX_REVIEW_TEXT}"
            echo "- 機械的リスク判定: ${RISK_TEXT}"
            if [ "$RISK" = "hit" ] && [ -n "$REASONS" ]; then
              # risk-checkが組み立てた `- <理由>` の行を、そのままぶら下げる
              printf '%s\n' "$REASONS" | sed 's/^- /  - /'
            fi
            echo "- ユーザーの確認: ${CONFIRM_TEXT}"
            echo
            # 「いつの中身に対する判定か」の記録（#3172）。画面はこれをPRのheadと突き合わせ、
            # 修正コミットを積んだ後に古い判定をそのまま出さないようにする。
            # **開始マーカーの属性にはしない**——`review=`・`risk=`の直後が`-->`である前提で
            # 読んでいる版が本番に出ているあいだ、節ごと「記録なし」に倒れるため（画面が
            # リリースされるまで要修正PRのマージ警告が消える）。別行なら古い読み手は読み飛ばす
            echo "<!-- issue-deck-verification:sha=${HEAD_SHA} -->"
            echo "<sub>この節は\`claude-review-develop.yml\`が自動で更新します（#2448）。判定の根拠はこのPRのレビューコメントにあります。</sub>"
            echo "<!-- issue-deck-verification:end -->"
          } > "$TMP/verification-section.md"

          # 既にある節を落としてから足す。開始マーカーの行から終了マーカーの行までを捨てる。
          gh pr view "$PR_NUMBER" --json body --jq .body | tr -d '\r' | awk '
            index($0, "<!-- issue-deck-verification:start") { skip = 1 }
            !skip { print }
            index($0, "<!-- issue-deck-verification:end -->") { skip = 0 }
          ' > "$TMP/pr-body-base.md"

          # 末尾の空行を落としてから空行1つを挟む(節の前後に空行が増え続けないようにする)
          awk 'NF { last = NR } { line[NR] = $0 } END { for (i = 1; i <= last; i++) print line[i] }' \
            "$TMP/pr-body-base.md" > "$TMP/pr-body-new.md"
          printf '\n' >> "$TMP/pr-body-new.md"
          cat "$TMP/verification-section.md" >> "$TMP/pr-body-new.md"

          gh pr edit "$PR_NUMBER" --body-file "$TMP/pr-body-new.md"
          echo "検証結果をPR本文へ記録しました（review=${OVERALL_REVIEW} risk=${RISK}）。"

      # GITHUB_TOKEN起点でAuto-mergeを有効化すると、必須ステータスチェック通過後に
      # GitHub側が非同期に実行する実際のマージが「GITHUB_TOKEN起点のイベントは他の
      # ワークフローを起動しない」というGitHub仕様の影響を受け、issue-labels.ymlの
      # develop-pr-mergedジョブが発火しないことがある(Issue #112)。GITHUB_TOKEN以外の
      # トークン（GitHub Appのインストールトークン。未登録時はWORKFLOW_PAT）で有効化する
      # ことでこの制約を回避する。
      - name: 自動マージ可否を判定して実行する
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.WORKFLOW_PAT }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.identify-issue.outputs.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_FIX_HANDOFF: ${{ steps.hold.outputs.handoff }}
          WAITING_FOR_CODEX: ${{ steps.hold.outputs.waiting }}
        run: |
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "対応Issue番号を特定できないため、自動マージをスキップします。"
            exit 0
          fi

          # Codexレビューの結果待ち・古いHEADでは、マージを有効化しない（#3990）。結果が出ると
          # このジョブが再実行され、最新のHEADについて改めて判定する
          if [ "$WAITING_FOR_CODEX" = "true" ]; then
            echo "Codexレビューの結果を待っているため、自動マージを有効化しません。"
            exit 0
          fi

          # レビュー指摘の自動修正へ渡したPR(#3363)は、00.check-userを付けていないが
          # 「要修正」のままなのでマージしない。直したpushで走る次のレビューが改めて判定する
          if [ "$REVIEW_FIX_HANDOFF" = "true" ]; then
            echo "レビュー指摘の自動修正へ渡したため、自動マージをスキップします。"
            exit 0
          fi

          LABELS="$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')"
          if echo "$LABELS" | grep -qx "00.check-user"; then
            echo "対応Issue #${ISSUE_NUMBER} に 00.check-user が付与されているため、自動マージをスキップします。"
            exit 0
          fi

          echo "自動マージ不可カテゴリに該当しないため、auto-mergeを有効化します。"
          gh pr merge "$PR_NUMBER" --auto --merge

  auto-merge-fallback:
    needs: [identify-issue, risk-check, auto-merge]
    if: always() && needs.auto-merge.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: 自動マージ失敗をPRに通知する
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ needs.identify-issue.outputs.number }}
          RISKY: ${{ needs.risk-check.outputs.risky }}
          REASONS: ${{ needs.risk-check.outputs.reasons }}
        run: |
          set -e
          gh pr comment "$PR_NUMBER" --body "⚠️ 自動マージ（auto-merge）が失敗しました。Actionsの実行ログを確認し、必要であれば手動でマージしてください。"
          if [ -n "$ISSUE_NUMBER" ]; then
            REASON_LABEL="01.check-merge"
            # 展開先リポジトリにラベル自体が定義されていない場合でもこのステップを落とさないよう、
            # 付与・除去の前にリポジトリのラベル一覧と突き合わせる(#975)。理由ラベル(#1490)は常に1枚
            # なので、定義済みの他の理由ラベルは同じ呼び出しで外す。
            DEFINED_LABELS="$(gh label list --json name --jq '.[].name' --limit 200)"
            LABEL_ARGS=()
            for name in "00.check-user" "$REASON_LABEL"; do
              if grep -qx "$name" <<<"$DEFINED_LABELS"; then
                LABEL_ARGS+=(--add-label "$name")
              else
                echo "::warning::ラベル '$name' がリポジトリに存在しないため付与をスキップします"
              fi
            done
            for name in 01.check-plan 01.check-input 01.check-merge 01.check-blocked 01.check-answered 00.qa-answered; do
              if [ "$name" != "$REASON_LABEL" ] && grep -qx "$name" <<<"$DEFINED_LABELS"; then
                LABEL_ARGS+=(--remove-label "$name")
              fi
            done
            if [ "${#LABEL_ARGS[@]}" -gt 0 ]; then
              gh issue edit "$ISSUE_NUMBER" "${LABEL_ARGS[@]}"
            fi
            # Issueにも理由を残す(#2062)。従来はPRコメントにしか書いておらず、Issue側は
            # ラベルだけが付くため、issue-deckのIssue詳細が「理由の記録が見つかりませんでした」
            # としか出せなかった。文面は「見出し語 + 箇条書き」の形を守る
            # (src/lib/merge-check-reasons.ts がこの形からしか理由を取り出せない)。
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            COMMENT_BODY="⚠️ 以下の理由により、developへのマージ前にユーザーの確認が必要です。"
            COMMENT_BODY="$COMMENT_BODY"$'\n\n'"- 自動マージ（auto-merge）の有効化に失敗したため、ユーザーのマージ操作が必要です"
            if [ "$RISKY" = "true" ]; then
              COMMENT_BODY="$COMMENT_BODY"$'\n'"$REASONS"
            fi
            COMMENT_BODY="$COMMENT_BODY"$'\n\n'"実行ログ: ${RUN_URL}"
            COMMENT_BODY="$COMMENT_BODY"$'\n\n<!-- issue-deck-source:claude-review-develop -->'
            gh issue comment "$ISSUE_NUMBER" --body "$COMMENT_BODY"
          fi
