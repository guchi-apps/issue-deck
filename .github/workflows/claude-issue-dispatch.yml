name: Claude Issue Dispatch

# Issueへの@claudeコメントを起点に、ローカルのscripts/start-issue.shが行っている作業
# (issue-<番号>ブランチ作成・実装・develop向けPR作成)をGitHub Actions上で無人実行する
# (docs/multi-agent-workflow.md Phase5)。
#
# 21.plan-requiredラベルが付いているissueは二段階トリガーにする(無人実行では
# 対話的な承認者がその場にいないため):
#   1. 計画をIssueコメントとして投稿し、00.check-userを付与して停止する(implementはしない)
#   2. 人間が計画を確認し、00.check-userラベルを外すと「承認」とみなして実装を再開する
#      (00.check-userが付いたままの状態で新たに@claudeコメントが付いた場合は、計画の
#      練り直し依頼として扱い、計画コメントを投稿し直す。00.check-userは外さない)
#      00.check-userはPhase4の自動マージ不可判定でも使われる汎用の「要確認」ラベルだが、
#      実装ブランチ(issue-<番号>)がまだ存在しない状態でのみ「承認」と解釈するため、
#      既にPRが存在する状態(Phase4側の要確認)で外されても実装が誤って再始動することはない。
#      「00.check-user・21.plan-requiredともに付いていない」状態を承認済みとみなして実装を
#      再開する判定自体はissues/unlabeled・issue_commentどちらのイベント経由でも同じロジックで
#      行う(下記「実行者の権限・状態を判定する」ステップ)。issue-deckアプリの承認ボタンは
#      ラベル更新をGitHub App経由(issue-deck[bot]として記録される)で行うため、
#      issues/unlabeledイベント単独では実際に承認した人間を特定できず自己ループ防止ロジックで
#      弾かれる。そのためアプリはラベル更新に続けて個人アカウントでの@claudeコメントも送信し、
#      issue_commentイベント経由で実装を再開させる(#173)。
#   3. 承認・練り直しのいずれもせず計画を拒否する場合は、人間がIssueを直接クローズする
#      (`not planned`等の理由。コメントに@claudeを含める必要はない)。クローズ済みIssueは
#      本ワークフローの全モードで再始動しないため(issue_closedガード)、クローズ後に
#      issue-labels.ymlのcleanup-on-closeジョブが00.check-userを除去しても安全(issue #172)。
#
# 21.plan-requiredの計画提示ステップは、実装範囲が広くGitHub Actions上で一度に処理しきれない
# 懸念がある場合、計画コメントをサブIssueへの分割案として提示できる(#144)。計画コメント末尾に
# 埋め込む<!-- issue-deck-plan-type:implement|split -->マーカーにより、00.check-user解除時に
# 実装(mode=implement)を始めるかサブIssueへの分割(mode=split)を始めるかを判定する。
# mode=splitでは、承認済みの計画コメントに沿って`gh issue create`でサブIssueを作成し、元Issue
# にサブIssue一覧をコメントしたうえで元Issueを`not planned`理由でクローズする。サブIssueへの
# 実際の着手は、これまでどおり人間が各サブIssueに`@claude`とコメントして個別に起動する
# (自動連鎖起動はしない)。
#
# クローズ済みのIssueに対する@claudeコメント・ラベル操作では、実装・計画・分割のいずれも
# 再始動しない(mode=skip)。上記の分割で元Issueがクローズされた後に誤って再始動しないための
# ガードだが、通常の09.mainクローズ後のIssueにも同様に適用される。
#
# issue-<番号>ブランチが既に存在する場合でも、issue_commentトリガー(人間からの明示的な
# @claudeコメント)であれば、以下のいずれかに該当する限りmode=additional(既存ブランチへの
# 追加対応)として扱う。00.check-userの有無は問わない(Phase4の要確認判定と、人間からの追加
# 依頼は独立した文脈のため)。新規ブランチは作らず、既存のissue-<番号>ブランチをcheckoutして
# 続きから作業する。
#   - PRがOPEN(#129): 追加の依頼内容としてコミットをpushし、既存PRにコメントで報告する。
#   - PRがまだ一度も無く、かつ01.wipが付いている(#112): 前回の実装試行がPR作成に至らないまま
#     (権限拒否・エラー等で)終了し詰まった状態の可能性がある。ブランチを削除して作り直すのは
#     人間しかできない(自動では行わない。前回コミットまで進んでいた作業を無言で失わせない
#     ため)が、その既存ブランチをそのままcheckoutして続きから再開すること自体は自動で行い、
#     完了時に新規でPRを作成する(実装ステップのプロンプト内で、現在のブランチの状態を確認して
#     続行可能か判断させる)。
# PRがMERGED/CLOSED、またはPRが無く01.wipも付いていない異常な中間状態の場合は、従来どおり
# mode=skipとし、実装は再始動しない。
#
# パブリックリポジトリのため、Issueへのコメント自体は誰でも投稿できる。ラベルの
# 付与・削除にはリポジトリへのwrite権限が必要でGitHub側で担保されるが、
# @claudeコメントによる起動は権限を持たない第三者からも到達しうるため、
# 全トリガー経路で一律に実行者(github.actor)のリポジトリ権限を確認し、
# write権限未満の場合は何もしない。ただし issue-deckアプリ自身のGitHub App経由の
# コメント投稿(issue-deck[bot])は、人間がアプリ画面上で操作していてもGitHub上は
# 常にBot扱いになるため例外とし、アプリがコメント本文に埋め込む投稿者マーカーから
# 実際に操作した人間を復元したうえで同様に権限確認する(詳細は後述のステップを参照)。
#
# 対象issueの番号はissues/issue_commentイベントの github.event.issue.number
# からそのまま取得できる(ブランチ名からの推測が必要な他ワークフローと異なる)。
# 値はscript injectionを避けるため env 経由でのみ参照し、run: 本文に直接
# 展開しない(.github/workflows/issue-labels.yml と同じ方針)。
#
# @claudeトリガーの判定はcontains()ではなくstartsWith()を使う(#173)。containsだと、この
# ワークフロー自身が投稿する完了報告コメント(APPROVE_COMMENT_BODY等の定型コメント本文を
# 説明のため引用する場合や、ドキュメント・コード中の`@claude`という記述を含む場合)にまで
# 反応し、報告コメント→再トリガー→報告コメント...の無限ループを起こしうる
# (実際に#173で2回連続発生した)。issue-detail.tsx・mobile-issue-detail.tsx・
# approval-labels.ts・start-implementation.tsが送信する定型コメントは全て本文の先頭が
# `@claude`であり、人間が手動で投稿する起動コメントも同様の慣習(先頭に`@claude`)のため、
# startsWith()に絞っても正規の起動経路は損なわれない。
#
# ブランチのpush(Checkoutステップ)・実装ステップのgit push/PR作成はGITHUB_TOKENではなく、
# secrets.WORKFLOW_PAT(workflowスコープ/Repository permissions > Workflows: Read and write
# を持つFine-grained PAT)を使う(issue #106)。既定のGITHUB_TOKENは`.github/workflows/`配下への
# push権限をGitHubの仕様上原理的に持てない(リポジトリのWorkflow permissions設定をRead and write
# にしても解除されない制限)ため、本ワークフロー自身がワークフローファイルを変更するIssueを
# 扱えるようにするにはPATが必須。副次効果として、GITHUB_TOKENによるpush/PR作成と異なりPATに
# よるpush/PR作成は他のワークフローを起動できるため、ここで作成したPRに対して
# .github/workflows/claude-review-develop.yml(Phase3自動レビュー・Phase4自動マージ)が
# 自動発火する可能性がある(未検証)。develop向けPR作成までが本ワークフローの完了条件であり、
# developへのマージまでの自動化は前提としないが、自動発火した場合はそれ自体は許容する。

on:
  issues:
    types: [unlabeled]
  issue_comment:
    types: [created]

jobs:
  dispatch:
    if: |
      (github.event_name == 'issues' && github.event.action == 'unlabeled' && github.event.label.name == '00.check-user') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && startsWith(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    # 同じissueに対して短時間に複数の@claudeコメント等が来た場合、複数のワークフロー実行が
    # 同じブランチに同時にcheckout・pushして競合するのを避けるため、issueごとに直列化する(#129)。
    # cancel-in-progress: falseにより、先行実行を中断せず後続を待たせる。
    concurrency:
      group: issue-dispatch-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    # 無人実行環境でも`pnpm dev`を起動して画面を確認できるようにするためのMySQLサービス
    # コンテナ(#256)。plan/splitモードでは使わないが、サービスコンテナはジョブ全体に
    # 紐づく仕様上いずれのモードでも起動する(未使用でも実行時間への影響は小さい)。
    # 認証情報はCI専用のプレースホルダーで、.github/workflows/ci.yml のDATABASE_URLと揃える。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: placeholder
          MYSQL_DATABASE: app_issue_deck
          MYSQL_USER: placeholder
          MYSQL_PASSWORD: placeholder
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1
          # .github/workflows/配下を変更するIssueでも実装ステップのgit pushが拒否されないよう、
          # workflow書き込み権限を持つPAT(secrets.WORKFLOW_PAT)でcheckoutする(issue #106)。
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: 実行者の権限・状態を判定する
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
          ACTOR_TYPE: ${{ github.event.sender.type }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -e
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

          if [ "$ACTOR_TYPE" = "Bot" ]; then
            # issue-deckアプリ自身のGitHub App経由の書き込みは、人間がアプリ画面上で
            # 操作した場合でもGitHub上は issue-deck[bot] が投稿者になる。issue_comment
            # イベントに限り、アプリがコメント本文の末尾に埋め込む投稿者マーカー
            # (<!-- issue-deck:posted-by:<login> -->。src/app/api/issues/comments/route.ts
            # のPOSTで付与、ユーザー入力より後ろに付くため本文中の偽マーカーは無効)から
            # 実際に操作した人間のログイン名を取り出し、以降の権限チェックをその人間に
            # 対して行う。マーカーが無い場合(issue-deck[bot]以外のBotや、マーカーの無い
            # 旧コメント)はこれまで通りスキップする。
            POSTED_BY=""
            if [ "$ACTOR" = "issue-deck[bot]" ] && [ "$EVENT_NAME" = "issue_comment" ]; then
              POSTED_BY="$(printf '%s' "$COMMENT_BODY" | grep -oP '(?<=<!-- issue-deck:posted-by:)\S+(?= -->)' | tail -n1 || true)"
            fi
            if [ -z "$POSTED_BY" ]; then
              echo "実行者がBotのため何もしません（自己ループ防止）: $ACTOR"
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "issue-deck[bot]経由のコメントを検出、投稿者マーカーから実行者を復元します: $POSTED_BY"
            ACTOR="$POSTED_BY"
          fi

          PERMISSION="$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo "none")"
          case "$PERMISSION" in
            admin|write|maintain) : ;;
            *)
              echo "実行者 $ACTOR はwrite権限を持たないため何もしません（権限: $PERMISSION）"
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          BRANCH="issue-$ISSUE_NUMBER"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # クローズ済みのIssueは実装・計画・分割のいずれも再始動しない。分割(#144)で元Issueが
          # クローズされた後の誤爆防止が主目的だが、09.mainクローズ後のIssue全般にも適用される。
          ISSUE_STATE="$(gh issue view "$ISSUE_NUMBER" --json state --jq .state)"
          ISSUE_CLOSED=false
          [ "$ISSUE_STATE" = "CLOSED" ] && ISSUE_CLOSED=true
          echo "issue_closed=$ISSUE_CLOSED" >> "$GITHUB_OUTPUT"

          BRANCH_EXISTS=false
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            BRANCH_EXISTS=true
          fi
          echo "branch_exists=$BRANCH_EXISTS" >> "$GITHUB_OUTPUT"

          # ブランチが既に存在する場合、対応するdevelop向けPRの状態を見て、追加対応
          # (mode=additional)として扱うかを判定する(#129)。PRがOPENであれば、人間からの
          # @claudeコメントによる追加のやり取りとして既存ブランチに追加コミットする。
          PR_STATE=""
          PR_URL=""
          if [ "$BRANCH_EXISTS" = "true" ]; then
            PR_JSON="$(gh pr list --head "$BRANCH" --state all --json state,url --jq '.[0]' 2>/dev/null || true)"
            if [ -n "$PR_JSON" ] && [ "$PR_JSON" != "null" ]; then
              PR_STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
              PR_URL="$(printf '%s' "$PR_JSON" | jq -r '.url')"
            fi
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

          LABELS="$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')"
          PLAN_REQUIRED=false
          echo "$LABELS" | grep -qx "21.plan-required" && PLAN_REQUIRED=true
          AWAITING_CONFIRM=false
          echo "$LABELS" | grep -qx "00.check-user" && AWAITING_CONFIRM=true
          WIP=false
          echo "$LABELS" | grep -qx "01.wip" && WIP=true

          # ブランチが既に存在する場合の分岐(labeled/unlabeledイベントは人間からの明示的な
          # 追加依頼ではないため、以下はいずれもissue_commentトリガーに限定する):
          # - PRがOPENなら追加対応として扱う(#129)。00.check-user(Phase4の自動マージ不可判定を
          #   含む)の有無は問わない。
          # - PRがまだ無く01.wipが付いている詰まった状態(#112)も追加対応として扱い、既存
          #   ブランチをそのままcheckoutして続きから再開する(実装ステップのプロンプト側で
          #   続行可能か判断する)。ブランチの削除・作り直しは自動化せず人間の明示操作に委ねる。
          # - それ以外(PRがMERGED/CLOSED、または01.wipも付いていない異常な中間状態)は
          #   mode=skipとし、実装は再始動しない。
          MODE=skip
          if [ "$ISSUE_CLOSED" = "true" ]; then
            MODE=skip
          elif [ "$BRANCH_EXISTS" = "true" ]; then
            if [ "$EVENT_NAME" != "issue_comment" ]; then
              MODE=skip
            elif [ "$PR_STATE" = "OPEN" ]; then
              MODE=additional
            elif [ -z "$PR_STATE" ] && [ "$WIP" = "true" ]; then
              MODE=additional
            else
              MODE=skip
            fi
          elif [ "$AWAITING_CONFIRM" = "true" ]; then
            # 計画レビュー待ち中の@claudeコメントは、計画の練り直し依頼として扱う
            if [ "$EVENT_NAME" = "issue_comment" ]; then
              MODE=plan
            fi
          elif [ "$PLAN_REQUIRED" = "true" ]; then
            MODE=plan
          else
            # 00.check-user・21.plan-requiredともに付いていない状態。計画レビューを経ていた
            # issueであれば、それらのラベルが外れた = 承認とみなす。直前の計画コメントに
            # 埋め込まれた<!-- issue-deck-plan-type:implement|split -->マーカーから、
            # そのまま実装するかサブIssueへ分割するかを判定する(#144)。マーカーが無い場合
            # (計画レビューを経ていない通常issueや、旧形式の計画コメント・フォールバック通知
            # のみの場合)はimplementにフォールバックする。
            #
            # 承認操作の経路は2通りある:
            #   - 人間がGitHub UI等で直接00.check-userを外す(issues/unlabeledイベント)
            #   - issue-deckアプリの承認ボタン(issue-deckのGitHub Appによるラベル更新の
            #     操作はGitHub上issue-deck[bot]として記録され、issues/unlabeledイベント単独
            #     では実際に操作した人間を特定できず前段の権限チェックで自己ループ防止に
            #     より弾かれるため、アプリはラベル更新に続けて個人アカウントでの@claudeコメント
            #     も送信し、issue_commentイベント経由でここに到達する。#173)
            PLAN_TYPE="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments[].body' | grep -oP '(?<=<!-- issue-deck-plan-type:)(implement|split)(?= -->)' | tail -n1 || true)"
            : "${PLAN_TYPE:=implement}"
            if [ "$PLAN_TYPE" = "split" ]; then
              MODE=split
            else
              MODE=implement
            fi
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "判定結果: mode=$MODE branch=$BRANCH plan_required=$PLAN_REQUIRED awaiting_confirm=$AWAITING_CONFIRM wip=$WIP branch_exists=$BRANCH_EXISTS pr_state=$PR_STATE issue_closed=$ISSUE_CLOSED"

      - name: 対応開始をコメントで通知する
        # Claude Codeエージェント自身に通知コメントの投稿を委ねると、調査に時間がかかった場合や
        # 途中で行き詰まった場合に「依頼を受け取ったこと」自体が使用者に伝わらない恐れがある。
        # そのため後続のClaude Codeステップとは独立した、失敗しにくい単純なシェルスクリプトの
        # ステップとしてここで確実に投稿する（計画コメントのフォールバック検証と同じ考え方）。
        if: steps.state.outputs.mode == 'plan' || steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional' || steps.state.outputs.mode == 'split'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          if [ "${{ steps.state.outputs.mode }}" = "plan" ]; then
            BODY='🔍 依頼を確認しました。実装前の計画を検討します（まとまり次第このIssueにコメントします）。'
          elif [ "${{ steps.state.outputs.mode }}" = "split" ]; then
            BODY='🔀 承認された計画に沿って、このIssueをサブIssueに分割します（完了次第このIssueにコメントします）。'
          elif [ "${{ steps.state.outputs.mode }}" = "additional" ] && [ -n "${{ steps.state.outputs.pr_url }}" ]; then
            BODY="🔧 依頼を確認しました。既存の \`${{ steps.state.outputs.branch }}\` ブランチ・Pull Request（${{ steps.state.outputs.pr_url }}）に追加コミットします。"
          elif [ "${{ steps.state.outputs.mode }}" = "additional" ]; then
            BODY="🔧 前回の実装がPull Request作成に至らないまま終了した可能性があるため、既存の \`${{ steps.state.outputs.branch }}\` ブランチの状態を確認したうえで実装を再開します。"
          else
            BODY="🔧 依頼を確認しました。\`${{ steps.state.outputs.branch }}\` ブランチで調査・実装に着手します。"
          fi
          BODY="$BODY"$'\n\n'"実行ログ: $RUN_URL"
          gh issue comment ${{ steps.state.outputs.issue_number }} --body "$BODY"

      - name: 実装済み・対応中のissueへの@claudeコメントに返信する
        # BRANCH_EXISTS=trueかつmode=skipとなるケース(#105)。develop向けPRがOPENの状態、または
        # PRが無く01.wipが付いている詰まった状態(#112)でissue_commentが来た場合はmode=additional
        # になり、このステップの対象外(#129, #112。既存ブランチをcheckoutして続きから再開する)。
        # ここに該当するのは、PRがMERGED/CLOSED、またはPRが無く01.wipも付いていない異常な
        # 中間状態で、issue-<番号>ブランチが既に存在するため実装は再始動しないが、
        # issue_commentトリガー(人間が直接@claudeへ呼びかけたケース)に限り、これまでの
        # 「無言でスキップ」を避けて対応状況を返信する。unlabeledイベントでの同条件のskip
        # (Phase4の要確認判定など)は人間への呼びかけではないため対象外。Issueがクローズ済み
        # (issue_closed=true)の場合も同様の理由で返信する(#144の分割でクローズされたIssueへの
        # 呼びかけ等、branch_existsがfalseのケースを含む)。
        if: |
          steps.state.outputs.mode == 'skip' &&
          github.event_name == 'issue_comment' &&
          (steps.state.outputs.branch_exists == 'true' || steps.state.outputs.issue_closed == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "${{ steps.state.outputs.issue_closed }}" = "true" ]; then
            BODY='ℹ️ このIssueは既にクローズされています。分割により対応が複数のサブIssueに分かれている場合、コメント欄でリンクをご確認ください。'
            BODY="$BODY"$'\n\n''追加の対応が必要な場合、このコメントをきっかけに実装が再始動することはありません。人間が対応してください。'
            gh issue comment ${{ steps.state.outputs.issue_number }} --body "$BODY"
            exit 0
          fi
          BRANCH="${{ steps.state.outputs.branch }}"
          PR_URL="${{ steps.state.outputs.pr_url }}"
          if [ -z "$PR_URL" ]; then
            BODY="⚠️ \`$BRANCH\` ブランチは存在しますが、Pull Requestも\`01.wip\`ラベルも無い、想定外の状態です。"
            BODY="$BODY"$'\n\n'"作り直す場合は、人間が明示的に \`git push origin --delete $BRANCH\` 等でブランチを削除してから、改めて\`@claude\`とコメントしてください（このワークフローが自動でブランチを削除・作り直すことはありません）。"
          else
            BODY="ℹ️ このIssueは既に \`$BRANCH\` ブランチで対応中、または対応済みです。関連するPull Requestはこちらです: $PR_URL"
            BODY="$BODY"$'\n\n''追加の対応が必要な場合、このコメントをきっかけに実装が再始動することはありません。ブランチやPull Requestの状態を直接ご確認のうえ、人間が対応してください。'
          fi
          gh issue comment ${{ steps.state.outputs.issue_number }} --body "$BODY"

      - name: 01.wip を付与する（計画検討着手時）
        # Claude Codeエージェント自身にラベル付与を委ねるとLLMの実行タイミング・忘れに
        # 依存してしまうため、他の確実な通知ステップと同じくシェルスクリプトで直接行う。
        # CLAUDE.mdの運用ルール(01.wipはPlan mode開始時点で付与する)をこのワークフローでも
        # 保証するためのステップ。
        if: steps.state.outputs.mode == 'plan'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "01.wip"

      - name: 計画提示前のコメント数を記録する
        id: before_plan
        if: steps.state.outputs.mode == 'plan'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="$(gh issue view ${{ steps.state.outputs.issue_number }} --json comments --jq '.comments | length')"
          echo "comment_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Claude Code（計画提示）
        if: steps.state.outputs.mode == 'plan'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr list:*),Bash(gh api:*),Bash(git ls-remote:*),Bash(git log:*),Bash(curl:*),Read"'
          prompt: |
            あなたはissue-deckリポジトリの実装エージェントです。Issue #${{ steps.state.outputs.issue_number }} に
            `21.plan-required` ラベルが付いているため、実装に入る前に計画を提示してください。

            ## 最初にやること
            `gh issue view ${{ steps.state.outputs.issue_number }} --comments` でIssueの最新の本文・ラベル・
            コメント（過去に提示した計画やそれへのフィードバックを含む）を確認してください。

            ## Issue本文・コメントに画像が含まれる場合
            issue-deck独自の画像アップロードAPI（`/api/issues/images/...`のURL）で貼り付けられた画像は、
            GitHub純正の画像CDNではないため自動では読み込めません。計画立案に画像の内容確認が必要な場合は、
            `curl -o /tmp/<適当なファイル名> "<画像URL>"`で一時ファイルにダウンロードしたうえで、`Read`ツールで
            そのローカルファイルを開いて内容を確認してください（URLを直接`Read`しても開けません）。

            ## 直近のコメントが質問か、計画の修正依頼かの判定
            このIssueに既に計画コメント（末尾に`<!-- issue-deck-plan-type:implement -->`または
            `<!-- issue-deck-plan-type:split -->`マーカーが付いたコメント）が投稿済みの場合、直近の
            `@claude`コメントはその計画に対する反応です。まず、それが計画の変更を求める「修正依頼」か、
            単なる「質問・確認」（例:「この方針だとXの場合はどうなる？」）かを判定してください。

            - 単なる質問・確認と判断した場合:
              - 計画本文は書き直さず、`gh issue comment ${{ steps.state.outputs.issue_number }} --body "..."`
                で質問への回答のみを簡潔に投稿する
              - 計画種別マーカー（`<!-- issue-deck-plan-type:... -->`）は付けない（直前の計画のマーカーが
                そのまま承認判定に使われる想定のため）
              - ラベル（`00.check-user`等）は変更しない
              - 以下の「やること」「分割するかどうかの判断」の手順は行わず、ここで対応を終了する
            - 計画の修正が必要と判断した場合、または、このIssueにまだ計画コメントが投稿されていない
              （今回が初回の計画提示である）場合は、以下の「やること」に従って計画全文を練り直す
              （または新規に作成する）

            ## やること
            - リポジトリのコードを調査し、対応方針・変更範囲（触るファイル・追加するファイル）・懸念点を
              日本語でまとめる
            - 直前のコメントで計画への修正依頼が来ている場合は、それを踏まえて計画を練り直す
            - 実装範囲が広く、GitHub Actions上の1回の実装ステップで最後まで処理しきれない懸念がある
              場合は、無理に一つの計画に収めようとせず、下記「分割するかどうかの判断」に従って
              サブIssueへの分割を計画してよい
            - まとめた計画を `gh issue comment ${{ steps.state.outputs.issue_number }} --body "..."` で
              Issueにコメント投稿する。コメント本文の末尾に、下記の計画種別マーカーと、このワークフロー
              実行への追跡用リンク
              `実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
              を必ず追記する
            - 投稿後、`gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "00.check-user"` を実行する
              （既に付いていても無害なので毎回実行してよい）

            ## 分割するかどうかの判断とマーカー
            計画コメントの末尾に、判断結果に応じて次のいずれか1つのHTMLコメントマーカーを必ず含めて
            ください。人間が`00.check-user`を外して承認した後、別のワークフロー実行がこのマーカーを
            読み取ってそのまま実装するかサブIssueへ分割するかを自動的に振り分けます。

            - このIssueのまま1つのPull Requestとして実装できると判断した場合:
              `<!-- issue-deck-plan-type:implement -->`
            - 実装範囲が広く、複数のサブIssueに分割してそれぞれ独立に実装すべきと判断した場合:
              `<!-- issue-deck-plan-type:split -->`
              - この場合、計画コメント本文に分割後の各サブIssue案（タイトル案・スコープ・実装順序や
                依存関係があればそれも）を箇条書きで明記すること。承認後、別のワークフロー実行がこの
                計画コメントを読んでサブIssueを実際に作成するため、その内容がそのままサブIssue作成の
                元になります
              - 分割後の1つのサブIssueもなお複雑だと判断される場合、そのサブIssue案の中に
                「このサブIssueには21.plan-requiredが必要」と書き添えてよい（実際のラベル付与は
                分割を実行するステップが行う）

            ## 迷った場合・調査に行き詰まった場合の振る舞い
            - 許可されていない操作が拒否される等で調査に行き詰まった場合、それ以上粘らず、その時点で
              分かっている情報の範囲で計画をまとめてコメント投稿することを最優先する
              （コメントを一切投稿できないまま終了することが最悪の結果のため）

            ## このステップでは行わないこと
            - コードの変更・コミット・ブランチ作成・PR作成・Issueの新規作成は一切行わない（計画提示のみ。
              分割を計画した場合も、実際のサブIssue作成はこのステップでは行わない）

            ## 次に起きること
            人間が計画を確認し、問題なければIssueから `00.check-user` ラベルを外します。それをもって承認と
            みなし、別のワークフロー実行が、上記マーカーに応じて実装（`implement`）またはサブIssueの
            作成（`split`）を開始します。計画に修正が必要な場合は、人間が`@claude`宛にコメントで指摘するので、
            その場合はこのステップが再び起動し計画を練り直します。

      - name: 計画コメント投稿を検証し、必要ならフォールバックする
        if: always() && steps.state.outputs.mode == 'plan'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          AFTER_COUNT="$(gh issue view ${{ steps.state.outputs.issue_number }} --json comments --jq '.comments | length')"
          BEFORE_COUNT="${{ steps.before_plan.outputs.comment_count }}"
          : "${BEFORE_COUNT:=0}"
          if [ "$AFTER_COUNT" -gt "$BEFORE_COUNT" ]; then
            echo "新規コメントを確認できたため計画提示は完了とみなします（投稿前: $BEFORE_COUNT 件, 投稿後: $AFTER_COUNT 件）"
            exit 0
          fi

          echo "新規コメントが確認できないため、フォールバックコメントを投稿します（投稿前後とも $BEFORE_COUNT 件）"
          FALLBACK_BODY=$'⚠️ 計画の自動提示に失敗した可能性があります。コード調査中に許可されていない操作が拒否される、または想定外のエラーが発生する等の理由で、計画コメントの投稿まで到達できなかったと考えられます。\n\nお手数ですが、`@claude` とコメントして再実行するか、必要であれば計画フェーズを経ずに人間が直接対応方針を指示してください。'
          FALLBACK_BODY="$FALLBACK_BODY"$'\n\n'"実行ログ: $RUN_URL"
          gh issue comment ${{ steps.state.outputs.issue_number }} --body "$FALLBACK_BODY"
          gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "00.check-user"

      - name: 分割前のコメント数を記録する
        id: before_split
        if: steps.state.outputs.mode == 'split'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="$(gh issue view ${{ steps.state.outputs.issue_number }} --json comments --jq '.comments | length')"
          echo "comment_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Claude Code（分割）
        if: steps.state.outputs.mode == 'split'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue create:*),Bash(gh issue close:*)"'
          prompt: |
            あなたはissue-deckリポジトリの実装エージェントです。Issue #${{ steps.state.outputs.issue_number }} は、
            人間が承認済みの計画（直前の`<!-- issue-deck-plan-type:split -->`マーカー付きコメント）により、
            このIssueのまま実装せず複数のサブIssueに分割することが決まっています。この分割を実行してください。

            ## 最初にやること
            `gh issue view ${{ steps.state.outputs.issue_number }} --comments` でIssueの本文と、承認済みの
            計画コメント（分割後の各サブIssue案）を確認してください。

            ## やること
            - 計画コメントに記載されたサブIssue案それぞれについて、
              `gh issue create --title "..." --body "..."` でサブIssueを作成する
              - 本文には「分割元: #${{ steps.state.outputs.issue_number }}」を含め、元Issueを読み返さなくても
                単独で着手できる程度に、対応するスコープの背景・要件を書く
              - 計画コメントでそのサブIssueにも`21.plan-required`が必要と書かれている場合は
                `--label "21.plan-required"`を付ける
              - 元Issueに`22.preview-required`または`23.screenshot-required`が付いており、かつそのサブIssue
                が画面に関わる変更を含む場合は、該当するラベルを引き継ぐ
              - 一度に作成するサブIssueは目安として6件程度までとする。計画がそれを超える数の分割を
                提案している場合、無理に全部作らず作成できた分にとどめ、残りは後述の親Issueコメントで
                「追って検討が必要」である旨を明記する
            - 全て作成したら `gh issue comment ${{ steps.state.outputs.issue_number }} --body "..."` で
              元Issueに作成したサブIssue一覧（`#番号`の形式で書けば自動的にリンクされる）をコメントする。
              コメント末尾に実行ログのリンク
              `実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
              を必ず追記する
            - 最後に `gh issue close ${{ steps.state.outputs.issue_number }} --reason "not planned"` を実行し、
              元Issueをクローズする（元Issueは今後このままでは実装されず、作業は上記サブIssueへ引き継がれる
              ことを明示するため）

            ## 迷った場合・行き詰まった場合の振る舞い
            - 許可されていない操作が拒否される等で行き詰まった場合、それ以上粘らず、その時点で作成できた
              サブIssue（0件でもよい）と状況を元Issueにコメントすることを最優先する
              （コメントを一切投稿できないまま終了することが最悪の結果のため）。この場合、元Issueの
              クローズは行わず、人間が状況を確認できるよう開いたままにする

            ## このステップでは行わないこと
            - サブIssueへの`@claude`コメント投稿など、サブIssueの実装を自動的に開始させる操作は行わない
              （サブIssueの着手はこれまでどおり人間が個別に`@claude`とコメントして起動する）
            - コードの変更・コミット・ブランチ作成・PR作成は一切行わない

      - name: 分割結果を検証し、必要ならフォールバックする
        # 計画コメント投稿の検証と同じ考え方。サブIssue作成後の親Issueコメントが確認できない場合、
        # 途中で行き詰まった可能性があるためフォールバック通知を投稿する。
        if: always() && steps.state.outputs.mode == 'split'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          AFTER_COUNT="$(gh issue view ${{ steps.state.outputs.issue_number }} --json comments --jq '.comments | length')"
          BEFORE_COUNT="${{ steps.before_split.outputs.comment_count }}"
          : "${BEFORE_COUNT:=0}"
          if [ "$AFTER_COUNT" -gt "$BEFORE_COUNT" ]; then
            echo "新規コメントを確認できたため分割の完了または途中経過の報告は行われたとみなします（投稿前: $BEFORE_COUNT 件, 投稿後: $AFTER_COUNT 件）"
            exit 0
          fi

          echo "新規コメントが確認できないため、フォールバックコメントを投稿します（投稿前後とも $BEFORE_COUNT 件）"
          FALLBACK_BODY=$'⚠️ Issueの分割に失敗した可能性があります。サブIssueの作成中に許可されていない操作が拒否される、または想定外のエラーが発生する等の理由で、コメント投稿まで到達できなかったと考えられます。\n\nお手数ですが、`@claude` とコメントして再実行するか、必要であれば人間が直接Issueを分割してください。'
          FALLBACK_BODY="$FALLBACK_BODY"$'\n\n'"実行ログ: $RUN_URL"
          gh issue comment ${{ steps.state.outputs.issue_number }} --body "$FALLBACK_BODY"
          gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "00.check-user"

      - name: 実装前のコメント数を記録する
        id: before_implement
        # additionalモード(PR未作成の詰まった状態からの再開を含む)も、implementと同様に
        # 途中で行き詰まって無言のまま終了しうるため、フォールバック検証の対象に含める。
        if: steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="$(gh issue view ${{ steps.state.outputs.issue_number }} --json comments --jq '.comments | length')"
          echo "comment_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: 既存ブランチをcheckoutする（追加対応時）
        # 実装着手直前に都度最新化する。他エージェント・人間による手動コミットとの競合を避けるため、
        # 先にcheckoutした develop の内容は使わず、ここで改めて既存ブランチへ切り替える(#129)。
        if: steps.state.outputs.mode == 'additional'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -e
          git fetch origin "${{ steps.state.outputs.branch }}"
          git checkout "${{ steps.state.outputs.branch }}"

      - name: Setup pnpm（DBセットアップ用）
        if: steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js（DBセットアップ用）
        if: steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: 依存関係をインストールする（DBセットアップ用）
        # 後続のprisma migrate deploy・シードスクリプト実行に必要。実装エージェント自身も
        # lint/typecheck/build実行のため`pnpm install`を行うが、ここで先に済ませておくことで
        # ロックファイルどおりの依存関係でマイグレーション・シードを確実に実行する。
        if: steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional'
        run: pnpm install --frozen-lockfile

      - name: DBマイグレーションを適用する
        # 無人実行で`pnpm dev`を起動できるようにするための土台(#256)。実際に開発サーバーを
        # 起動して画面を確認する処理自体は別Issueで統合する。
        if: steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional'
        env:
          DATABASE_URL: mysql://placeholder:placeholder@127.0.0.1:3306/app_issue_deck
        run: pnpm db:migrate:deploy

      - name: 画面確認用のダミーデータをシードする
        # 実際のGitHub Appとの同期処理(src/lib/github/sync-issues.ts等)は使わず、Prismaで
        # 直接最小限のダミーデータ（リポジトリ・Issue数件）を投入する(#256)。
        if: steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional'
        env:
          DATABASE_URL: mysql://placeholder:placeholder@127.0.0.1:3306/app_issue_deck
        run: pnpm db:seed:ci

      - name: 01.wip を付与する（実装着手時）
        # Claude Codeエージェント自身にラベル付与を委ねるとLLMの実行タイミング・忘れに
        # 依存してしまう(実際、コメント投稿から付与まで数分〜10分ほど遅延する例があった)ため、
        # 実装着手前にシェルスクリプトで直接・確実に付与する。
        if: steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "${{ steps.state.outputs.mode }}" = "additional" ]; then
            gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "01.wip" --remove-label "03.d:marge"
          else
            gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "01.wip"
          fi

      - name: Claude Code（実装・PR作成）
        if: steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional'
        uses: anthropics/claude-code-action@v1
        env:
          # .github/workflows/配下を変更するIssueでもgit pushが拒否されないよう、workflow書き込み
          # 権限を持つPAT(secrets.WORKFLOW_PAT)を使う(issue #106)。Checkoutステップと同じPAT。
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.WORKFLOW_PAT }}
          show_full_output: true
          claude_args: '--allowedTools "Edit,Write,Read,Bash(git:*),Bash(gh:*),Bash(pnpm:*),Bash(npx:*),Bash(curl:*)"'
          prompt: |
            あなたはissue-deckリポジトリのIssueごとの実装エージェントです。GitHub Actions上で無人実行されて
            おり、対応するIssueは #${{ steps.state.outputs.issue_number }} のみです。このワークフロー実行の
            モードは `${{ steps.state.outputs.mode }}` です。

            - `implement`（新規実装）: 現在のワークツリーは `develop` の最新コミットをチェックアウトした
              状態です。新しく作業ブランチを作成し、新規にPull Requestを作成します。
            - `additional`（既存ブランチへの追加対応）: このIssueに対応する作業ブランチ
              `${{ steps.state.outputs.branch }}` が既に存在し、現在のワークツリーは既にそのブランチを
              checkout済みです。新規ブランチは作成しません。develop向けPull RequestのURLは
              `${{ steps.state.outputs.pr_url }}` です（空の場合は後述のとおりPR未作成の再開ケースです）。
              - PR作成済み（上記URLが空でない場合）: 直近のIssueへの`@claude`コメントへの対応です。まず、
                そのコメントが「コード変更を伴う追加の実装依頼」か「単なる質問・確認」かを判定してください。
                - 単なる質問・確認と判断した場合: コードは一切変更せず、コミット・pushは行いません。
                  `gh pr comment`（またはIssueへの`gh issue comment`）で質問への回答のみを簡潔に投稿します。
                  なお、このステップの直前のシェルステップで既に`01.wip`が付与され`03.d:marge`が
                  外されているため、状態を元に戻すために
                  `gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "03.d:marge" --remove-label "01.wip"`
                  のみ実行してください（`00.check-user`等、他のラベルは変更しません）。以降の「責務」
                  「画面確認・スクリーンショットについて」の手順は行わず、ここで対応を終了してください。
                - コード変更が必要な依頼と判断した場合: それを踏まえて追加コミットし、新規PRは作らず
                  既存PRにコメントで報告します（以下の「責務」に従って進めてください）。
              - PR未作成（上記URLが空の場合）: 前回の実装試行がPR作成に至らないまま（権限拒否・
                エラー等で）終了した可能性があります。まず`git log develop..HEAD --stat`・`git status`・
                `git diff develop`で現在のブランチの状態を確認してください。
                - 既にコミットされた変更が把握できる内容であれば、それを踏まえて実装を続行して
                  ください（ゼロからやり直す必要はありません）。完了したら新規にPull Requestを
                  作成してください（`implement`と同じ手順）。
                - 続行が難しいほど中途半端・矛盾した状態だと判断した場合は、無理に修正しようと
                  せず、現在の状態を`gh issue comment`で報告し
                  `gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "00.check-user"`
                  を実行して停止してください（ブランチの削除・作り直しは人間の明示操作でのみ行われ、
                  このワークフローが自動で行うことはありません）。

            ## 最初にやること
            - `gh issue view ${{ steps.state.outputs.issue_number }} --comments` でIssueの最新の本文・
              ラベル・コメントを確認する（`implement`で`21.plan-required`が付いている場合、承認済みの
              計画がIssueコメントに投稿されているはずなので、それに沿って実装する。`additional`でPR
              作成済みの場合は、直近の`@claude`コメントの内容を踏まえて対応する。PR未作成の再開の
              場合は、過去のコメント履歴や既存のコミットから前回どこまで実装が進んでいたかも把握する）
              （`01.wip`ラベルの付与・`03.d:marge`からの付け替えは、このステップの前段のシェルステップで
              既に完了しているため、ここで行う必要はない）
            - `implement`の場合のみ`git checkout -b ${{ steps.state.outputs.branch }}`で作業ブランチを
              作成する（`additional`の場合は既にcheckout済みのため不要）

            ## Issue本文・コメントに画像が含まれる場合
            issue-deck独自の画像アップロードAPI（`/api/issues/images/...`のURL）で貼り付けられた画像は、
            GitHub純正の画像CDNではないため自動では読み込めません。実装内容の把握に画像の内容確認が必要な
            場合は、`curl -o /tmp/<適当なファイル名> "<画像URL>"`で一時ファイルにダウンロードしたうえで、
            `Read`ツールでそのローカルファイルを開いて内容を確認してください（URLを直接`Read`しても開けません）。

            ## 責務
            - Issueの要件を実装する
            - テスト・Lint・型チェック・ビルドを実行する
            - 変更をコミットする（コミットメッセージは日本語、1〜2文で変更の目的を書き、末尾に
              `#${{ steps.state.outputs.issue_number }}` を付ける。Authorは
              `Claude Code <claude-code@example.com>` にする）
            - ブランチをpushする
              - `implement`の場合: `git push -u origin ${{ steps.state.outputs.branch }}`
              - `additional`の場合: `git push origin ${{ steps.state.outputs.branch }}`（既に追跡設定済み
                のため`-u`は不要）。pushが拒否された場合は
                `git pull --rebase origin ${{ steps.state.outputs.branch }}`で追随し、1回だけリトライする。
                それでも失敗する場合はそれ以上リトライせず、
                `gh issue comment ${{ steps.state.outputs.issue_number }}`で他の変更と競合したため
                追加対応を中断した旨を人間に報告して停止する
            - Pull Requestを作成・更新する
              - `implement`の場合、または`additional`でPRがまだ無い場合:
                `gh pr create --base develop --head ${{ steps.state.outputs.branch }}`で
                `develop`向けPull Requestを作成する（タイトル・本文は日本語。本文には対応Issue・実装内容・
                テスト内容・確認方法・注意点を記載する。developマージ時点ではissueをcloseしない運用のため
                `closes #番号` / `fixes #番号`は使わず、`#${{ steps.state.outputs.issue_number }}`のように
                番号のみ記載する）
              - `additional`でPRが既にある場合: 新規PRは作成しない。既存のPull Request
                （${{ steps.state.outputs.pr_url }}）に`gh pr comment`で、今回追加でpushしたコミットの
                内容を日本語で要約して投稿する
            - 完了したら`gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "03.d:marge" --remove-label "01.wip"`
              を実行する（`additional`の場合も同じコマンドで`01.wip`↔`03.d:marge`の付け替えを閉じる。
              `00.check-user`には触れない。このワークフローのgit push/PR作成はPAT
              （`secrets.WORKFLOW_PAT`）で行っており`.github/workflows/issue-labels.yml`が自動発火する
              可能性があるが、未検証のため当てにせず、必ず自分でこのコマンドを実行すること）
            - 最後に `gh issue comment ${{ steps.state.outputs.issue_number }} --body "..."` で対応完了の
              報告コメントをIssueに投稿する（無人実行のため、この報告が使用者にとって唯一の完了確認手段に
              なる）。新規にPRを作成した場合はそのURL、既存PRにコメントした場合は追加コミットした旨と
              対象PR（${{ steps.state.outputs.pr_url }}）のURLに加えて、どのような変更・追加対応を行ったかの
              要約（触ったファイルや対応内容が使用者に伝わる程度の箇条書き）を日本語で含めること

            ## 画面確認・スクリーンショットについて
            無人実行のため、開発サーバーを起動しての画面確認やPlaywright等によるスクリーンショット取得は
            できません。
            - Issueに`22.preview-required`または`23.screenshot-required`のいずれかのラベルが付いている
              場合は、実装・テストまで終えた時点で上記の完了処理（新規PR作成またはPRコメント投稿）を
              行わず、ブランチのpushまでは行ったうえで、代わりに
              `gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "00.check-user"`を実行し
              （`01.wip`はそのままにし`03.d:marge`への付け替えは行わない）、実装内容の要約と「画面確認が
              必要なため人間の確認を待っています」旨を`gh issue comment`で投稿して停止してください。
              - `22.preview-required`が付いている場合は、このコメントに開発サーバーのプレビューURLも
                あわせて記載する。無人実行では実際にdevサーバーを起動できないため、人間が手元で
                ブランチをcheckoutして`pnpm dev`を起動した際に開くURLとして、
                `docs/multi-agent-workflow.md`のポート割り当て規約（`PORT=4000 + Issue番号`。本Issueの
                番号は${{ steps.state.outputs.issue_number }}）に従い、以下の2形式で案内する。
                ・`http://localhost:<ポート>`
                ・`http://<WSLまたはLANのIPアドレス>.sslip.io:<ポート>`（同一LAN上の別端末から確認する
                場合。IPアドレスは人間が手元の環境に合わせて読み替える）
              - 新規にPRを作成する予定だった場合の文言例:「ブランチ `${{ steps.state.outputs.branch }}` の
                内容を確認のうえ、問題なければ手動でPRを作成してください」
              - 既存PRにコメントする予定だった場合の文言例:「ブランチ `${{ steps.state.outputs.branch }}`
                に追加コミットをpushしました。Pull Request（${{ steps.state.outputs.pr_url }}）の内容を
                確認してください」
              コメント末尾に、このワークフロー実行への追跡用リンクとして
              `実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
              を必ず追記する
            - 上記いずれのラベルも付いていない場合は、通常どおり完了処理まで進めてください

            ## 禁止事項
            - `main` / `develop` への直接コミット・push
            - 他Issueのブランチの編集
            - 不要なforce push
            - 自分が作成したPull Requestの自己マージ

            ## コミット・PRの書き方
            - コミットメッセージ・PRタイトル・PR本文は英語ではなく日本語で書く
            - PR本文の見出し（Summary/Test planなど）は英語でもよいが、説明文は日本語で書く

      - name: 実装結果を検証し、完了・待ち状態が確認できない場合はフォールバック通知する
        # Claude Codeエージェントに完了報告コメントの投稿を委ねるだけだと、途中でエラー終了した場合や
        # 許可されていない操作で行き詰まった場合に「どうなったか」が使用者に一切伝わらない恐れがある。
        # そのため計画コメントの検証と同じ考え方で、後続のステップとして独立に結果を確認する。
        # additionalモード(PR未作成の詰まった状態からの再開を含む)も同じ理由で対象に含める。
        if: always() && (steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          BRANCH="${{ steps.state.outputs.branch }}"
          ISSUE_NUMBER="${{ steps.state.outputs.issue_number }}"

          AFTER_COUNT="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments | length')"
          BEFORE_COUNT="${{ steps.before_implement.outputs.comment_count }}"
          : "${BEFORE_COUNT:=0}"
          if [ "$AFTER_COUNT" -gt "$BEFORE_COUNT" ]; then
            echo "新規コメントを確認できたため、完了または待ち状態の通知は行われたとみなします（投稿前: $BEFORE_COUNT 件, 投稿後: $AFTER_COUNT 件）"
            exit 0
          fi

          PR_URL="$(gh pr list --head "$BRANCH" --state all --json url --jq '.[0].url // empty' 2>/dev/null || true)"
          if [ -n "$PR_URL" ]; then
            echo "コメントは無いがPRの存在を確認できたため、フォールバックとして完了報告コメントを投稿します: $PR_URL"
            PR_BODY="$(gh pr view "$BRANCH" --json body --jq '.body // empty' 2>/dev/null || true)"
            FALLBACK_BODY="✅ 実装が完了し、Pull Requestを確認できました: $PR_URL"
            if [ -n "$PR_BODY" ]; then
              FALLBACK_BODY="$FALLBACK_BODY"$'\n\n---\n\n'"$PR_BODY"
            fi
            gh issue comment "$ISSUE_NUMBER" --body "$FALLBACK_BODY"
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "新規コメント・PRのいずれも確認できないため、フォールバックコメントを投稿します"
          FALLBACK_BODY="⚠️ 実装ステップが終了しましたが、コメント投稿・PR作成のいずれも確認できませんでした。調査や実装の途中で行き詰まった、またはエラーで終了した可能性があります。実行ログをご確認ください: $RUN_URL"
          gh issue comment "$ISSUE_NUMBER" --body "$FALLBACK_BODY"
          gh issue edit "$ISSUE_NUMBER" --add-label "00.check-user"
