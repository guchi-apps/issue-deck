name: Claude Issue Dispatch
# 対象issue番号をActionsの実行一覧で見分けられるようにする(#1113)。計画/実装フォールバック
# 検証ステップの自動リトライ通知が「自動的に再実行します」の実行ログURLとして新しく起動した
# runを特定する際、この表示名(displayTitle)をgh run listでの絞り込みに使う。
run-name: "Issue #${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number || github.event.issue.number }}"

# Issueへの@claudeコメントを起点にした無人実行の、issue-deck自身のトリガー定義(#945)。
# ジョブ本体はreusable-issue-dispatch.ymlへ切り出し、他リポジトリからも同じ実体を
# 呼べるようにしている(方式は#934、最初の適用例は#940)。
#
# issue-deck自身はローカルパス参照(./)を使い、常にそのブランチ・PRの内容で動かす。
# 他アプリはタグ固定(@workflows/vX)で参照する運用とし、issue-deck側が先に壊れて
# 他アプリには波及しない「カナリア」構成にする(#934)。
on:
  issues:
    types: [unlabeled]
  issue_comment:
    types: [created]
  # 計画/実装フォールバック検証ステップ(下記「計画コメント投稿を検証し、必要ならフォールバックする」
  # 「実装結果を検証し、完了・待ち状態が確認できない場合はフォールバック通知する」)専用の自己リトライ
  # 起動経路(#497)。issue_number/retry_attemptともにgh workflow runから渡す想定で、人間が直接
  # 手動実行することも許容する(GitHub側がworkflow_dispatchの実行自体にwrite権限を要求するため、
  # 実行者チェックの信頼レベルは他のトリガー経路と同等)。
  workflow_dispatch:
    inputs:
      issue_number:
        description: "対象issue番号"
        required: true
        type: string
      retry_attempt:
        description: "これまでの自動リトライ回数(0始まり。指定した回数の次の試行として実行する)"
        required: false
        type: string
        default: "0"

jobs:
  dispatch:
    uses: ./.github/workflows/reusable-issue-dispatch.yml
    # issue-deckは唯一pnpmを使うリポジトリ(他の全アプリはnpm)。既定は多数派のnpmのため明示する。
    with:
      runtime-setup: node-db
      package-manager: pnpm
      database-name: app_issue_deck
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
