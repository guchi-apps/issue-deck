name: Claude Issue Dispatch

# Issueへの@claudeコメントを起点にした無人実行の、issue-deck自身のトリガー定義(#945)。
# ジョブ本体はreusable-issue-dispatch.ymlへ切り出し、他リポジトリからも同じ実体を
# 呼べるようにしている(方式は#934、最初の適用例は#940)。
#
# issue-deck自身はローカルパス参照(./)を使い、常にそのブランチ・PRの内容で動かす。
# 他アプリはタグ固定(@workflows/vX)で参照する運用とし、issue-deck側が先に壊れて
# 他アプリには波及しない「カナリア」構成にする(#934)。
#
# プレビュー系の2ジョブは、呼び出すdeploy-preview.ymlの中身がアプリ固有(Fly.io設定)の
# ため、共通化せずここに残している。
on:
  issues:
    types: [unlabeled]
  issue_comment:
    types: [created]
  # 計画/実装フォールバック検証ステップ(下記「計画コメント投稿を検証し、必要ならフォールバックする」
  # 「実装結果を検証し、完了・待ち状態が確認できない場合はフォールバック通知する」)専用の自己リトライ
  # 起動経路(#497)。issue_number/retry_attemptともにgh workflow runから渡す想定で、人間が直接
  # 手動実行することも許容する(GitHub側がworkflow_dispatchの実行自体にwrite権限を要求するため、
  # 実行者チェックの信頼レベルは他のトリガー経路と同等)。
  workflow_dispatch:
    inputs:
      issue_number:
        description: "対象issue番号"
        required: true
        type: string
      retry_attempt:
        description: "これまでの自動リトライ回数(0始まり。指定した回数の次の試行として実行する)"
        required: false
        type: string
        default: "0"

jobs:
  dispatch:
    uses: ./.github/workflows/reusable-issue-dispatch.yml
    # issue-deckは唯一pnpmを使うリポジトリ(他の全アプリはnpm)。既定は多数派のnpmのため明示する。
    with:
      runtime-setup: node-db
      package-manager: pnpm
      database-name: app_issue_deck
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write


  # 23.preview-requiredが付いているIssueで実装(implement/additional)が完了した場合、
  # deploy-preview.yml(#831)を呼び出し、実装ブランチ(issue-<番号>)を実際にFly.io Machines上へ
  # デプロイする(#832)。developではなく実装ブランチそのものをデプロイ対象にするのは、develop向け
  # PRのレビュー中に実際の変更内容を画面で確認できるようにするため。
  #
  # mode判定にはtriageジョブの出力(待機前の判定)ではなくdispatchジョブのoutputs.final_mode
  # (「triageの判定結果を引き継ぐ」ステップの陳腐化チェック後の値)を使う。concurrencyの順番待ちの
  # 間にIssueがクローズされる・00.check-userが付与される等でdispatch側がmode=skipへ倒した場合に、
  # 実装が行われていないのにデプロイだけ走ってしまうのを防ぐため。
  #
  # 独自の`if:`条件を指定しているが、always()/failure()/cancelled()を使っていないため、
  # GitHub Actionsの仕様によりsuccess()が暗黙にANDされる。そのためdispatchジョブが失敗した
  # 場合はこのジョブも実行されない。
  deploy-preview:
    needs: [dispatch]
    if: needs.dispatch.outputs.preview_required == 'true' && (needs.dispatch.outputs.final_mode == 'implement' || needs.dispatch.outputs.final_mode == 'additional')
    uses: ./.github/workflows/deploy-preview.yml
    with:
      ref: ${{ needs.dispatch.outputs.branch }}
      # Issueごとに専用のFly.ioアプリ(<fly.tomlのapp>-<Issue番号>)へデプロイし、複数の
      # プレビューを同時に別々のURLで提供できるようにする(#892)。
      issue_number: ${{ needs.dispatch.outputs.issue_number }}
    secrets: inherit


  # deploy-previewジョブの結果をIssueへ別コメントとして通知する。実装完了報告コメント
  # (dispatchジョブ内のClaude Codeステップが投稿するもの)は、deploy-previewジョブの完了を
  # 待たずに投稿される(本番DBダンプ・サニタイズ・fly deploy等を含み数分かかるため、実装ステップの
  # 中で同期的に待つことができない)。実際に開けるプレビューURLは、本ジョブが後から別コメントとして
  # 追記する。
  #
  # `always()`で起動しつつ、deploy-previewがskipされた場合(preview_required=falseや
  # mode不一致)は通知しない。deploy-previewが失敗した場合は成功時と同じジョブから失敗を報告する
  # (notify-failureジョブと役割が重ならないよう、プレビューデプロイ固有の失敗はこちらで扱う)。
  notify-preview-url:
    needs: [dispatch, deploy-preview]
    if: always() && needs.deploy-preview.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: プレビューURLをIssueに通知する
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.dispatch.outputs.issue_number }}
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          SKIPPED_REASON: ${{ needs.deploy-preview.outputs.skipped_reason }}
          DEPLOY_RESULT: ${{ needs.deploy-preview.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          # skipped_reasonが非空のときは、デプロイ自体を意図的に見送っている(#892)。
          # 「失敗」ではないため、原因に応じた対処方法を案内する。
          case "$SKIPPED_REASON" in
            limit_reached:*)
              COUNTS="${SKIPPED_REASON#limit_reached:}"
              BODY="⏸️ プレビュー環境の同時起動数が上限に達しているため（${COUNTS}）、このIssueのプレビューは作成していません。"
              BODY="$BODY"$'\n\n''他のIssueで不要になったプレビュー環境を破棄すると枠が空きます。破棄はそのIssueをクローズするか、`23.preview-required`ラベルを外すと自動で行われます（`.github/workflows/cleanup-preview.yml`）。'
              BODY="$BODY"$'\n\n''枠が空いたら、このIssueに `@claude` とコメントすれば改めてプレビューが作成されます。'
              ;;
            create_failed)
              BODY="⚠️ プレビュー環境用のFly.ioアプリを作成できなかったため、プレビューを作成していません。"
              BODY="$BODY"$'\n\n''`FLY_API_TOKEN`がorganizationスコープのトークンか確認してください（特定アプリに限定されたデプロイトークンでは新規アプリを作成できません）。'
              BODY="$BODY"$'\n\n'"実行ログ: $RUN_URL"
              ;;
            "")
              if [ "$DEPLOY_RESULT" = "success" ] && [ -n "$PREVIEW_URL" ]; then
                BODY="🚀 プレビュー環境へのデプロイが完了しました。実際に開けるプレビューURLはこちらです: $PREVIEW_URL"
                BODY="$BODY"$'\n\n''このプレビューはこのIssue専用です。develop向けPRのマージ、またはIssueのクローズで自動的に破棄されます。'
              else
                BODY="⚠️ プレビュー環境へのデプロイに失敗しました（結果: $DEPLOY_RESULT）。実行ログをご確認ください: $RUN_URL"
              fi
              ;;
            *)
              BODY="⚠️ プレビュー環境へのデプロイを見送りました（理由: $SKIPPED_REASON）。実行ログをご確認ください: $RUN_URL"
              ;;
          esac
          BODY="$BODY"$'\n\n<!-- issue-deck-source:claude-issue-dispatch -->'$'\n\n<!-- issue-deck-agent:implementer -->'
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"
