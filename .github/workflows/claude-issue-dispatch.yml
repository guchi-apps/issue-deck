name: Claude Issue Dispatch

# Issueへの@claudeコメントを起点に、ローカルのscripts/start-issue.shが行っている作業
# (issue-<番号>ブランチ作成・実装・develop向けPR作成)をGitHub Actions上で無人実行する
# (docs/multi-agent-workflow.md Phase5)。
#
# 21.plan-requiredラベルが付いているissueは二段階トリガーにする(無人実行では
# 対話的な承認者がその場にいないため):
#   1. 計画をIssueコメントとして投稿し、00.check-userを付与して停止する(implementはしない)
#   2. 人間が計画を確認し、00.check-userラベルを外すと「承認」とみなして実装を再開する
#      (00.check-userが付いたままの状態で新たに@claudeコメントが付いた場合は、計画の
#      練り直し依頼として扱い、計画コメントを投稿し直す。00.check-userは外さない)
#      計画コメントへの反応が「質問」と判定された場合も、回答コメント投稿後に00.check-userを
#      必ず再付与する(issue-deck画面の「修正」ボタンは送信前に機械的に00.check-userを外すため、
#      質問と判定されると確認待ちラベルが復元されないまま消えてしまう問題があった。#417)
#      00.check-userはPhase4の自動マージ不可判定でも使われる汎用の「要確認」ラベルだが、
#      実装ブランチ(issue-<番号>)がまだ存在しない状態でのみ「承認」と解釈するため、
#      既にPRが存在する状態(Phase4側の要確認)で外されても実装が誤って再始動することはない。
#      「00.check-user・21.plan-requiredともに付いていない」状態を承認済みとみなして実装を
#      再開する判定自体はissues/unlabeled・issue_commentどちらのイベント経由でも同じロジックで
#      行う(下記「実行者の権限・状態を判定する」ステップ)。issue-deckアプリの承認ボタンは
#      ラベル更新を個人のGitHub OAuthトークン(user.githubAccessToken)経由で行うため、
#      GitHub上は操作した本人のアカウントによるissues/unlabeledイベントとして記録され、
#      自己ループ防止ロジック(Bot判定)には引っかからない(#566。旧: GitHub Appインストール
#      トークンでissue-deck[bot]として記録され、ラベル更新に続けて個人アカウントでの
#      @claudeコメントも送信することで実装を再開させていた。#173)。ただし21.plan-required保持時
#      (ブランチ未作成の計画承認・練り直し)は、ラベル除去イベント単独で実装再開に必要な情報が
#      揃うため、アプリが続けて送る確認コメントと二重に実装を再始動しかねない。この場合のみ
#      アプリは確認コメント本文に<!-- issue-deck:no-trigger -->マーカーを付与し(下記「@claudeトリガー
#      の判定」を参照)、ラベル除去イベント単独を正規のトリガーとする(#566)。ブランチ・PR作成後の
#      状態(03.d:marge/07.m:margeでの「修正を依頼する」等)は後述のBRANCH_EXISTSガードにより
#      二重発火の実害が無いため、確認コメントにマーカーは付けない。
#   3. 承認・練り直しのいずれもせず計画を拒否する場合は、人間がIssueを直接クローズする
#      (`not planned`等の理由。コメントに@claudeを含める必要はない)。クローズ済みIssueは
#      本ワークフローの全モードで再始動しないため(issue_closedガード)、クローズ後に
#      issue-labels.ymlのcleanup-on-closeジョブが00.check-userを除去しても安全(issue #172)。
#
# 21.plan-requiredの計画提示ステップは、実装範囲が広くGitHub Actions上で一度に処理しきれない
# 懸念がある場合、計画コメントをサブIssueへの分割案として提示できる(#144)。計画コメント末尾に
# 埋め込む<!-- issue-deck-plan-type:implement|split -->マーカーにより、00.check-user解除時に
# 実装(mode=implement)を始めるかサブIssueへの分割(mode=split)を始めるかを判定する。
# mode=splitでは、承認済みの計画コメントに沿って`gh issue create`でサブIssueを作成し、元Issue
# にサブIssue一覧をコメントしたうえで元Issueを`not planned`理由でクローズする。サブIssueへの
# 実際の着手は、これまでどおり人間が各サブIssueに`@claude`とコメントして個別に起動する
# (自動連鎖起動はしない)。
#
# クローズ済みのIssueに対する@claudeコメント・ラベル操作では、実装・計画・分割のいずれも
# 再始動しない(mode=skip)。上記の分割で元Issueがクローズされた後に誤って再始動しないための
# ガードだが、通常の09.mainクローズ後のIssueにも同様に適用される。
#
# issue-detail.tsx等の「Claudeに質問する」ダイアログ(src/lib/github/ask-claude.ts)が投稿する
# `@claude 質問: `で始まるコメントは、コード変更を伴わない読み取り専用の質問応答(mode=ask)として
# 扱う。実装状況(実装中・承認待ち・PR作成後・クローズ済み等、上記いずれの状態でも)によらず常に
# 最優先で割り込み、ラベル変更・ブランチ作成・コミット・PR作成は一切行わずIssueへの回答コメントの
# 投稿のみを行う(#216)。
#
# issue-<番号>ブランチが既に存在する場合でも、issue_commentトリガー(人間からの明示的な
# @claudeコメント)であれば、以下のいずれかに該当する限りmode=additional(既存ブランチへの
# 追加対応)として扱う。00.check-userの有無は問わない(Phase4の要確認判定と、人間からの追加
# 依頼は独立した文脈のため)。新規ブランチは作らず、既存のissue-<番号>ブランチをcheckoutして
# 続きから作業する。
#   - PRがOPEN(#129): 追加の依頼内容としてコミットをpushし、既存PRにコメントで報告する。
#   - PRがまだ一度も無く、かつ02.wipが付いている(#112): 前回の実装試行がPR作成に至らないまま
#     (権限拒否・エラー等で)終了し詰まった状態の可能性がある。ブランチを削除して作り直すのは
#     人間しかできない(自動では行わない。前回コミットまで進んでいた作業を無言で失わせない
#     ため)が、その既存ブランチをそのままcheckoutして続きから再開すること自体は自動で行い、
#     完了時に新規でPRを作成する(実装ステップのプロンプト内で、現在のブランチの状態を確認して
#     続行可能か判断させる)。
# PRがMERGED/CLOSED、またはPRが無く02.wipも付いていない異常な中間状態の場合は、従来どおり
# mode=skipとし、実装は再始動しない。
#
# PRがOPENの状態(上記1つ目)で、直近の@claudeコメントが「単なる質問・確認」と判定された場合も、
# mode=plan(上記21.plan-required)の質問判定分岐と同様に、回答コメント投稿後に00.check-userを
# 必ず再付与する。issue-deck画面の「修正を依頼する」ボタンは送信前に機械的に00.check-userを
# 外す一方、質問と判定されるとコミット・pushが発生せずclaude-review-develop.yml側の再判定による
# 復元も起きないため、確認待ちラベルが失われたままになる問題があった(#417と同種の問題。#528)。
#
# パブリックリポジトリのため、Issueへのコメント自体は誰でも投稿できる。ラベルの
# 付与・削除にはリポジトリへのwrite権限が必要でGitHub側で担保されるが、
# @claudeコメントによる起動は権限を持たない第三者からも到達しうるため、
# 全トリガー経路で一律に実行者(github.actor)のリポジトリ権限を確認し、
# write権限未満の場合は何もしない。ただし issue-deckアプリ自身のGitHub App経由の
# コメント投稿(issue-deck[bot])は、人間がアプリ画面上で操作していてもGitHub上は
# 常にBot扱いになるため例外とし、アプリがコメント本文に埋め込む投稿者マーカーから
# 実際に操作した人間を復元したうえで同様に権限確認する(詳細は後述のステップを参照)。
#
# 対象issueの番号はissues/issue_commentイベントの github.event.issue.number
# からそのまま取得できる(ブランチ名からの推測が必要な他ワークフローと異なる)。
# 値はscript injectionを避けるため env 経由でのみ参照し、run: 本文に直接
# 展開しない(.github/workflows/issue-labels.yml と同じ方針)。
#
# @claudeトリガーの判定はcontains()ではなくstartsWith()を使う(#173)。containsだと、この
# ワークフロー自身が投稿する完了報告コメント(APPROVE_COMMENT_BODY等の定型コメント本文を
# 説明のため引用する場合や、ドキュメント・コード中の`@claude`という記述を含む場合)にまで
# 反応し、報告コメント→再トリガー→報告コメント...の無限ループを起こしうる
# (実際に#173で2回連続発生した)。issue-detail.tsx・mobile-issue-detail.tsx・
# approval-labels.ts・start-implementation.tsが送信する定型コメントは全て本文の先頭が
# `@claude`であり、人間が手動で投稿する起動コメントも同様の慣習(先頭に`@claude`)のため、
# startsWith()に絞っても正規の起動経路は損なわれない。
#
# ブランチのpush(Checkoutステップ)・実装ステップのgit push/PR作成はGITHUB_TOKENではなく、
# secrets.WORKFLOW_PAT(workflowスコープ/Repository permissions > Workflows: Read and write
# を持つFine-grained PAT)を使う(issue #106)。既定のGITHUB_TOKENは`.github/workflows/`配下への
# push権限をGitHubの仕様上原理的に持てない(リポジトリのWorkflow permissions設定をRead and write
# にしても解除されない制限)ため、本ワークフロー自身がワークフローファイルを変更するIssueを
# 扱えるようにするにはPATが必須。副次効果として、GITHUB_TOKENによるpush/PR作成と異なりPATに
# よるpush/PR作成は他のワークフローを起動できるため、ここで作成したPRに対して
# .github/workflows/claude-review-develop.yml(Phase3自動レビュー・Phase4自動マージ)が
# 自動発火する可能性がある(未検証)。develop向けPR作成までが本ワークフローの完了条件であり、
# developへのマージまでの自動化は前提としないが、自動発火した場合はそれ自体は許容する。
#
# 計画提示ステップ・実装ステップそれぞれのフォールバック検証ステップ(「計画コメント投稿を検証し、
# 必要ならフォールバックする」「実装結果を検証し、完了・待ち状態が確認できない場合はフォールバック
# 通知する」)は、新規コメント・PRのいずれも確認できず行き詰まったと判断した場合、全リポジトリ共通の
# 自動リトライ上限(GET /api/settings/auto-retryで取得するautoRetryLimit、#496・#497)未満で
# あれば、workflow_dispatchで自分自身を再起動して再試行する(#497)。上限に達した場合
# (未設定なら常に上限0扱い)は従来どおり00.check-userを付与して停止する。自己再起動のgh workflow run
# 呼び出しはGITHUB_TOKENでは新たなワークフロー実行を誘発しない制約があるためWORKFLOW_PATを使う。
# workflow_dispatchトリガー自体は、issue_comment/issuesの各トリガーと異なりBot判定・実行者
# パーミッション確認(下記「実行者の権限・状態を判定する」ステップ)を経由しない。これは
# workflow_dispatchのAPI呼び出し自体がリポジトリへのwrite権限を要求するGitHub側の仕様により、
# 同等の信頼レベルが既に担保されているため。
#
# 上記のフォールバック検証ステップは、いずれもdispatchジョブ内のステップとして動く。そのため
# dispatchジョブが「対応開始をコメントで通知する」より前の段階(Set up job・Checkout等)で落ちた
# 場合は、どのフォールバックも動かずIssue側に痕跡が一切残らない。これを拾うために、dispatchとは
# 独立したnotify-failureジョブで起動失敗を通知する(#650)。
#
# ジョブは triage → dispatch → notify-failure の3段構成(#651)。
#   triage        : 実行者の権限・issueの状態を判定してmodeを決める。concurrency・services・uses:
#                   のいずれも持たず即時実行される。受理を示す👀リアクションと、mode=skipのうち
#                   コメント返信が必要なケース(#105)もここで処理する。
#   dispatch      : mode!=skipのときだけ動く重い本体。issueごとのconcurrency(#129)とmysqlの
#                   サービスコンテナ(#256)はこのジョブだけが持つ。先頭でtriageの判定を
#                   id: state として引き継ぎ、以降のステップは従来の記述のまま動かす。
#   notify-failure: triage/dispatchのいずれかが失敗した場合にIssueへ通知する(#650)。
# この分離により、実測で全runの54%を占めていたmode=skipのrunが、concurrency枠もサービス
# コンテナもactionのダウンロードも消費しなくなる。

on:
  issues:
    types: [unlabeled]
  issue_comment:
    types: [created]
  # 計画/実装フォールバック検証ステップ(下記「計画コメント投稿を検証し、必要ならフォールバックする」
  # 「実装結果を検証し、完了・待ち状態が確認できない場合はフォールバック通知する」)専用の自己リトライ
  # 起動経路(#497)。issue_number/retry_attemptともにgh workflow runから渡す想定で、人間が直接
  # 手動実行することも許容する(GitHub側がworkflow_dispatchの実行自体にwrite権限を要求するため、
  # 実行者チェックの信頼レベルは他のトリガー経路と同等)。
  workflow_dispatch:
    inputs:
      issue_number:
        description: "対象issue番号"
        required: true
        type: string
      retry_attempt:
        description: "これまでの自動リトライ回数(0始まり。指定した回数の次の試行として実行する)"
        required: false
        type: string
        default: "0"

jobs:
  # 実行者・issueの状態判定を、重いdispatchジョブから切り離して先に実行する(#651)。
  #
  # 従来は単一のdispatchジョブにissueごとのconcurrency(#129)とservices: mysqlが同居していたため、
  # 何もせず終わるmode=skipのrunでも、concurrencyの枠を1つ占有し、mysqlコンテナを起動し、
  # claude-code-action/Playwright/setup-bun等のactionを全てダウンロードしていた。実測で
  # Claude Issue Dispatchのrunの54%がmode=skipであり、無視できない無駄になっていた。
  # 2026-08-06のGitHub Actions障害では、これが増幅装置として働き、Set up jobで死ぬだけのrunが
  # 4〜6分ずつconcurrency枠を握って同一issueの後続を巻き込んだ(#641)。
  #
  # このジョブはconcurrency・services・uses:のいずれも持たない。特にuses:を使わないことで、
  # actionの解決処理(Getting action download info)が落ちる種類の障害でも判定・リアクション・
  # skip時の返信までは生き残る(notify-failureジョブ #650 と同じ考え方)。
  triage:
    if: |
      (github.event_name == 'issues' && github.event.action == 'unlabeled' && github.event.label.name == '00.check-user') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && startsWith(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '<!-- issue-deck:no-trigger -->')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      mode: ${{ steps.state.outputs.mode }}
      issue_number: ${{ steps.state.outputs.issue_number }}
      branch: ${{ steps.state.outputs.branch }}
      pr_url: ${{ steps.state.outputs.pr_url }}
      retry_attempt: ${{ steps.state.outputs.retry_attempt }}
      issue_closed: ${{ steps.state.outputs.issue_closed }}
      branch_exists: ${{ steps.state.outputs.branch_exists }}
      screenshot_required: ${{ steps.state.outputs.screenshot_required }}
      lane: ${{ steps.state.outputs.lane }}
    steps:
      - name: 実行者の権限・状態を判定する
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number || github.event.issue.number }}
          ACTOR: ${{ github.actor }}
          ACTOR_TYPE: ${{ github.event.sender.type }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_RETRY_ATTEMPT: ${{ github.event.inputs.retry_attempt }}
        run: |
          set -e
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

          RETRY_ATTEMPT="${INPUT_RETRY_ATTEMPT:-0}"
          : "${RETRY_ATTEMPT:=0}"
          # 後続のフォールバック検証ステップで$((RETRY_ATTEMPT + 1))という算術展開に使うため、
          # workflow_dispatchの手動起動等で不正な値が渡された場合に備え数値であることを検証する(#497)。
          case "$RETRY_ATTEMPT" in ''|*[!0-9]*) RETRY_ATTEMPT=0 ;; esac
          echo "retry_attempt=$RETRY_ATTEMPT" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # 計画/実装フォールバック検証ステップからの自己リトライ専用の起動経路(#497)。
            # workflow_dispatchのAPI呼び出し自体がリポジトリへのwrite権限を要求するため、
            # issue_comment向けに実装済みのBot判定・実行者パーミッション確認と同等の信頼レベルが
            # 既に担保されている。そのためここではスキップする。
            echo "workflow_dispatch起動のため、Bot判定・実行者パーミッション確認をスキップします（retry_attempt=$RETRY_ATTEMPT）"
          else
            if [ "$ACTOR_TYPE" = "Bot" ]; then
              # issue-deckアプリ自身のGitHub App経由の書き込みは、人間がアプリ画面上で
              # 操作した場合でもGitHub上は issue-deck[bot] が投稿者になる。issue_comment
              # イベントに限り、アプリがコメント本文の末尾に埋め込む投稿者マーカー
              # (<!-- issue-deck:posted-by:<login> -->。src/app/api/issues/comments/route.ts
              # のPOSTで付与、ユーザー入力より後ろに付くため本文中の偽マーカーは無効)から
              # 実際に操作した人間のログイン名を取り出し、以降の権限チェックをその人間に
              # 対して行う。マーカーが無い場合(issue-deck[bot]以外のBotや、マーカーの無い
              # 旧コメント)はこれまで通りスキップする。
              POSTED_BY=""
              if [ "$ACTOR" = "issue-deck[bot]" ] && [ "$EVENT_NAME" = "issue_comment" ]; then
                POSTED_BY="$(printf '%s' "$COMMENT_BODY" | grep -oP '(?<=<!-- issue-deck:posted-by:)\S+(?= -->)' | tail -n1 || true)"
              fi
              if [ -z "$POSTED_BY" ]; then
                echo "実行者がBotのため何もしません（自己ループ防止）: $ACTOR"
                echo "mode=skip" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "issue-deck[bot]経由のコメントを検出、投稿者マーカーから実行者を復元します: $POSTED_BY"
              ACTOR="$POSTED_BY"
            fi

            PERMISSION="$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo "none")"
            case "$PERMISSION" in
              admin|write|maintain) : ;;
              *)
                echo "実行者 $ACTOR はwrite権限を持たないため何もしません（権限: $PERMISSION）"
                echo "mode=skip" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi

          BRANCH="issue-$ISSUE_NUMBER"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # クローズ済みのIssueは実装・計画・分割のいずれも再始動しない。分割(#144)で元Issueが
          # クローズされた後の誤爆防止が主目的だが、09.mainクローズ後のIssue全般にも適用される。
          ISSUE_STATE="$(gh issue view "$ISSUE_NUMBER" --json state --jq .state)"
          ISSUE_CLOSED=false
          [ "$ISSUE_STATE" = "CLOSED" ] && ISSUE_CLOSED=true
          echo "issue_closed=$ISSUE_CLOSED" >> "$GITHUB_OUTPUT"

          # triageジョブはcheckoutを行わない(uses:を一切使わないため)ので、git ls-remoteでは
          # なくGitHub APIでブランチの存在を確認する(#651)。
          BRANCH_EXISTS=false
          if gh api "repos/$GH_REPO/branches/$BRANCH" >/dev/null 2>&1; then
            BRANCH_EXISTS=true
          fi
          echo "branch_exists=$BRANCH_EXISTS" >> "$GITHUB_OUTPUT"

          # ブランチが既に存在する場合、対応するdevelop向けPRの状態を見て、追加対応
          # (mode=additional)として扱うかを判定する(#129)。PRがOPENであれば、人間からの
          # @claudeコメントによる追加のやり取りとして既存ブランチに追加コミットする。
          PR_STATE=""
          PR_URL=""
          if [ "$BRANCH_EXISTS" = "true" ]; then
            PR_JSON="$(gh pr list --head "$BRANCH" --state all --json state,url --jq '.[0]' 2>/dev/null || true)"
            if [ -n "$PR_JSON" ] && [ "$PR_JSON" != "null" ]; then
              PR_STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
              PR_URL="$(printf '%s' "$PR_JSON" | jq -r '.url')"
            fi
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

          LABELS="$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')"
          PLAN_REQUIRED=false
          echo "$LABELS" | grep -qx "21.plan-required" && PLAN_REQUIRED=true
          AWAITING_CONFIRM=false
          echo "$LABELS" | grep -qx "00.check-user" && AWAITING_CONFIRM=true
          WIP=false
          echo "$LABELS" | grep -qx "02.wip" && WIP=true
          SCREENSHOT_REQUIRED=false
          echo "$LABELS" | grep -qx "24.screenshot-required" && SCREENSHOT_REQUIRED=true
          echo "screenshot_required=$SCREENSHOT_REQUIRED" >> "$GITHUB_OUTPUT"

          # issue-detail.tsx等の「Claudeに質問する」ダイアログが投稿する定型プレフィックス
          # （ASK_CLAUDE_COMMENT_PREFIX、src/lib/github/ask-claude.ts）で始まるコメントかを判定する。
          # 該当する場合、実装状況（実装中・承認待ち・PR作成後等）によらず常に最優先で読み取り専用の
          # 質問応答モード(mode=ask)へ割り込む。
          IS_ASK=false
          case "$COMMENT_BODY" in
            "@claude 質問: "*) IS_ASK=true ;;
          esac

          # ブランチが既に存在する場合の分岐(labeled/unlabeledイベントは人間からの明示的な
          # 追加依頼ではないため、以下はissue_comment・workflow_dispatchトリガーに限定する。
          # workflow_dispatchは計画/実装フォールバック検証ステップからの自己リトライ(#497)。
          # PRがまだ無く02.wipが付いている詰まった状態(#112)からの再開先(mode=additional)は、
          # 実装フォールバックの自己リトライがちょうど再開したい状態と一致する):
          # - PRがOPENなら追加対応として扱う(#129)。00.check-user(Phase4の自動マージ不可判定を
          #   含む)の有無は問わない。
          # - PRがまだ無く02.wipが付いている詰まった状態(#112)も追加対応として扱い、既存
          #   ブランチをそのままcheckoutして続きから再開する(実装ステップのプロンプト側で
          #   続行可能か判断する)。ブランチの削除・作り直しは自動化せず人間の明示操作に委ねる。
          # - それ以外(PRがMERGED/CLOSED、または02.wipも付いていない異常な中間状態)は
          #   mode=skipとし、実装は再始動しない。
          MODE=skip
          if [ "$EVENT_NAME" = "issue_comment" ] && [ "$IS_ASK" = "true" ]; then
            MODE=ask
          elif [ "$ISSUE_CLOSED" = "true" ]; then
            MODE=skip
          elif [ "$BRANCH_EXISTS" = "true" ]; then
            if [ "$EVENT_NAME" != "issue_comment" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
              MODE=skip
            elif [ "$PR_STATE" = "OPEN" ]; then
              MODE=additional
            elif [ -z "$PR_STATE" ] && [ "$WIP" = "true" ]; then
              MODE=additional
            else
              MODE=skip
            fi
          elif [ "$AWAITING_CONFIRM" = "true" ]; then
            # 計画レビュー待ち中の@claudeコメントは、計画の練り直し依頼として扱う。workflow_dispatchは
            # 計画提示フォールバック検証ステップからの自己リトライ(#497)であり、練り直し中の計画提示が
            # 行き詰まった場合の再試行はこの状態(00.check-user付与中)で起動するため、issue_commentと
            # 同様にMODE=planとして扱わないと自己リトライがmode=skipに落ちて何もしないまま終わる(#672)。
            if [ "$EVENT_NAME" = "issue_comment" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              MODE=plan
            fi
          elif [ "$PLAN_REQUIRED" = "true" ]; then
            MODE=plan
          else
            # 00.check-user・21.plan-requiredともに付いていない状態。計画レビューを経ていた
            # issueであれば、それらのラベルが外れた = 承認とみなす。直前の計画コメントに
            # 埋め込まれた<!-- issue-deck-plan-type:implement|split -->マーカーから、
            # そのまま実装するかサブIssueへ分割するかを判定する(#144)。マーカーが無い場合
            # (計画レビューを経ていない通常issueや、旧形式の計画コメント・フォールバック通知
            # のみの場合)はimplementにフォールバックする。
            #
            # 承認操作の経路は2通りある:
            #   - 人間がGitHub UI等で直接00.check-userを外す(issues/unlabeledイベント)
            #   - issue-deckアプリの承認ボタン(issue-deckのGitHub Appによるラベル更新の
            #     操作はGitHub上issue-deck[bot]として記録され、issues/unlabeledイベント単独
            #     では実際に操作した人間を特定できず前段の権限チェックで自己ループ防止に
            #     より弾かれるため、アプリはラベル更新に続けて個人アカウントでの@claudeコメント
            #     も送信し、issue_commentイベント経由でここに到達する。#173)
            PLAN_TYPE="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments[].body' | grep -oP '(?<=<!-- issue-deck-plan-type:)(implement|split)(?= -->)' | tail -n1 || true)"
            : "${PLAN_TYPE:=implement}"
            if [ "$PLAN_TYPE" = "split" ]; then
              MODE=split
            else
              MODE=implement
            fi
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          # dispatchジョブのconcurrencyグループをbranch/commentレーンに分割するためのlane算出
          # (#652)。implement/additionalは実際にissue-<番号>ブランチへcommit・pushするレーン
          # (branch)、それ以外(plan/split/ask/skip)はブランチに触れずコメント投稿のみのレーン
          # (comment)に分類する。この分類はmode確定ロジック自体に既に存在する事実を機械的に
          # 転記したものであり、新たな判断基準を持ち込むものではない。
          case "$MODE" in
            implement|additional) LANE=branch ;;
            *) LANE=comment ;;
          esac
          echo "lane=$LANE" >> "$GITHUB_OUTPUT"

          echo "判定結果: mode=$MODE lane=$LANE branch=$BRANCH plan_required=$PLAN_REQUIRED awaiting_confirm=$AWAITING_CONFIRM wip=$WIP branch_exists=$BRANCH_EXISTS pr_state=$PR_STATE issue_closed=$ISSUE_CLOSED screenshot_required=$SCREENSHOT_REQUIRED"

      - name: 依頼を受け取ったことをリアクションで示す
        # triageはconcurrencyの外で即時実行されるため、dispatchがキュー待ちの間でも「受け取った」
        # ことが利用者に見える(#651)。GitHubは1つのconcurrencyグループにつき待機中のrunを1件しか
        # 保持しない仕様のため、無反応に見えて催促の@claudeコメントが重なると、待機中のrunが
        # キャンセルされて置き換わる。受理が見えることでこれを減らす。
        # リアクション付与の失敗自体は本筋ではないため、continue-on-errorで処理を止めない。
        if: steps.state.outputs.mode != 'skip'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE_NUMBER: ${{ steps.state.outputs.issue_number }}
        run: |
          set -e
          if [ -n "$COMMENT_ID" ]; then
            gh api -X POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes --silent
          else
            gh api -X POST "repos/$GH_REPO/issues/$ISSUE_NUMBER/reactions" -f content=eyes --silent
          fi

      - name: 実装済み・対応中のissueへの@claudeコメントに返信する
        # BRANCH_EXISTS=trueかつmode=skipとなるケース(#105)。develop向けPRがOPENの状態、または
        # PRが無く02.wipが付いている詰まった状態(#112)でissue_commentが来た場合はmode=additional
        # になり、このステップの対象外(#129, #112。既存ブランチをcheckoutして続きから再開する)。
        # ここに該当するのは、PRがMERGED/CLOSED、またはPRが無く02.wipも付いていない異常な
        # 中間状態で、issue-<番号>ブランチが既に存在するため実装は再始動しないが、
        # issue_commentトリガー(人間が直接@claudeへ呼びかけたケース)に限り、これまでの
        # 「無言でスキップ」を避けて対応状況を返信する。unlabeledイベントでの同条件のskip
        # (Phase4の要確認判定など)は人間への呼びかけではないため対象外。Issueがクローズ済み
        # (issue_closed=true)の場合も同様の理由で返信する(#144の分割でクローズされたIssueへの
        # 呼びかけ等、branch_existsがfalseのケースを含む)。
        if: |
          steps.state.outputs.mode == 'skip' &&
          github.event_name == 'issue_comment' &&
          (steps.state.outputs.branch_exists == 'true' || steps.state.outputs.issue_closed == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "${{ steps.state.outputs.issue_closed }}" = "true" ]; then
            BODY='ℹ️ このIssueは既にクローズされています。分割により対応が複数のサブIssueに分かれている場合、コメント欄でリンクをご確認ください。'
            BODY="$BODY"$'\n\n''追加の対応が必要な場合、このコメントをきっかけに実装が再始動することはありません。人間が対応してください。'
            BODY="$BODY"$'\n\n<!-- issue-deck-source:claude-issue-dispatch -->'
            gh issue comment ${{ steps.state.outputs.issue_number }} --body "$BODY"
            exit 0
          fi
          BRANCH="${{ steps.state.outputs.branch }}"
          PR_URL="${{ steps.state.outputs.pr_url }}"
          if [ -z "$PR_URL" ]; then
            BODY="⚠️ \`$BRANCH\` ブランチは存在しますが、Pull Requestも\`02.wip\`ラベルも無い、想定外の状態です。"
            BODY="$BODY"$'\n\n'"作り直す場合は、人間が明示的に \`git push origin --delete $BRANCH\` 等でブランチを削除してから、改めて\`@claude\`とコメントしてください（このワークフローが自動でブランチを削除・作り直すことはありません）。"
          else
            BODY="ℹ️ このIssueは既に \`$BRANCH\` ブランチで対応中、または対応済みです。関連するPull Requestはこちらです: $PR_URL"
            BODY="$BODY"$'\n\n''追加の対応が必要な場合、このコメントをきっかけに実装が再始動することはありません。ブランチやPull Requestの状態を直接ご確認のうえ、人間が対応してください。'
          fi
          BODY="$BODY"$'\n\n<!-- issue-deck-source:claude-issue-dispatch -->'
          gh issue comment ${{ steps.state.outputs.issue_number }} --body "$BODY"

  dispatch:
    needs: triage
    # mode=skipのrunはここで完全に打ち切る。concurrencyの枠もservices: mysqlも消費しない(#651)。
    # skipのうちコメント返信が必要なケース(#105)はtriage側で処理済み。
    if: needs.triage.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    # 同じissueに対して短時間に複数の@claudeコメント等が来た場合、複数のワークフロー実行が
    # 同じブランチに同時にcheckout・pushして競合するのを避けるため、issueごとに直列化する(#129)。
    # cancel-in-progress: falseにより、先行実行を中断せず後続を待たせる。
    #
    # グループ名にはtriageジョブが算出したlane(branch/comment)をサフィックスとして含める(#652)。
    # implement/additional(issue-<番号>ブランチへcommit・push)とplan/split/ask(ブランチに触れず
    # コメント投稿のみ)は本来競合しないが、単一のconcurrencyグループで直列化していたため、
    # 実装中のissueにplan相当の質問対応が割り込めず、無関係な待ち時間が発生していた。レーンを
    # 分けることで両者は並行実行できるようにしつつ、同じレーン内(例: implement→additional)では
    # 従来どおり直列化を維持する。claude-conflict-resolve.ymlのresolve-conflictsジョブは常に
    # branchレーンに属する(docs/multi-agent-workflow.md「既存の実装ワークフローとの競合回避」参照)。
    concurrency:
      group: issue-dispatch-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number || github.event.issue.number }}-${{ needs.triage.outputs.lane }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # 自己リトライ(#497)のgh workflow run呼び出しは、GITHUB_TOKENが同呼び出しを誘発しない
      # 制約があるためsecrets.WORKFLOW_PATを使う(WORKFLOW_PAT側の権限はpermissions:の対象外)。
      # GITHUB_TOKEN自体はactions:writeを使わないため、least privilegeの観点でreadのままにする。
      actions: read
      id-token: write
    # 無人実行環境でも`pnpm dev`を起動して画面を確認できるようにするためのMySQLサービス
    # コンテナ(#256)。plan/splitモードでは使わないが、サービスコンテナはジョブ全体に
    # 紐づく仕様上いずれのモードでも起動する(未使用でも実行時間への影響は小さい)。
    # 認証情報はCI専用のプレースホルダーで、.github/workflows/ci.yml のDATABASE_URLと揃える。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: placeholder
          MYSQL_DATABASE: app_issue_deck
          MYSQL_USER: placeholder
          MYSQL_PASSWORD: placeholder
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1
          # .github/workflows/配下を変更するIssueでも実装ステップのgit pushが拒否されないよう、
          # workflow書き込み権限を持つPAT(secrets.WORKFLOW_PAT)でcheckoutする(issue #106)。
          # ただしcheckoutが設定する認証情報はclaude-code-actionに消されるため、pushの認証は
          # 次のステップで別途固定する(#662)。
          token: ${{ secrets.WORKFLOW_PAT }}
      - name: pushの認証をWORKFLOW_PATに固定する
        # claude-code-actionは実行時にreplaceCheckoutCredentials()で、actions/checkoutが
        # .git/configに残したhttp.<server>/.extraheaderを削除し、remote.origin.urlを
        # `https://x-access-token:<action自身のトークン>@github.com/...`へ差し替える
        # (claude-code-action@v1のsrc/github/operations/git-config.ts)。github_token未指定時の
        # そのトークンはClaude GitHub Appのインストールトークンで、workflows権限を持たないため、
        # `.github/workflows/`配下を含むpushだけがremote rejectedになる(#662で判明。#621で
        # github_token: WORKFLOW_PATを外して以降、#622・#638・#652が停止した)。
        #
        # 一方でgithub_token: WORKFLOW_PATを戻すと、claude-code-actionが実装ステップのGH_TOKENも
        # 同じPATへ上書きするため(src/entrypoints/run.tsのprocess.env.GH_TOKEN代入)、#621で直した
        # 「Issue/PRコメントの投稿者が人間名義になる」問題が再発する。actionに渡すトークン1本では
        # 「pushはPAT・コメントはbot」を両立できない。
        #
        # そのためpush専用のURL(remote.origin.pushurl)にだけPATを固定する。actionが行うのは
        # `git remote set-url origin <URL>`(fetch側のremote.origin.urlのみ)であり、pushurlは
        # 書き換えられないため、fetchはaction自身のトークン、pushはPATという分離が成立する。
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git remote set-url --push origin \
            "https://x-access-token:${WORKFLOW_PAT}@github.com/${REPOSITORY}.git"
      - name: triageの判定結果を引き継ぐ
        # 判定自体はtriageジョブで完了しているが、以降のステップは既存の記述をそのまま活かすため、
        # 同じ id: state として出力し直す(#651)。ファイル全体に101箇所ある steps.state.outputs.*
        # の参照を書き換えずに済ませるための措置。書き換え漏れはエラーにならず空文字として評価
        # されてしまい、#115と同種の「構文は妥当なのに静かに壊れる」事故になりやすいため、
        # 変更範囲を意図的に狭めている。
        #
        # あわせて、triageの判定が古くなっていないかをここで確認する。triageはconcurrencyの
        # キュー待ちより前に判定するため、待機中に人間がissueをクローズした/00.check-userを
        # 付けた場合、古い判定のまま実装が走る恐れがある。食い違いを検知した場合はmodeをskipに
        # 落とし、以降のステップを全て空振りさせる(個々のステップのif条件は触らない)。
        # ラベル全体の再判定は行わない。それはtriageを分離した意味を失わせるため、実装を止める
        # 必要がある2条件(クローズ済み・要確認)に絞っている。
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ needs.triage.outputs.mode }}
          ISSUE_NUMBER: ${{ needs.triage.outputs.issue_number }}
          BRANCH: ${{ needs.triage.outputs.branch }}
          PR_URL: ${{ needs.triage.outputs.pr_url }}
          RETRY_ATTEMPT: ${{ needs.triage.outputs.retry_attempt }}
          ISSUE_CLOSED: ${{ needs.triage.outputs.issue_closed }}
          BRANCH_EXISTS: ${{ needs.triage.outputs.branch_exists }}
          SCREENSHOT_REQUIRED: ${{ needs.triage.outputs.screenshot_required }}
        run: |
          set -e
          echo "triageから引き継いだ判定: mode=$MODE branch=$BRANCH issue_number=$ISSUE_NUMBER"

          STALE_REASON=""
          ISSUE_JSON="$(gh issue view "$ISSUE_NUMBER" --json state,labels 2>/dev/null || true)"
          if [ -n "$ISSUE_JSON" ]; then
            NOW_STATE="$(printf '%s' "$ISSUE_JSON" | jq -r '.state')"
            NOW_LABELS="$(printf '%s' "$ISSUE_JSON" | jq -r '.labels[].name')"
            if [ "$NOW_STATE" = "CLOSED" ] && [ "$ISSUE_CLOSED" != "true" ]; then
              STALE_REASON="判定後にIssueがクローズされた"
            elif echo "$NOW_LABELS" | grep -qx "00.check-user" && [ "$MODE" != "plan" ] && [ "$MODE" != "ask" ]; then
              STALE_REASON="判定後に00.check-userが付与された"
            fi
          else
            echo "Issueの再取得に失敗したため、陳腐化の確認はスキップします"
          fi

          if [ -n "$STALE_REASON" ]; then
            echo "$STALE_REASON ため、実装に入らず中止します（mode=$MODE -> skip）"
            BODY="⏹️ 順番待ちの間にIssueの状態が変わったため（$STALE_REASON）、今回の自動対応は実行せず中止しました。"
            BODY="$BODY"$'\n\n''必要であれば改めて `@claude` とコメントしてください。'
            BODY="$BODY"$'\n\n<!-- issue-deck-source:claude-issue-dispatch -->'
            gh issue comment "$ISSUE_NUMBER" --body "$BODY" || true
            MODE=skip
          fi

          {
            echo "mode=$MODE"
            echo "issue_number=$ISSUE_NUMBER"
            echo "branch=$BRANCH"
            echo "pr_url=$PR_URL"
            echo "retry_attempt=$RETRY_ATTEMPT"
            echo "issue_closed=$ISSUE_CLOSED"
            echo "branch_exists=$BRANCH_EXISTS"
            echo "screenshot_required=$SCREENSHOT_REQUIRED"
          } >> "$GITHUB_OUTPUT"

      - name: claude-code-actionに渡すモデル指定を取得する
        id: claude_model
        # 全リポジトリ共通のモデル設定(自動リトライ上限と同じくAppSetting、#622)を読み取り専用
        # APIから取得し、以降の各claude-code-actionステップのclaude_argsに埋め込む--modelの値に
        # する。"auto"（未設定時のデフォルト含む）の場合はmodel_flagを空文字にし、--modelを
        # 一切付与しない(claude-code-action側のデフォルトモデルに委ねる)。値はモデルの
        # スナップショット日付を含まないエイリアス(opus/sonnet/haiku)のみを許可し、想定外の値は
        # autoにフォールバックする(APP_BASE_URL未設定・疎通失敗時も同様)。
        if: steps.state.outputs.mode != 'skip'
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          CLAUDE_MODEL=auto
          if [ -n "$APP_BASE_URL" ]; then
            RESPONSE="$(curl -fsS "$APP_BASE_URL/api/settings/claude-model" 2>/dev/null || true)"
            if [ -n "$RESPONSE" ]; then
              CLAUDE_MODEL="$(printf '%s' "$RESPONSE" | jq -r '.claudeModel // "auto"' 2>/dev/null || echo auto)"
            fi
          fi
          case "$CLAUDE_MODEL" in
            opus|sonnet|haiku) : ;;
            *) CLAUDE_MODEL=auto ;;
          esac
          echo "model=$CLAUDE_MODEL" >> "$GITHUB_OUTPUT"
          if [ "$CLAUDE_MODEL" = "auto" ]; then
            echo "model_flag=" >> "$GITHUB_OUTPUT"
          else
            echo "model_flag=--model $CLAUDE_MODEL" >> "$GITHUB_OUTPUT"
          fi

      - name: 対応開始をコメントで通知する
        # Claude Codeエージェント自身に通知コメントの投稿を委ねると、調査に時間がかかった場合や
        # 途中で行き詰まった場合に「依頼を受け取ったこと」自体が使用者に伝わらない恐れがある。
        # そのため後続のClaude Codeステップとは独立した、失敗しにくい単純なシェルスクリプトの
        # ステップとしてここで確実に投稿する（計画コメントのフォールバック検証と同じ考え方）。
        # workflow_dispatch起動(計画/実装フォールバック検証ステップからの自己リトライ、#497)では、
        # フォールバック検証ステップ側が専用の「自動リトライします」コメントを既に投稿しているため、
        # ここでの重複した「対応確認しました」系コメントは投稿しない。
        if: github.event_name != 'workflow_dispatch' && (steps.state.outputs.mode == 'plan' || steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional' || steps.state.outputs.mode == 'split' || steps.state.outputs.mode == 'ask')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          if [ "${{ steps.state.outputs.mode }}" = "ask" ]; then
            BODY='🤔 ご質問を確認しました。回答をまとめています。'
          elif [ "${{ steps.state.outputs.mode }}" = "plan" ]; then
            BODY='🔍 依頼を確認しました。実装前の計画を検討します（まとまり次第このIssueにコメントします）。'
          elif [ "${{ steps.state.outputs.mode }}" = "split" ]; then
            BODY='🔀 承認された計画に沿って、このIssueをサブIssueに分割します（完了次第このIssueにコメントします）。'
          elif [ "${{ steps.state.outputs.mode }}" = "additional" ] && [ -n "${{ steps.state.outputs.pr_url }}" ]; then
            BODY="🔧 依頼を確認しました。既存の \`${{ steps.state.outputs.branch }}\` ブランチ・Pull Request（${{ steps.state.outputs.pr_url }}）に追加コミットします。"
          elif [ "${{ steps.state.outputs.mode }}" = "additional" ]; then
            BODY="🔧 前回の実装がPull Request作成に至らないまま終了した可能性があるため、既存の \`${{ steps.state.outputs.branch }}\` ブランチの状態を確認したうえで実装を再開します。"
          else
            BODY="🔧 依頼を確認しました。\`${{ steps.state.outputs.branch }}\` ブランチで調査・実装に着手します。"
          fi
          BODY="$BODY"$'\n\n'"実行ログ: $RUN_URL"$'\n\n<!-- issue-deck-source:claude-issue-dispatch -->'
          gh issue comment ${{ steps.state.outputs.issue_number }} --body "$BODY"

      - name: 01.planning を付与する（計画検討着手時）
        # Claude Codeエージェント自身にラベル付与を委ねるとLLMの実行タイミング・忘れに
        # 依存してしまうため、他の確実な通知ステップと同じくシェルスクリプトで直接行う。
        # CLAUDE.mdの運用ルール(01.planningはPlan mode開始時点で付与する)をこのワークフローでも
        # 保証するためのステップ。
        if: steps.state.outputs.mode == 'plan'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "01.planning"

      - name: 計画提示前のコメント数を記録する
        id: before_plan
        if: steps.state.outputs.mode == 'plan'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="$(gh issue view ${{ steps.state.outputs.issue_number }} --json comments --jq '.comments | length')"
          echo "comment_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Claude Code（計画提示）
        id: claude_plan
        if: steps.state.outputs.mode == 'plan'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --allowedTools "Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr list:*),Bash(gh api:*),Bash(git ls-remote:*),Bash(git log:*),Bash(curl:*),Read,Grep,Glob"
            ${{ steps.claude_model.outputs.model_flag }}
          prompt: |
            あなたはissue-deckリポジトリの実装エージェントです。Issue #${{ steps.state.outputs.issue_number }} に
            `21.plan-required` ラベルが付いているため、実装に入る前に計画を提示してください。

            ## 最初にやること
            `gh issue view ${{ steps.state.outputs.issue_number }} --comments` でIssueの最新の本文・ラベル・
            コメント（過去に提示した計画やそれへのフィードバックを含む）を確認してください。

            ## Issue本文・コメントに画像が含まれる場合
            issue-deck独自の画像アップロードAPI（`/api/issues/images/...`のURL）で貼り付けられた画像は、
            GitHub純正の画像CDNではないため自動では読み込めません。計画立案に画像の内容確認が必要な場合は、
            `curl -o /tmp/<適当なファイル名> "<画像URL>"`で一時ファイルにダウンロードしたうえで、`Read`ツールで
            そのローカルファイルを開いて内容を確認してください（URLを直接`Read`しても開けません）。

            ## 直近のコメントが質問か、計画の修正依頼かの判定
            このIssueに既に計画コメント（末尾に`<!-- issue-deck-plan-type:implement -->`または
            `<!-- issue-deck-plan-type:split -->`マーカーが付いたコメント）が投稿済みの場合、直近の
            `@claude`コメントはその計画に対する反応です。まず、それが計画の変更を求める「修正依頼」か、
            単なる「質問・確認」（例:「この方針だとXの場合はどうなる？」）かを判定してください。

            - 単なる質問・確認と判断した場合:
              - 計画本文は書き直さず、`gh issue comment ${{ steps.state.outputs.issue_number }} --body "..."`
                で質問への回答のみを簡潔に投稿する。回答コメントの本文末尾には、実装フローの通常コメントと
                視覚的に区別できるよう`<!-- issue-deck-qa-answer -->`マーカーと、投稿元を示す
                `<!-- issue-deck-source:claude-issue-dispatch -->`マーカーを必ず付与する
              - 計画種別マーカー（`<!-- issue-deck-plan-type:... -->`）は付けない（直前の計画のマーカーが
                そのまま承認判定に使われる想定のため）
              - 回答コメント投稿後、`gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "00.check-user"`
                を必ず実行する（既に付いていても無害）。`00.check-user`以外のラベル（`21.plan-required`等）は
                変更しない。理由: `mode=plan`に到達している時点で既存の計画コメントが存在する＝計画レビューは
                未完了であり、issue-deck画面の「修正」ボタンは押下時点で質問か修正依頼かを区別できないため
                送信前に機械的に`00.check-user`を外す実装になっている。そのため質問と判定された場合に確認待ち
                ラベルが外れたまま復元されず、ユーザーが対応要否を判別できなくなる問題があった（#417）
              - 以下の「やること」「分割するかどうかの判断」の手順は行わず、ここで対応を終了する
            - 計画の修正が必要と判断した場合、または、このIssueにまだ計画コメントが投稿されていない
              （今回が初回の計画提示である）場合は、以下の「やること」に従って計画全文を練り直す
              （または新規に作成する）

            ## やること
            - リポジトリのコードを調査し、対応方針・変更範囲（触るファイル・追加するファイル）・懸念点を
              日本語でまとめる
            - 直前のコメントで計画への修正依頼が来ている場合は、それを踏まえて計画を練り直す
            - 実装範囲が広く、GitHub Actions上の1回の実装ステップで最後まで処理しきれない懸念がある
              場合は、無理に一つの計画に収めようとせず、下記「分割するかどうかの判断」に従って
              サブIssueへの分割を計画してよい
            - まとめた計画を `gh issue comment ${{ steps.state.outputs.issue_number }} --body "..."` で
              Issueにコメント投稿する。コメント本文の末尾に、下記の計画種別マーカーと、このワークフロー
              実行への追跡用リンク
              `実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`、
              投稿元を示す`<!-- issue-deck-source:claude-issue-dispatch -->`マーカーを必ず追記する
            - 投稿後、`gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "00.check-user"` を実行する
              （既に付いていても無害なので毎回実行してよい）

            ## 分割するかどうかの判断とマーカー
            計画コメントの末尾に、判断結果に応じて次のいずれか1つのHTMLコメントマーカーを必ず含めて
            ください。人間が`00.check-user`を外して承認した後、別のワークフロー実行がこのマーカーを
            読み取ってそのまま実装するかサブIssueへ分割するかを自動的に振り分けます。

            - このIssueのまま1つのPull Requestとして実装できると判断した場合:
              `<!-- issue-deck-plan-type:implement -->`
            - 実装範囲が広く、複数のサブIssueに分割してそれぞれ独立に実装すべきと判断した場合:
              `<!-- issue-deck-plan-type:split -->`
              - この場合、計画コメント本文に分割後の各サブIssue案（タイトル案・スコープ・実装順序や
                依存関係があればそれも）を箇条書きで明記すること。承認後、別のワークフロー実行がこの
                計画コメントを読んでサブIssueを実際に作成するため、その内容がそのままサブIssue作成の
                元になります
              - 分割後の1つのサブIssueもなお複雑だと判断される場合、そのサブIssue案の中に
                「このサブIssueには21.plan-requiredが必要」と書き添えてよい（実際のラベル付与は
                分割を実行するステップが行う）

            ## 迷った場合・調査に行き詰まった場合の振る舞い
            - 許可されていない操作が拒否される等で調査に行き詰まった場合、それ以上粘らず、その時点で
              分かっている情報の範囲で計画をまとめてコメント投稿することを最優先する
              （コメントを一切投稿できないまま終了することが最悪の結果のため）

            ## このステップでは行わないこと
            - コードの変更・コミット・ブランチ作成・PR作成・Issueの新規作成は一切行わない（計画提示のみ。
              分割を計画した場合も、実際のサブIssue作成はこのステップでは行わない）

            ## 次に起きること
            人間が計画を確認し、問題なければIssueから `00.check-user` ラベルを外します。それをもって承認と
            みなし、別のワークフロー実行が、上記マーカーに応じて実装（`implement`）またはサブIssueの
            作成（`split`）を開始します。計画に修正が必要な場合は、人間が`@claude`宛にコメントで指摘するので、
            その場合はこのステップが再び起動し計画を練り直します。

      - name: 計画コメント投稿を検証し、必要ならフォールバックする
        if: always() && steps.state.outputs.mode == 'plan'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_NUMBER: ${{ steps.state.outputs.issue_number }}
          RETRY_ATTEMPT: ${{ steps.state.outputs.retry_attempt }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          REPO: ${{ github.repository }}
          CLAUDE_STEP_OUTCOME: ${{ steps.claude_plan.outcome }}
          # APP_BASE_URL未設定・API到達不可等でリポジトリ共通のAUTO_RETRY_LIMITを取得できない
          # 環境でも、一過性障害(ERROR_TYPE=transient)と判定した場合にだけ適用する最低限の
          # リトライ回数(#621)。一過性のGitHub API障害はリトライで解消する可能性が高い一方、
          # 恒常的な障害(ツール権限拒否等)はリトライしても解消しないため区別する。
          TRANSIENT_FALLBACK_RETRY_LIMIT: 2
        run: |
          set -e
          AFTER_COUNT="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments | length')"
          BEFORE_COUNT="${{ steps.before_plan.outputs.comment_count }}"
          : "${BEFORE_COUNT:=0}"
          if [ "$AFTER_COUNT" -gt "$BEFORE_COUNT" ]; then
            echo "新規コメントを確認できたため計画提示は完了とみなします（投稿前: $BEFORE_COUNT 件, 投稿後: $AFTER_COUNT 件）"
            exit 0
          fi

          echo "新規コメントが確認できないため、エラー種別の判定と自動リトライの可否を確認します（投稿前後とも $BEFORE_COUNT 件）"

          # Claude Code（計画提示）ステップ自体がfailureで終了した場合、Claude起動前後のGitHub API
          # 呼び出しエラー等、一過性の可能性が高いインフラ障害と判断する(#610で実際に観測された例:
          # 実行者の権限チェックAPIが一時的に503を返しステップごと失敗した)。ステップ自体はsuccessで
          # 終了したが新規コメントが確認できない場合は、Claude内部でのツール権限拒否等、リトライしても
          # 解消しない可能性が高い恒常的な障害と判断する。
          if [ "$CLAUDE_STEP_OUTCOME" = "failure" ]; then
            ERROR_TYPE=transient
          else
            ERROR_TYPE=persistent
          fi
          echo "エラー種別判定: $ERROR_TYPE（Claude Codeステップの終了状態: $CLAUDE_STEP_OUTCOME）"

          # 全リポジトリ共通の自動リトライ上限を読み取り専用APIから取得する(#496, #497)。APP_BASE_URL未設定・
          # API到達不可・レスポンス不正のいずれの場合も安全側(リトライなし=0)にフォールバックする。
          AUTO_RETRY_LIMIT=0
          if [ -n "$APP_BASE_URL" ]; then
            RESPONSE="$(curl -fsS "$APP_BASE_URL/api/settings/auto-retry" 2>/dev/null || true)"
            if [ -n "$RESPONSE" ]; then
              AUTO_RETRY_LIMIT="$(printf '%s' "$RESPONSE" | jq -r '.autoRetryLimit // 0' 2>/dev/null || echo 0)"
            fi
          fi
          case "$AUTO_RETRY_LIMIT" in ''|*[!0-9]*) AUTO_RETRY_LIMIT=0 ;; esac

          # APP_BASE_URL未設定等でAUTO_RETRY_LIMITを取得できない環境でも、一過性障害と判定した
          # 場合は最低限のリトライ回数を保証する(#621)。恒常的な障害の場合はこれまでどおり
          # APP_BASE_URL未設定時はリトライしない。
          if [ "$ERROR_TYPE" = "transient" ] && [ "$AUTO_RETRY_LIMIT" -lt "$TRANSIENT_FALLBACK_RETRY_LIMIT" ]; then
            AUTO_RETRY_LIMIT="$TRANSIENT_FALLBACK_RETRY_LIMIT"
          fi

          NEXT_ATTEMPT=$((RETRY_ATTEMPT + 1))
          if [ "$NEXT_ATTEMPT" -le "$AUTO_RETRY_LIMIT" ]; then
            echo "自動リトライを試みます（${NEXT_ATTEMPT}/${AUTO_RETRY_LIMIT}回目）"
            if GH_TOKEN="$WORKFLOW_PAT" gh workflow run claude-issue-dispatch.yml --repo "$REPO" --ref develop -f issue_number="$ISSUE_NUMBER" -f retry_attempt="$NEXT_ATTEMPT"; then
              RETRY_BODY="🔁 計画提示ステップの完了を確認できなかったため、自動的に再実行します（${NEXT_ATTEMPT}/${AUTO_RETRY_LIMIT}回目）。"
              RETRY_BODY="$RETRY_BODY"$'\n\n'"実行ログ: $RUN_URL"$'\n\n<!-- issue-deck-source:claude-issue-dispatch -->'
              gh issue comment "$ISSUE_NUMBER" --body "$RETRY_BODY"
              exit 0
            fi
            echo "自動リトライの起動（gh workflow run）に失敗しました。WORKFLOW_PATに必要な権限（Actions: write相当）が不足している可能性があります。従来どおりのフォールバック通知に切り替えます"
          fi

          echo "自動リトライを行わないため、フォールバックコメントを投稿します（エラー種別: $ERROR_TYPE）"
          if [ "$ERROR_TYPE" = "transient" ]; then
            FALLBACK_BODY=$'⚠️ 計画の自動提示に失敗した可能性があります。Claude Code起動前後のGitHub API呼び出しが一時的に失敗した等、一過性の障害が発生したと考えられます。\n\nお手数ですが、`@claude` とコメントして再実行してください。再実行すれば解消する可能性があります。'
          else
            FALLBACK_BODY=$'⚠️ 計画の自動提示に失敗した可能性があります。コード調査中に許可されていない操作が拒否される、または想定外のエラーが発生する等の理由で、計画コメントの投稿まで到達できなかったと考えられます。\n\nお手数ですが、`@claude` とコメントして再実行するか、必要であれば計画フェーズを経ずに人間が直接対応方針を指示してください。'
          fi
          if [ "$RETRY_ATTEMPT" -gt 0 ]; then
            FALLBACK_BODY="$FALLBACK_BODY"$'\n\n'"自動リトライを${RETRY_ATTEMPT}回試みましたが解決しませんでした。"
          fi
          FALLBACK_BODY="$FALLBACK_BODY"$'\n\n'"実行ログ: $RUN_URL"$'\n\n<!-- issue-deck-source:claude-issue-dispatch -->'$'\n\n<!-- issue-deck-fallback-notice -->'
          gh issue comment "$ISSUE_NUMBER" --body "$FALLBACK_BODY"
          gh issue edit "$ISSUE_NUMBER" --add-label "00.check-user"

      - name: 分割前のコメント数を記録する
        id: before_split
        if: steps.state.outputs.mode == 'split'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="$(gh issue view ${{ steps.state.outputs.issue_number }} --json comments --jq '.comments | length')"
          echo "comment_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Claude Code（分割）
        if: steps.state.outputs.mode == 'split'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue create:*),Bash(gh issue close:*)"
            ${{ steps.claude_model.outputs.model_flag }}
          prompt: |
            あなたはissue-deckリポジトリの実装エージェントです。Issue #${{ steps.state.outputs.issue_number }} は、
            人間が承認済みの計画（直前の`<!-- issue-deck-plan-type:split -->`マーカー付きコメント）により、
            このIssueのまま実装せず複数のサブIssueに分割することが決まっています。この分割を実行してください。

            ## 最初にやること
            `gh issue view ${{ steps.state.outputs.issue_number }} --comments` でIssueの本文と、承認済みの
            計画コメント（分割後の各サブIssue案）を確認してください。

            ## やること
            - 計画コメントに記載されたサブIssue案それぞれについて、
              `gh issue create --title "..." --body "..."` でサブIssueを作成する
              - 本文には「分割元: #${{ steps.state.outputs.issue_number }}」を含め、元Issueを読み返さなくても
                単独で着手できる程度に、対応するスコープの背景・要件を書く
              - 計画コメントでそのサブIssueにも`21.plan-required`が必要と書かれている場合は
                `--label "21.plan-required"`を付ける
              - 元Issueに`23.preview-required`または`24.screenshot-required`が付いており、かつそのサブIssue
                が画面に関わる変更を含む場合は、該当するラベルを引き継ぐ
              - 一度に作成するサブIssueは目安として6件程度までとする。計画がそれを超える数の分割を
                提案している場合、無理に全部作らず作成できた分にとどめ、残りは後述の親Issueコメントで
                「追って検討が必要」である旨を明記する
            - 全て作成したら `gh issue comment ${{ steps.state.outputs.issue_number }} --body "..."` で
              元Issueに作成したサブIssue一覧（`#番号`の形式で書けば自動的にリンクされる）をコメントする。
              コメント末尾に実行ログのリンク
              `実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`、
              投稿元を示す`<!-- issue-deck-source:claude-issue-dispatch -->`マーカーを必ず追記する
            - 最後に `gh issue close ${{ steps.state.outputs.issue_number }} --reason "not planned"` を実行し、
              元Issueをクローズする（元Issueは今後このままでは実装されず、作業は上記サブIssueへ引き継がれる
              ことを明示するため）

            ## 迷った場合・行き詰まった場合の振る舞い
            - 許可されていない操作が拒否される等で行き詰まった場合、それ以上粘らず、その時点で作成できた
              サブIssue（0件でもよい）と状況を元Issueにコメントすることを最優先する
              （コメントを一切投稿できないまま終了することが最悪の結果のため）。この場合、元Issueの
              クローズは行わず、人間が状況を確認できるよう開いたままにする

            ## このステップでは行わないこと
            - サブIssueへの`@claude`コメント投稿など、サブIssueの実装を自動的に開始させる操作は行わない
              （サブIssueの着手はこれまでどおり人間が個別に`@claude`とコメントして起動する）
            - コードの変更・コミット・ブランチ作成・PR作成は一切行わない

      - name: 分割結果を検証し、必要ならフォールバックする
        # 計画コメント投稿の検証と同じ考え方。サブIssue作成後の親Issueコメントが確認できない場合、
        # 途中で行き詰まった可能性があるためフォールバック通知を投稿する。
        if: always() && steps.state.outputs.mode == 'split'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          AFTER_COUNT="$(gh issue view ${{ steps.state.outputs.issue_number }} --json comments --jq '.comments | length')"
          BEFORE_COUNT="${{ steps.before_split.outputs.comment_count }}"
          : "${BEFORE_COUNT:=0}"
          if [ "$AFTER_COUNT" -gt "$BEFORE_COUNT" ]; then
            echo "新規コメントを確認できたため分割の完了または途中経過の報告は行われたとみなします（投稿前: $BEFORE_COUNT 件, 投稿後: $AFTER_COUNT 件）"
            exit 0
          fi

          echo "新規コメントが確認できないため、フォールバックコメントを投稿します（投稿前後とも $BEFORE_COUNT 件）"
          FALLBACK_BODY=$'⚠️ Issueの分割に失敗した可能性があります。サブIssueの作成中に許可されていない操作が拒否される、または想定外のエラーが発生する等の理由で、コメント投稿まで到達できなかったと考えられます。\n\nお手数ですが、`@claude` とコメントして再実行するか、必要であれば人間が直接Issueを分割してください。'
          FALLBACK_BODY="$FALLBACK_BODY"$'\n\n'"実行ログ: $RUN_URL"$'\n\n<!-- issue-deck-source:claude-issue-dispatch -->'
          gh issue comment ${{ steps.state.outputs.issue_number }} --body "$FALLBACK_BODY"
          gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "00.check-user"

      - name: 質問前のコメント数を記録する
        id: before_ask
        if: steps.state.outputs.mode == 'ask'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="$(gh issue view ${{ steps.state.outputs.issue_number }} --json comments --jq '.comments | length')"
          echo "comment_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Claude Code（質問応答）
        # コードやIssueの状態を一切変更しない読み取り専用モード。ラベル変更・ブランチ作成・
        # コミット・PR作成は許可しない（allowedToolsにEdit/Write/Bash(git ...)を含めない）。
        if: steps.state.outputs.mode == 'ask'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --allowedTools "Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr list:*),Bash(gh api:*),Bash(git ls-remote:*),Bash(git log:*),Bash(curl:*),Read,Grep,Glob"
            ${{ steps.claude_model.outputs.model_flag }}
          prompt: |
            あなたはissue-deckリポジトリについて質問に答えるエージェントです。Issue #${{ steps.state.outputs.issue_number }} に
            投稿された、`@claude 質問: ` で始まる直近のコメントへの回答のみを行ってください。
            コード変更・コミット・ブランチ作成・PR作成・ラベル操作は一切行いません（許可されたツールにも
            含まれていません）。

            ## 最初にやること
            `gh issue view ${{ steps.state.outputs.issue_number }} --comments` でIssueの本文・ラベル・
            コメント履歴を確認し、直近の `@claude 質問: ` で始まるコメントから質問内容（プレフィックスに
            続く部分）を読み取ってください。

            ## Issue本文・コメントに画像が含まれる場合
            issue-deck独自の画像アップロードAPI（`/api/issues/images/...`のURL）で貼り付けられた画像は、
            GitHub純正の画像CDNではないため自動では読み込めません。回答に画像の内容確認が必要な場合は、
            `curl -o /tmp/<適当なファイル名> "<画像URL>"`で一時ファイルにダウンロードしたうえで、`Read`ツールで
            そのローカルファイルを開いて内容を確認してください（URLを直接`Read`しても開けません）。

            ## やること
            - 必要に応じてリポジトリのコード（`Read`ツール）やgit履歴（`git log`）、関連するPull Request
              （`gh pr list`）を調査し、質問に日本語で回答する
            - `gh issue comment ${{ steps.state.outputs.issue_number }} --body "..."` で回答をコメント投稿する。
              コメント本文の先頭を`@claude`にしない（このワークフロー自身の再トリガーを防ぐため）。
              コメント末尾に、実装フローの通常コメントと視覚的に区別できるよう
              `<!-- issue-deck-qa-answer -->`マーカーと、投稿元を示す
              `<!-- issue-deck-source:claude-issue-dispatch -->`マーカー、このワークフロー実行への
              追跡用リンク`実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
              を必ず追記する

            ## 迷った場合・調査に行き詰まった場合の振る舞い
            - 許可されていない操作が拒否される等で調査に行き詰まった場合、それ以上粘らず、その時点で
              分かっている情報の範囲で回答をコメント投稿することを最優先する
              （コメントを一切投稿できないまま終了することが最悪の結果のため）

            ## このステップでは行わないこと
            - コードの変更・コミット・ブランチ作成・PR作成・Issueのラベル変更・状態変更は一切行わない

      - name: 質問への回答を検証し、必要ならフォールバックする
        if: always() && steps.state.outputs.mode == 'ask'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          AFTER_COUNT="$(gh issue view ${{ steps.state.outputs.issue_number }} --json comments --jq '.comments | length')"
          BEFORE_COUNT="${{ steps.before_ask.outputs.comment_count }}"
          : "${BEFORE_COUNT:=0}"
          if [ "$AFTER_COUNT" -gt "$BEFORE_COUNT" ]; then
            echo "新規コメントを確認できたため質問への回答は完了とみなします（投稿前: $BEFORE_COUNT 件, 投稿後: $AFTER_COUNT 件）"
            exit 0
          fi

          echo "新規コメントが確認できないため、フォールバックコメントを投稿します（投稿前後とも $BEFORE_COUNT 件）"
          FALLBACK_BODY=$'⚠️ 質問への回答に失敗した可能性があります。調査中に許可されていない操作が拒否される、または想定外のエラーが発生する等の理由で、回答コメントの投稿まで到達できなかったと考えられます。\n\nお手数ですが、もう一度「Claudeに質問する」から質問し直してください。'
          FALLBACK_BODY="$FALLBACK_BODY"$'\n\n'"実行ログ: $RUN_URL"$'\n\n<!-- issue-deck-source:claude-issue-dispatch -->'
          gh issue comment ${{ steps.state.outputs.issue_number }} --body "$FALLBACK_BODY"

      - name: 実装前のコメント数を記録する
        id: before_implement
        # additionalモード(PR未作成の詰まった状態からの再開を含む)も、implementと同様に
        # 途中で行き詰まって無言のまま終了しうるため、フォールバック検証の対象に含める。
        if: steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="$(gh issue view ${{ steps.state.outputs.issue_number }} --json comments --jq '.comments | length')"
          echo "comment_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: 既存ブランチをcheckoutする（追加対応時）
        # 実装着手直前に都度最新化する。他エージェント・人間による手動コミットとの競合を避けるため、
        # 先にcheckoutした develop の内容は使わず、ここで改めて既存ブランチへ切り替える(#129)。
        if: steps.state.outputs.mode == 'additional'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -e
          git fetch origin "${{ steps.state.outputs.branch }}"
          git checkout "${{ steps.state.outputs.branch }}"

      - name: Setup pnpm（DBセットアップ用）
        # 以下のDBセットアップ一式は、スクリーンショット撮影(scripts/capture-issue-screenshots.sh)
        # でのみ使われる(#258)。撮影しない`24.screenshot-required`無しのissueでは無駄なため、
        # Playwrightのブラウザインストールと同様にscreenshot_requiredでのみ実行する(#319)。
        if: (steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional') && steps.state.outputs.screenshot_required == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js（DBセットアップ用）
        if: (steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional') && steps.state.outputs.screenshot_required == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: 依存関係をインストールする（DBセットアップ用）
        # 後続のprisma migrate deploy・シードスクリプト実行に必要。実装エージェント自身も
        # lint/typecheck/build実行のため`pnpm install`を行うが、ここで先に済ませておくことで
        # ロックファイルどおりの依存関係でマイグレーション・シードを確実に実行する。
        if: (steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional') && steps.state.outputs.screenshot_required == 'true'
        run: pnpm install --frozen-lockfile

      - name: DBマイグレーションを適用する
        # 無人実行で`pnpm dev`を起動できるようにするための土台(#256)。実際に開発サーバーを
        # 起動して画面を確認・撮影する処理自体は#258で統合済み(後述のClaude Codeステップの
        # プロンプト内`24.screenshot-required`の節、およびscripts/capture-issue-screenshots.sh)。
        if: (steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional') && steps.state.outputs.screenshot_required == 'true'
        env:
          DATABASE_URL: mysql://placeholder:placeholder@127.0.0.1:3306/app_issue_deck
        run: pnpm db:migrate:deploy

      - name: CIバイパス用ログインユーザーをシードする
        # Supabaseを経由しないCI専用ログインバイパス(#257)の対象ユーザーをupsertする。
        # 後続の「画面確認用のダミーデータをシードする」ステップがこのユーザーに
        # UserInstallationを紐付けるため、必ずこちらを先に実行する(#258)。
        if: (steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional') && steps.state.outputs.screenshot_required == 'true'
        env:
          DATABASE_URL: mysql://placeholder:placeholder@127.0.0.1:3306/app_issue_deck
        run: node scripts/ci-seed-user.mjs

      - name: 画面確認用のダミーデータをシードする
        # 実際のGitHub Appとの同期処理(src/lib/github/sync-issues.ts等)は使わず、Prismaで
        # 直接最小限のダミーデータ（リポジトリ・Issue数件）を投入する(#256)。CIバイパス用
        # ユーザーへのUserInstallation紐付けも行う(#258。紐付けが無いと/dashboardが空になる)。
        if: (steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional') && steps.state.outputs.screenshot_required == 'true'
        env:
          DATABASE_URL: mysql://placeholder:placeholder@127.0.0.1:3306/app_issue_deck
        run: pnpm db:seed:ci

      - name: Playwrightのブラウザをインストールする
        # スクリーンショット撮影(#258)にはchromiumのブラウザ本体が必要だが、ダウンロードに
        # 時間がかかるため`24.screenshot-required`が付いている場合のみインストールする。
        if: (steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional') && steps.state.outputs.screenshot_required == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: 02.wip を付与する（実装着手時）
        # Claude Codeエージェント自身にラベル付与を委ねるとLLMの実行タイミング・忘れに
        # 依存してしまう(実際、コメント投稿から付与まで数分〜10分ほど遅延する例があった)ため、
        # 実装着手前にシェルスクリプトで直接・確実に付与する。計画検討中（01.planning）から
        # 実装着手に進む場合に備え、両分岐とも01.planningの除去も併せて行う（付いていなくても
        # 無害）。
        if: steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "${{ steps.state.outputs.mode }}" = "additional" ]; then
            gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "02.wip" --remove-label "03.d:marge" --remove-label "01.planning"
          else
            gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "02.wip" --remove-label "01.planning"
          fi

      - name: Claude Code（実装・PR作成）
        id: claude_implement
        if: steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional'
        uses: anthropics/claude-code-action@v1
        env:
          # .github/workflows/配下を変更するIssueでもgit pushが拒否されないようにする認証は、
          # 前段の「pushの認証をWORKFLOW_PATに固定する」ステップが設定するremote.origin.pushurl
          # で完結しており、このステップのGH_TOKEN/github_tokenには依存しない(#662)。
          # (#635時点では`actions/checkout`のtoken入力がpersist-credentialsで永続化されるため
          # 十分だと判断していたが、claude-code-action自身がその認証情報を消して自前トークンに
          # 差し替えるため誤りだった。#622・#638・#652の停止原因)
          # (#576時点ではGH_TOKENをWORKFLOW_PATにしたうえでコメント投稿・PR作成のみ
          # コマンド単位でDEFAULT_GH_TOKENに上書きさせる方式を試みたが、Claude Codeのbashツール
          # 自体のシークレット保護がTOKENを含む環境変数の展開を一律ブロックするため機能しなかった
          # (#621で発覚)。そのため、そもそもgit pushに不要なWORKFLOW_PATをGH_TOKENに設定するのを
          # やめ、既定のGITHUB_TOKENをそのまま使う「計画提示」ステップと同じ構成に揃える)。
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --allowedTools "Edit,Write,Read,Grep,Glob,Bash(git:*),Bash(gh:*),Bash(pnpm:*),Bash(npx:*),Bash(curl:*)"
            ${{ steps.claude_model.outputs.model_flag }}
          prompt: |
            あなたはissue-deckリポジトリのIssueごとの実装エージェントです。GitHub Actions上で無人実行されて
            おり、対応するIssueは #${{ steps.state.outputs.issue_number }} のみです。このワークフロー実行の
            モードは `${{ steps.state.outputs.mode }}` です。

            - `implement`（新規実装）: 現在のワークツリーは `develop` の最新コミットをチェックアウトした
              状態です。新しく作業ブランチを作成し、新規にPull Requestを作成します。
            - `additional`（既存ブランチへの追加対応）: このIssueに対応する作業ブランチ
              `${{ steps.state.outputs.branch }}` が既に存在し、現在のワークツリーは既にそのブランチを
              checkout済みです。新規ブランチは作成しません。develop向けPull RequestのURLは
              `${{ steps.state.outputs.pr_url }}` です（空の場合は後述のとおりPR未作成の再開ケースです）。
              - PR作成済み（上記URLが空でない場合）: 直近のIssueへの`@claude`コメントへの対応です。まず、
                そのコメントが「コード変更を伴う追加の実装依頼」か「単なる質問・確認」かを判定してください。
                - 単なる質問・確認と判断した場合: コードは一切変更せず、コミット・pushは行いません。
                  `gh issue comment ${{ steps.state.outputs.issue_number }} --body "..."`
                  で質問への回答のみを簡潔に投稿します（PR側ではなくIssue側のスレッドに投稿することで、実装フローの
                  通常コメントと同じ場所で視覚的に区別できるようにするため）。回答コメントの本文末尾には
                  `<!-- issue-deck-qa-answer -->`マーカーと、投稿元を示す
                  `<!-- issue-deck-source:claude-issue-dispatch -->`マーカーを必ず付与してください。
                  なお、このステップの直前のシェルステップで既に`02.wip`が付与され`03.d:marge`が
                  外されているため、状態を元に戻すために
                  `gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "03.d:marge" --add-label "00.check-user" --remove-label "02.wip"`
                  を実行してください（`00.check-user`以外の他のラベルは変更しません）。`00.check-user`は
                  既に付いていても無害なので必ず付与すること。理由: issue-deck画面の「修正を依頼する」
                  ボタンは送信前に機械的に`00.check-user`を外す実装になっており、依頼内容が実際には
                  コード変更を伴わない質問だった場合はコミット・pushが発生しないため
                  `claude-review-develop.yml`側の再判定による`00.check-user`の復元が起きず、確認待ち
                  ラベルが失われたままになってしまう問題があった（#417と同種の問題）。以降の「責務」
                  「画面確認・スクリーンショットについて」の手順は行わず、ここで対応を終了してください。
                - コード変更が必要な依頼と判断した場合: それを踏まえて追加コミットし、新規PRは作らず
                  既存PRにコメントで報告します（以下の「責務」に従って進めてください）。
              - PR未作成（上記URLが空の場合）: 前回の実装試行がPR作成に至らないまま（権限拒否・
                エラー等で）終了した可能性があります。まず`git log develop..HEAD --stat`・`git status`・
                `git diff develop`で現在のブランチの状態を確認してください。
                - 既にコミットされた変更が把握できる内容であれば、それを踏まえて実装を続行して
                  ください（ゼロからやり直す必要はありません）。完了したら新規にPull Requestを
                  作成してください（`implement`と同じ手順）。
                - 続行が難しいほど中途半端・矛盾した状態だと判断した場合は、無理に修正しようと
                  せず、現在の状態を`gh issue comment`で報告し
                  `gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "00.check-user"`
                  を実行して停止してください（ブランチの削除・作り直しは人間の明示操作でのみ行われ、
                  このワークフローが自動で行うことはありません）。

            ## 最初にやること
            - `gh issue view ${{ steps.state.outputs.issue_number }} --comments` でIssueの最新の本文・
              ラベル・コメントを確認する（`implement`で`21.plan-required`が付いている場合、承認済みの
              計画がIssueコメントに投稿されているはずなので、それに沿って実装する。`additional`でPR
              作成済みの場合は、直近の`@claude`コメントの内容を踏まえて対応する。PR未作成の再開の
              場合は、過去のコメント履歴や既存のコミットから前回どこまで実装が進んでいたかも把握する）
              （`02.wip`ラベルの付与・`03.d:marge`からの付け替えは、このステップの前段のシェルステップで
              既に完了しているため、ここで行う必要はない）
            - `implement`の場合のみ`git checkout -b ${{ steps.state.outputs.branch }}`で作業ブランチを
              作成する（`additional`の場合は既にcheckout済みのため不要）

            ## Issue本文・コメントに画像が含まれる場合
            issue-deck独自の画像アップロードAPI（`/api/issues/images/...`のURL）で貼り付けられた画像は、
            GitHub純正の画像CDNではないため自動では読み込めません。実装内容の把握に画像の内容確認が必要な
            場合は、`curl -o /tmp/<適当なファイル名> "<画像URL>"`で一時ファイルにダウンロードしたうえで、
            `Read`ツールでそのローカルファイルを開いて内容を確認してください（URLを直接`Read`しても開けません）。

            ## コメント投稿・PR作成時のトークンについて
            このステップの既定の`GH_TOKEN`は、投稿者が`github-actions[bot]`になる既定のGITHUB_TOKEN
            です。以下の「責務」に記載する`gh issue comment` / `gh pr create` / `gh pr comment` /
            `gh issue edit`は、すべてトークンを上書きせずそのまま実行してください。
            `.github/workflows/`配下を含む`git push`の認証は、このステップより前段で設定済みの
            push専用URL（`remote.origin.pushurl`、workflow書き込み権限を持つPAT）で別途完結して
            いるため、このステップのGH_TOKENには依存しません。`git push origin <ブランチ名>`は
            リモート名`origin`のまま実行してください（push時だけ自動的にPATが使われます）。

            ## コメント投稿元マーカーについて
            このステップ全体を通じて`gh issue comment`によりIssueへ投稿する全てのコメント（上記の
            質問への回答、PR未作成の再開が困難な場合の状況報告、以下の「責務」「画面確認・
            スクリーンショットについて」に記載の完了報告・push競合の報告・スクリーンショット失敗報告・
            画面確認待ちの報告等）の本文末尾に、投稿元を示す
            `<!-- issue-deck-source:claude-issue-dispatch -->`マーカーを必ず付与してください
            （`gh pr create` / `gh pr comment`によるPR側への投稿は対象外です）。

            ## 責務
            - Issueの要件を実装する
            - テスト・Lint・型チェック・ビルドを実行する
            - 変更をコミットする（コミットメッセージは日本語、1〜2文で変更の目的を書き、末尾に
              `#${{ steps.state.outputs.issue_number }}` を付ける。Authorは
              `Claude Code <claude-code@example.com>` にする）
            - ブランチをpushする
              - `implement`の場合: `git push -u origin ${{ steps.state.outputs.branch }}`
              - `additional`の場合: `git push origin ${{ steps.state.outputs.branch }}`（既に追跡設定済み
                のため`-u`は不要）。pushが拒否された場合は
                `git pull --rebase origin ${{ steps.state.outputs.branch }}`で追随し、1回だけリトライする。
                それでも失敗する場合はそれ以上リトライせず、
                `gh issue comment ${{ steps.state.outputs.issue_number }}`
                で他の変更と競合したため追加対応を中断した旨を人間に報告して停止する
            - Pull Requestを作成・更新する
              - `implement`の場合、または`additional`でPRがまだ無い場合:
                `gh pr create --base develop --head ${{ steps.state.outputs.branch }}`で
                `develop`向けPull Requestを作成する（タイトル・本文は日本語。本文には対応Issue・実装内容・
                テスト内容・確認方法・注意点を記載する。developマージ時点ではissueをcloseしない運用のため
                `closes #番号` / `fixes #番号`は使わず、`#${{ steps.state.outputs.issue_number }}`のように
                番号のみ記載する）
              - `additional`でPRが既にある場合: 新規PRは作成しない。既存のPull Request
                （${{ steps.state.outputs.pr_url }}）に`gh pr comment`で、
                今回追加でpushしたコミットの内容を日本語で要約して投稿する
            - 完了したら`gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "03.d:marge" --remove-label "02.wip"`
              を実行する（`additional`の場合も同じコマンドで`02.wip`↔`03.d:marge`の付け替えを閉じる。
              `00.check-user`には触れない。このワークフローのgit pushはPAT
              （`secrets.WORKFLOW_PAT`）で行っており`.github/workflows/issue-labels.yml`が自動発火する
              可能性があるが、未検証のため当てにせず、必ず自分でこのコマンドを実行すること）
            - 最後に `gh issue comment ${{ steps.state.outputs.issue_number }} --body "..."`
              で対応完了の報告コメントをIssueに投稿する（無人実行のため、この報告が使用者にとって唯一の完了確認
              手段になる）。新規にPRを作成した場合はそのURL、既存PRにコメントした場合は追加コミットした旨と
              対象PR（${{ steps.state.outputs.pr_url }}）のURLに加えて、どのような変更・追加対応を行ったかの
              要約（触ったファイルや対応内容が使用者に伝わる程度の箇条書き）を日本語で含めること。
              `24.screenshot-required`が付いている場合は、後述の「画面確認・スクリーンショットについて」の
              節に従い取得したスクリーンショットのURLもこのコメントに埋め込むこと

            ## 画面確認・スクリーンショットについて

            - Issueに`24.screenshot-required`ラベルが付いている場合:
              無人実行でも、Playwrightによる自動スクリーンショット撮影とIssueコメントへの埋め込みまで
              統合済みです（#255の画像埋め込み仕組み・#256のMySQLサービスコンテナ・#257のCI専用ログイン
              バイパスの上に構築。#258）。DBマイグレーション・ダミーデータのシード・CIバイパス用ユーザーの
              作成・Playwright（chromium）のインストールは、このClaude Codeステップより前段の
              シェルスクリプトのステップで既に完了しています。実装・テスト・コミットまで終えたら、
              上記の完了処理（PR作成またはPRコメント投稿）を行う前に以下を行ってください。
              1. `pnpm run capture:issue-screenshots -- ${{ steps.state.outputs.issue_number }} [対象パス]`を
                 実行する。内部で開発サーバー（`next dev`）を起動し、CIバイパス用ユーザーでログインした
                 状態で撮影し、`screenshots`ブランチへコミット・pushしたうえで、埋め込み用のraw URLを
                 標準出力に出力する。第2引数（対象パス）は今回の変更内容から実装エージェント自身が
                 判断して指定すること。
                 - 対応箇所のパスが判断できる場合: そのパスを第2引数に明示指定する
                   （例: `-- ${{ steps.state.outputs.issue_number }} /dashboard`）。ダッシュボード内の
                   特定の状態（モーダル・フィルタ等）を対象にしたい場合はクエリパラメータ付きの
                   URLパスを指定してもよい。この場合、指定したパスをデスクトップビューポートと
                   モバイルデバイスプリセット（`devices['iPhone 13']`）の両方で撮影し、raw URLを
                   標準出力に2行（1行目がデスクトップ、2行目がモバイル）で出力する。
                 - 対応箇所のパスの判断が難しい場合: 無理に推測せず第2引数を省略してよい。この場合、
                   自動的にデスクトップは`/dashboard`1枚、モバイルはホーム・イシュー一覧・イシュー詳細
                   の計3枚（スマホのみボトムナビ等で画面遷移するため）を撮影し、raw URLを標準出力に
                   4行（1行目: デスクトップ、2行目: スマホ・ホーム、3行目: スマホ・イシュー一覧、
                   4行目: スマホ・イシュー詳細）で出力する。
                 - 失敗した場合（開発サーバーが起動しない等）は、無理に修正しようとせず、ブランチの
                   pushまでは行ったうえで`gh issue comment`で失敗した旨と
                   エラー内容を報告し、
                   `gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "00.check-user"`を
                   実行して停止してください（`02.wip`はそのまま、`03.d:marge`への付け替えは行わない。
                   エラーの原因を推測で決めつけず、実際のエラーメッセージをそのままIssueコメントに
                   引用すること）。
              2. 撮影に成功したら、通常どおり完了処理（PR作成またはPRコメント投稿）へ進めてください。
                 ただし取得したスクリーンショットのURLはPR本文・PRコメントには含めず、上記「責務」に
                 記載の最後の完了報告コメント（Issue側の`gh issue comment`）にのみ埋め込んでください
                 （PR側ではなくIssue側のスレッドにスクリーンショットを集約するため）。
                 - 対象パスを明示指定した場合（2行）: `![PC画面](デスクトップのraw URL)`・
                   `![スマホ画面](モバイルのraw URL)`
                 - 対象パスを省略した場合（4行）: `![PC画面](デスクトップのraw URL)`・
                   `![スマホ:ホーム](1つ目のスマホraw URL)`・
                   `![スマホ:イシュー一覧](2つ目のスマホraw URL)`・
                   `![スマホ:イシュー詳細](3つ目のスマホraw URL)`
              - `23.preview-required`も同時に付いている場合、無人実行では実際に到達可能なプレビューURLを
                提供できない点は変わらないため、上記の完了報告コメント（Issue側）に、下記
                「`23.preview-required`のみが付いている場合」と同様のポート割り当て規約に基づく
                `http://localhost:<ポート>`・`http://<WSLまたはLANのIPアドレス>.sslip.io:<ポート>`の
                案内もあわせて記載してください（この場合もブロックはしません）。

            - Issueに`23.preview-required`ラベルが付いていて、`24.screenshot-required`が付いていない場合:
              実装・テストまで終えた時点で上記の完了処理（新規PR作成またはPRコメント投稿）を行わず、
              ブランチのpushまでは行ったうえで、代わりに
              `gh issue edit ${{ steps.state.outputs.issue_number }} --add-label "00.check-user"`を実行し
              （`02.wip`はそのままにし`03.d:marge`への付け替えは行わない）、実装内容の要約と「画面確認が
              必要なためユーザーの確認を待っています」旨を`gh issue comment`で
              投稿して停止してください。
              このコメントに開発サーバーのプレビューURLもあわせて記載する。無人実行では実際にdevサーバーを
              起動できないため、人間が手元でブランチをcheckoutして`pnpm dev`を起動した際に開くURLとして、
              `docs/multi-agent-workflow.md`のポート割り当て規約（`PORT=4000 + Issue番号`。本Issueの
              番号は${{ steps.state.outputs.issue_number }}）に従い、以下の2形式で案内する。
              ・`http://localhost:<ポート>`
              ・`http://<WSLまたはLANのIPアドレス>.sslip.io:<ポート>`（同一LAN上の別端末から確認する
              場合。IPアドレスは人間が手元の環境に合わせて読み替える）
              - 新規にPRを作成する予定だった場合の文言例:「ブランチ `${{ steps.state.outputs.branch }}` の
                内容を確認のうえ、問題なければ手動でPRを作成してください」
              - 既存PRにコメントする予定だった場合の文言例:「ブランチ `${{ steps.state.outputs.branch }}`
                に追加コミットをpushしました。Pull Request（${{ steps.state.outputs.pr_url }}）の内容を
                確認してください」
              コメント末尾に、このワークフロー実行への追跡用リンクとして
              `実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
              を必ず追記する

            - 上記いずれのラベルも付いていない場合は、通常どおり完了処理まで進めてください

            ## 禁止事項
            - `main` / `develop` への直接コミット・push
            - 他Issueのブランチの編集
            - 不要なforce push
            - 自分が作成したPull Requestの自己マージ

            ## コミット・PRの書き方
            - コミットメッセージ・PRタイトル・PR本文は英語ではなく日本語で書く
            - PR本文の見出し（Summary/Test planなど）は英語でもよいが、説明文は日本語で書く

      - name: 実装結果を検証し、完了・待ち状態が確認できない場合はフォールバック通知する
        # Claude Codeエージェントに完了報告コメントの投稿を委ねるだけだと、途中でエラー終了した場合や
        # 許可されていない操作で行き詰まった場合に「どうなったか」が使用者に一切伝わらない恐れがある。
        # そのため計画コメントの検証と同じ考え方で、後続のステップとして独立に結果を確認する。
        # additionalモード(PR未作成の詰まった状態からの再開を含む)も同じ理由で対象に含める。
        if: always() && (steps.state.outputs.mode == 'implement' || steps.state.outputs.mode == 'additional')
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
          RETRY_ATTEMPT: ${{ steps.state.outputs.retry_attempt }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          REPO: ${{ github.repository }}
          CLAUDE_STEP_OUTCOME: ${{ steps.claude_implement.outcome }}
          # 計画提示ステップと同じ考え方(#621)。APP_BASE_URL未設定等でリポジトリ共通の
          # AUTO_RETRY_LIMITを取得できない環境でも、一過性障害と判定した場合にだけ適用する
          # 最低限のリトライ回数。
          TRANSIENT_FALLBACK_RETRY_LIMIT: 2
        run: |
          set -e
          BRANCH="${{ steps.state.outputs.branch }}"
          ISSUE_NUMBER="${{ steps.state.outputs.issue_number }}"

          AFTER_COUNT="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments | length')"
          BEFORE_COUNT="${{ steps.before_implement.outputs.comment_count }}"
          : "${BEFORE_COUNT:=0}"
          if [ "$AFTER_COUNT" -gt "$BEFORE_COUNT" ]; then
            echo "新規コメントを確認できたため、完了または待ち状態の通知は行われたとみなします（投稿前: $BEFORE_COUNT 件, 投稿後: $AFTER_COUNT 件）"
            exit 0
          fi

          PR_URL="$(gh pr list --head "$BRANCH" --state all --json url --jq '.[0].url // empty' 2>/dev/null || true)"
          if [ -n "$PR_URL" ]; then
            echo "コメントは無いがPRの存在を確認できたため、フォールバックとして完了報告コメントを投稿します: $PR_URL"
            PR_BODY="$(gh pr view "$BRANCH" --json body --jq '.body // empty' 2>/dev/null || true)"
            FALLBACK_BODY="✅ 実装が完了し、Pull Requestを確認できました: $PR_URL"
            if [ -n "$PR_BODY" ]; then
              FALLBACK_BODY="$FALLBACK_BODY"$'\n\n---\n\n'"$PR_BODY"
            fi
            FALLBACK_BODY="$FALLBACK_BODY"$'\n\n<!-- issue-deck-source:claude-issue-dispatch -->'
            gh issue comment "$ISSUE_NUMBER" --body "$FALLBACK_BODY"
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "新規コメント・PRのいずれも確認できないため、エラー種別の判定と自動リトライの可否を確認します"

          # Claude Code（実装・PR作成）ステップ自体がfailureで終了した場合、Claude起動前後の
          # GitHub API呼び出しエラー等、一過性の可能性が高いインフラ障害と判断する(#610で実際に
          # 観測された例: 実行者の権限チェックAPIが一時的に503を返しステップごと失敗した)。ステップ
          # 自体はsuccessで終了したが新規コメント・PRのいずれも確認できない場合は、Claude内部での
          # ツール権限拒否等、リトライしても解消しない可能性が高い恒常的な障害と判断する。
          if [ "$CLAUDE_STEP_OUTCOME" = "failure" ]; then
            ERROR_TYPE=transient
          else
            ERROR_TYPE=persistent
          fi
          echo "エラー種別判定: $ERROR_TYPE（Claude Codeステップの終了状態: $CLAUDE_STEP_OUTCOME）"

          # 全リポジトリ共通の自動リトライ上限を読み取り専用APIから取得する(#496, #497)。APP_BASE_URL未設定・
          # API到達不可・レスポンス不正のいずれの場合も安全側(リトライなし=0)にフォールバックする。
          AUTO_RETRY_LIMIT=0
          if [ -n "$APP_BASE_URL" ]; then
            RESPONSE="$(curl -fsS "$APP_BASE_URL/api/settings/auto-retry" 2>/dev/null || true)"
            if [ -n "$RESPONSE" ]; then
              AUTO_RETRY_LIMIT="$(printf '%s' "$RESPONSE" | jq -r '.autoRetryLimit // 0' 2>/dev/null || echo 0)"
            fi
          fi
          case "$AUTO_RETRY_LIMIT" in ''|*[!0-9]*) AUTO_RETRY_LIMIT=0 ;; esac

          # APP_BASE_URL未設定等でAUTO_RETRY_LIMITを取得できない環境でも、一過性障害と判定した
          # 場合は最低限のリトライ回数を保証する(#621)。恒常的な障害の場合はこれまでどおり
          # APP_BASE_URL未設定時はリトライしない。
          if [ "$ERROR_TYPE" = "transient" ] && [ "$AUTO_RETRY_LIMIT" -lt "$TRANSIENT_FALLBACK_RETRY_LIMIT" ]; then
            AUTO_RETRY_LIMIT="$TRANSIENT_FALLBACK_RETRY_LIMIT"
          fi

          NEXT_ATTEMPT=$((RETRY_ATTEMPT + 1))
          if [ "$NEXT_ATTEMPT" -le "$AUTO_RETRY_LIMIT" ]; then
            echo "自動リトライを試みます（${NEXT_ATTEMPT}/${AUTO_RETRY_LIMIT}回目）"
            if GH_TOKEN="$WORKFLOW_PAT" gh workflow run claude-issue-dispatch.yml --repo "$REPO" --ref develop -f issue_number="$ISSUE_NUMBER" -f retry_attempt="$NEXT_ATTEMPT"; then
              RETRY_BODY="🔁 実装ステップの完了を確認できなかったため、自動的に再実行します（${NEXT_ATTEMPT}/${AUTO_RETRY_LIMIT}回目）。既存のブランチ・コミットがあれば続きから再開します。"
              RETRY_BODY="$RETRY_BODY"$'\n\n'"実行ログ: $RUN_URL"$'\n\n<!-- issue-deck-source:claude-issue-dispatch -->'
              gh issue comment "$ISSUE_NUMBER" --body "$RETRY_BODY"
              exit 0
            fi
            echo "自動リトライの起動（gh workflow run）に失敗しました。WORKFLOW_PATに必要な権限（Actions: write相当）が不足している可能性があります。従来どおりのフォールバック通知に切り替えます"
          fi

          echo "自動リトライを行わないため、フォールバックコメントを投稿します（エラー種別: $ERROR_TYPE）"
          if [ "$ERROR_TYPE" = "transient" ]; then
            FALLBACK_BODY="⚠️ 実装ステップが終了しましたが、コメント投稿・PR作成のいずれも確認できませんでした。Claude Code起動前後のGitHub API呼び出しが一時的に失敗した等、一過性の障害が発生したと考えられます。再実行すれば解消する可能性があります。実行ログをご確認ください: $RUN_URL"
          else
            FALLBACK_BODY="⚠️ 実装ステップが終了しましたが、コメント投稿・PR作成のいずれも確認できませんでした。調査や実装の途中で行き詰まった、またはエラーで終了した可能性があります。実行ログをご確認ください: $RUN_URL"
          fi
          if [ "$RETRY_ATTEMPT" -gt 0 ]; then
            FALLBACK_BODY="$FALLBACK_BODY"$'\n\n'"自動リトライを${RETRY_ATTEMPT}回試みましたが解決しませんでした。"
          fi
          FALLBACK_BODY="$FALLBACK_BODY"$'\n\n<!-- issue-deck-source:claude-issue-dispatch -->'$'\n\n<!-- issue-deck-fallback-notice -->'
          gh issue comment "$ISSUE_NUMBER" --body "$FALLBACK_BODY"
          gh issue edit "$ISSUE_NUMBER" --add-label "00.check-user"

  # triage/dispatchジョブが「対応開始をコメントで通知する」ステップに到達する前に落ちた場合、
  # Issue側に痕跡が一切残らず、利用者からは処理が無反応のまま止まったようにしか見えない(#650)。
  # 2026-08-06のGitHub Actions障害(Status: Actions=partial_outage)では、`Set up job`の
  # `Failed to resolve action download info`により本ワークフローのrunが7件連続で失敗し、
  # #641で実際にこの状態が発生した。
  #
  # このジョブは`uses:`を一切使わず`run:`ステップのみで構成する。上記障害はactionの解決処理
  # (`Getting action download info`)そのもので発生したため、actionを使わないジョブであれば
  # 解決処理が不要で、同種の障害でも生き残って通知を残せる見込みが高い。`gh`はrunnerに同梱
  # されているためインストールも要らない。同じ理由でcheckoutも行わない。
  #
  # concurrencyは付けない。dispatchジョブはissueごとに直列化される(#129)が、通知は先行実行の
  # 完了を待たず即座に出す必要があるため。
  #
  # 00.check-userは付与しない。このラベルは解除が「計画の承認」として解釈される経路があり
  # (実装ブランチ未作成の状態でのunlabeledイベント)、計画コメントが投稿されないまま起動に失敗した
  # ケースで付与してしまうと、人間が解除した際に計画フェーズを飛ばして実装が始まる恐れがあるため。
  #
  # 発火条件に`if: failure()`は使わない。実際に検証したところ、dispatchジョブが`Set up job`で
  # 失敗したケース(まさに本ジョブが拾いたいインフラ起因の失敗)では、`if: failure()`が真にならず
  # 本ジョブごとskipされた(run 31119604256で確認)。そのため`always()`で必ず起動したうえで、
  # needs.dispatch.resultの値を見てシェル側で通知要否を判定する。
  notify-failure:
    needs: [triage, dispatch]
    if: always() && (needs.triage.result == 'failure' || needs.dispatch.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 起動失敗をIssueに通知する
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number || github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIAGE_RESULT: ${{ needs.triage.result }}
          DISPATCH_RESULT: ${{ needs.dispatch.result }}
        run: |
          set -e
          echo "各ジョブの結果: triage=$TRIAGE_RESULT dispatch=$DISPATCH_RESULT"

          # cancelled(人間による中断・concurrencyによる置き換え)は意図的な停止のため通知しない。
          # triageが失敗した場合も対象に含める。triageはuses:を使わないぶん障害に強いが、
          # gh API側の障害等で落ちる可能性は残り、その場合もIssueには何も残らないため(#651)。
          if [ "$TRIAGE_RESULT" != "failure" ] && [ "$DISPATCH_RESULT" != "failure" ]; then
            echo "triage・dispatchのいずれも失敗していないため、通知しません"
            exit 0
          fi

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "対象issue番号を特定できないため、通知をスキップします"
            exit 0
          fi

          # dispatchジョブ側が既に何らかの通知(対応開始・各フォールバック通知)を投稿できていた
          # 場合は二重に通知しない。dispatchが投稿するコメントには実行ログURLが含まれるため、
          # 同一runのURLを含むコメントの有無で判定する。判定自体に失敗した場合は投稿する側に倒す
          # (無言で止まるのを防ぐのが本ジョブの目的のため)。
          if gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments[-20:][].body' 2>/dev/null | grep -qF "$RUN_URL"; then
            echo "同一runの通知コメントを確認できたため、重複通知をスキップします"
            exit 0
          fi

          BODY='⚠️ 自動対応の起動に失敗しました。計画・実装のいずれも行われていません。'
          BODY="$BODY"$'\n\n'"実行ログ: $RUN_URL"
          BODY="$BODY"$'\n\n''GitHub Actions側の障害が原因の場合があります。https://www.githubstatus.com で `Actions` の状態をご確認ください。'
          BODY="$BODY"$'\n\n''復旧後、このIssueに改めて `@claude` とコメントすると再開します。'
          BODY="$BODY"$'\n\n<!-- issue-deck-source:claude-issue-dispatch -->'$'\n\n<!-- issue-deck-fallback-notice -->'
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"
