name: Reusable sync secrets

# 1Password（正）から、このリポジトリのGitHub secret / variable へ値を同期する（#1309）。
#
# **なぜActionsの中で書くのか。** issue-deckの画面のボタンから同期できるようにしたいが、
# issue-deckのサーバーから直接GitHub Secrets APIへ書くと、GitHub AppにSecrets書き込み権限を
# 足すことになる。issue-deckは16リポジトリを操作する立場のため、それは「全リポジトリのデプロイ用
# シークレットを書き換えられるアプリ」を作ることを意味する（docs/cross-repo-automation.mdが
# 1Password方式を採った理由として「IssueDeck側にActions Secrets書き込み権限を追加せずに済む」を
# 挙げている）。そこで権限の置き場所を分け、issue-deckは`workflow_dispatch`で起動するだけにして、
# 書き込み権限を持つトークンは対象リポジトリのActionsの中に閉じる。
#
# **中身は`scripts/sync-github-secrets.sh`をそのまま実行するだけ。** CLI・Actions・画面のボタンの
# いずれから叩いても同じものが動く。同期の仕様（何を読み、どこへ書き、何を出力するか）の正は
# スクリプト側にあり、ここはその呼び出しと結果の報告に徹する。
#
# **値そのものも、値の長さも、一切出力しない。** スクリプトが出すのはキー名と件数だけで、
# ここで拾うのもそれだけ（同期・スキップ・失敗の3種類のキー名と件数。#2022）。
# issue-deckはPUBLICリポジトリでActionsのログが誰でも読める。
#
# **1Passwordの日次レート制限に注意。** サービスアカウントの枠はアカウント全体で1,000リクエスト/日で、
# 全件同期1回でマニフェストの項目数ぶん（20〜30件）を消費する。`--dry-run`も同じだけ読むため
# 「安全な下見」にはならない。値を変えた項目だけを`only`で指定するのが本来の使い方。
# （ローカルCLIから叩く場合は個人アカウントのセッションを使うため枠を消費しない。枠を食うのは
# このワークフロー経由の実行だけ。）
#
# 他リポジトリからは
# `uses: guchi-apps/issue-deck/.github/workflows/reusable-sync-secrets.yml@workflows/vN`
# で参照する。
on:
  workflow_call:
    inputs:
      script-path:
        description: "同期スクリプトのパス（既定: scripts/sync-github-secrets.sh。vpsのみ .github/scripts/ にある）"
        required: false
        type: string
        default: scripts/sync-github-secrets.sh
      manifest:
        description: "対応表のパス（空ならスクリプトの既定値 .github/secrets-manifest.tsv）"
        required: false
        type: string
        default: ""
      only:
        description: "同期するKEYをカンマ区切りで絞る（空ならマニフェスト全件）"
        required: false
        type: string
        default: ""

# **concurrency と permissions は呼び出し元（caller）が持つ。** 再利用可能ワークフローの
# トップレベルに置くと、呼び出し時に startup_failure になりうる（#1181）。
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # 同期スクリプトと対応表はこのリポジトリ側にある。workflow_call では
        # github.repository が呼び出し元のリポジトリを指すため、素のcheckoutで対象が取れる。
        uses: actions/checkout@v4

      - name: 入力を検証する
        env:
          ONLY: ${{ inputs.only }}
          SCRIPT_PATH: ${{ inputs.script-path }}
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail

          # onlyはスクリプトの引数に入る。マニフェストのKEYと同じ字種だけを通す
          if [ -n "$ONLY" ] && ! printf '%s' "$ONLY" | grep -qE '^[A-Z0-9_]+(,[A-Z0-9_]+)*$'; then
            echo "::error::only の形式が不正です（英大文字・数字・アンダースコアをカンマ区切り）"
            exit 1
          fi

          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "::error::$SCRIPT_PATH が見つかりません。script-path を指定してください"
            exit 1
          fi

          if [ -n "$MANIFEST" ] && [ ! -f "$MANIFEST" ]; then
            echo "::error::$MANIFEST が見つかりません"
            exit 1
          fi

      - name: 1Password CLI を入れる
        uses: 1password/install-cli-action@v1

      - name: 1Password から GitHub へ同期する
        id: sync
        env:
          # 1Password側の読み取り。**ここだけサービスアカウントの日次枠を消費する**
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # 書き込み側。既定の GITHUB_TOKEN では Actions secrets を書けないため、
          # Secrets / Variables の Read and write を持つPATが要る（#1309）
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          # スクリプトの既定値（guchi-apps/issue-deck）に頼らず、実行中のリポジトリを明示する。
          # --repo ではなく環境変数で渡すのは、他リポジトリへ配った古い版のスクリプトが
          # そのオプションを持たない場合でも壊れないようにするため
          REPO: ${{ github.repository }}
          SCRIPT_PATH: ${{ inputs.script-path }}
          MANIFEST: ${{ inputs.manifest }}
          ONLY: ${{ inputs.only }}
          LOG: ${{ runner.temp }}/sync-secrets.log
        run: |
          set -uo pipefail

          if [ -z "${OP_SERVICE_ACCOUNT_TOKEN:-}" ]; then
            echo "::error::OP_SERVICE_ACCOUNT_TOKEN が未設定です（organization secret を確認してください）"
            exit 1
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::WORKFLOW_PAT が未設定です（organization secret を確認してください）"
            exit 1
          fi

          args=()
          [ -n "$MANIFEST" ] && args+=(--manifest "$MANIFEST")
          [ -n "$ONLY" ] && args+=(--only "$ONLY")

          # 1件の失敗でジョブを止めない。スクリプト自身も止まらず最後に集計を出す作りで、
          # 「何が失敗したか」を画面へ返すことがこのワークフローの目的。
          #
          # **失敗は`|| rc=$?`で明示的に受ける（#2049）。** `run:`の既定シェルは`bash -e {0}`で、
          # 冒頭の`set -uo pipefail`は-uとpipefailを足すだけで-eを打ち消さない。素で呼ぶと
          # スクリプトが非ゼロで終わった瞬間にステップが終わり、次行の`cat "$LOG"`にも集計にも
          # 到達しない。`scripts/sync-github-secrets.sh`は1件でも失敗すれば必ず非ゼロで終わるため、
          # **失敗したときだけログが消える**という、いちばん困る形になっていた
          rc=0
          bash "$SCRIPT_PATH" "${args[@]}" >"$LOG" 2>&1 || rc=$?
          cat "$LOG"

          # 出力から拾うのはキー名と件数だけ。**値も値の長さも拾わない**
          summary="$(grep -E '^同期=' "$LOG" | tail -n 1 || true)"
          synced=0
          skipped=0
          failed=0
          if [ -n "$summary" ]; then
            synced="$(printf '%s' "$summary" | sed -E 's/.*同期=([0-9]+).*/\1/')"
            skipped="$(printf '%s' "$summary" | sed -E 's/.*スキップ=([0-9]+).*/\1/')"
            failed="$(printf '%s' "$summary" | sed -E 's/.*失敗=([0-9]+).*/\1/')"
          fi

          # `FAIL   KEY（理由）` と `FAIL   KEY -> GH_NAME（理由）` のどちらからもKEYだけを取る。
          # **awk '{print $2}' では足りない**——理由の丸括弧はKEYに空白なしで続くため、
          # `KEY（値が空です:` のように理由の断片まで拾ってしまう（実際に踏んだ）
          failed_keys="$(sed -nE 's/^FAIL[[:space:]]+([A-Za-z0-9_]+).*/\1/p' "$LOG" | sort -u | paste -sd, - || true)"

          # **何の項目が同期されたのか**も名前だけ拾って返す（#2022）。件数だけでは
          # 「値を変えた項目が本当に入ったのか」を画面から確かめられなかった。
          # 拾うのはスクリプトが出す `ok     KEY -> ...` と `skip   KEY（...）` の行頭で、
          # 値も値の長さも出力に無い（scripts/sync-github-secrets.sh の取り決め）
          synced_keys="$(sed -nE 's/^ok[[:space:]]+([A-Za-z0-9_]+).*/\1/p' "$LOG" | sort -u | paste -sd, - || true)"
          skipped_keys="$(sed -nE 's/^skip[[:space:]]+([A-Za-z0-9_]+).*/\1/p' "$LOG" | sort -u | paste -sd, - || true)"

          {
            echo "synced=$synced"
            echo "skipped=$skipped"
            echo "failed=$failed"
            echo "failed_keys=$failed_keys"
            echo "synced_keys=$synced_keys"
            echo "skipped_keys=$skipped_keys"
            echo "exit_code=$rc"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 1Password → GitHub の同期"
            echo ""
            echo "- 対象: \`$REPO\`"
            echo "- 同期=$synced スキップ=$skipped 失敗=$failed"
            [ -n "$failed_keys" ] && echo "- 失敗した項目: $failed_keys"
            [ -n "$synced_keys" ] && echo "- 同期した項目: $synced_keys"
            [ -n "$skipped_keys" ] && echo "- スキップした項目: $skipped_keys"
          } >> "$GITHUB_STEP_SUMMARY"

          # 失敗の理由は上の`cat "$LOG"`に出ているが、Actionsの画面ではステップのログが
          # 畳まれていて開かないと読めない。**何が落ちたのかを注釈として実行ページの先頭へ出す。**
          # ここでもキー名と件数だけで、値も値の長さも出さない
          if [ "$rc" -ne 0 ]; then
            if [ -n "$failed_keys" ]; then
              echo "::error::同期に失敗しました（失敗=$failed 件: $failed_keys）。理由はこのステップのログの FAIL 行にあります"
            else
              echo "::error::同期スクリプトが異常終了しました（exit code $rc）。このステップのログを確認してください"
            fi
          fi

          exit "$rc"

      - name: issue-deck へ結果を報告する
        # 同期が失敗しても報告する。むしろ失敗したときこそ画面に出したい
        if: always()
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ONLY: ${{ inputs.only }}
          SYNCED: ${{ steps.sync.outputs.synced }}
          SKIPPED: ${{ steps.sync.outputs.skipped }}
          FAILED: ${{ steps.sync.outputs.failed }}
          FAILED_KEYS: ${{ steps.sync.outputs.failed_keys }}
          SYNCED_KEYS: ${{ steps.sync.outputs.synced_keys }}
          SKIPPED_KEYS: ${{ steps.sync.outputs.skipped_keys }}
          # 同期ステップ自体が起動しなかった場合（opのインストール失敗など）もここへ来る
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          set -uo pipefail

          missing=""
          [ -n "$APP_BASE_URL" ] || missing="APP_BASE_URL"
          [ -n "$PROGRESS_REPORT_SECRET" ] || missing="${missing:+$missing, }PROGRESS_REPORT_SECRET"
          if [ -n "$missing" ]; then
            echo "$missing が未設定のため、issue-deckへの結果報告をスキップします"
            exit 0
          fi

          # 件数が全て0で失敗した場合、同期処理（1Password→GitHubへ書く手前のループ）そのものが
          # 始まる前に落ちている（WORKFLOW_PATが未設定・1Password CLIのインストール失敗など）。
          # そのままだと画面には「同期=0 スキップ=0 失敗=0」としか出ず、何も伝わらない
          message=""
          if [ "$SYNC_OUTCOME" != "success" ] \
            && [ "${SYNCED:-0}" -eq 0 ] && [ "${SKIPPED:-0}" -eq 0 ] && [ "${FAILED:-0}" -eq 0 ]; then
            message="同期処理が始まる前に失敗しました。Actionsの実行ログを確認してください。"
          fi

          # 値は載せない。載せるのは件数と、失敗した項目の**名前だけ**（＋件数だけでは
          # 何も伝わらない場合の補足メッセージ）
          payload="$(jq -nc \
            --arg repository "$REPO" \
            --arg runUrl "$RUN_URL" \
            --arg only "$ONLY" \
            --arg outcome "$SYNC_OUTCOME" \
            --arg failedKeys "${FAILED_KEYS:-}" \
            --arg syncedKeys "${SYNCED_KEYS:-}" \
            --arg skippedKeys "${SKIPPED_KEYS:-}" \
            --arg message "$message" \
            --argjson synced "${SYNCED:-0}" \
            --argjson skipped "${SKIPPED:-0}" \
            --argjson failed "${FAILED:-0}" \
            '{
              repository: $repository,
              runUrl: $runUrl,
              only: $only,
              succeeded: ($outcome == "success"),
              synced: $synced,
              skipped: $skipped,
              failed: $failed,
              failedKeys: (if $failedKeys == "" then [] else ($failedKeys | split(",")) end),
              syncedKeys: (if $syncedKeys == "" then [] else ($syncedKeys | split(",")) end),
              skippedKeys: (if $skippedKeys == "" then [] else ($skippedKeys | split(",")) end),
              message: (if $message == "" then null else $message end)
            }')"

          # **報告の失敗でジョブを落とさない。** issue-deckを単一障害点にしない取り決め
          # （docs/progress-status-architecture.md）に揃える。同期そのものの成否は
          # 前のステップの結果が持つ
          code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
            -X POST "$APP_BASE_URL/api/secrets-sync/report" \
            -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
            -H "Content-Type: application/json" \
            -d "$payload")" || code=000

          if [ "$code" = "200" ]; then
            echo "issue-deckへ結果を報告しました"
          else
            echo "::warning::issue-deckへの結果報告に失敗しました（HTTP $code）"
          fi
