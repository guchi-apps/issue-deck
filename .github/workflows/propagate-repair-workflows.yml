name: Propagate repair workflows

# 置かれていないcallerを追加するPRを、リポジトリごとに作成する（#1948・#1475）。
# 配るのは自動修復の3種（claude-conflict-resolve.yml・claude-ci-fix.yml・
# claude-pr-repair.yml）と、claude-review-develop.yml・deploy-retry.yml。
#
# **なぜ要るか。** 自動修復はissue-deckの画面の「コンフリクトを自動解消」「CI失敗を自動修正」
# から対象リポジトリのcallerをworkflow_dispatchで起動する。callerが無いリポジトリでは押しても
# 404で何も起きず、押すまでそれが分からない。claude-review-develop.ymlはdevelop向けPRの
# 自動マージ可否を判定する唯一の経路で、無いリポジトリでは低リスクPRも含めて全て手動マージ
# になる（#1470・#1475）。どちらも実測ではフリートのうち3リポジトリしか持っていなかった
# （issue-deck・dayspan・shopping-list）。
#
# **claude-review-develop.ymlを配るときは、配布先のリポジトリ設定も揃える**（#1475）。
# `Allow auto-merge`の有効化と`develop`のブランチ保護（必須ステータスチェック）が無いと
# 自動マージは成立しない。詳細は.github/scripts/propagate-repair-workflows.shを参照。
#
# **タグ配布（propagate-workflow-tag.yml）とは別の操作。** あちらは既存callerの
# `@workflows/vN`をsedで置換するもので、こちらは新しいcallerを雛形から作って追加する。
# 自動マージの例外（#1602）は前者にのみ適用されるため、**ここで作るPRは自動マージしない。**
#
# **対象は呼び出し元（issue-deckの画面）が決めて渡す。** ここで再検知すると、画面の表示と
# 実際の対象がずれる。
on:
  workflow_dispatch:
    inputs:
      targets:
        description: '配布先のJSON配列（例: [{"repository":"guchi-apps/aide","workflows":["claude-ci-fix.yml"]}]）'
        required: true
        type: string

concurrency:
  # 同じリポジトリへ二重にPRを作りうる
  group: propagate-repair-workflows
  cancel-in-progress: false

jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # 配布処理（.github/scripts/propagate-repair-workflows.sh）と雛形
        # （.github/templates/callers/）を使うため、このジョブ自身のチェックアウトが要る。
        uses: actions/checkout@v4

      - name: 入力を検証する
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$TARGETS" | jq -e 'type == "array" and length > 0' >/dev/null; then
            echo "::error::targets は空でないJSON配列である必要があります"
            exit 1
          fi

          # owner/repo 以外を弾く。ここを緩めるとgh apiの宛先を任意に指定できてしまう
          if ! printf '%s' "$TARGETS" \
            | jq -e 'all(.repository | test("^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$"))' >/dev/null; then
            echo "::error::targets に owner/repo 形式でない repository が含まれています"
            exit 1
          fi

          # 配れるのは自動修復の3種と claude-review-develop.yml・deploy-retry.yml だけ
          # （#1475・#2134）。ここを緩めると任意のファイル名を作りにいける
          if ! printf '%s' "$TARGETS" | jq -e '
            all(.workflows | type == "array" and length > 0
                and all(. == "claude-ci-fix.yml"
                        or . == "claude-conflict-resolve.yml"
                        or . == "claude-pr-repair.yml"
                        or . == "claude-review-develop.yml"
                        or . == "deploy-retry.yml"))' >/dev/null; then
            echo "::error::workflows に配布対象外のファイル名が含まれています"
            exit 1
          fi

      - name: 各リポジトリへPRを作成する
        env:
          # 他リポジトリの .github/workflows/ を変更するため、workflow権限を持つPATが要る
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          TARGETS: ${{ inputs.targets }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail

          git config --global user.name "Claude Code"
          git config --global user.email "claude-code@example.com"

          FAILED=0
          while read -r REPO WORKFLOWS; do
            echo "::group::$REPO"

            # 1リポジトリの失敗で全体を止めない。残りは配れるほうがよい
            if ! bash .github/scripts/propagate-repair-workflows.sh \
              "$REPO" "$WORKFLOWS" "$SOURCE_REPOSITORY"; then
              echo "::warning::$REPO への配布に失敗しました"
              FAILED=$((FAILED + 1))
            fi

            echo "::endgroup::"
          done < <(printf '%s' "$TARGETS" | jq -r '.[] | "\(.repository) \(.workflows | join(" "))"')

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED 件のリポジトリで失敗しました"
            exit 1
          fi
