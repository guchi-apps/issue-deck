name: Issue Progress (reusable)

# 他リポジトリからも呼び出せる再利用可能ワークフロー本体(#940)。トリガー定義は各リポジトリの
# 薄いcaller(.github/workflows/issue-labels.yml)側に置き、ここにはジョブ本体だけを置く。
# 展開の方式と背景はdocs/multi-agent/labels.md・docs/cross-repo-setup-guide.mdを参照。
#
# 呼ばれる側でも`github`コンテキストはcaller(呼び出し元リポジトリ)のものになるため(#939で実測)、
# 各ジョブの`if:`が見る`github.event_name`/`github.event.action`も、`gh`が対象とする
# リポジトリも、caller側のものになる。そのため以下のジョブ定義はcaller側リポジトリを
# 意識した書き換えを一切必要としない。
#
# `secrets.GITHUB_TOKEN`は再利用可能ワークフローでも自動的に利用可能なため、caller側から
# `secrets: inherit`を渡していない(最小権限)。

# Issueの進捗(Ready -> Planning -> Implementation -> Develop PR -> Develop -> Release -> Done。
# Planningは21.plan-required選択時のみ経由する)の状態遷移をイベント駆動で保証する。
#
# **進捗はGitHub ProjectsのStatusが唯一の正である(#991 Phase 5・#1010)。**
# Phase 4までは同じ遷移を進捗ラベル(計画検討中〜本番反映済の6つ)にも書いており、Statusが壊れても
# ラベルから状態を復元できる二重運用になっていた。Phase 5でラベルを廃止したため、このワークフローが
# 行うのは**issue-deckの進捗報告API(POST /api/progress)への報告だけ**になっている。
# `00.check-user`(条件系ラベル)の付け外しだけはラベル操作として残る。Status = 今どこにいるか、
# Label = どんな性質・条件があるか、という役割分担のため。
#
# develop-pr-opened(Develop PR)・develop-pr-merged(Develop)の2ジョブは、
# 進捗の報告と同時にIssueへ完了報告のコメントも投稿する。盤面より気付きやすい
# 通知手段として、実装エージェント経由・人間の手動PRのどちらでも同じ場所
# (PRオープン・マージイベント)で確実に発火する。
#
# **develop を持たないリポジトリ向けにmain-direct-pr-opened・main-direct-mergedがある(#1901)。**
# 上記の遷移はすべて「作業ブランチ -> develop -> main」を前提にしており、base.refかhead.refの
# どちらかが`develop`であることを見る。guchi-apps/docsのようにPRが`issue-<番号>` -> `main`の
# 形にしかならないリポジトリでは1つも発火せず、Implementationから先へ進む経路が無かった。
# この2ジョブだけがbase.ref == 'main'かつhead.refが`issue-<番号>`のPRを拾う。develop運用の
# リポジトリでは作業ブランチがmainを直接狙わないため、既存の挙動は変わらない。
#
# 対象issueの番号は、本リポジトリの命名規約であるブランチ名 issue-<番号>
# (scripts/start-issue.shが作成)から特定する。head_ref等の値はscript injection
# を避けるため env 経由でのみ参照し、run: 本文に直接展開しない。
#
# gh issue edit の --remove-label は、Issueに未付与なだけなら呼んでも無害(冪等)。ただし
# 対象リポジトリにラベル定義自体が無いと exit 1 になりジョブ全体が落ちる(#975。展開先
# リポジトリのラベル1つの欠落だけで発生する)。そのため`00.check-user`の除去では
# `gh label list`の結果と突き合わせ、実在する場合だけ呼び出している。`00.check-user`の理由を
# 表す`01.check-*`(#1490)も同じ作法で扱い、付ける・外すのは常に`00.check-user`と同じ場所。
#
# develop-pr-mergedジョブは、claude-review-develop.ymlのauto-mergeジョブが有効化する
# GitHub Auto-merge機能による実際のマージ(必須ステータスチェック通過後にGitHub側が
# 非同期に実行)では発火しないことがある(Issue #112。GITHUB_TOKEN起点のイベントは他の
# ワークフローを起動しないというGitHub仕様の影響を受けるため。auto-mergeジョブ自体は
# WORKFLOW_PATで有効化するよう対応済みだが、根本解消したか確証がないための安全網)。
# develop-merge-sweepジョブはこれを取りこぼした`Develop PR`・`Implementation`のissueを
# scheduleで定期的に拾い直す。**拾えなかったもの(developへ入らないまま取り残された
# コミットがあるブランチ)も見送るだけで終わらせず、`00.check-user`を付けて人へ渡す(#1999)。**
#
# **一時的なAPI不調でこの経路が丸ごと失われないようにしてある(#1861)。** #1583では
# develop-pr-openedの報告がHTTP 500、develop-pr-mergedの`gh label list`がHTTP 503に当たり、
# マージ済みのissueが`Implementation`のまま取り残された。対処は3つで、(1)進捗の報告より先に
# 対象issue番号をGITHUB_OUTPUTへ書き、ラベル操作・コメント投稿の失敗は警告に留める、
# (2)issue-deckへのPOST/GETは5xxと接続失敗にだけ再試行する、(3)develop-merge-sweepが
# `Implementation`も走査する。詳細はdocs/progress-status-architecture.mdを参照。
# 判定の失敗経路はscripts/reusable-issue-labels.test.mjsが`run:`本文を直接実行して検証する。
#
# cleanup-on-closeジョブは、上記の状態遷移(main-pr-mergedによるDone遷移)を経由しない
# Issueクローズ(例: 21.plan-requiredの計画をユーザーが承認・練り直しのいずれもせず、
# `not planned`等の理由でIssueを直接クローズして実装自体を取りやめた場合)で、
# `00.check-user`ラベルが「要確認」のまま残り続けるのを防ぐための安全網(issue #172)。
# クローズ済みのIssueはclaude-issue-dispatch.ymlの全モードで再始動しないため
# (`issue_closed`ガード)、`00.check-user`を除去してもワークフローが誤って再始動することはない。
#
# `00.check-user`はclaude-review-develop.ymlの自動マージ不可判定でも「マージ保留」
# シグナルとして使われ、付与時は人間がPRリンクから手動マージする運用になっている。
# その手動マージ自体が確認完了を意味するため、develop-pr-merged・develop-merge-sweep・
# main-pr-mergedの各ジョブでは進捗の報告とあわせて`00.check-user`も除去する(#266。
# 除去のタイミングが無く残り続けていた)。
#
# **その判定を行うclaude-review-develop.ymlは、全リポジトリにあるわけではない。**
# 持たないリポジトリではdevelop向けPRの可否が一度も判定されず、自動マージもされないのに
# `00.check-user`も付かず、PRが開いたまま残る(#1470)。このワークフローは展開済みの全
# リポジトリが呼ぶ唯一の共通経路なので、develop-pr-openedがcallerの有無を見て、
# 無ければ「ユーザーのマージが必要」として`00.check-user`を付ける保険を持つ。
#
# 報告は`ProgressStatusKey`(src/lib/issue-progress.ts)で送る。ラベル名でもStatus名でもない
# 状態キーを送るのは、呼び出し側を表記の変更から切り離すため。
# 各ジョブは遷移対象のissue番号を`issue_numbers`(改行区切り)としてstep outputへ出し、
# 続く報告ステップが同じ本文で処理できるようにしている(単一issueのジョブも一括遷移の
# ジョブも同じ形にするため)。
#
# **報告の失敗はジョブを落とさない。** issue-deckを進捗更新の単一障害点にしないための
# 取り決めで、疎通失敗・未設定は警告に留める。
#
# **ただしPhase 5以降、対象issueの「検索」もissue-deck経由になった。**
# develop-merge-sweep・main-pr-in-progress・main-pr-mergedの3ジョブは、以前
# `gh issue list --label <進捗ラベル>`で対象を探していた。ラベルが無くなった
# 以上、探し先はProjectしかなく、Projectへの読み書きはissue-deckへ一本化する設計
# (docs/progress-status-architecture.md「中核の判断」)に従って`GET /api/progress`を使う。
# **issue-deckへ届かない間、これらのジョブは対象を1件も見つけられず何もしない。**
# ラベルという代替の判断材料はもう無い。取りこぼしはissue-deckの復旧後に
# workflow_dispatch(develop-merge-sweep)またはrun再実行で回収する。
#
# manual-step-labelジョブだけは進捗ではなく条件系ラベルを扱う(#1492)。タイトルが`[手作業]`で
# 始まるIssueへ`71.manual-step`を付ける。このラベルは付いているかどうかでissue-deckの画面が
# 変わる(「ユーザーの作業待ち」ビューに並び、エージェントへ送る導線が消え、実行者向けの案内パネルが
# 出る)ため、付け忘れると**エージェントへ送る導線が出たままの、ただのIssue**になる。
# 起票経路が3つある(issue-deckの作成ダイアログ・エージェントの`gh issue create`・GitHubから
# 直接)以上、どの経路も通る最後の地点で担保できるのはIssueのopenイベントなので、ここに置く。
# **ただしイベントだけでは取りこぼす(#2010)。** caller側の`on: issues: types:`に`opened`が
# 無い時期に起票されたIssueは後からイベントが再発火せず永久に埋まらないため、同じジョブを
# scheduleでも動かし、ラベルの無い手作業Issueを定期的に埋め直す(develop-merge-sweepと同じ安全網)。


on:
  workflow_call:
    secrets:
      PROGRESS_REPORT_SECRET:
        # issue-deckの進捗報告API(POST/GET /api/progress)の共有シークレット(#991 Phase 2)。
        # caller側でorganization secretとして解決される。渡さない・未設定の場合は
        # 報告・問い合わせのステップが警告を出してスキップされる
        # (Project未導入のリポジトリからも同じ実体を呼べるようにするため required: false)。
        required: false

permissions:
  issues: write
  pull-requests: write

jobs:
  wip-on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # 「この push の内容が既にdevelopへマージ済みか」を調べるため、コミットに紐づくPRを読む。
    # ワークフロー先頭の permissions: には contents が無いので、ジョブ側で明示する
    # (develop-pr-openedと同じ形)。
    permissions:
      issues: write
      pull-requests: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: 対象issueを特定する
        id: transition
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^issue-([0-9]+)$ ]]; then
            exit 0
          fi
          n="${BASH_REMATCH[1]}"

          # **既にdevelopへマージ済みのpushでは`implementation`を報告しない**(#1511)。
          #
          # このジョブの実行は、pushそのものではなくGitHub側がrunを作った時刻に起きる。
          # #1503では`git push`(07:48:41)に対してrunの作成が07:59:29までずれ込み、その間に
          # develop-pr-opened(07:49)・develop-pr-merged(07:51)が先に走ってStatusを
          # `Develop`まで進めていた。後から動いた当ジョブが`implementation`を報告した結果、
          # マージ済みのIssueが`Implementation`へ巻き戻った。**この巻き戻りは自力で戻らない**
          # ——develop-merge-sweepが拾うのは`Develop PR`にいるIssueだけで、
          # `Implementation`は対象外のため。
          #
          # 判定は「このコミットを先端とする、同じブランチからdevelopまたはmainへのマージ済みPRが
          # あるか」。`.head.ref`まで見るのは、developの先端から切ったブランチを**コミット前に**
          # pushした場合を巻き込まないため(そのSHAはdevelopのマージコミットでもあり、ブランチ名を
          # 見ないと「マージ済み」と誤判定する)。マージ後の追加対応でpushされた新しいコミットには
          # マージ済みPRが紐づかないため、`Develop` -> `Implementation`という正規の戻り
          # (reusable-issue-dispatch.ymlのmode=additional)は妨げない。
          #
          # **`main`も見るのはmain直行リポジトリのため(#1901)。** そちらのマージ済みPRは
          # `base.ref == 'main'`なので、developだけを見ていると常に「マージ済みでない」と判定し、
          # 遅れて走ったこのジョブがmain-direct-mergedの`Done`を`Implementation`へ巻き戻す。
          # しかも`develop-merge-sweep`は`--base develop`固定で拾い直せない。develop運用の
          # リポジトリでは`issue-<番号>` -> `main`のPRを作らないため、条件を緩めても挙動は
          # 変わらない(`.head.ref`の一致も必ず要求している)。
          #
          # 問い合わせに失敗した場合は報告する側へ倒す(fail-open)。Statusのズレは盤面から直せるが、
          # 報告しなければ実装中のIssueが`Ready`のまま残り、着手が見えなくなるため。
          merged=""
          merged="$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" 2>/dev/null |
            jq --arg branch "$GITHUB_REF_NAME" \
              '[.[] | select(.merged_at != null and (.base.ref == "develop" or .base.ref == "main") and .head.ref == $branch)] | length' \
              2>/dev/null)" || merged=""
          if [[ ! "$merged" =~ ^[0-9]+$ ]]; then
            echo "::warning::$HEAD_SHA に紐づくPRを取得できませんでした。マージ済みではないものとして報告します"
          elif [ "$merged" -gt 0 ]; then
            echo "このpushの内容は既にdevelop・mainへマージ済みのため、issue #$n を Implementation へ戻しません"
            exit 0
          fi

          echo "issue_numbers=$n" >> "$GITHUB_OUTPUT"

      - name: Project Status を報告する
        if: steps.transition.outputs.issue_numbers != ''
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBERS: ${{ steps.transition.outputs.issue_numbers }}
          STATUS: implementation
        run: |
          missing=""
          [ -n "$APP_BASE_URL" ] || missing="APP_BASE_URL"
          [ -n "$PROGRESS_REPORT_SECRET" ] || missing="${missing:+$missing, }PROGRESS_REPORT_SECRET"
          if [ -n "$missing" ]; then
            echo "$missing が未設定のため、Project Statusの報告をスキップします"
            exit 0
          fi
          while read -r n; do
            [ -n "$n" ] || continue
            # 一時的な5xx・接続失敗だけを再試行する(#1861)。#1583では17:06〜17:13の
            # API不調に単発のcurlが当たり、`Develop PR`への報告が失われた。4xxは設定・
            # 実装の誤りで待っても変わらないため、再試行せず即座に諦める。
            code=""
            for attempt in 1 2 3 4; do
              if [ "$attempt" != 1 ]; then sleep "$(( (attempt - 1) * 10 ))"; fi
              code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
                -X POST "$APP_BASE_URL/api/progress" \
                -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
                -H "Content-Type: application/json" \
                -d "{\"repository\":\"$REPO\",\"issue\":$n,\"status\":\"$STATUS\"}")" || code=000
              if [ "$code" = "200" ]; then break; fi
              case "$code" in
                000|5??) ;;
                *) break ;;
              esac
              if [ "$attempt" != 4 ]; then
                echo "Project Statusの報告に失敗しました（issue #$n / HTTP $code）。再試行します"
              fi
            done
            if [ "$code" = "200" ]; then
              echo "issue #$n を $STATUS として報告しました"
            else
              echo "::warning::Project Statusの報告に失敗しました（issue #$n / status=$STATUS / HTTP $code）"
            fi
          done <<< "$ISSUE_NUMBERS"

  develop-pr-opened:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    # 自動マージ判定の経路を調べるため .github/workflows/ の一覧を読む。ワークフロー先頭の
    # permissions: には contents が無いので、ジョブ側で明示する(cleanup-on-closeと同じ形)。
    # callerの付与範囲は超えられないが、展開済みの全リポジトリのcallerが contents: write を
    # 渡していることを確認済み(#1470)。
    permissions:
      issues: write
      pull-requests: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # develop向けPRを「自動マージしてよい」「ユーザーのマージが要る」のどちらかへ確定させるのは
      # claude-review-develop.yml(risk-check -> auto-merge)だけで、このcallerを持たないリポジトリでは
      # その判定が一度も走らない。判定が走らなければ自動マージもされないので、そのPRは必ずユーザーが
      # 手でマージすることになるが、00.check-userが付かないためissue-deckの画面にも「要確認」として
      # 出ず、PRが開いたまま気付かれずに残る(#1470。実測で12リポジトリ13本が放置されていた)。
      # ここでcallerの有無を見て、無ければ「ユーザーのマージが必要」と確定させる。
      # 経路を持つリポジトリでは何もしない——ここで付けるとauto-mergeジョブが
      # 「00.check-userが付いている」と読んで自動マージを常にスキップしてしまうため。
      - name: 自動マージ判定の経路があるか調べる
        id: verdict
        run: |
          # 「一覧は取れたがその中に無い」と「一覧自体が取れなかった」を区別する。後者を
          # 「経路あり」に倒すと放置が再発するため、リトライし切ったら「経路なし」に倒す
          # (fail-closed)。誤って付いた00.check-userは画面から外せるが、付かないPRは
          # 気付かれずに残り続ける。
          listing=""
          for i in 1 2 3; do
            if listing="$(gh api "repos/$GH_REPO/contents/.github/workflows?ref=$BASE_REF" --jq '.[].name' 2>/dev/null)" \
              && [ -n "$listing" ]; then
              break
            fi
            listing=""
            [ "$i" = 3 ] || sleep 5
          done
          if [ -z "$listing" ]; then
            echo "::warning::.github/workflows/ の一覧を取得できませんでした。自動マージ判定の経路が無いものとして扱います"
            echo "auto_merge_path=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$listing" | grep -qx "claude-review-develop.yml"; then
            echo "claude-review-develop.yml があるため、マージ可否の判定はそちらに任せます"
            echo "auto_merge_path=true" >> "$GITHUB_OUTPUT"
          else
            echo "claude-review-develop.yml が無いため、このPRはユーザーのマージが必要です"
            echo "auto_merge_path=false" >> "$GITHUB_OUTPUT"
          fi

      - name: PR作成をIssueへ通知する
        id: transition
        env:
          AUTO_MERGE_PATH: ${{ steps.verdict.outputs.auto_merge_path }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^issue-([0-9]+)$ ]]; then
            exit 0
          fi
          n="${BASH_REMATCH[1]}"

          # **対象issueの出力を最初に行う(#1861)。** ラベル操作・コメント投稿のどれかが
          # GitHub APIの一時的な5xxで落ちると、`bash -e`でこのステップごと異常終了し、
          # 後続の「Project Status を報告する」ステップまでスキップされる。以降の失敗は
          # すべて警告に留め、進捗の報告を最優先で守る(develop-pr-mergedと同じ形)。
          echo "issue_numbers=$n" >> "$GITHUB_OUTPUT"

          note=""
          if [ "$AUTO_MERGE_PATH" != "true" ]; then
            # 対象リポジトリにラベル定義自体が無いと gh issue edit が exit 1 になり
            # ジョブごと落ちる(#975)。実在する場合だけ呼ぶ(develop-pr-mergedと同じ作法)。
            # ユーザーがマージする状態なので、理由は`01.check-merge`(#1490)。理由は常に1枚
            # なので、定義済みの他の理由ラベルは同じ呼び出しで外す。
            REASON_LABEL="01.check-merge"
            DEFINED_LABELS=""
            for attempt in 1 2 3; do
              if [ "$attempt" != 1 ]; then sleep 5; fi
              if DEFINED_LABELS="$(gh label list --json name --jq '.[].name' --limit 200 2>/dev/null)" \
                && [ -n "$DEFINED_LABELS" ]; then
                break
              fi
              DEFINED_LABELS=""
            done
            if [ -z "$DEFINED_LABELS" ]; then
              echo "::warning::ラベル一覧を取得できませんでした。ラベルの付与をスキップします（進捗の報告は続けます）"
            fi
            LABEL_ARGS=()
            for name in "00.check-user" "$REASON_LABEL"; do
              if grep -qx "$name" <<<"$DEFINED_LABELS"; then
                LABEL_ARGS+=(--add-label "$name")
              elif [ -n "$DEFINED_LABELS" ]; then
                echo "::warning::ラベル '$name' がリポジトリに存在しないため付与をスキップします"
              fi
            done
            for name in 01.check-plan 01.check-input 01.check-merge 01.check-blocked 01.check-answered 00.qa-answered; do
              if [ "$name" != "$REASON_LABEL" ] && grep -qx "$name" <<<"$DEFINED_LABELS"; then
                LABEL_ARGS+=(--remove-label "$name")
              fi
            done
            if grep -qx "00.check-user" <<<"$DEFINED_LABELS"; then
              if gh issue edit "$n" "${LABEL_ARGS[@]}"; then
                note=$'\n\n'"⚠️ このリポジトリには自動マージ可否を判定するワークフロー（\`claude-review-develop.yml\`）が無いため、このPRが自動でマージされることはありません。内容を確認したうえでマージしてください。"
              else
                echo "::warning::issue #$n: ラベルの付与に失敗しました（進捗の報告は続けます）"
              fi
            fi
          fi
          gh issue comment "$n" --body "🔧 実装が完了し、developへのPRを作成しました: $PR_URL"$'\n\n'"実行ログ: $RUN_URL$note"$'\n\n<!-- issue-deck-source:issue-labels -->' \
            || echo "::warning::issue #$n: PR作成のコメント投稿に失敗しました（進捗の報告は続けます）"

      - name: Project Status を報告する
        if: steps.transition.outputs.issue_numbers != ''
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBERS: ${{ steps.transition.outputs.issue_numbers }}
          STATUS: develop-pr
        run: |
          missing=""
          [ -n "$APP_BASE_URL" ] || missing="APP_BASE_URL"
          [ -n "$PROGRESS_REPORT_SECRET" ] || missing="${missing:+$missing, }PROGRESS_REPORT_SECRET"
          if [ -n "$missing" ]; then
            echo "$missing が未設定のため、Project Statusの報告をスキップします"
            exit 0
          fi
          while read -r n; do
            [ -n "$n" ] || continue
            # 一時的な5xx・接続失敗だけを再試行する(#1861)。#1583では17:06〜17:13の
            # API不調に単発のcurlが当たり、`Develop PR`への報告が失われた。4xxは設定・
            # 実装の誤りで待っても変わらないため、再試行せず即座に諦める。
            code=""
            for attempt in 1 2 3 4; do
              if [ "$attempt" != 1 ]; then sleep "$(( (attempt - 1) * 10 ))"; fi
              code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
                -X POST "$APP_BASE_URL/api/progress" \
                -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
                -H "Content-Type: application/json" \
                -d "{\"repository\":\"$REPO\",\"issue\":$n,\"status\":\"$STATUS\"}")" || code=000
              if [ "$code" = "200" ]; then break; fi
              case "$code" in
                000|5??) ;;
                *) break ;;
              esac
              if [ "$attempt" != 4 ]; then
                echo "Project Statusの報告に失敗しました（issue #$n / HTTP $code）。再試行します"
              fi
            done
            if [ "$code" = "200" ]; then
              echo "issue #$n を $STATUS として報告しました"
            else
              echo "::warning::Project Statusの報告に失敗しました（issue #$n / status=$STATUS / HTTP $code）"
            fi
          done <<< "$ISSUE_NUMBERS"

  develop-pr-merged:
    # 00.check-userが付いたPRは自動マージがスキップされ、人間がPRリンクから手動マージする
    # 運用になっている(claude-review-develop.ymlのauto-mergeジョブ参照)。このマージ操作自体が
    # 「確認済み」を意味するため、Developへの遷移とあわせて00.check-userもここで除去する
    # (#266。除去のタイミングが無く残り続けていた)。
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.head_ref }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 00.check-user を外しマージ完了を通知する
        id: transition
        run: |
          if [[ ! "$HEAD_REF" =~ ^issue-([0-9]+)$ ]]; then
            exit 0
          fi
          n="${BASH_REMATCH[1]}"

          # **対象issueの出力を最初に行う(#1861)。** ラベル操作・コメント投稿のどれかが
          # GitHub APIの一時的な5xxで落ちると、`bash -e`でこのステップごと異常終了し、
          # 後続の「Project Status を報告する」ステップまでスキップされる。#1583では
          # `gh label list`のHTTP 503でこの経路に落ち、マージ済みのissueが`Implementation`の
          # まま取り残された。**進捗の報告を最優先で守り、以降の失敗はすべて警告に留める。**
          echo "issue_numbers=$n" >> "$GITHUB_OUTPUT"

          # `00.check-user`と理由ラベル`01.check-*`(#1490。旧名`00.qa-answered`を含む)を
          # まとめて外す。展開先リポジトリにラベル定義自体が無いと gh issue edit が exit 1 になり
          # ジョブごと落ちる(#975)ため、実在するものだけを渡す。
          DEFINED_LABELS=""
          for attempt in 1 2 3; do
            if [ "$attempt" != 1 ]; then sleep 5; fi
            if DEFINED_LABELS="$(gh label list --json name --jq '.[].name' --limit 200 2>/dev/null)" \
              && [ -n "$DEFINED_LABELS" ]; then
              break
            fi
            DEFINED_LABELS=""
          done
          REMOVE_ARGS=()
          for name in 00.check-user 01.check-plan 01.check-input 01.check-merge 01.check-blocked 01.check-answered 00.qa-answered; do
            if grep -qx "$name" <<<"$DEFINED_LABELS"; then
              REMOVE_ARGS+=(--remove-label "$name")
            fi
          done
          if [ "${#REMOVE_ARGS[@]}" -gt 0 ]; then
            gh issue edit "$n" "${REMOVE_ARGS[@]}" \
              || echo "::warning::issue #$n: ラベルの除去に失敗しました（進捗の報告は続けます）"
          elif [ -z "$DEFINED_LABELS" ]; then
            echo "::warning::ラベル一覧を取得できませんでした。ラベルの除去をスキップします（進捗の報告は続けます）"
          else
            echo "::warning::ラベル '00.check-user' がリポジトリに存在しないため除去をスキップします"
          fi
          gh issue comment "$n" --body "✅ developへのマージが完了しました: $PR_URL"$'\n\n'"実行ログ: $RUN_URL"$'\n\n<!-- issue-deck-source:issue-labels -->' \
            || echo "::warning::issue #$n: マージ完了のコメント投稿に失敗しました（進捗の報告は続けます）"

      # 1つのIssueに複数のPRが発生するため、ここでの`develop`は「最新のPRがdevelopへ入った」
      # ことを表し、Issueの完了を意味しない(docs/progress-status-architecture.md)。
      # Statusは次のPRで`Develop PR`へ戻る。この往復は正常な挙動として扱う。
      - name: Project Status を報告する
        if: steps.transition.outputs.issue_numbers != ''
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBERS: ${{ steps.transition.outputs.issue_numbers }}
          STATUS: develop
        run: |
          missing=""
          [ -n "$APP_BASE_URL" ] || missing="APP_BASE_URL"
          [ -n "$PROGRESS_REPORT_SECRET" ] || missing="${missing:+$missing, }PROGRESS_REPORT_SECRET"
          if [ -n "$missing" ]; then
            echo "$missing が未設定のため、Project Statusの報告をスキップします"
            exit 0
          fi
          while read -r n; do
            [ -n "$n" ] || continue
            # 一時的な5xx・接続失敗だけを再試行する(#1861)。#1583では17:06〜17:13の
            # API不調に単発のcurlが当たり、`Develop PR`への報告が失われた。4xxは設定・
            # 実装の誤りで待っても変わらないため、再試行せず即座に諦める。
            code=""
            for attempt in 1 2 3 4; do
              if [ "$attempt" != 1 ]; then sleep "$(( (attempt - 1) * 10 ))"; fi
              code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
                -X POST "$APP_BASE_URL/api/progress" \
                -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
                -H "Content-Type: application/json" \
                -d "{\"repository\":\"$REPO\",\"issue\":$n,\"status\":\"$STATUS\"}")" || code=000
              if [ "$code" = "200" ]; then break; fi
              case "$code" in
                000|5??) ;;
                *) break ;;
              esac
              if [ "$attempt" != 4 ]; then
                echo "Project Statusの報告に失敗しました（issue #$n / HTTP $code）。再試行します"
              fi
            done
            if [ "$code" = "200" ]; then
              echo "issue #$n を $STATUS として報告しました"
            else
              echo "::warning::Project Statusの報告に失敗しました（issue #$n / status=$STATUS / HTTP $code）"
            fi
          done <<< "$ISSUE_NUMBERS"

  develop-merge-sweep:
    # GitHub Auto-merge機能によるマージがdevelop-pr-mergedジョブを起動しなかった
    # ケースの安全網。`Develop PR`・`Implementation`にいる全issueについて、対応ブランチ
    # (issue-<番号>)からdevelopへのPRが既にマージ済みかを確認し、マージ済みなら`Develop`へ進める。
    #
    # **`Implementation`も対象にするのは、`Develop PR`へ一度も到達しないまま
    # 取り残されるケースがあるため(#1861)。** develop-pr-openedの`POST /api/progress`が
    # 一時的な5xxで失敗すると、PRを作ってもStatusは`Implementation`のまま動かない。
    # そのまま人がPRをマージし、develop-pr-mergedも同じ時間帯のAPI不調で落ちると、
    # 「`Develop PR`にいるissue」しか見ていなかった従来のこのジョブは対象にすら入れられず、
    # 拾い直す経路がどこにも無かった(#1583で実測)。
    #
    # ただし`Implementation`には「developへマージしたあと追加対応でブランチへpushした」
    # 正規の状態(reusable-issue-dispatch.ymlのmode=additional)も含まれる。マージ済みPRが
    # あるだけで進めると実装中のissueを勝手に動かすため、**マージ済みPRの先端と現在の
    # ブランチの先端が一致するか**を必ず確かめる(#1513と同じ考え方)。マージ後に
    # ブランチが削除されている場合は追加のpushが無い証拠として扱う。
    #
    # **先端が一致しないときに黙って見送らない(#1999)。** 先端不一致には「追加対応で
    # 実装中」だけでなく「PRのマージとほぼ同時にpushされ、どのPRにも載らないまま
    # developへ入らないコミット」も含まれる。従来はどちらも同じ1行をログへ書いて
    # 見送るだけだったため、後者は15分ごとに見送られ続けるだけで誰にも伝わらなかった
    # (guchi-apps/subscription-lists#99で実測。本番の画面が404のまま残った)。
    # developへ入っていないコミットの有無を比較で確かめ、猶予時間を過ぎても
    # develop向けPRが開かれないものへ`00.check-user`+`01.check-blocked`を付けて通知する。
    #
    # 対象の探し方がPhase 5で変わった。以前は`gh issue list --label <進捗ラベル>`で
    # GitHubのラベルから探していたが、ラベルを廃止したためissue-deckへ問い合わせる。
    # **issue-deckへ届かなければ対象は0件になり、このrunは何もしない。**
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # ブランチとdevelopの比較(compare API)を読むためcontentsが要る。ワークフロー先頭の
    # permissions:には無いので、develop-pr-openedと同じ形でジョブ側に明示する。
    permissions:
      issues: write
      pull-requests: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: マージ済みのdevelop向けPRを持つissueをDevelopへ進める
        id: transition
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          REPO: ${{ github.repository }}
        run: |
          missing=""
          [ -n "$APP_BASE_URL" ] || missing="APP_BASE_URL"
          [ -n "$PROGRESS_REPORT_SECRET" ] || missing="${missing:+$missing, }PROGRESS_REPORT_SECRET"
          if [ -n "$missing" ]; then
            echo "::warning::$missing が未設定のため、対象issueを特定できません（進捗の問い合わせにissue-deckが必要です）"
            exit 0
          fi
          body_file="${RUNNER_TEMP:-/tmp}/progress-develop-pr.json"
          # 一時的な5xx・接続失敗だけを再試行する(#1861)。4xxは設定・実装の誤りで、
          # 待っても変わらないため即座に諦める。
          code=""
          for attempt in 1 2 3 4; do
            if [ "$attempt" != 1 ]; then sleep "$(( (attempt - 1) * 10 ))"; fi
            code="$(curl -sS -m 20 -o "$body_file" -w '%{http_code}' \
              -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
              "$APP_BASE_URL/api/progress?repository=$REPO&status=develop-pr,implementation")" || code=000
            if [ "$code" = "200" ]; then break; fi
            case "$code" in
              000|5??) ;;
              *) break ;;
            esac
            if [ "$attempt" != 4 ]; then
              echo "issue-deckへの問い合わせに失敗しました（HTTP $code）。再試行します"
            fi
          done
          # 「対象が0件」と「issue-deckへ届かなかった」を区別する(#1124)。進捗ラベルを廃止した
          # 後はラベルという代替の判断材料が無く、両者を同じ文言にすると「リリースしたのに
          # issueが1件もcloseされない」が正常系と見分けられなくなる。
          if [ "$code" != "200" ]; then
            echo "::warning::issue-deckへ問い合わせできませんでした（HTTP $code）。対象issueを特定できないため何もしません"
            exit 0
          fi
          if [ "$(jq -r '.available // false' "$body_file" 2>/dev/null || echo false)" != "true" ]; then
            echo "::warning::issue-deckが進捗を返せませんでした（reason=$(jq -r '.reason // "unknown"' "$body_file" 2>/dev/null || echo unknown)）。対象issueを特定できないため何もしません"
            exit 0
          fi
          numbers="$(jq -r '.issues[]' "$body_file" 2>/dev/null || true)"
          if [ -z "$numbers" ]; then
            echo "Develop PR・Implementation にいるopenなissueはありません（対象なしのため何もしません）"
            exit 0
          fi

          # `00.check-user`と理由ラベル`01.check-*`(#1490。旧名`00.qa-answered`を含む)を
          # まとめて外す。展開先リポジトリにラベル定義自体が無いと gh issue edit が exit 1 になり
          # ジョブごと落ちる(#975)ため、実在するものだけを渡す。
          #
          # ラベル一覧の取得もGitHub APIの一時的な5xxで落ちる(#1583でHTTP 503を実測)。
          # 取れなければラベルの除去だけを諦め、進捗の報告は続ける(#1861)。
          DEFINED_LABELS=""
          for attempt in 1 2 3; do
            if [ "$attempt" != 1 ]; then sleep 5; fi
            if DEFINED_LABELS="$(gh label list --json name --jq '.[].name' --limit 200 2>/dev/null)" \
              && [ -n "$DEFINED_LABELS" ]; then
              break
            fi
            DEFINED_LABELS=""
          done
          if [ -z "$DEFINED_LABELS" ]; then
            echo "::warning::ラベル一覧を取得できませんでした。ラベルの除去をスキップします（進捗の報告は続けます）"
          fi
          REMOVE_ARGS=()
          for name in 00.check-user 01.check-plan 01.check-input 01.check-merge 01.check-blocked 01.check-answered 00.qa-answered; do
            if grep -qx "$name" <<<"$DEFINED_LABELS"; then
              REMOVE_ARGS+=(--remove-label "$name")
            fi
          done
          # developへ入らないまま取り残されたコミットを見つけたときに付けるラベル(#1999)。
          # ユーザーがやることは「計画の承認」ではなく「続け方の指示」なので理由は
          # `01.check-blocked`。理由は常に1枚なので、定義済みの他の理由ラベルは同じ
          # 呼び出しで外す(develop-pr-openedと同じ作法)。
          STRANDED_REASON_LABEL="01.check-blocked"
          ADD_ARGS=()
          if grep -qx "00.check-user" <<<"$DEFINED_LABELS"; then
            ADD_ARGS+=(--add-label "00.check-user")
            if grep -qx "$STRANDED_REASON_LABEL" <<<"$DEFINED_LABELS"; then
              ADD_ARGS+=(--add-label "$STRANDED_REASON_LABEL")
            fi
            for name in 01.check-plan 01.check-input 01.check-merge 01.check-blocked 01.check-answered 00.qa-answered; do
              if [ "$name" != "$STRANDED_REASON_LABEL" ] && grep -qx "$name" <<<"$DEFINED_LABELS"; then
                ADD_ARGS+=(--remove-label "$name")
              fi
            done
          fi
          transitioned=""
          for n in $numbers; do
            # 該当なしなら`[]`、取得に失敗したときだけ空になる。失敗を「マージ済みPRが無い」と
            # 取り違えないよう区別し、失敗は次回のスケジュール実行に回す(#1861)
            merged_json="$(gh pr list --state merged --base develop --head "issue-$n" \
              --json url,headRefOid,mergedAt --limit 20 2>/dev/null)" || merged_json=""
            if [ -z "$merged_json" ]; then
              echo "::warning::issue #$n: マージ済みPRを取得できませんでした。次回のスケジュール実行で再判定します"
              continue
            fi
            pr_url="$(jq -r 'sort_by(.mergedAt) | last | .url // empty' <<<"$merged_json" 2>/dev/null || true)"
            pr_head="$(jq -r 'sort_by(.mergedAt) | last | .headRefOid // empty' <<<"$merged_json" 2>/dev/null || true)"
            if [ -z "$pr_url" ]; then
              continue
            fi

            # マージ後に追加でpushされていないかを確かめる(#1861)。`Implementation`には
            # マージ後の追加対応(mode=additional)も含まれるため、マージ済みPRがあるだけで
            # 進めると実装中のissueを勝手に`Develop`へ動かしてしまう。
            # ブランチが消えている(HTTP 404)なら、そのissueへの追加のpushは無い。
            ref_json="$(gh api "repos/$GH_REPO/git/ref/heads/issue-$n" 2>/dev/null)" || true
            branch_head="$(jq -r '.object.sha // empty' <<<"$ref_json" 2>/dev/null || true)"
            ref_status="$(jq -r '.status // empty' <<<"$ref_json" 2>/dev/null || true)"
            if [ -n "$branch_head" ] && [ "$branch_head" != "$pr_head" ]; then
              # 先端が一致しない理由は2つあり、従来はまとめて見送っていた(#1999)。
              # (a)マージ後の追加対応でpushした実装中(mode=additional)
              # (b)PRのマージとほぼ同時にpushされ、どのPRにも載らないまま取り残された
              #    コミット。**このジョブが15分ごとに同じ行をログへ書くだけで、
              #    developへ入らないことが誰にも伝わらなかった**(guchi-apps/subscription-lists#99。
              #    2秒差のpushでdevelopに画面のルートが入らず、本番が404のまま残った)。
              #
              # 見分けにはdevelopとの比較を使う。developへ入っていないコミットが1件も
              # 無ければ、先端が違っても取り残しは無いので、そのまま`Develop`へ進めてよい
              # (人がcherry-pick等で取り残しを解消した後、ここで止まり続けないための経路でもある)。
              compare_json="$(gh api "repos/$GH_REPO/compare/develop...issue-$n" 2>/dev/null)" || compare_json=""
              ahead="$(jq -r '.ahead_by // empty' <<<"$compare_json" 2>/dev/null || true)"
              if [ -z "$ahead" ]; then
                echo "::warning::issue #$n: ブランチ issue-$n とdevelopの差分を取得できませんでした。次回のスケジュール実行で再判定します"
                continue
              fi
              # **コミット数だけでは取り残しと言えない(#2289)。** developへ入っていない
              # コミットはあるが、developへ持ち込む変更は1件も無いブランチがある。
              # コンフリクト解消のワークフロー(claude-conflict-resolve)とローカル
              # セッションが同じコンフリクトを別々に解消し、PRには片方だけが載って
              # マージされた場合がこれで、残るのは中身の同じマージコミットだけになる
              # (#2249。ahead_by=2・変更ファイル0件で`00.check-user`が付いた)。
              # compareは三点比較なので、filesが空＝マージしても何も入らない。
              # **`files`が読めなかったときは従来どおり取り残しとして扱う**(応答の形が
              # 変わって「変更なし」と読み違えると、本物の取り残しを黙って見送ることに
              # なる。#1999で直したのはまさにその見送りだった)。
              changed_files="$(jq -r 'if has("files") then ([.files[]] | length) else "" end' <<<"$compare_json" 2>/dev/null || true)"
              if [ "$ahead" != "0" ] && [ "$changed_files" != "0" ]; then
                # ここから先は「取り残しかどうか」の判定。実装中(a)と区別が付かないため、
                # (1)developへのPRが開いていない、(2)最後のコミットから猶予時間が過ぎている、
                # の両方を満たすものだけを取り残しとして扱う。回数ではなく時間で見るのは、
                # ジョブが実行間の状態を持てないため(#1999)。
                open_json="$(gh pr list --state open --base develop --head "issue-$n" \
                  --json url --limit 5 2>/dev/null)" || open_json=""
                if [ -z "$open_json" ]; then
                  echo "::warning::issue #$n: 開いているdevelop向けPRを取得できませんでした。取り残しの判定は次回のスケジュール実行に回します"
                  continue
                fi
                if [ "$(jq -r 'length' <<<"$open_json" 2>/dev/null || echo 0)" != "0" ]; then
                  echo "issue #$n: developへ未マージのコミットがありますが、develop向けPRが開いているため進めません（取り残しではありません）"
                  continue
                fi
                grace_minutes="${STRANDED_GRACE_MINUTES:-120}"
                last_commit_at="$(jq -r '.commits | last | .commit.committer.date // empty' <<<"$compare_json" 2>/dev/null || true)"
                last_epoch=""
                if [ -n "$last_commit_at" ]; then
                  last_epoch="$(date -u -d "$last_commit_at" +%s 2>/dev/null || true)"
                fi
                if [ -z "$last_epoch" ]; then
                  echo "::warning::issue #$n: 未マージコミットの日時を判定できませんでした。次回のスケジュール実行で再判定します"
                  continue
                fi
                age_minutes=$(( ( $(date -u +%s) - last_epoch ) / 60 ))
                if [ "$age_minutes" -lt "$grace_minutes" ]; then
                  echo "issue #$n: developへ未マージのコミットが${ahead}件ありますが、最後のコミットから${age_minutes}分のため様子を見ます（${grace_minutes}分を超えたら通知します）"
                  continue
                fi
                # 同じ先端について通知を繰り返さない。15分おきに走るため、冪等でないと
                # 同じ内容が一日100件近く積まれる。**取得に失敗したときは通知しない**
                # (二重投稿より、次回の実行へ回す方が軽い)。
                stranded_marker="<!-- issue-deck-stranded:issue-$n@$branch_head -->"
                stranded_notified="$(gh issue view "$n" --json comments 2>/dev/null \
                  | jq --arg m "$stranded_marker" '[.comments[].body | select(contains($m))] | length' 2>/dev/null)" || stranded_notified=""
                if [ -z "$stranded_notified" ]; then
                  echo "::warning::issue #$n: 既存コメントを取得できませんでした。取り残しの通知は次回のスケジュール実行に回します"
                  continue
                fi
                if [ "$stranded_notified" != "0" ]; then
                  echo "issue #$n: 取り残し（$branch_head）は通知済みのため、コメントは投稿しません"
                  continue
                fi
                if [ "${#ADD_ARGS[@]}" -gt 0 ]; then
                  gh issue edit "$n" "${ADD_ARGS[@]}" \
                    || echo "::warning::issue #$n: 00.check-user の付与に失敗しました（コメントの投稿は続けます）"
                fi
                gh issue comment "$n" --body "⚠️ developへ入っていないコミットが \`issue-$n\` に残っています。"$'\n\n'"- ブランチ \`issue-$n\` の先端: \`$branch_head\`"$'\n'"- 直近のマージ済みPR: $pr_url （head \`$pr_head\`）"$'\n'"- developへ入っていないコミット: ${ahead}件（最後のコミットから約${age_minutes}分）"$'\n\n'"PRのマージとほぼ同時にpushされたコミットは、そのPRに含まれずdevelopへも入りません。このままでは進捗も\`Develop\`へ進みません。次のどちらかで解消してください。"$'\n\n'"1. コミットが必要なら、\`issue-$n\` から \`develop\` への新しいPull Requestを作成してマージする"$'\n'"2. コミットが不要なら、ブランチ \`issue-$n\` を削除する"$'\n\n'"実行ログ: $RUN_URL"$'\n\n'"$stranded_marker"$'\n<!-- issue-deck-source:issue-labels -->' \
                  || echo "::warning::issue #$n: 取り残しのコメント投稿に失敗しました"
                echo "issue #$n: developへ入っていないコミット${ahead}件を取り残しとして通知しました"
                continue
              fi
              if [ "$ahead" = "0" ]; then
                echo "issue #$n: ブランチ issue-$n の先端はマージ済みPR（$pr_url）と違いますが、developへ入っていないコミットは無いため進めます"
              else
                echo "issue #$n: ブランチ issue-$n にdevelopへ入っていないコミットが${ahead}件ありますが、developへ持ち込む変更が無いため進めます（コンフリクト解消のマージコミットなど）"
              fi
            elif [ -z "$branch_head" ] && [ "$ref_status" != "404" ]; then
              echo "::warning::issue #$n: ブランチ issue-$n の状態を確認できませんでした。次回のスケジュール実行で再判定します"
              continue
            fi

            if [ "${#REMOVE_ARGS[@]}" -gt 0 ]; then
              gh issue edit "$n" "${REMOVE_ARGS[@]}" \
                || echo "::warning::issue #$n: ラベルの除去に失敗しました（進捗の報告は続けます）"
            fi
            # 同じPRのマージを既に通知済みなら重ねて通知しない。`Implementation`を対象に
            # 加えたことで、develop-pr-mergedが通知だけ済ませた後にStatusが巻き戻った
            # ケース(#1511)を拾うと二重に通知しうるため(#1861)
            notified="$(gh issue view "$n" --json comments 2>/dev/null \
              | jq --arg url "$pr_url" '[.comments[].body | select(contains($url) and contains("developへのマージが完了しました"))] | length' 2>/dev/null)" || notified=""
            if [ "$notified" = "0" ] || [ -z "$notified" ]; then
              gh issue comment "$n" --body "✅ developへのマージが完了しました: $pr_url"$'\n\n'"実行ログ: $RUN_URL"$'\n\n<!-- issue-deck-source:issue-labels -->' \
                || echo "::warning::issue #$n: マージ完了のコメント投稿に失敗しました（進捗の報告は続けます）"
            else
              echo "issue #$n: $pr_url のマージは通知済みのため、コメントは投稿しません"
            fi
            transitioned="${transitioned}${n}"$'\n'
          done
          if [ -n "$transitioned" ]; then
            {
              echo "issue_numbers<<TRANSITIONED_EOF"
              printf '%s' "$transitioned"
              echo "TRANSITIONED_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Project Status を報告する
        if: steps.transition.outputs.issue_numbers != ''
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBERS: ${{ steps.transition.outputs.issue_numbers }}
          STATUS: develop
        run: |
          while read -r n; do
            [ -n "$n" ] || continue
            # 一時的な5xx・接続失敗だけを再試行する(#1861)。#1583では17:06〜17:13の
            # API不調に単発のcurlが当たり、`Develop PR`への報告が失われた。4xxは設定・
            # 実装の誤りで待っても変わらないため、再試行せず即座に諦める。
            code=""
            for attempt in 1 2 3 4; do
              if [ "$attempt" != 1 ]; then sleep "$(( (attempt - 1) * 10 ))"; fi
              code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
                -X POST "$APP_BASE_URL/api/progress" \
                -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
                -H "Content-Type: application/json" \
                -d "{\"repository\":\"$REPO\",\"issue\":$n,\"status\":\"$STATUS\"}")" || code=000
              if [ "$code" = "200" ]; then break; fi
              case "$code" in
                000|5??) ;;
                *) break ;;
              esac
              if [ "$attempt" != 4 ]; then
                echo "Project Statusの報告に失敗しました（issue #$n / HTTP $code）。再試行します"
              fi
            done
            if [ "$code" = "200" ]; then
              echo "issue #$n を $STATUS として報告しました"
            else
              echo "::warning::Project Statusの報告に失敗しました（issue #$n / status=$STATUS / HTTP $code）"
            fi
          done <<< "$ISSUE_NUMBERS"

  main-pr-in-progress:
    # develop -> main のPRが開いている間、その時点で`Develop`にいる全issueを`Release`へ
    # 一括で進める。synchronizeも対象にすることで、PRオープン後にheadへ追加された分も
    # 随時反映する。
    #
    # **リリースPRのheadは固定ブランチ`release-main/vX.Y.Z`（#2117）で、作成後は動かない。**
    # そのためsynchronizeは実質発火せず、`opened`の1回だけが掃き寄せになる。リリースPRの
    # 作成後にdevelopへ入ったissueは`Develop`のまま残り、次のリリースで`Release`へ進む
    # （それがmainへ出る内容と一致する）。`develop`をheadに持つのは#2117以前のPRか、
    # 共有ワークフローの参照タグが古いリポジトリのPR。
    #
    # 対象の探し方はdevelop-merge-sweepと同じ理由でissue-deckへの問い合わせになっている。
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize') &&
      github.event.pull_request.base.ref == 'main' &&
      (github.event.pull_request.head.ref == 'develop' ||
       startsWith(github.event.pull_request.head.ref, 'release-main/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Develop にいる issue を特定する
        id: transition
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          REPO: ${{ github.repository }}
        run: |
          missing=""
          [ -n "$APP_BASE_URL" ] || missing="APP_BASE_URL"
          [ -n "$PROGRESS_REPORT_SECRET" ] || missing="${missing:+$missing, }PROGRESS_REPORT_SECRET"
          if [ -n "$missing" ]; then
            echo "::warning::$missing が未設定のため、対象issueを特定できません（進捗の問い合わせにissue-deckが必要です）"
            exit 0
          fi
          body_file="${RUNNER_TEMP:-/tmp}/progress-develop.json"
          # 一時的な5xx・接続失敗だけを再試行する(#1861)
          code=""
          for attempt in 1 2 3 4; do
            if [ "$attempt" != 1 ]; then sleep "$(( (attempt - 1) * 10 ))"; fi
            code="$(curl -sS -m 20 -o "$body_file" -w '%{http_code}' \
              -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
              "$APP_BASE_URL/api/progress?repository=$REPO&status=develop")" || code=000
            if [ "$code" = "200" ]; then break; fi
            case "$code" in
              000|5??) ;;
              *) break ;;
            esac
            if [ "$attempt" != 4 ]; then
              echo "issue-deckへの問い合わせに失敗しました（HTTP $code）。再試行します"
            fi
          done
          # 「対象が0件」と「issue-deckへ届かなかった」を区別する(#1124)。進捗ラベルを廃止した
          # 後はラベルという代替の判断材料が無く、両者を同じ文言にすると「リリースしたのに
          # issueが1件もcloseされない」が正常系と見分けられなくなる。
          if [ "$code" != "200" ]; then
            echo "::warning::issue-deckへ問い合わせできませんでした（HTTP $code）。対象issueを特定できないため何もしません"
            exit 0
          fi
          if [ "$(jq -r '.available // false' "$body_file" 2>/dev/null || echo false)" != "true" ]; then
            echo "::warning::issue-deckが進捗を返せませんでした（reason=$(jq -r '.reason // "unknown"' "$body_file" 2>/dev/null || echo unknown)）。対象issueを特定できないため何もしません"
            exit 0
          fi
          numbers="$(jq -r '.issues[]' "$body_file" 2>/dev/null || true)"
          if [ -z "$numbers" ]; then
            echo "Develop にいるopenなissueはありません（対象なしのため何もしません）"
            exit 0
          fi
          {
            echo "issue_numbers<<TRANSITIONED_EOF"
            printf '%s\n' "$numbers"
            echo "TRANSITIONED_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Project Status を報告する
        if: steps.transition.outputs.issue_numbers != ''
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBERS: ${{ steps.transition.outputs.issue_numbers }}
          STATUS: release
        run: |
          while read -r n; do
            [ -n "$n" ] || continue
            # 一時的な5xx・接続失敗だけを再試行する(#1861)。#1583では17:06〜17:13の
            # API不調に単発のcurlが当たり、`Develop PR`への報告が失われた。4xxは設定・
            # 実装の誤りで待っても変わらないため、再試行せず即座に諦める。
            code=""
            for attempt in 1 2 3 4; do
              if [ "$attempt" != 1 ]; then sleep "$(( (attempt - 1) * 10 ))"; fi
              code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
                -X POST "$APP_BASE_URL/api/progress" \
                -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
                -H "Content-Type: application/json" \
                -d "{\"repository\":\"$REPO\",\"issue\":$n,\"status\":\"$STATUS\"}")" || code=000
              if [ "$code" = "200" ]; then break; fi
              case "$code" in
                000|5??) ;;
                *) break ;;
              esac
              if [ "$attempt" != 4 ]; then
                echo "Project Statusの報告に失敗しました（issue #$n / HTTP $code）。再試行します"
              fi
            done
            if [ "$code" = "200" ]; then
              echo "issue #$n を $STATUS として報告しました"
            else
              echo "::warning::Project Statusの報告に失敗しました（issue #$n / status=$STATUS / HTTP $code）"
            fi
          done <<< "$ISSUE_NUMBERS"

  main-pr-merged:
    # develop -> main のPRがマージされた時点で、そのリリースに含まれるissueを`Done`へ
    # 進めてcloseする。
    #
    # **対象はリリースPR本文の`## 対象issue`に載っている番号**(#2117)。リリースPRのheadは
    # 固定ブランチ`release-main/vX.Y.Z`で、本文の一覧はその凍結内容と同じ時点で作られている
    # ため、実際にmainへ出たissueと一致する。Project Statusで探すと、リリースPRの作成後に
    # developへ入った(＝mainへ出ていない)issueまで`Develop`として拾ってcloseしてしまう。
    #
    # **本文から1件も取れなかった場合だけ、`Develop`/`Release`のProject Statusで探す**
    # (#2117以前のPR・手で作ったPR・PR作成時にissue-deckへ問い合わせできず一覧が注記に
    # なっていた場合)。両方を対象にするのは、main-pr-in-progressの掃き寄せが拾いきれて
    # いない可能性のあるissueを取りこぼさないため。
    #
    # ここでの`gh issue close`はGITHUB_TOKEN起点のため、cleanup-on-closeジョブの
    # `issues: closed`トリガーは発火しない(他ジョブと同様のGitHub仕様。#266)。
    # そのため00.check-userが残っていた場合の除去をこのジョブ自身でも行っておく
    # (cleanup-on-closeだけに頼るとclose済みissueにラベルが残り続ける)。
    #
    # **issue-deckへ問い合わせできない場合、対象は0件になりissueは1件もcloseされない。**
    # 以前はラベルで探していたためissue-deckに依存せず完結していた。取りこぼした場合は
    # issue-deckの復旧後にこのrunを再実行する。
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      (github.event.pull_request.head.ref == 'develop' ||
       startsWith(github.event.pull_request.head.ref, 'release-main/v'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: issue を close する
        id: transition
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # リリースPR本文の`## 対象issue`から番号を取り出す(#2117)。見出しから次の`## `
          # 見出しまでを切り出し、`- #<番号> …`の行の番号だけを拾う。取得に失敗したときの
          # 注記（`（issue-deckへ問い合わせできず…）`）はこの形にならないため紛れ込まない。
          numbers="$(printf '%s\n' "$PR_BODY" | tr -d '\r' \
            | awk '/^## 対象issue[[:space:]]*$/ { f = 1; next } /^## / { f = 0 } f' \
            | sed -n 's/^- #\([0-9][0-9]*\).*$/\1/p' || true)"
          if [ -n "$numbers" ]; then
            echo "リリースPR本文の対象issueを使います: $(echo "$numbers" | tr '\n' ' ')"
          else
            echo "リリースPR本文に対象issueの一覧が無いため、Project Statusから探します"
          fi

          if [ -z "$numbers" ]; then
            missing=""
            [ -n "$APP_BASE_URL" ] || missing="APP_BASE_URL"
            [ -n "$PROGRESS_REPORT_SECRET" ] || missing="${missing:+$missing, }PROGRESS_REPORT_SECRET"
            if [ -n "$missing" ]; then
              echo "::warning::$missing が未設定のため、対象issueを特定できません（進捗の問い合わせにissue-deckが必要です）"
              exit 0
            fi
            body_file="${RUNNER_TEMP:-/tmp}/progress-done.json"
            # 一時的な5xx・接続失敗だけを再試行する(#1861)
            code=""
            for attempt in 1 2 3 4; do
              if [ "$attempt" != 1 ]; then sleep "$(( (attempt - 1) * 10 ))"; fi
              code="$(curl -sS -m 20 -o "$body_file" -w '%{http_code}' \
                -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
                "$APP_BASE_URL/api/progress?repository=$REPO&status=develop,release")" || code=000
              if [ "$code" = "200" ]; then break; fi
              case "$code" in
                000|5??) ;;
                *) break ;;
              esac
              if [ "$attempt" != 4 ]; then
                echo "issue-deckへの問い合わせに失敗しました（HTTP $code）。再試行します"
              fi
            done
            # 「対象が0件」と「issue-deckへ届かなかった」を区別する(#1124)。進捗ラベルを廃止した
            # 後はラベルという代替の判断材料が無く、両者を同じ文言にすると「リリースしたのに
            # issueが1件もcloseされない」が正常系と見分けられなくなる。
            if [ "$code" != "200" ]; then
              echo "::warning::issue-deckへ問い合わせできませんでした（HTTP $code）。対象issueを特定できないため何もしません"
              exit 0
            fi
            if [ "$(jq -r '.available // false' "$body_file" 2>/dev/null || echo false)" != "true" ]; then
              echo "::warning::issue-deckが進捗を返せませんでした（reason=$(jq -r '.reason // "unknown"' "$body_file" 2>/dev/null || echo unknown)）。対象issueを特定できないため何もしません"
              exit 0
            fi
            numbers="$(jq -r '.issues[]' "$body_file" 2>/dev/null || true)"
            if [ -z "$numbers" ]; then
              echo "Develop・Releaseにopenなissueはありません（対象なしのため何もしません。今回のリリースに紐づくissueが無い場合に起きます）"
              exit 0
            fi
          fi

          # `00.check-user`と理由ラベル`01.check-*`(#1490。旧名`00.qa-answered`を含む)を
          # まとめて外す。展開先リポジトリにラベル定義自体が無いと gh issue edit が exit 1 になり
          # ジョブごと落ちる(#975)ため、実在するものだけを渡す。
          #
          # ラベル一覧の取得もGitHub APIの一時的な5xxで落ちる(#1583でHTTP 503を実測)。
          # 取れなければラベルの除去だけを諦め、closeと進捗の報告は続ける(#1861)。
          DEFINED_LABELS=""
          for attempt in 1 2 3; do
            if [ "$attempt" != 1 ]; then sleep 5; fi
            if DEFINED_LABELS="$(gh label list --json name --jq '.[].name' --limit 200 2>/dev/null)" \
              && [ -n "$DEFINED_LABELS" ]; then
              break
            fi
            DEFINED_LABELS=""
          done
          if [ -z "$DEFINED_LABELS" ]; then
            echo "::warning::ラベル一覧を取得できませんでした。ラベルの除去をスキップします（closeと進捗の報告は続けます）"
          fi
          REMOVE_ARGS=()
          for name in 00.check-user 01.check-plan 01.check-input 01.check-merge 01.check-blocked 01.check-answered 00.qa-answered; do
            if grep -qx "$name" <<<"$DEFINED_LABELS"; then
              REMOVE_ARGS+=(--remove-label "$name")
            fi
          done
          transitioned=""
          for n in $numbers; do
            if [ "${#REMOVE_ARGS[@]}" -gt 0 ]; then
              gh issue edit "$n" "${REMOVE_ARGS[@]}" \
                || echo "::warning::issue #$n: ラベルの除去に失敗しました（closeと進捗の報告は続けます）"
            fi
            gh issue close "$n" || echo "::warning::issue #$n: closeに失敗しました（進捗の報告は続けます）"
            transitioned="${transitioned}${n}"$'\n'
          done
          if [ -n "$transitioned" ]; then
            {
              echo "issue_numbers<<TRANSITIONED_EOF"
              printf '%s' "$transitioned"
              echo "TRANSITIONED_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Project Status を報告する
        if: steps.transition.outputs.issue_numbers != ''
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBERS: ${{ steps.transition.outputs.issue_numbers }}
          STATUS: done
        run: |
          while read -r n; do
            [ -n "$n" ] || continue
            # 一時的な5xx・接続失敗だけを再試行する(#1861)。#1583では17:06〜17:13の
            # API不調に単発のcurlが当たり、`Develop PR`への報告が失われた。4xxは設定・
            # 実装の誤りで待っても変わらないため、再試行せず即座に諦める。
            code=""
            for attempt in 1 2 3 4; do
              if [ "$attempt" != 1 ]; then sleep "$(( (attempt - 1) * 10 ))"; fi
              code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
                -X POST "$APP_BASE_URL/api/progress" \
                -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
                -H "Content-Type: application/json" \
                -d "{\"repository\":\"$REPO\",\"issue\":$n,\"status\":\"$STATUS\"}")" || code=000
              if [ "$code" = "200" ]; then break; fi
              case "$code" in
                000|5??) ;;
                *) break ;;
              esac
              if [ "$attempt" != 4 ]; then
                echo "Project Statusの報告に失敗しました（issue #$n / HTTP $code）。再試行します"
              fi
            done
            if [ "$code" = "200" ]; then
              echo "issue #$n を $STATUS として報告しました"
            else
              echo "::warning::Project Statusの報告に失敗しました（issue #$n / status=$STATUS / HTTP $code）"
            fi
          done <<< "$ISSUE_NUMBERS"

  main-direct-pr-opened:
    # `issue-<番号>` -> `main` のPRを、develop運用における `issue-<番号>` -> `develop` のPRと
    # 同じ扱いにする(#1901)。**develop を経由しないリポジトリのための経路。**
    #
    # 上の develop-pr-opened / develop-pr-merged / main-pr-in-progress / main-pr-merged は
    # いずれも「作業ブランチ -> develop -> main」という運用を前提にしており、
    # `base.ref == 'develop'` か `head.ref == 'develop'` のどちらかを必ず見る。そのため
    # develop を持たない `guchi-apps/docs` のように PR が `issue-<番号>` -> `main` の形にしか
    # ならないリポジトリでは、**`Implementation` から先へ進む経路が1つも無かった**
    # (guchi-apps/docs#3 が PR #17 をmainへマージした後も `Implementation` のまま open で
    # 盤面の「実行中」に残り続けた)。
    #
    # develop運用のリポジトリでは作業ブランチが `main` を直接狙うことは無いため、この2ジョブが
    # 既存の挙動を変えることはない(仮に誤って `issue-<番号>` -> `main` のPRが作られた場合も、
    # そのマージをもって完了扱いにするのは妥当な解釈になる)。
    #
    # **自動マージ判定の経路は調べない。** `claude-review-develop.yml` は caller 側で
    # `branches: [develop]` にトリガーを絞っており(このリポジトリの同名ファイルを参照)、
    # base が `main` のPRを判定することは無い。したがってこのPRは必ず人がマージするので、
    # develop-pr-opened のような経路の有無の調査を挟まず、常に「ユーザーのマージが必要」
    # (`00.check-user` + 理由の `01.check-merge`。#1470・#1490)として確定させる。
    #
    # 報告する Status は develop-pr-opened と同じ `develop-pr`(盤面の「Develop PR」)。
    # main直行のリポジトリにとってはこのPRが唯一のPRで、「PRを作成・マージ中」という
    # 段の意味はそのまま当てはまる。
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'issue-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.head_ref }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: main宛のPR作成をIssueへ通知する
        id: transition
        run: |
          if [[ ! "$HEAD_REF" =~ ^issue-([0-9]+)$ ]]; then
            exit 0
          fi
          n="${BASH_REMATCH[1]}"

          # **対象issueの出力を最初に行う(#1861)。** ラベル操作・コメント投稿のどれかが
          # GitHub APIの一時的な5xxで落ちると、`bash -e`でこのステップごと異常終了し、
          # 後続の「Project Status を報告する」ステップまでスキップされる。以降の失敗は
          # すべて警告に留め、進捗の報告を最優先で守る(develop-pr-openedと同じ形)。
          echo "issue_numbers=$n" >> "$GITHUB_OUTPUT"

          # 対象リポジトリにラベル定義自体が無いと gh issue edit が exit 1 になり
          # ジョブごと落ちる(#975)。実在する場合だけ呼ぶ(develop-pr-openedと同じ作法)。
          # ユーザーがマージする状態なので、理由は`01.check-merge`(#1490)。理由は常に1枚
          # なので、定義済みの他の理由ラベルは同じ呼び出しで外す。
          REASON_LABEL="01.check-merge"
          DEFINED_LABELS=""
          for attempt in 1 2 3; do
            if [ "$attempt" != 1 ]; then sleep 5; fi
            if DEFINED_LABELS="$(gh label list --json name --jq '.[].name' --limit 200 2>/dev/null)" \
              && [ -n "$DEFINED_LABELS" ]; then
              break
            fi
            DEFINED_LABELS=""
          done
          if [ -z "$DEFINED_LABELS" ]; then
            echo "::warning::ラベル一覧を取得できませんでした。ラベルの付与をスキップします（進捗の報告は続けます）"
          fi
          LABEL_ARGS=()
          for name in "00.check-user" "$REASON_LABEL"; do
            if grep -qx "$name" <<<"$DEFINED_LABELS"; then
              LABEL_ARGS+=(--add-label "$name")
            elif [ -n "$DEFINED_LABELS" ]; then
              echo "::warning::ラベル '$name' がリポジトリに存在しないため付与をスキップします"
            fi
          done
          for name in 01.check-plan 01.check-input 01.check-merge 01.check-blocked 01.check-answered 00.qa-answered; do
            if [ "$name" != "$REASON_LABEL" ] && grep -qx "$name" <<<"$DEFINED_LABELS"; then
              LABEL_ARGS+=(--remove-label "$name")
            fi
          done
          note=""
          if grep -qx "00.check-user" <<<"$DEFINED_LABELS"; then
            if gh issue edit "$n" "${LABEL_ARGS[@]}"; then
              note=$'\n\n'"⚠️ このリポジトリは作業ブランチから\`main\`へ直接マージする運用のため、自動マージの判定は行われません。内容を確認したうえでマージしてください。"
            else
              echo "::warning::issue #$n: ラベルの付与に失敗しました（進捗の報告は続けます）"
            fi
          fi
          gh issue comment "$n" --body "🔧 実装が完了し、mainへのPRを作成しました: $PR_URL"$'\n\n'"実行ログ: $RUN_URL$note"$'\n\n<!-- issue-deck-source:issue-labels -->' \
            || echo "::warning::issue #$n: PR作成のコメント投稿に失敗しました（進捗の報告は続けます）"

      - name: Project Status を報告する
        if: steps.transition.outputs.issue_numbers != ''
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBERS: ${{ steps.transition.outputs.issue_numbers }}
          STATUS: develop-pr
        run: |
          missing=""
          [ -n "$APP_BASE_URL" ] || missing="APP_BASE_URL"
          [ -n "$PROGRESS_REPORT_SECRET" ] || missing="${missing:+$missing, }PROGRESS_REPORT_SECRET"
          if [ -n "$missing" ]; then
            echo "$missing が未設定のため、Project Statusの報告をスキップします"
            exit 0
          fi
          while read -r n; do
            [ -n "$n" ] || continue
            # 一時的な5xx・接続失敗だけを再試行する(#1861)。#1583では17:06〜17:13の
            # API不調に単発のcurlが当たり、`Develop PR`への報告が失われた。4xxは設定・
            # 実装の誤りで待っても変わらないため、再試行せず即座に諦める。
            code=""
            for attempt in 1 2 3 4; do
              if [ "$attempt" != 1 ]; then sleep "$(( (attempt - 1) * 10 ))"; fi
              code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
                -X POST "$APP_BASE_URL/api/progress" \
                -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
                -H "Content-Type: application/json" \
                -d "{\"repository\":\"$REPO\",\"issue\":$n,\"status\":\"$STATUS\"}")" || code=000
              if [ "$code" = "200" ]; then break; fi
              case "$code" in
                000|5??) ;;
                *) break ;;
              esac
              if [ "$attempt" != 4 ]; then
                echo "Project Statusの報告に失敗しました（issue #$n / HTTP $code）。再試行します"
              fi
            done
            if [ "$code" = "200" ]; then
              echo "issue #$n を $STATUS として報告しました"
            else
              echo "::warning::Project Statusの報告に失敗しました（issue #$n / status=$STATUS / HTTP $code）"
            fi
          done <<< "$ISSUE_NUMBERS"

  main-direct-merged:
    # `issue-<番号>` -> `main` のPRがマージされた時点で、そのissueを`Done`にしてcloseする(#1901)。
    # main直行のリポジトリではこのマージが本番反映そのものなので、develop運用における
    # 「developへマージ -> リリースPR -> main-pr-merged」の3段が1回のマージに畳まれる。
    #
    # **`done`の報告を`gh issue close`より先に行う(順序が意味を持つ)。** issue-deckは
    # Issueのcloseを受け取ると、Statusが`Planning`・`Implementation`・`Develop PR`のときに限り
    # 終端`Closed`へ送る(#1856。src/app/api/webhooks/github/route.tsのcloseStrandedProgress)。
    # このジョブが対象にするissueは`Implementation`か`Develop PR`にいるため**まさにその条件に
    # 当てはまる**——先にcloseすると、`Done`ではなく`Closed`(対応終了)へ落ちうる。
    # `done`を先に報告しておけば、close側は`onlyFrom`でProjectの実物を読み直して対象外と判断する。
    # **既存のmain-pr-mergedがclose先行なのは、そちらの対象が`Develop`・`Release`にいて
    # 終端遷移の条件に当てはまらないから**であり、ここへそのまま持ち込んではいけない。
    #
    # `gh issue close`はGITHUB_TOKEN起点のため、cleanup-on-closeジョブの`issues: closed`
    # トリガーは発火しない(#266と同じGitHub仕様)。そのため`00.check-user`の除去はこのジョブ
    # 自身で行う。**Webhookの配信には及ばない**ので、issue-deck側の受信は妨げられない。
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'issue-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.head_ref }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 00.check-user を外しmainへのマージを通知する
        id: transition
        run: |
          if [[ ! "$HEAD_REF" =~ ^issue-([0-9]+)$ ]]; then
            exit 0
          fi
          n="${BASH_REMATCH[1]}"

          # **対象issueの出力を最初に行う(#1861)。** 以降の失敗はすべて警告に留め、
          # 進捗の報告とcloseを最優先で守る(develop-pr-mergedと同じ形)。
          echo "issue_numbers=$n" >> "$GITHUB_OUTPUT"

          # `00.check-user`と理由ラベル`01.check-*`(#1490。旧名`00.qa-answered`を含む)を
          # まとめて外す。展開先リポジトリにラベル定義自体が無いと gh issue edit が exit 1 になり
          # ジョブごと落ちる(#975)ため、実在するものだけを渡す。
          DEFINED_LABELS=""
          for attempt in 1 2 3; do
            if [ "$attempt" != 1 ]; then sleep 5; fi
            if DEFINED_LABELS="$(gh label list --json name --jq '.[].name' --limit 200 2>/dev/null)" \
              && [ -n "$DEFINED_LABELS" ]; then
              break
            fi
            DEFINED_LABELS=""
          done
          REMOVE_ARGS=()
          for name in 00.check-user 01.check-plan 01.check-input 01.check-merge 01.check-blocked 01.check-answered 00.qa-answered; do
            if grep -qx "$name" <<<"$DEFINED_LABELS"; then
              REMOVE_ARGS+=(--remove-label "$name")
            fi
          done
          if [ "${#REMOVE_ARGS[@]}" -gt 0 ]; then
            gh issue edit "$n" "${REMOVE_ARGS[@]}" \
              || echo "::warning::issue #$n: ラベルの除去に失敗しました（進捗の報告とcloseは続けます）"
          elif [ -z "$DEFINED_LABELS" ]; then
            echo "::warning::ラベル一覧を取得できませんでした。ラベルの除去をスキップします（進捗の報告とcloseは続けます）"
          else
            echo "::warning::ラベル '00.check-user' がリポジトリに存在しないため除去をスキップします"
          fi
          gh issue comment "$n" --body "🎉 mainへのマージが完了しました: $PR_URL"$'\n\n'"実行ログ: $RUN_URL"$'\n\n<!-- issue-deck-source:issue-labels -->' \
            || echo "::warning::issue #$n: マージ完了のコメント投稿に失敗しました（進捗の報告とcloseは続けます）"

      - name: Project Status を報告する
        if: steps.transition.outputs.issue_numbers != ''
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBERS: ${{ steps.transition.outputs.issue_numbers }}
          STATUS: done
        run: |
          missing=""
          [ -n "$APP_BASE_URL" ] || missing="APP_BASE_URL"
          [ -n "$PROGRESS_REPORT_SECRET" ] || missing="${missing:+$missing, }PROGRESS_REPORT_SECRET"
          if [ -n "$missing" ]; then
            echo "$missing が未設定のため、Project Statusの報告をスキップします"
            exit 0
          fi
          while read -r n; do
            [ -n "$n" ] || continue
            # 一時的な5xx・接続失敗だけを再試行する(#1861)。4xxは設定・実装の誤りで
            # 待っても変わらないため、再試行せず即座に諦める。
            code=""
            for attempt in 1 2 3 4; do
              if [ "$attempt" != 1 ]; then sleep "$(( (attempt - 1) * 10 ))"; fi
              code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
                -X POST "$APP_BASE_URL/api/progress" \
                -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
                -H "Content-Type: application/json" \
                -d "{\"repository\":\"$REPO\",\"issue\":$n,\"status\":\"$STATUS\"}")" || code=000
              if [ "$code" = "200" ]; then break; fi
              case "$code" in
                000|5??) ;;
                *) break ;;
              esac
              if [ "$attempt" != 4 ]; then
                echo "Project Statusの報告に失敗しました（issue #$n / HTTP $code）。再試行します"
              fi
            done
            if [ "$code" = "200" ]; then
              echo "issue #$n を $STATUS として報告しました"
            else
              echo "::warning::Project Statusの報告に失敗しました（issue #$n / status=$STATUS / HTTP $code）"
            fi
          done <<< "$ISSUE_NUMBERS"

      # 報告の後にcloseする。理由はジョブ先頭のコメントを参照(#1856の終端遷移との競合)。
      # 報告が失敗していてもcloseはする——mainへ入った以上、issueを開いたままにする理由が無い。
      - name: mainへ到達したissueをcloseする
        if: steps.transition.outputs.issue_numbers != ''
        env:
          ISSUE_NUMBERS: ${{ steps.transition.outputs.issue_numbers }}
        run: |
          while read -r n; do
            [ -n "$n" ] || continue
            gh issue close "$n" || echo "::warning::issue #$n: closeに失敗しました"
          done <<< "$ISSUE_NUMBERS"

  manual-step-label:
    # タイトルが`[手作業]`で始まるIssueへ`71.manual-step`を自動で付ける(#1492)。
    #
    # 手作業Issueの規約(docs/multi-agent/labels.md「デプロイ後などに残るユーザーの手作業は
    # Issueとして起票する」)では、タイトルを`[手作業] <実行する場所>: <やること>`に揃え、
    # ラベルに`71.manual-step`を付けることになっている。**しかしラベルの付与を担保するものが
    # どこにも無かった。** 実装エージェントはプロンプトの指示に従って`gh issue create --label`を
    # 付けるだけで、忘れても誰も気付かず、人がissue-deckの作成ダイアログやGitHubから直接
    # 起票する経路には指示すら届かない。ラベルが無い手作業Issueは「ユーザーの作業待ち」ビューに
    # 現れず、Issue詳細でも案内パネル(ManualStepPanel)ではなく「実装を開始」が出るため、
    # **エージェントへ送れる普通のIssueに見えてしまう。**
    #
    # 判定をタイトルに寄せるのは、規約でプレフィックスが決まっており、3つの起票経路すべてで
    # 同じ形になるため(ラベルと違い、リポジトリにラベル定義が無くても書ける)。
    #
    # **付けるだけで、外しはしない。** タイトルからプレフィックスを消したときにラベルまで
    # 剥がすと、人が意図して付けたラベルをワークフローが取り消すことになる。「付け忘れを
    # 埋める」以上のことはしない。
    #
    # editedも拾うのは、起票時にプレフィックスを付け忘れて後からタイトルを直す経路が実際に
    # あるため。付与済みなら何もせずに終わるので、本文だけの編集で再発火しても害はない。
    #
    # **イベントだけでは取りこぼす(#2010)。** `on:`はcaller側にしかないため、caller側の
    # `issues: types:`に`opened`・`edited`が無い時期に起票されたIssueは、後からタグを上げても
    # イベントが再発火せず**永久に埋まらない**。guchi-apps/signaly#148は`manual-step-label`
    # ジョブがまだ無い`workflows/v21`を指していた時期に起票され、ラベルが1つも付かないまま
    # 2日以上openのままだった(「ユーザーの作業待ち」ビューにも通知にも一度も出ていない)。
    # そのため`schedule`・`workflow_dispatch`でも動かし、**タイトルが`[手作業]`で始まるopenな
    # Issueのうちラベルの無いものを埋め直す**。develop-merge-sweepと同じ「安全網」の位置づけ。
    #
    # scheduleでの対象の探し方は`gh issue list --search`。GitHubの検索は日本語もタイトルの
    # `[手作業]`で引けるが(実測)、`手作業`を含むだけの別Issueも混ざるため、**プレフィックスの
    # 一致は取得後に自分で確かめる**(検索を絞り込みにだけ使い、判定はイベント経路と同じ規則で行う)。
    #
    # **scheduleを持つcallerでは、このジョブぶんのActions実行が1回増える**(課金はジョブ単位で
    # 1分に切り上げ)。対象0件でも起動はするため、cronを詰めているリポジトリほど効く。
    # それでも別ジョブのままにしてあるのは、develop-merge-sweepが進捗報告APIへ依存するのに対し
    # こちらはGitHubだけで完結し、片方が落ちてももう片方が動くようにするため。
    #
    # ラベル定義が無いリポジトリでは`gh issue edit --add-label`がexit 1で落ちる(#975)ため、
    # cleanup-on-closeと同じく`gh label list`と突き合わせてから呼ぶ。ラベルが無いこと自体は
    # そのリポジトリへラベル体系を配れていないという別の問題なので、警告に留めて落とさない。
    # **突き合わせるのは対象が1件でも見つかってから**にしてある。先に確かめると、ラベルを配れて
    # いないリポジトリでイベントのたび・15分ごとに無関係な警告が出続けるため。
    if: |
      (github.event_name == 'issues' &&
        (github.event.action == 'opened' || github.event.action == 'edited')) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      # タイトルはユーザー入力なので、run:本文へ展開せずenv経由でのみ参照する(script injection対策)
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - name: タイトルが[手作業]で始まるIssueへ 71.manual-step を付与する
        run: |
          set -euo pipefail
          prefix='[手作業]'
          targets=""
          if [ "$EVENT_NAME" = "issues" ]; then
            # scheduleではissue関連のenvが空になるため、set -u下でも触れるように既定値を置く
            title="${ISSUE_TITLE:-}"
            number="${ISSUE_NUMBER:-}"
            if [ "${title#"$prefix"}" = "$title" ]; then
              echo "タイトルが $prefix で始まらないため何もしません: $title"
              exit 0
            fi
            # grep -q は一致した時点で終了するため、pipefail下ではgh側がSIGPIPE(141)で落ちて
            # パイプライン全体の終了ステータスが1になりうる。判定を取り違えないよう、
            # 出力を変数へ受けてから突き合わせる
            attached="$(gh issue view "$number" --json labels --jq '.labels[].name')"
            if grep -qx "71.manual-step" <<< "$attached"; then
              echo "issue #$number には既に 71.manual-step が付与されています"
              exit 0
            fi
            targets="$number"
          else
            # 検索は絞り込みだけに使い、プレフィックスの一致はjq側で確かめる(`手作業`を
            # 含むだけの別Issueが混ざるため)。検索インデックスの遅れで既に付与済みのものが
            # 返ってきても、--add-labelは冪等なので害は無い
            targets="$(gh issue list --state open --limit 200 \
              --search 'in:title "[手作業]" -label:"71.manual-step"' \
              --json number,title \
              --jq '.[] | select(.title | startswith("[手作業]")) | .number')"
            if [ -z "$targets" ]; then
              echo "ラベルの付いていない手作業Issueはありません"
              exit 0
            fi
            echo "ラベルの付いていない手作業Issue: $(tr '\n' ' ' <<< "$targets")"
          fi
          defined="$(gh label list --json name --jq '.[].name' --limit 200)"
          if ! grep -qx "71.manual-step" <<< "$defined"; then
            echo "::warning::ラベル '71.manual-step' がリポジトリに存在しないため付与をスキップします"
            exit 0
          fi
          while IFS= read -r n; do
            [ -n "$n" ] || continue
            if gh issue edit "$n" --add-label "71.manual-step"; then
              echo "issue #$n へ 71.manual-step を付与しました"
            else
              # sweepでは1件の失敗で残りを止めない(次のrunで拾い直せるが、気付けるよう警告は出す)
              echo "::warning::issue #$n への 71.manual-step の付与に失敗しました"
            fi
          done <<< "$targets"

  manual-step-body-check:
    # 手作業Issueの本文が、issue-deckの手作業アシスタントが読む書式に合っているかを検査し、
    # 外れていれば指摘をコメントする(#2048)。
    #
    # **書式の揺れは見た目の問題ではなく、機能が黙って落ちる問題である。** 起票するエージェントは
    # 雛形を埋めるが、雛形どおりに書けたかを確かめる経路が無かった。実測でopenだった3件は
    # 太字・インデント・参照の書き方が3通りに割れており、うち2件は`## 関連`の対応PRをURLで
    # 書いていて実施順序の表示から丸ごと落ちていた。
    #
    # **判定はissue-deck側(`POST /api/manual-steps/body-check`)に置く。** 検査するのは画面の
    # パーサーが読む書式なので、規則をここへ写すと「検査は通るが画面は読めない」食い違いが出る。
    # ここが持つのは、呼んで・コメントを貼り直すところまで。
    #
    # **判定をタイトルに寄せるのはmanual-step-labelと同じ理由**(ラベル定義が無いリポジトリでも
    # 書けるため)。ラベルの付与とは別ジョブにしてあるので、片方が落ちてももう片方は動く。
    #
    # **指摘してもラベルは付けず、起票も止めない。** 手作業Issueに`00.check-user`を付けない規約
    # (docs/multi-agent/labels.md)があり、ここは書式の助言であってゲートではない。
    #
    # **issue-deckが落ちていてもワークフローを失敗させない**(進捗報告と同じ取り決め)。
    if: |
      github.event_name == 'issues' &&
      (github.event.action == 'opened' || github.event.action == 'edited')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      # タイトルと本文はユーザー入力なので、run:本文へ展開せずenv経由でのみ参照する
      # (script injection対策)。JSONの組み立ても jq --arg に通す
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
    steps:
      - name: 本文の書式を検査して指摘コメントを貼り直す
        run: |
          set -uo pipefail

          prefix='[手作業]'
          if [ "${ISSUE_TITLE#"$prefix"}" = "$ISSUE_TITLE" ]; then
            echo "タイトルが $prefix で始まらないため何もしません"
            exit 0
          fi

          missing=""
          [ -n "$APP_BASE_URL" ] || missing="APP_BASE_URL"
          [ -n "$PROGRESS_REPORT_SECRET" ] || missing="${missing:+$missing, }PROGRESS_REPORT_SECRET"
          if [ -n "$missing" ]; then
            echo "$missing が未設定のため、本文の書式検査をスキップします"
            exit 0
          fi

          jq -n --arg repo "$GH_REPO" --arg body "$ISSUE_BODY" \
            '{repository: $repo, body: $body}' > request.json

          code="$(curl -sS -m 20 -o response.json -w '%{http_code}' \
            -X POST "$APP_BASE_URL/api/manual-steps/body-check" \
            -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @request.json)" || code=000
          if [ "$code" != "200" ]; then
            echo "::warning::本文の書式検査に失敗しました（HTTP $code）。指摘は投稿しません"
            exit 0
          fi

          jq -r '.comment // ""' response.json > comment.md

          # 前回の指摘コメント。マーカーは定数なので --jq へ直接書いてよい
          existing="$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER/comments?per_page=100" --paginate \
            --jq '.[] | select(.body | startswith("<!-- issue-deck-source:manual-step-body-check -->")) | .id' \
            | head -n 1)"

          # **サイズではなく中身で判定する**(#2106)。指摘が無いときAPIは`comment: null`を返し、
          # `jq -r '.comment // ""'`は空文字を出すが、jqが末尾に改行を付けるため comment.md は
          # 改行1バイトのファイルになる。`[ -s ]`はサイズしか見ないのでここを素通りし、
          # 空本文の投稿がGraphQLの`Body cannot be blank`で落ちてジョブごと赤くなっていた
          # (書式どおりの手作業Issueを起票するたびに再現した)。**前回の指摘を消す経路も
          # 同じ`if`の中にあるため、指摘を直しても古いコメントが残り続けていた。**
          if [ -z "$(tr -d '[:space:]' < comment.md)" ]; then
            if [ -n "$existing" ]; then
              gh api --method DELETE "repos/$GH_REPO/issues/comments/$existing"
              echo "指摘が解消したため、前回のコメントを削除しました"
            else
              echo "本文の書式に指摘はありません"
            fi
            exit 0
          fi

          if [ -n "$existing" ]; then
            jq -n --rawfile body comment.md '{body: $body}' > patch.json
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$existing" --input patch.json
            echo "指摘コメントを更新しました"
          else
            gh issue comment "$ISSUE_NUMBER" --body-file comment.md
            echo "指摘コメントを投稿しました"
          fi

  cleanup-on-close:
    # main-pr-mergedのDone遷移以外の経路でIssueがクローズされた場合(21.plan-requiredの
    # 計画を拒否してIssueを直接クローズした場合など)、`00.check-user`が残り続けないよう、
    # クローズをトリガーに除去する(#464)。
    #
    # **進捗そのものはここで巻き戻さない**(Phase 2からの方針)。`Done`のIssueを人が
    # 閉じ直しただけで盤面が`Ready`へ戻るのを避けるため。Phase 4までは進捗ラベル
    # (計画検討中〜本番へマージ中)の除去も行っていたが、ラベルの廃止(#1010)で対象が
    # `00.check-user`だけになった。
    #
    # あわせて、screenshotsブランチ(#255。orphanブランチにスクリーンショット画像をコミットし
    # raw.githubusercontent.com経由でIssueコメントに埋め込む仕組み)上の issue-<番号>/
    # ディレクトリが際限なく肥大化しないよう、Issueクローズをトリガーに削除する。
    # screenshotsブランチは.github/workflows/配下を含まないため、pushにはissue #106のような
    # workflow書き込み権限を持つPATは不要で、既定のGITHUB_TOKEN(contents: write)で足りる。
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: 00.check-user と理由ラベルを除去する
        run: |
          # `00.check-user`と理由ラベル`01.check-*`(#1490。旧名`00.qa-answered`を含む)を
          # まとめて外す。展開先リポジトリにラベル定義自体が無いと gh issue edit が exit 1 になり
          # ジョブごと落ちる(#975)ため、実在するものだけを渡す。
          #
          # ラベル一覧の取得もGitHub APIの一時的な5xxで落ちる(#1583でHTTP 503を実測)。
          # 取れなければ除去を諦め、後続のスクリーンショット削除まで巻き添えにしない(#1861)。
          DEFINED_LABELS=""
          for attempt in 1 2 3; do
            if [ "$attempt" != 1 ]; then sleep 5; fi
            if DEFINED_LABELS="$(gh label list --json name --jq '.[].name' --limit 200 2>/dev/null)" \
              && [ -n "$DEFINED_LABELS" ]; then
              break
            fi
            DEFINED_LABELS=""
          done
          REMOVE_ARGS=()
          for name in 00.check-user 01.check-plan 01.check-input 01.check-merge 01.check-blocked 01.check-answered 00.qa-answered; do
            if grep -qx "$name" <<<"$DEFINED_LABELS"; then
              REMOVE_ARGS+=(--remove-label "$name")
            fi
          done
          if [ "${#REMOVE_ARGS[@]}" -gt 0 ]; then
            gh issue edit "$ISSUE_NUMBER" "${REMOVE_ARGS[@]}" \
              || echo "::warning::issue #$ISSUE_NUMBER: ラベルの除去に失敗しました"
          elif [ -z "$DEFINED_LABELS" ]; then
            echo "::warning::ラベル一覧を取得できませんでした。ラベルの除去をスキップします"
          else
            echo "::warning::ラベル '00.check-user' がリポジトリに存在しないため除去をスキップします"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: screenshotsブランチから対応する画像ディレクトリを削除する
        run: |
          set -e
          if ! git ls-remote --exit-code --heads origin screenshots >/dev/null 2>&1; then
            echo "screenshotsブランチが存在しないため何もしません"
            exit 0
          fi
          git fetch origin screenshots:screenshots
          git checkout screenshots
          if [ ! -d "issue-$ISSUE_NUMBER" ]; then
            echo "issue-$ISSUE_NUMBER ディレクトリが無いため何もしません"
            exit 0
          fi
          git rm -rq "issue-$ISSUE_NUMBER"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "issue-$ISSUE_NUMBER のスクリーンショットを削除（Issueクローズに伴うクリーンアップ）"
          git push origin screenshots
