name: Reusable release develop to main

# develop→mainのリリース手順（バージョンbump PR・develop→mainのPR作成）を、全リポジトリで
# 共通化するための再利用可能ワークフロー（#1181）。呼び出し元には薄いcallerだけを置く。
#
# **元はコピー方式だった。** issue-deck・shopping-list・dayspanの3件だけが持ち、残り8件は
# 手作業でリリースしていた。手作業ではリポジトリ固有の制約を毎回踏む（solitaireでは
# deploy.ymlのタグ重複チェックと、更新履歴エントリを強制するテストの2つに当たった）。
#
# 参照方式にすることで、#985/#1173 の「参照タグの検知と一括更新」の対象にもなる
# （コピー方式は対象外）。
#
# 呼び出し元ごとの差異は3つのinputで吸収する。バージョンの読み取り（version-file・
# version-query）と、書き込み（bump-command）。**読み取りより書き込みの差異のほうが大きい。**
# npm version を使う理由は「バージョンを書き換えること」ではなく「"version" lifecycle
# スクリプトを起動すること」で、これが更新履歴フック（RELEASE_CHANGELOG）と使い方フック
# （RELEASE_USAGE・#1729）の土台になっている。
# ルートに package.json が無いリポジトリ（myroom・signaly）ではそのままでは使えない。
#
# 元の設計（状態はversionフィールドだけから判定する・バンプPRはauto-merge・develop→mainの
# マージは人間が行う）はそのまま維持している。
#
# **リリースPRのheadは`develop`ではなく固定ブランチ`release-main/vX.Y.Z`**（#2117）。
# PRのheadは常にそのブランチの先端を追うため、`develop`をheadにすると、PRを作った後に
# developへ入った変更まで同じリリースでmainへ出ていた（更新履歴にも対象issueにも載らないまま
# 出る）。凍結点はバンプPRのhead（`$GITHUB_SHA^2`）＝更新履歴を判定したときのdevelopで、
# 更新履歴・対象issue一覧・mainへ出る内容の3つが同じ時点を指すようにしてある。
# ブランチ名を変えるときは、リリースPRを見つける側もあわせて直すこと
# （`src/lib/pull-request-list.ts`の`RELEASE_BRANCH_PREFIX`、
# `reusable-issue-labels.yml`の`main-pr-in-progress`・`main-pr-merged`）。
on:
  workflow_call:
    inputs:
      version-file:
        description: "バージョンを読み書きするファイル（既定: package.json）"
        required: false
        type: string
        default: package.json
      version-query:
        description: "バージョンを取り出すjq式（既定: .version）"
        required: false
        type: string
        default: .version
      bump-kind:
        # 画面（issue-deck）から指定された上げ幅（#1548）。`auto`・空文字は自動判定。
        # **判定ステップ自体は指定があっても走らせる。** 上げ幅と一緒に利用者向けの更新履歴
        # （changelog → RELEASE_CHANGELOG）と使い方（usage → RELEASE_USAGE）を作っている
        # ため、飛ばすとどちらも空になる。
        # 指定があれば判定結果を上書きし、判断根拠に指定した旨を残す。
        description: "バージョンの上げ幅（auto/空なら自動判定。patch/minor/majorで固定）"
        required: false
        type: string
        default: ""
      bump-command:
        description: >-
          バージョンを書き換えるコマンド。空なら
          `npm version <新版> --no-git-tag-version` を実行する。
          NEW_VERSION（例 1.5.9）・BUMP_KIND（patch/minor/major）・RELEASE_CHANGELOG・
          RELEASE_USAGE を環境変数で受け取れる。
          スクリプトが上げ幅を受け取る形なら BUMP_KIND を渡す
        required: false
        type: string
        default: ""

# **concurrency と permissions は呼び出し元（caller）が持つ。** 再利用可能ワークフローの
# トップレベルに置くと、呼び出し時に startup_failure になる（#1181で実際に踏んだ）。
# 既存の reusable-issue-dispatch.yml・reusable-claude-ci-fix.yml も name / on / jobs だけを持つ。
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: GitHub Appのインストールトークンを発行する
        # 期限切れが単一障害点になるsecrets.WORKFLOW_PATを、1時間で失効するインストールトークンへ
        # 置き換える(#835。仕組みの詳細はreusable-issue-dispatch.ymlの同名ステップと
        # docs/actions-token-model.mdを参照)。vars.WORKFLOW_APP_IDが未登録ならこのステップは
        # skipされ、使用箇所は`|| secrets.WORKFLOW_PAT`で従来のPATへ落ちる。
        # permission-*は、このワークフローが実際に使う権限だけへ絞るために付けている。
        id: app-token
        if: ${{ vars.WORKFLOW_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write
          permission-issues: write
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          # フィーチャーブランチのpush・PR作成を後続のCI/レビューworkflow
          # (ci.yml, claude-review-develop.yml)が確実に検知できるよう、
          # GITHUB_TOKEN起点のイベントは他のworkflowを起動しないというGitHub仕様を
          # 避けるためワークフロー用トークンを使う（claude-issue-dispatch.ymlと同じ方針）。
          token: ${{ steps.app-token.outputs.token || secrets.WORKFLOW_PAT }}

      - name: develop/mainの最新を取得する
        # actions/checkoutが作成するリモート追跡ブランチの範囲に依存せず、
        # origin/develop・origin/mainを確実に参照できるよう明示的なrefspecで取得する。
        run: |
          git fetch origin develop:refs/remotes/origin/develop --quiet --force
          git fetch origin main:refs/remotes/origin/main --quiet --force

      - name: リリース状態を判定する
        id: state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.WORKFLOW_PAT }}
          GH_REPO: ${{ github.repository }}
          VERSION_FILE: ${{ inputs.version-file }}
          VERSION_QUERY: ${{ inputs.version-query }}
        run: |
          set -e

          # バージョンの置き場所はリポジトリごとに違う（#1181）。実測では
          # package.json が9件、frontend/package.json が1件（myroom）、
          # version.json が1件（signaly）。version-query は全件 .version だった。
          MAIN_VERSION="$(git show "origin/main:$VERSION_FILE" | jq -r "$VERSION_QUERY")"
          DEV_VERSION="$(jq -r "$VERSION_QUERY" "$VERSION_FILE")"
          echo "main_version=$MAIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "dev_version=$DEV_VERSION" >> "$GITHUB_OUTPUT"

          NEED_BUMP=false
          NEED_MAIN_PR=false

          if [ "$MAIN_VERSION" = "$DEV_VERSION" ]; then
            if git diff --quiet origin/main origin/develop; then
              echo "developとmainに差分が無いため、リリースするものがありません"
            else
              EXISTING_BUMP_PR="$(gh pr list --base develop --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("release/v"))] | .[0].headRefName // empty')"
              if [ -n "$EXISTING_BUMP_PR" ]; then
                echo "バージョンbump用のPR（$EXISTING_BUMP_PR）が既にオープン中のため、新規作成をスキップします"
              else
                NEED_BUMP=true
              fi
            fi
          else
            echo "developのバージョン($DEV_VERSION)がmain($MAIN_VERSION)と異なるため、バンプ済みとみなします"
            # リリースPRのheadは固定ブランチ`release-main/vX.Y.Z`（#2117）。`--head`で絞ると
            # 版が違うだけの取りこぼしが出るため、base=mainのopenなPRを接頭辞で拾う。
            # `develop`は#2117以前に作られたPR（移行期間中のみ存在しうる）。
            EXISTING_MAIN_PR="$(gh pr list --base main --state open --json url,headRefName \
              --jq '[.[] | select(.headRefName == "develop" or (.headRefName | startswith("release-main/v")))] | .[0].url // empty')"
            if [ -n "$EXISTING_MAIN_PR" ]; then
              echo "develop→mainのPR（$EXISTING_MAIN_PR）が既にオープン中のため、新規作成をスキップします"
            else
              NEED_MAIN_PR=true
            fi
          fi

          echo "need_bump=$NEED_BUMP" >> "$GITHUB_OUTPUT"
          echo "need_main_pr=$NEED_MAIN_PR" >> "$GITHUB_OUTPUT"
          echo "判定結果: need_bump=$NEED_BUMP need_main_pr=$NEED_MAIN_PR main_version=$MAIN_VERSION dev_version=$DEV_VERSION"

      - name: リリース対象issueの一覧を取得する
        id: issues
        # 対象は「developへ入ったがmainへ未反映」のissue、すなわち進捗が`Develop`または`Release`
        # にあるもの。Phase 4までは`gh issue list --label <進捗ラベル>`でラベルから探して
        # いたが、進捗ラベルの廃止（#991 Phase 5・#1010）で判断材料がProject Statusだけに
        # なったため、issue-deckの進捗問い合わせAPIから引く。
        # **issue-deckへ疎通できない場合は0件として扱い、リリース自体は続行する**（PR本文の
        # 対象issue一覧が空になるだけで、バージョンbumpとPR作成は成立するため）。
        if: steps.state.outputs.need_bump == 'true' || steps.state.outputs.need_main_pr == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.WORKFLOW_PAT }}
          GH_REPO: ${{ github.repository }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
          NEED_MAIN_PR: ${{ steps.state.outputs.need_main_pr }}
          DEV_VERSION: ${{ steps.state.outputs.dev_version }}
        run: |
          set -e

          # develop→mainのPRを作るrunでは、対象issueの一覧を**バンプPR本文から引き継ぐ**（#2117）。
          # バンプPRを作ったrun（T0）と、そのマージのpushで起きる今のrun（T1）は別のrunで、
          # 更新履歴・上げ幅・リリースの凍結点はいずれもT0のdevelopから作られる。T1でその場の
          # 進捗を問い合わせると、T0〜T1のあいだにdevelopへ入ったIssue（リリースには含まれない）
          # まで一覧に載る。T0の一覧をそのまま持ち越して、更新履歴・凍結内容・対象issueを揃える。
          # 引き継げなかった場合（バンプPRが見つからない・本文に一覧が無い・手動リリース）は
          # 従来どおりその場で問い合わせる。
          if [ "$NEED_MAIN_PR" = "true" ]; then
            BUMP_BODY="$(gh pr list --base develop --head "release/v$DEV_VERSION" --state merged \
              --json body --jq '.[0].body // empty' 2>/dev/null || true)"
            if [ -n "$BUMP_BODY" ]; then
              # `## 対象issue`の見出しから次の`## `見出しまでを切り出し、`- #<番号> …`の行だけ残す。
              # 取得に失敗したときの注記（`（issue-deckへ問い合わせできず…）`）はこの形に
              # ならないため、注記だけを引き継いでしまうことはない。
              INHERITED_LINES="$(printf '%s\n' "$BUMP_BODY" | tr -d '\r' \
                | awk '/^## 対象issue[[:space:]]*$/ { f = 1; next } /^## / { f = 0 } f' \
                | grep -E '^- #[0-9]+' || true)"
              if [ -n "$INHERITED_LINES" ]; then
                printf '%s\n' "$INHERITED_LINES" > /tmp/release-issue-lines.txt
                echo "バンプPR（release/v$DEV_VERSION）の対象issue一覧を引き継ぎました"
                echo "対象issue:"
                cat /tmp/release-issue-lines.txt
                exit 0
              fi
            fi
            echo "バンプPRから対象issue一覧を引き継げなかったため、その場で問い合わせます"
          fi

          NUMBERS=""
          # 「対象が0件」と「issue-deckへ届かなかった」を区別する(#1124)。取得できなかった場合は
          # PR本文にもその旨を残す。空一覧と同じ文言だと、後から読んだときに「本当にissueが
          # 無かったリリース」と見分けがつかない。
          UNAVAILABLE_NOTE=""
          if [ -z "$APP_BASE_URL" ] || [ -z "$PROGRESS_REPORT_SECRET" ]; then
            echo "::warning::APP_BASE_URL / PROGRESS_REPORT_SECRET が未設定のため、リリース対象issueを特定できません"
            UNAVAILABLE_NOTE="（設定不足のためリリース対象issueを取得できませんでした。APP_BASE_URL・PROGRESS_REPORT_SECRET を確認してください）"
          else
            BODY_FILE="${RUNNER_TEMP:-/tmp}/release-progress.json"
            CODE="$(curl -sS -m 20 -o "$BODY_FILE" -w '%{http_code}' \
              -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
              "$APP_BASE_URL/api/progress?repository=$GH_REPO&status=develop,release")" || CODE=000
            if [ "$CODE" != "200" ]; then
              echo "::warning::issue-deckへ問い合わせできませんでした（HTTP $CODE）。リリース対象issueを特定できません"
              UNAVAILABLE_NOTE="（issue-deckへ問い合わせできず、リリース対象issueを取得できませんでした。HTTP $CODE）"
            elif [ "$(jq -r '.available // false' "$BODY_FILE" 2>/dev/null || echo false)" != "true" ]; then
              REASON="$(jq -r '.reason // "unknown"' "$BODY_FILE" 2>/dev/null || echo unknown)"
              echo "::warning::issue-deckが進捗を返せませんでした（reason=$REASON）。リリース対象issueを特定できません"
              UNAVAILABLE_NOTE="（issue-deckが進捗を返せず、リリース対象issueを取得できませんでした。reason=$REASON）"
            else
              NUMBERS="$(jq -r '.issues[]' "$BODY_FILE" 2>/dev/null || true)"
            fi
          fi

          echo "[]" > /tmp/release-issues.json
          : > /tmp/release-issue-lines.txt
          if [ -n "$NUMBERS" ]; then
            for NUM in $NUMBERS; do
              gh issue view "$NUM" --json number,title,labels
            done | jq -s 'unique_by(.number) | sort_by(.number)' > /tmp/release-issues.json
            jq -r '.[] | "- #\(.number) \(.title)"' /tmp/release-issues.json > /tmp/release-issue-lines.txt
          fi
          if [ ! -s /tmp/release-issue-lines.txt ]; then
            if [ -n "$UNAVAILABLE_NOTE" ]; then
              echo "$UNAVAILABLE_NOTE" > /tmp/release-issue-lines.txt
            else
              echo "（Develop・Releaseにいるopenなissueはありませんでした）" > /tmp/release-issue-lines.txt
            fi
          fi
          echo "対象issue:"
          cat /tmp/release-issue-lines.txt

      - name: コード変更内容からバージョンの上げ幅を判定する
        id: version-decision
        if: steps.state.outputs.need_bump == 'true' && github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # github_token省略時は既定のGITHUB_TOKENにフォールバックし、このステップの実行中に
          # チェックアウト済みリポジトリのgit認証情報がワークフロー用トークンから置き換わって
          # しまう。後続の「バージョンをbumpして...」ステップの素のgit pushが同じ認証情報を
          # 使えるよう、claude-issue-dispatch.ymlの実装ステップと同じく明示する。
          github_token: ${{ steps.app-token.outputs.token || secrets.WORKFLOW_PAT }}
          # 本ワークフローはissue-deckアプリ（GitHub App = issue-deck[bot]）からの
          # workflow_dispatchでも起動されるため、非人間アクター起点の実行を明示的に許可する
          # (参考: https://github.com/anthropics/claude-code-action/issues/1299)
          allowed_bots: "issue-deck[bot],claude[bot]"
          claude_args: |
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --json-schema '{"type":"object","properties":{"bump_kind":{"type":"string","enum":["major","minor","patch"]},"reason":{"type":"string"},"changelog":{"type":"string"},"usage":{"type":"string"}},"required":["bump_kind","reason"]}'
          prompt: |
            ${{ github.repository }} リポジトリで、mainブランチとdevelopブランチの実際のコード差分の内容から、
            セマンティックバージョニング（semver）に基づく適切なバージョンの上げ幅
            （major/minor/patch）を判定してください。Issueのラベルは一切参照せず、差分の
            内容そのものだけから判断してください。

            ## 確認すること
            - `git diff origin/main origin/develop` で実際のコード変更内容を確認する
            - `git log origin/main..origin/develop --oneline` でコミット一覧も参考にする

            ## 判定基準
            - major: 既存の挙動・データ構造・公開APIに対する後方互換性のない変更
              （破壊的変更）が含まれる場合
            - minor: 後方互換性を保ったまま新機能が追加されている場合
            - patch: バグ修正・リファクタリング・ドキュメント更新など、上記のいずれにも
              該当しない変更のみの場合
            - 複数種類の変更が混在する場合は、最も上げ幅が大きい判定を採用する
              （例: 新機能追加とバグ修正が両方含まれる場合はminor）

            ## 出力
            判定結果（bump_kind）と、その判断根拠（reason）を返してください。reasonは日本語で、
            なぜそのbump_kindと判定したか（該当した変更の種類と、判定の決め手になった代表的な
            変更点）を簡潔に説明してください。変更したファイルや修正内容を網羅的に列挙する必要は
            なく、3〜5行程度に要約してください（バンプPRやリリース画面に表示されるため、冗長な
            長文にしないこと）。

            あわせて、利用者向けの更新履歴（changelog）も生成してください。reasonが開発者向けの
            判断根拠であるのに対し、changelogはエンドユーザー向けに何ができるようになった/直った
            かを平易な日本語で簡潔に説明する文章にしてください（実装の詳細やファイル名には触れない）。
            更新履歴表示を持つリポジトリが利用するための汎用フックです（`version` lifecycle
            スクリプトへ `RELEASE_CHANGELOG` として渡されます）。持たないリポジトリでは
            生成されるだけで使われません。

            さらに、利用者向けの使い方（usage）も生成してください。changelogが「何が変わったか」を
            書くのに対し、usageは「どう使うか」を書きます。このリリースで新しくできるように
            なったことについて、**どこを開く / 何を押す・実行する / どうなれば成功か**が分かる
            操作手順を、番号付きの箇条書きで3〜5行程度にまとめてください（`1. ` から始まる行を
            改行で並べる）。次の点を守ること。

            - 利用者が画面で辿れる言葉で書く。実装の詳細・ファイル名・関数名には触れない
            - 「どうなれば成功か」を必ず1行入れる（画面に何が出れば効いているのか）
            - 画面の写真は含めない（このワークフローは撮影を行いません）
            - **画面で使える変化が無いリリース**（内部改善・リファクタリング・不具合修正だけで、
              操作手順が変わらない場合）は、無理に書かず**空文字にしてください**。空の場合は
              PR本文にも各リポジトリの更新履歴にも出しません
            - changelogと同じく、更新履歴表示を持つリポジトリが利用するための汎用フックです
              （`version` lifecycleスクリプトへ `RELEASE_USAGE` として渡されます）

      - name: Claude使用量をJob Summaryに出力する（コード変更内容からバージョンの上げ幅を判定する）
        # トークン使用量・ターン数・権限拒否を可視化する(#903)。計測は補助情報のため、
        # 失敗しても本来の処理に影響させない(スクリプト側で常にexit 0する)。
        #
        # **スクリプトは呼び出し元リポジトリに無いことがある(#1181)。** 実際 signaly には
        # .github/scripts/summarize-claude-usage.sh が無く、バンプ自体は成功しているのに
        # このステップだけが落ちてジョブ全体を失敗させた。存在するときだけ実行する。
        # （reusable-issue-dispatch.yml は prompts-ref 経由で共有側を使えるが、こちらは
        #   呼び出し元のcheckoutしか持たないため、無ければスキップする方針にする）
        if: always() && steps.version-decision.outputs.execution_file != ''
        run: |
          USAGE=.github/scripts/summarize-claude-usage.sh
          if [ -x "$USAGE" ]; then
            "$USAGE" "コード変更内容からバージョンの上げ幅を判定する" "${{ steps.version-decision.outputs.execution_file }}"
          else
            echo "$USAGE が無いため、使用量のJob Summary出力はスキップします"
          fi

      - name: バージョン判定結果を検証する
        id: bump
        # version-decisionステップ自体が失敗した場合でもpatchへフォールバックできるよう、
        # 前ステップの成否によらず実行する
        if: always() && steps.state.outputs.need_bump == 'true' && github.event_name == 'workflow_dispatch'
        env:
          # structured_outputはClaude Codeの判定結果（信頼できないテキストを含みうる）のため、
          # run:本文に直接展開せずenv経由でのみ参照する
          # (.github/workflows/issue-labels.ymlと同じ、script injectionを避ける方針)。
          STRUCTURED_OUTPUT: ${{ steps.version-decision.outputs.structured_output }}
          # 画面から指定された上げ幅（#1548）。自動判定の結果より優先する。
          SPECIFIED_BUMP_KIND: ${{ inputs.bump-kind }}
        run: |
          set -e

          BUMP_KIND="$(echo "$STRUCTURED_OUTPUT" | jq -r '.bump_kind // empty' 2>/dev/null || true)"
          # reasonはプロンプト側で3〜5行程度の要約に収めてもらう想定のため、changelogと同様に
          # 改行を保持したまま扱う（1行への平坦化はしない）
          REASON="$(echo "$STRUCTURED_OUTPUT" | jq -r '.reason // empty' 2>/dev/null || true)"
          # changelogは利用者向けの複数行文章になりうるため平坦化しない
          CHANGELOG="$(echo "$STRUCTURED_OUTPUT" | jq -r '.changelog // empty' 2>/dev/null || true)"
          # usage（利用者向けの操作手順・#1729）も番号付きの複数行になるため平坦化しない。
          # 画面で使える変化が無いリリースでは空になる契約で、空のときはPR本文にも出さない
          USAGE="$(echo "$STRUCTURED_OUTPUT" | jq -r '.usage // empty' 2>/dev/null || true)"

          case "$BUMP_KIND" in
            major|minor|patch) ;;
            *)
              echo "Claude Codeによるバージョン判定が失敗・不正な結果だったため、patchにフォールバックします（判定結果: '$BUMP_KIND'）"
              BUMP_KIND=patch
              REASON="コード差分からのバージョン自動判定に失敗したため、安全側としてpatchにフォールバックしました。実際の変更内容を確認し、必要であればこのPR上でバージョンを修正してください。"
              CHANGELOG=""
              USAGE=""
              ;;
          esac

          # 画面から上げ幅を指定して起動した場合は、自動判定の結果をそれで上書きする（#1548）。
          # **判定の結果は捨てずに判断根拠へ残す。** 後からバンプPRを見たときに、指定した版で
          # 入ったのか自動判定どおりだったのかを読み取れるようにするため。
          case "$SPECIFIED_BUMP_KIND" in
            major|minor|patch)
              echo "画面から指定された上げ幅（$SPECIFIED_BUMP_KIND）で、自動判定の結果（$BUMP_KIND）を上書きします"
              # 改行はprintfで作る。**YAMLのブロックスカラーの中に列1で始まる行を置くと
              # そこでブロックが終わってしまう**ため、run:本文に生の改行を書かない。
              REASON="$(printf 'issue-deckの画面から%sを指定しました（コード差分からの自動判定は%s）。\n\n%s' "$SPECIFIED_BUMP_KIND" "$BUMP_KIND" "$REASON")"
              BUMP_KIND="$SPECIFIED_BUMP_KIND"
              ;;
            ""|auto) ;;
            *)
              echo "::warning::bump-kind の値が不正なため無視します（指定値: '$SPECIFIED_BUMP_KIND'）"
              ;;
          esac

          echo "bump_kind=$BUMP_KIND" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<REASON_EOF"
            echo "$REASON"
            echo "REASON_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "usage<<USAGE_EOF"
            echo "$USAGE"
            echo "USAGE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "判定結果: bump_kind=$BUMP_KIND"
          echo "reason: $REASON"
          echo "changelog: $CHANGELOG"
          echo "usage: $USAGE"

      - name: バージョンをbumpしてdevelop向けPRを作成する
        if: always() && steps.state.outputs.need_bump == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.WORKFLOW_PAT }}
          GH_REPO: ${{ github.repository }}
          MAIN_VERSION: ${{ steps.state.outputs.main_version }}
          VERSION_FILE: ${{ inputs.version-file }}
          VERSION_QUERY: ${{ inputs.version-query }}
          BUMP_COMMAND: ${{ inputs.bump-command }}
          BUMP_KIND: ${{ steps.bump.outputs.bump_kind }}
          REASON: ${{ steps.bump.outputs.reason }}
          # 更新履歴表示を自リポジトリに持つリポジトリ向けの汎用フック。npm versionの
          # "version" lifecycleスクリプト（対象リポジトリがpackage.jsonに定義した場合のみ実行
          # される）がこの環境変数を読み、自前の更新履歴ファイルを書き換えるという契約にする。
          # issue-deck自身も#1764で受け取り側になった（scripts/version-changelog.mjs）。
          # **受け取り側を持たないリポジトリでも通知には載せる**ため、このステップの後半で
          # .github/release-notes.md へも書き出す（#2391）。
          RELEASE_CHANGELOG: ${{ steps.bump.outputs.changelog }}
          # 同じ契約で渡す、利用者向けの操作手順（#1729）。RELEASE_CHANGELOGが「何が変わったか」、
          # こちらが「どう使うか」。**両者は必ずセットで扱うこと**——env:とexportのどちらかに
          # 足し忘れると空文字が渡り、受け取り側では「使い方が無いリリース」と区別できない。
          RELEASE_USAGE: ${{ steps.bump.outputs.usage }}
        run: |
          set -e

          IFS='.' read -r MAJOR MINOR PATCH <<< "$MAIN_VERSION"
          case "$BUMP_KIND" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            *)
              PATCH=$((PATCH + 1))
              ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          BRANCH="release/v$NEW_VERSION"

          git checkout -b "$BRANCH" origin/develop

          # **npm version を使う理由は「バージョンを書き換えること」ではなく、"version"
          # lifecycleスクリプトを起動すること。** これが更新履歴フック（RELEASE_CHANGELOG）と
          # 使い方フック（RELEASE_USAGE）の土台になっている（npm pkg set では
          # lifecycleスクリプトが起動しない）。
          # --no-git-tag-versionでコミット・タグ作成だけを抑止する。
          #
          # ルートに package.json が無いリポジトリではそのままでは使えないため、
          # bump-command で差し替えられるようにしてある（#1181）。
          # 例: myroom は `npm version "$NEW_VERSION" --no-git-tag-version --prefix frontend`
          #     signaly は `python3 scripts/bump_version.py "$BUMP_KIND"`
          #
          # **スクリプトによって受け取る引数が違う。** バージョン番号そのものを取るものと、
          # 上げ幅（patch/minor/major）を取るものがある。signaly の bump_version.py は後者で、
          # NEW_VERSION を渡して「使い方: ... [patch|minor|major]」で失敗した（#1181で実際に踏んだ）。
          # 両方を環境変数で渡してあるので、スクリプトの実装に合わせて選ぶこと。
          if [ -n "$BUMP_COMMAND" ]; then
            echo "bump-command を実行します: $BUMP_COMMAND"
            # **NEW_VERSION はこのステップ内で計算したシェル変数のため、exportしないと
            # `bash -c` の子プロセスへ渡らない（#1181で実際に踏んだ）。** BUMP_KIND・
            # RELEASE_CHANGELOG・RELEASE_USAGE は env: で渡しているので既に環境変数だが、
            # 揃えてexportする。
            # myroom で `npm error Invalid version: ` となり、空文字が渡っていることが分かった。
            export NEW_VERSION BUMP_KIND RELEASE_CHANGELOG RELEASE_USAGE
            bash -c "$BUMP_COMMAND"
          else
            npm version "$NEW_VERSION" --no-git-tag-version
          fi

          # 書き換えが実際に効いたかを確認する。コマンドが成功しても対象ファイルが
          # 変わっていなければ、以降のPR作成は空振りになる
          APPLIED="$(jq -r "$VERSION_QUERY" "$VERSION_FILE")"
          if [ "$APPLIED" != "$NEW_VERSION" ]; then
            echo "::error::バージョンの書き換えに失敗しました（$VERSION_FILE は $APPLIED のまま。期待: $NEW_VERSION）"
            exit 1
          fi

          # **リリース通知の本文に載せる変更内容を、リポジトリの中へ置く**（#2391）。
          # リリース通知（各リポジトリの`deploy.yml`の`notify-release`）が読むのはここで、
          # `.github/scripts/signaly-notify.sh`がバンプ後のチェックアウトから拾う。
          #
          # **更新履歴ファイルとは別に持つ。** `RELEASE_CHANGELOG`を受け取る"version"
          # lifecycleスクリプトを持つのはフリート16リポジトリ中7件しかなく、残りでは
          # 生成された文面がバンプPRの本文にしか残らない。ここで書き出せば、更新履歴画面を
          # 持たないアプリでも通知に変更内容を載せられる。
          #
          # 生成されなかったリリースでは**更新しない**（前回の文面が残るが、見出しの
          # バージョンが一致しないので通知には載らない）。
          if [ -n "$RELEASE_CHANGELOG" ] || [ -n "$RELEASE_USAGE" ]; then
            mkdir -p .github
            {
              echo "<!-- リリースのたびに自動生成されます。手で編集しないでください（guchi-apps/issue-deck#2391） -->"
              echo
              echo "# v${NEW_VERSION}"
              echo
              if [ -n "$RELEASE_CHANGELOG" ]; then
                echo "$RELEASE_CHANGELOG"
                echo
              fi
              if [ -n "$RELEASE_USAGE" ]; then
                echo "**使い方**"
                echo
                echo "$RELEASE_USAGE"
                echo
              fi
            } > .github/release-notes.md
            echo ".github/release-notes.md を更新しました"
          else
            echo "利用者向けの文面が生成されなかったため、.github/release-notes.md は更新しません"
          fi

          git config user.name "Claude Code"
          git config user.email "claude-code@example.com"
          # package.json本体に加え、"version" lifecycleスクリプトが更新履歴・使い方のフックとして
          # 新規作成・更新したファイルもバンプコミットへ含める（このステップ開始時点で
          # 作業ツリーはクリーンなので、意図しないファイルを拾うリスクは低い）
          git status --porcelain
          git add -A
          git commit -m "v${NEW_VERSION}をリリースする。"
          git push -u origin "$BRANCH"

          {
            echo "developへの取り込み待ちの変更を v${NEW_VERSION} としてリリースします。"
            echo
            echo "## バージョンの判断根拠"
            echo "コード差分の内容から${BUMP_KIND}バージョンと判定しました。"
            echo
            echo "$REASON"
            echo
            echo "判断が誤っていると思われる場合は、このPR上でバージョンを修正してください。"
            echo
            if [ -n "$RELEASE_CHANGELOG" ]; then
              echo "## 更新履歴（生成された利用者向け文言）"
              echo
              echo "$RELEASE_CHANGELOG"
              echo
            fi
            # 使い方は「画面で使える変化があったリリース」でしか生成されない（#1729）。
            # 空のときに見出しだけ出すと「書き漏らし」に見えるため、セクションごと出さない
            if [ -n "$RELEASE_USAGE" ]; then
              echo "## 使い方（生成された利用者向け文言）"
              echo
              echo "$RELEASE_USAGE"
              echo
            fi
            echo "## 対象issue"
            cat /tmp/release-issue-lines.txt
            echo
            echo "## 注意点"
            echo "- このPRはGitHub Actionsが自動作成しました（\`.github/workflows/release-develop-to-main.yml\`、#55）"
            echo "- **このPRはCI通過後にdevelopへ自動マージされます**（GitHub Auto-merge。マージ方式はマージコミット）。内容を止めたい場合はCIが終わる前にauto-mergeを解除してください"
            echo "- auto-mergeの有効化に失敗した場合のみ自動ではマージされません。その場合はCI通過を確認のうえ、リリース画面のリンクから手動でマージしてください"
          } > /tmp/release-pr-body.md

          gh pr create --base develop --head "$BRANCH" \
            --title "v${NEW_VERSION}をリリースする" \
            --body-file /tmp/release-pr-body.md

          # CI通過後にdevelopへ自動マージする（リポジトリ設定 'Allow auto-merge' が必要）。
          # このマージによりpackage.jsonのversionが変わり、push(develop, paths:package.json)で
          # 本ワークフローが再起動してdevelop→mainのPRを自動作成する。
          # 有効化に失敗しても run は落とさず、アプリのリリース画面のマージ用URLからの
          # 手動マージに委ねる。
          gh pr merge "$BRANCH" --auto --merge \
            || echo "auto-mergeの有効化に失敗しました。CI通過後に手動でマージしてください（アプリのリリース画面のリンクからマージできます）。"

      # 「本番へ出す中身が、どこまで自動レビューで検証されているのか」をリリースPRの本文に載せる
      # (#2448)。判定そのものはdevelop向けPRの本文へ`## 検証結果`として残っている
      # (reusable-claude-review-develop.ymlの「検証結果をPR本文へ記録する」)。ここではそれを
      # 対象issueぶん集めて1つの表にするだけで、レビューを回し直すことはしない。
      #
      # **記録が無くても表は作る。** 共有ワークフローの参照タグを配る前にマージされたPRや、
      # ブランチ名が`issue-<番号>`でないPRには節が無い。その行は「記録なし」と出す——
      # 表ごと消すと、検証されていないことも読めなくなる。
      - name: 対象issueの検証結果を集計する
        if: steps.state.outputs.need_main_pr == 'true'
        # 記録は補助情報なので、集計に失敗してもリリースPRの作成は止めない
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.WORKFLOW_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          OUT=/tmp/release-verification.md
          : > "$OUT"

          # 対象issue一覧は`- #<番号> <タイトル>`の行。取得できなかったときの注記
          # （`（issue-deckへ問い合わせできず…）`）はこの形にならないので拾わない。
          NUMBERS="$(sed -nE 's/^- #([0-9]+).*/\1/p' /tmp/release-issue-lines.txt || true)"
          if [ -z "$NUMBERS" ]; then
            echo "対象issueが無いため、検証結果の表は作りません"
            exit 0
          fi

          {
            echo "## コードレビューの検証結果"
            echo
            echo "developへ入れる前に各PRで行った自動レビューの判定です（#2448）。判定の根拠は各PRのレビューコメントにあります。"
            echo
            echo "| Issue | PR | 自動レビュー | 機械的リスク判定 |"
            echo "| --- | --- | --- | --- |"
          } > "$OUT"

          for NUM in $NUMBERS; do
            PR_JSON="$(gh pr list --state merged --base develop --head "issue-${NUM}" --limit 1 \
              --json number,body --jq '.[0] // empty' 2>/dev/null || true)"
            PR_CELL="—"
            REVIEW=""
            RISK=""
            if [ -n "$PR_JSON" ]; then
              PR_CELL="#$(printf '%s' "$PR_JSON" | jq -r '.number')"
              MARKER="$(printf '%s' "$PR_JSON" | jq -r '.body // ""' \
                | grep -oE '<!-- issue-deck-verification:start [^>]*-->' | tail -n 1 || true)"
              if [ -n "$MARKER" ]; then
                REVIEW="$(printf '%s' "$MARKER" | sed -nE 's/.*review=([a-z-]+).*/\1/p')"
                RISK="$(printf '%s' "$MARKER" | sed -nE 's/.*risk=([a-z-]+).*/\1/p')"
              fi
            fi
            # 文言はreusable-claude-review-develop.yml側と対。画面
            # (src/lib/github/release-verification.ts)はこの列の先頭の記号で判定を読む
            case "$REVIEW" in
              lgtm) REVIEW_CELL="✅ 問題なし" ;;
              needs-check) REVIEW_CELL="⚠️ 要確認" ;;
              changes-requested) REVIEW_CELL="❌ 要修正" ;;
              skipped) REVIEW_CELL="— 実施なし（低リスク・小規模）" ;;
              unavailable) REVIEW_CELL="? 判定を取得できず" ;;
              *) REVIEW_CELL="? 記録なし" ;;
            esac
            case "$RISK" in
              none) RISK_CELL="該当なし" ;;
              hit) RISK_CELL="⚠️ 該当あり" ;;
              *) RISK_CELL="? 記録なし" ;;
            esac
            echo "| #${NUM} | ${PR_CELL} | ${REVIEW_CELL} | ${RISK_CELL} |" >> "$OUT"
          done

          echo "検証結果の表:"
          cat "$OUT"

      - name: develop→mainのPRを作成する
        if: steps.state.outputs.need_main_pr == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.WORKFLOW_PAT }}
          GH_REPO: ${{ github.repository }}
          DEV_VERSION: ${{ steps.state.outputs.dev_version }}
          VERSION_FILE: ${{ inputs.version-file }}
          VERSION_QUERY: ${{ inputs.version-query }}
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_SHA: ${{ github.sha }}
        run: |
          set -e

          # **リリースPRのheadは`develop`ではなく固定ブランチにする**（#2117）。
          # PRのheadは常にそのブランチの先端を追うため、`develop`をheadにすると、PRを作った
          # 後にdevelopへ入った変更まで同じリリースでmainへ出る（更新履歴にも対象issueにも
          # 載らないまま出る）。内容を止めるには固定したrefが要る。
          #
          # 凍結点はバンプPRのhead（`$GITHUB_SHA^2`）。このrunはバンプPRがdevelopへマージ
          # されたpushで起きており、`$GITHUB_SHA`はそのマージコミット、第2親がバンプPRの
          # 先端＝**更新履歴・上げ幅を判定したときのdevelop（T0）＋版上げ**にあたる。
          # マージコミットそのもの（第1親側）にはT0以降にdevelopへ入った変更が含まれるため、
          # 更新履歴と食い違う。
          #
          # 第2親が無い場合（squashマージ・workflow_dispatchでの手動起動）と、そのコミットの
          # バージョンが`dev_version`と一致しない場合（package.jsonを変えた別のpushで起動した
          # 場合）は`origin/develop`へフォールバックする。
          FREEZE_SHA=""
          if [ "$EVENT_NAME" = "push" ]; then
            FREEZE_SHA="$(git rev-parse --verify --quiet "${PUSHED_SHA}^2" || true)"
            if [ -n "$FREEZE_SHA" ]; then
              FREEZE_VERSION="$(git show "$FREEZE_SHA:$VERSION_FILE" | jq -r "$VERSION_QUERY" || true)"
              if [ "$FREEZE_VERSION" != "$DEV_VERSION" ]; then
                echo "::warning::${PUSHED_SHA}^2 のバージョン($FREEZE_VERSION)が develop($DEV_VERSION) と一致しないため、origin/develop を凍結点にします"
                FREEZE_SHA=""
              fi
            fi
          fi
          if [ -z "$FREEZE_SHA" ]; then
            FREEZE_SHA="$(git rev-parse origin/develop)"
          fi

          RELEASE_BRANCH="release-main/v${DEV_VERSION}"
          echo "リリース内容を $FREEZE_SHA で凍結し、$RELEASE_BRANCH として push します"
          # 同名ブランチが残っているのは、前回のリリースPRがマージされずにcloseされた場合。
          # そのブランチを参照するopenなPRが無いことは状態判定で確認済みなので、上書きしてよい。
          git push --force origin "${FREEZE_SHA}:refs/heads/${RELEASE_BRANCH}"

          {
            echo "developの内容をv${DEV_VERSION}としてmainへリリースします。"
            echo
            echo "リリースする内容は \`${RELEASE_BRANCH}\`（\`${FREEZE_SHA}\`）で凍結しています。このPRを作った後にdevelopへ入った変更は、このリリースには含まれず次のリリースへ回ります（#2117）。"
            echo
            echo "## 対象issue"
            cat /tmp/release-issue-lines.txt
            echo
            # 直前のステップが作った検証結果の表（#2448）。対象issueが取れなかった場合や
            # 集計に失敗した場合は空なので、その節ごと出さない
            if [ -s /tmp/release-verification.md ]; then
              cat /tmp/release-verification.md
              echo
            fi
            echo "## 注意点"
            echo "- このPRはGitHub Actionsが自動作成しました（\`.github/workflows/release-develop-to-main.yml\`、#55）"
            echo "- develop→mainのマージはCLAUDE.mdの自動マージ不可カテゴリに該当するため自動マージはされません。ユーザーが内容を確認のうえマージしてください"
            echo "- マージ方式は必ず「Create a merge commit」を選んでください（squash mergeはdevelop/mainの祖先のつながりを切ってしまうため厳禁。詳細はrelease-to-mainスキル参照）"
            echo "- **このPRのCIが失敗した場合、\`${RELEASE_BRANCH}\`を直接直さないでください。** 自動修復（\`claude-pr-repair.yml\`）は修正をdevelop向けPRとして出します。developへ取り込んだうえで、このPRをcloseしてリリースを起動し直すと、直した内容で凍結され直します"
          } > /tmp/main-pr-body.md

          gh pr create --base main --head "$RELEASE_BRANCH" \
            --title "v${DEV_VERSION}をmainへリリースする" \
            --body-file /tmp/main-pr-body.md

  # releaseジョブが失敗した場合の通知(#727)。他の3ワークフロー
  # （claude-issue-dispatch.ymlのnotify-failure、claude-review-develop.ymlの
  # claude-review-fallback/auto-merge-fallback、claude-conflict-resolve.ymlのフォールバック通知）
  # と異なり、本ワークフローにはこれまで失敗時の通知が一切無く、Actionsの実行ログ以外に
  # 失敗の痕跡が残らなかった。
  #
  # releaseジョブがどのステップ（状態判定・バージョン判定・バンプPR作成・develop→mainのPR作成）
  # で失敗しても対象issueを特定できるよう、releaseジョブの「リリース対象issueの一覧を取得する」
  # ステップの出力には依存せず、このジョブでも`Develop`・`Release`にいるissueの一覧を
  # 独立に取得する（#991 Phase 5でラベル検索からissue-deckへの問い合わせに変わった）。
  notify-failure:
    needs: [release]
    if: always() && needs.release.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: リリース対象issueへ失敗を通知する
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PROGRESS_REPORT_SECRET: ${{ secrets.PROGRESS_REPORT_SECRET }}
        run: |
          set -e

          # 「対象が0件」と「issue-deckへ届かなかった」を区別する(#1124)。後者は本来通知すべき
          # 相手がいるのに通知できていない状態で、放置するとリリース失敗そのものに気づけない。
          ISSUE_NUMBERS=""
          if [ -z "$APP_BASE_URL" ] || [ -z "$PROGRESS_REPORT_SECRET" ]; then
            echo "::warning::APP_BASE_URL / PROGRESS_REPORT_SECRET が未設定のため、通知先を特定できません"
            exit 0
          fi
          BODY_FILE="${RUNNER_TEMP:-/tmp}/notify-progress.json"
          CODE="$(curl -sS -m 20 -o "$BODY_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $PROGRESS_REPORT_SECRET" \
            "$APP_BASE_URL/api/progress?repository=$GH_REPO&status=develop,release")" || CODE=000
          if [ "$CODE" != "200" ]; then
            echo "::warning::issue-deckへ問い合わせできませんでした（HTTP $CODE）。通知先を特定できません"
            exit 0
          fi
          if [ "$(jq -r '.available // false' "$BODY_FILE" 2>/dev/null || echo false)" != "true" ]; then
            echo "::warning::issue-deckが進捗を返せませんでした（reason=$(jq -r '.reason // "unknown"' "$BODY_FILE" 2>/dev/null || echo unknown)）。通知先を特定できません"
            exit 0
          fi
          ISSUE_NUMBERS="$(jq -r '.issues[]' "$BODY_FILE" 2>/dev/null || true)"

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "Develop・Releaseにいるopenなissueはありません（対象なしのため通知しません）"
            exit 0
          fi

          BODY='⚠️ develop→mainのリリースワークフロー（release-develop-to-main.yml）が失敗しました。'
          BODY="$BODY"$'\n\n'"実行ログ: $RUN_URL"
          BODY="$BODY"$'\n\n''GitHub Actions側の障害が原因の場合があります。https://www.githubstatus.com で `Actions` の状態をご確認ください。'
          BODY="$BODY"$'\n\n''復旧している場合は、リポジトリのissue-deck画面から手動でリリースを再実行できます。'
          BODY="$BODY"$'\n\n<!-- issue-deck-fallback-notice -->'

          # リリースが失敗して続け方の指示が要る状態なので、理由は`01.check-blocked`(#1490)。
          # 展開先リポジトリにラベル自体が定義されていない場合でもこのステップを落とさないよう、
          # 付与・除去の前にリポジトリのラベル一覧と突き合わせる(#975)。ラベルの構成はIssueに
          # よらず同じなので、対象Issueのループの外で1度だけ組み立てる。
          REASON_LABEL="01.check-blocked"
          DEFINED_LABELS="$(gh label list --json name --jq '.[].name' --limit 200)"
          LABEL_ARGS=()
          for name in "00.check-user" "$REASON_LABEL"; do
            if grep -qx "$name" <<<"$DEFINED_LABELS"; then
              LABEL_ARGS+=(--add-label "$name")
            else
              echo "::warning::ラベル '$name' がリポジトリに存在しないため付与をスキップします"
            fi
          done
          for name in 01.check-plan 01.check-input 01.check-merge 01.check-blocked 01.check-answered 00.qa-answered; do
            if [ "$name" != "$REASON_LABEL" ] && grep -qx "$name" <<<"$DEFINED_LABELS"; then
              LABEL_ARGS+=(--remove-label "$name")
            fi
          done

          for NUM in $ISSUE_NUMBERS; do
            # dispatchジョブ側の他の通知と同様、同一runのURLを含むコメントが既にあれば重複通知しない。
            if gh issue view "$NUM" --json comments --jq '.comments[-20:][].body' 2>/dev/null | grep -qF "$RUN_URL"; then
              echo "issue #$NUM は同一runの通知コメントを確認できたため、重複通知をスキップします"
              continue
            fi
            gh issue comment "$NUM" --body "$BODY"
            if [ "${#LABEL_ARGS[@]}" -gt 0 ]; then
              gh issue edit "$NUM" "${LABEL_ARGS[@]}"
            fi
          done
