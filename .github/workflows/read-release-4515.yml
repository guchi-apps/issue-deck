name: Read release 4519 validation
on:
  push:
    branches: [ops/verify-release-4515]
    paths: [.github/workflows/read-release-4515.yml]
permissions: {}
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Read stored validation results on the deployment host
        uses: appleboy/ssh-action@v1
        env:
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: TARGET_DIR
          script: |
            set -e
            cd "$TARGET_DIR"
            node --env-file=.env <<'NODE'
            const { PrismaClient } = require("@prisma/client");
            const db = new PrismaClient();
            (async () => {
              const rows = await db.releaseVerification.findMany({
                where: {
                  repoFullName: "guchi-apps/issue-deck",
                  prNumber: 4519,
                  baseSha: "b1e656c68e6d545e7136e935af7be472f3056418",
                  headSha: "787826db727e4e1a67ab2eb41505178cac773942",
                },
                select: { kind: true, state: true, summary: true, findings: true, unverifiedScope: true, message: true },
              });
              console.log("RELEASE_4519_RESULT=" + JSON.stringify(rows));
            })().catch(e => { console.error(e.message); process.exitCode = 1; }).finally(() => db.$disconnect());
            NODE
# Refresh final verification observation
# Observe final results after runner completion
