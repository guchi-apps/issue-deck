# ローカルセッションの開発サーバーが使うポート帯（ベース値）の対応表。
#
# 実際のポートは「ベース値 + Issue番号」。**どのリポジトリがどの帯を使うかは、定義上どの
# リポジトリ単独でも決められない**ため、全リポジトリを知るissue-deck側が持つ（#1073）。
# 元は scripts/start-local-session.sh の `case` 文だったが、対象リポジトリが増えたので
# 設定ファイルへ移した（#1224）。**サンプルではなく実データ**なのでリポジトリにコミットする
# （チェックアウト先のパスと違い、環境ごとに変わる値ではない）。
#
# 書式: <owner>/<repo><空白><ベース値>
#   - 先頭が `#` の行と空行は無視する
#   - 載っていないリポジトリへは何も渡さず、そのリポジトリの既定に任せる
#
# 読み込み順（先に見つかったものを使う）:
#   1. $ISSUE_DECK_LOCAL_REPO_PORTS_CONFIG
#   2. このファイル（受け口・汎用ランチャーと同じ場所）
#   3. ~/.config/issue-deck/local-repo-ports.conf
#
# 帯の幅は原則1000。**Issue番号が帯の幅を超えたら帯を割り直す。** issue-deckは既に
# #1224まで進んでおり、4000帯だけでは足りない（4000+1224=5224）ため、4000〜5999の
# 2000ぶんを占める扱いにしている。5000帯を使っていた shopping-list は、この重なりを
# 解消するため7000へ移した（#1224）。
#
# 詳細は docs/multi-agent/local-quick-start.md「開発サーバーのポート帯はリポジトリごとに固定する」。

guchi-apps/issue-deck          4000
guchi-apps/dayspan             6000
guchi-apps/shopping-list       7000
guchi-apps/car-care            8000
guchi-apps/asset-manager       9000
guchi-apps/clip-hive          10000
guchi-apps/meisai-lab         11000
guchi-apps/subscription-lists 12000
