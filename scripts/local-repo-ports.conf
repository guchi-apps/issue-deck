# ローカルセッションの開発サーバーが使うポート帯（ベース値）の対応表。
#
# 実際のポートは「ベース値 + Issue番号」を帯の中で折り返した値（#2478。採番は
# scripts/lib/dev-server.sh の `dev_server_port_for_issue` だけが行う）。**どのリポジトリが
# どの帯を使うかは、定義上どのリポジトリ単独でも決められない**ため、全リポジトリを知る
# issue-deck側が持つ（#1073）。元は scripts/start-local-session.sh の `case` 文だったが、
# 対象リポジトリが増えたので設定ファイルへ移した（#1224）。**サンプルではなく実データ**なので
# リポジトリにコミットする（チェックアウト先のパスと違い、環境ごとに変わる値ではない）。
#
# 書式: <owner>/<repo><空白><ベース値>[<空白><帯の幅>]
#   - 先頭が `#` の行と空行は無視する
#   - **行末コメントは書けない**（`guchi-apps/foo 25000 # メモ` は行全体が書式に合わず丸ごと
#     無視される）。由来を残すときは上の行に `#` で書く
#   - 3列目の帯の幅は省略できる（省略時は原則の1000）。**幅を書くのは、隣の帯まで何ポート
#     空けてあるかを採番側へ伝えるため**で、Issue番号がどれだけ増えてもポートはこの幅の中で
#     折り返す（#2478）
#   - 載っていないリポジトリへは何も渡さず、そのリポジトリの既定に任せる
#
# 読み込み順（先に見つかったものを使う）:
#   1. $ISSUE_DECK_LOCAL_REPO_PORTS_CONFIG
#   2. このファイル（受け口・汎用ランチャーと同じ場所）
#   3. ~/.config/issue-deck/local-repo-ports.conf
#
# 帯の幅は原則1000。**Issue番号が帯の幅を超えても帯を割り直さない**（#2478）。超えたぶんは
# 帯の中で折り返す（`(Issue番号 - 1) mod (幅 - 1) + 1`）ので、どのIssue番号でも自分の帯から
# 出ない。割り直しの運用にしていた頃は、超えたことを検知する仕組みが無かったため、issue-deckの
# `4000 + 2470 = 6470`が dayspan の6000帯に入り、dayspan #470と同じポートになっていた。
#
# **32768〜60999には帯を置かない**（#2487）。サブPCの `net.ipv4.ip_local_port_range` がこの
# 範囲で、外向きの接続が一時的に使う（エフェメラルポート）。長時間の待ち受けを置くと、たまたま
# 同じ番号が使われていたときだけ `EADDRINUSE` になり、再現しづらい形で表面化する。払い出し
# （lib/new-app/local-port-bands.ts の `chooseNextLocalPortBase`）はこの範囲を飛ばすので、
# 空きは「32768未満」と「61000〜64999」の飛び地になる。**手で行を足すときも同じ範囲を避ける**
# （local-port-bands.test.ts が実物の対応表を突き合わせる）。
#
# issue-deckは #1224 の時点で4000帯（1000ぶん）に収まらなくなっていたため、4000〜5999の
# 2000ぶんを占める（3列目の`2000`がその宣言）。5000帯を使っていた shopping-list は、この
# 重なりを解消するため7000へ移した（#1224）。
#
# 詳細は docs/multi-agent/local-quick-start.md「開発サーバーのポート帯はリポジトリごとに固定する」。

guchi-apps/issue-deck          4000  2000
# 6000はX11用としてブラウザ（Chrome・Firefox・Safari）が接続を拒否する（#2466）。帯としては
# そのまま使い、確認環境（scripts/start-preview-dev.sh の「ベース値 + 0」）だけが6001へ
# 繰り上がる。**Issueごとのセッションも同じ繰り上げを通る**（#2470）。この帯では #566 → 6567、
# #665〜#669 → 6670、#697 → 6698 になる（一覧は scripts/lib/dev-server.sh）。
guchi-apps/dayspan             6000
# 運用終了（#2435。Dayspanへ機能を集約したため。起点は guchi-apps/shopping-list#188）。
# **行を消さずコメント化して7000帯を予約したまま残す。** 消すと、後続アプリの立ち上げが
# 「現状の最大 + 1000」で決めるのとは別に7000帯が空きとして再利用される余地が生まれ、手元に
# 残っている ~/apps/shopping-list-worktrees/ の開発サーバーと衝突しうる。
#guchi-apps/shopping-list      7000
