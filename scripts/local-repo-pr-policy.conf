# Pull Requestを「人の指示があってから」作るリポジトリの一覧（#2499）。
#
# 既定は`auto`（載っていないリポジトリ）で、実装エージェントは作業が一区切りついた時点で
# Pull Requestを作り`11.local`を外す。ここに`manual`で載せたリポジトリだけは、
#
#   - 起動プロンプトが「コミットとpushまでは行い、`gh pr create`は指示されるまで実行しない。
#     `11.local`もPRを作るまで外さない」に変わる（scripts/generic-start-issue.sh）
#   - セッションの回収が、PRができるまでそのセッションを畳まなくなる（scripts/reap-sessions.sh）
#
# の2つが変わる。**この2つは対になっている。** プロンプトだけを変えるとPRを作らないまま
# `11.local`を外したセッションが猶予5分で畳まれ、回収だけを変えると自動で作られたPRによって
# 結局引き渡し済みとして畳まれる。
#
# 書式: <owner>/<repo><空白>manual
#   - 先頭が `#` の行と空行は無視する
#   - **行末コメントは書けない**（`guchi-apps/foo manual # メモ` は行全体が書式に合わず
#     丸ごと無視される）。由来を残すときは上の行に `#` で書く
#   - `manual` 以外の値を書いた行は無視する（`auto`は既定なので書く必要が無い）
#   - 載っていないリポジトリは従来どおり（PRを作ってレビューへ引き渡す）
#
# 読み込み順（先に見つかったものを使う。scripts/local-repo-ports.conf と同じ）:
#   1. $ISSUE_DECK_LOCAL_REPO_PR_POLICY_CONFIG
#   2. このファイル（受け口・汎用ランチャーと同じ場所）
#   3. ~/.config/issue-deck/local-repo-pr-policy.conf
#
# **画面の「実装プロンプトをコピー」もこの一覧を見るが、ブラウザからファイルは読めない**ため、
# src/lib/prompts/pr-policy.ts が同じ一覧を写しで持つ。ずれは
# src/lib/prompts/templates.test.ts がこのファイルを読んで検出する。**片方だけ直さないこと。**
#
# 詳細は docs/supported-repositories.md「`guchi-apps/ideas`（構想の置き場）」を参照。

# アプリになる前の構想の置き場（#2430）。構想は一度で仕上がるものではなく、同じセッションで
# 何度も練り直す。自動でPRを作ると、その時点で引き渡し済みと判定されて数分後にセッションが
# 畳まれ、続きを同じ会話で相談できなくなる（#2499）。
guchi-apps/ideas   manual
