# iOS事前検証（#4138）の対象リポジトリの設定。読むのは scripts/ios-precheck.sh だけ。
#
# **ここに載っていないリポジトリは検証しない**（「未設定」として返し、成功にしない）。
# 接続先（Macのホスト名・ユーザー名）はここに書かない。このリポジトリはPUBLICなので、
# サブPCの ~/.config/issue-deck/ios-precheck.env に IOS_PRECHECK_HOST=<ssh先> として置く。
#
# 書式: `[owner/repo]` の見出しに続けて `key=value` を1行ずつ。先頭が`#`の行と空行は無視する
# （行末コメントは書けない。値の一部として読まれる）。
#
#   project        .xcodeproj の相対パス（workspace とどちらか一方）
#   workspace      .xcworkspace の相対パス
#   scheme         xcodebuild -scheme に渡す名前
#   simulator      Simulatorの機種名（`xcrun simctl list devices available` に出る名前）
#   simulator_os   iOSの版（省略時はXcodeの既定）
#   tests          none = 自動テスト未設定 / scheme = schemeのテストを実行する
#   test_plan      テストプラン名（省略可）
#   kind           既定の検証種別。build = ビルドのみ / test = ビルド＋自動テスト
#   required       true にすると「必須検証」として扱う（docs/multi-agent/ios-precheck.md「必須検証」）
#   build_timeout  ビルドの上限秒数（既定1800）
#   test_timeout   テストの上限秒数（既定1800）
#
# テストTargetを持たないアプリは tests=none のままにする。kind=test で依頼しても
# 「ビルド成功・自動テスト未設定」として返り、テスト成功とは表示されない。

# 初回の実証対象（#4138）。テストTargetはまだ無い。
# 必須検証にするのは、yoteiflow側で必須チェックの設定を済ませてから（docs/multi-agent/ios-precheck.md）
[guchi-apps/yoteiflow]
project=ios/YoteiFlow.xcodeproj
scheme=YoteiFlow
simulator=iPhone 17
tests=none
kind=build
required=false
